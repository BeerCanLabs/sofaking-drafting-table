notes:
  sourceEvidence: >-
    Read-only inspection of chaise and le1 on 2026-07-24 confirmed active
    Traefik v3.3.6 DaemonSets selected by NodePort Services on ports 80 and
    443. HCM RH Ingress resources use the Traefik ingress class. OPS-933430
    read-only inspection on 2026-08-10 found two Traefik-annotated Ingress
    objects in ottm-dev, two in ottm-stage, and one in ottm-prod. Their status
    fields were empty, the only registered IngressClass was alb, and named
    public and internal Traefik ALBs were observed in the development and stage
    AWS VPCs but not the production VPC. This records observed current state
    without inferring controller ownership or a direct status mapping.
  ottomanDisposition: >-
    The Ottoman owner confirmed on 2026-08-10 that the current Traefik
    arrangement is intentional.

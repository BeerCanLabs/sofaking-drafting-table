name: AWS API Gateway (REST)
description: >-
  Amazon API Gateway REST API service — the managed HTTP front door for
  Lambda-backed services. Added under SKPG-19589 after the Associate Development
  form service was found to publish a REST API through it. No API Gateway object
  existed in the catalog, despite it being a distinct edge boundary from the
  load balancers and ingress controllers already catalogued.

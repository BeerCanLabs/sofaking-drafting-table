architectureNotes:
  eol:
    remediationPlan: Windows Server 2022 remains within Microsoft support through October 2031 and is reviewed through lifecycle governance before support end.
  privilegedAccessReview: Privileged administrative access is reviewed quarterly through enterprise identity and access governance.
  logging:
    retention: Windows event and application logs are retained centrally for 90 days or more.
  assetDisposal: EC2 storage retirement and managed host decommissioning follow cloud-provider media handling and enterprise wipe or disposal procedures.
deploymentConfigurations:
- id: eol-hardening
  name: EOL Hardening
  description: Unsupported or end-of-life hosts require additional network restriction and compensating hardening before continued use.
- id: admin-membership-alerting
  name: Admin Membership Alerting
  description: Changes to administrative groups and privileged access paths are monitored through identity and security tooling.
- id: account-baseline
  name: Account Baseline
  description: Host access requires unique accounts, disabled guest access, stale account handling, and no shared administrative accounts.
- id: least-privilege-admin
  name: Least Privilege Administration
  description: Local administrator rights are minimized and privileged elevation is governed through just-in-time or approved elevation paths.
- id: password-mfa-baseline
  name: Password And MFA Baseline
  description: Strong password, lockout, idle timeout, and MFA expectations are applied through enterprise identity policy.
- id: mfa-vault-laps
  name: MFA Vault And LAPS Baseline
  description: Administrative access uses MFA-capable identity flows, password vaulting, and managed local administrator password controls.
- id: risk-based-reauthentication
  name: Risk Based Reauthentication
  description: Administrative sessions can require periodic or risk-based reauthentication and compromised password handling.
- id: encrypted-remote-access
  name: Encrypted Remote Access
  description: Remote administrative access is encrypted and subject to inactivity controls and geographic restrictions.
- id: system-hardening
  name: System Hardening
  description: Windows hosts are hardened by disabling insecure services, removing defaults, configuring time sync, and applying secure baselines.
- id: configuration-review
  name: Configuration Compliance Review
  description: Host configuration drift is reviewed at least quarterly through enterprise configuration and security tooling.
- id: secure-image-maintenance
  name: Secure Image Maintenance
  description: Windows host images and hardening templates are updated from vulnerability scan and patch findings.
- id: disk-encryption
  name: Disk Encryption
  description: Windows host storage uses whole-disk or volume encryption for protected data at rest.
- id: browser-isolation
  name: Browser Isolation And Sandboxing
  description: Browser isolation or sandboxing controls are available for administrative browsing and high-risk access paths.

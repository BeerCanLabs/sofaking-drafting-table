  securityMonitoringApproach: ECS task and cluster telemetry integrated with AWS-native monitoring.
  patchManagementApproach: Task patching is performed through rolling service updates with new image versions.
  externalInteractionRationales:
    Amazon ECS Control Plane: The ECS control plane is modeled to show the managed task scheduling and service-state boundary for container workloads.
    Amazon ECR: Amazon ECR is modeled because ECS task runtime depends on the container registry for image delivery.
    Amazon CloudWatch: Amazon CloudWatch is modeled for ECS task and service telemetry in the managed container runtime.
    AWS Application Load Balancer: The application load balancer is modeled to show the ingress routing dependency for ECS services.

name: AWS Lambda Serverless Host
description: 'Serverless execution environment provided by AWS Lambda. The host is entirely AWS-managed and blackbox to Sofa King. Sofa King deploys function code as a Product Service. No OS management, no agent installation, and no patching responsibility.

  '

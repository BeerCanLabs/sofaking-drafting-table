architectureNotes:
  observedUse: >-
    SK.PG.FormService.CDK/FormServiceDbStack.cs in BeerCanLabs/sk-msvc-pg-forms
    constructs an Amazon.CDK.AWS.DocDB DatabaseCluster with a docdb4.0 cluster
    parameter group and a db.t3.medium instance class.
  approvalConcern: >-
    IMPORTANT — this may not be an acceptable direction. MongoDB Atlas
    (01KQQ5JT05-E3FZ) is recorded in the catalog as deprecated, and DocumentDB is
    a MongoDB-compatible document store. Introducing a new Mongo-compatible
    platform while the existing one is deprecated is an architecture decision,
    not a cataloguing exercise. Recorded as candidate and referred to the
    Architecture Review Board.
  lifecycleRationale: >-
    Candidate, not preferred. The object exists so the dependency is visible in
    the graph; it is not an endorsement.

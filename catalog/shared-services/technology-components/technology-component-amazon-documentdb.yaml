name: Amazon DocumentDB 4.0
description: >-
  Amazon DocumentDB, AWS's MongoDB-compatible managed document database, at
  engine compatibility 4.0. Added under SKPG-19589 after the Associate Development
  form service was found to provision a DocumentDB cluster. No DocumentDB object
  existed in the catalog.
version: 1.0.0
catalogStatus: incomplete
lifecycleStatus: candidate
vendor: Amazon Web Services

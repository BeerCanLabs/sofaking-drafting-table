  notes: Q3 2015 release (2015.3.1111). Progress Telerik mainstream support ended approximately 18 months post-release; extended support has also lapsed. This version is end-of-life. CVE-2019-18935 (critical RCE via deserialization in RadAsyncUpload) affects versions prior to 2020.1.114 — the Telerik.AsyncUpload.ConfigurationEncryptionKey and Telerik.Upload.ConfigurationHashKey settings in WebAppSettings.config must be set to unique random 64-character values per environment to mitigate. Current shipping version as of 2026 is approximately 2026.x; upgrade planning is documented in TrackwebIM-Telerik-Upgrade-Notes.md.
notes: Used exclusively by BeerCanLabs/sk-WHM_IM (Trackweb ASP.NET WebForms application). Controls observed in use include RadGrid, RadComboBox, RadTextBox, RadDatePicker, RadWindow, RadAjaxManager, RadAjaxPanel, RadAsyncUpload, RadStyleSheetManager, RadToolTip, RadNumericTextBox, RadBinaryImage, and RadButton.

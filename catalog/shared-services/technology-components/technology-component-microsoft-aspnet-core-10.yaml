name: Microsoft ASP.NET Core 10
description: >-
  ASP.NET Core 10 application framework and runtime. Added under SKPG-19589
  because three Sofa King product families already run on .NET 10 with no
  Technology Component in the catalog, which topped out at ASP.NET Core 9.
  Cataloguing this closes a company-wide gap rather than recording a
  Associate Development exception.
version: 1.0.0

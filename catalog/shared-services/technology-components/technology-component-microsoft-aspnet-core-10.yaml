architectureNotes:
  observedUse: >-
    Associate Development: pg-msvc-plm-eem-api and PG-ReportWriterAgent both build
    from mcr.microsoft.com/dotnet/sdk:10.0 and run on
    mcr.microsoft.com/dotnet/aspnet:10.0. Already recorded elsewhere in the
    catalog for SOM Tiers of Intensity (software-deployment-tiers-of-intensity
    names "ASP.NET Core 10") and for the Customer Data Platform components, whose
    observed runtime signals read "dotnet (net10.0)".
  lifecycleRationale: >-
    Recorded as candidate rather than preferred. Three product families use it,
    but no Architecture Review Board decision has established .NET 10 as an
    approved Sofa King standard. Promotion to preferred is an ARB action.
  approvalStatus: >-
    NOT approved. This object exists so that deployments on .NET 10 can
    reference a real Technology Component instead of pointing at nothing.
    Whether .NET 10 becomes an approved standard is an open ARB question.

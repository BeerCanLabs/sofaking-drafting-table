type: data_store_service
ownerRole: technology-admin
name: SQL Server 2025 DBMS Service
description: |
  SQL Server 2025 database service. Successor to the SQL Server 2022 DBMS Service.
  Targeted for new cloud-native platforms (e.g., Project Recliner National SOM) that
  need a per-tenant or per-region SQL Server engine. Production deployments are
  expected on AWS RDS for SQL Server; the modeled host below is the self-managed
  Windows Server 2025 on EC2 Standard Host used as the strategic baseline.
version: 1.0.0
catalogStatus: incomplete
lifecycleStatus: candidate

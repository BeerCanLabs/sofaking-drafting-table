architectureNotes:
  minNodes: 3
  autoscaling: none
  loadBalancer: optional
  serviceAuthentication: Database administrators and service identities authenticate through centralized identity and database account governance.
  scalingApproach: scale-up primaries with streaming replicas for resilience
  serviceLogging: Database audit and engine logs are forwarded to centralized logging beyond host-level collection.
  healthCheck: PostgreSQL service probe and replication lag monitoring
  healthWelfareMonitoring: Service probes, replication telemetry, and platform monitoring track service welfare.
  secretsManagement: service accounts and connection secrets stored centrally
  availabilityModel: PostgreSQL deployment with primary and streaming replicas for service continuity.
  scalabilityModel: Vertical scale-up of primaries with replicas used for resilience and read capacity.
  recoverabilityModel: Failed nodes are rebuilt and rejoined to the replica set while backups support point-in-time recovery.
  failureDomain: Scoped to the PostgreSQL cluster serving the dependent application estate.
  backup:
    strategy: daily full plus hourly WAL backup
    platform: pg_dump / pg_basebackup to managed storage
    rto: 1h
    rpo: 1h
  ha:
    mechanism: Streaming Replication
  encryption:
    atRest: required
  accessControl:
    model: Active Directory integrated access with role-based database permissions
deploymentConfigurations:
  - id: replicated-availability
    name: Replicated Availability
    description: Primary and streaming-replica deployment provides database availability and recovery tolerance.
    addressesQualities:
      - availability
      - recoverability
  - id: scale-up-with-replicas
    name: Scale Up With Replicas
    description: Capacity grows through larger primary nodes with replicas for resilience and workload distribution.
    addressesQualities:
      - scalability
  - id: backup-and-pitr
    name: Backup And Point-In-Time Recovery
    description: Daily full backups plus hourly WAL backups support restoration and point-in-time recovery.
  - id: encrypted-storage
    name: Encrypted Storage
    description: Encryption at rest is required for supported PostgreSQL deployments.
  - id: database-password-mfa-baseline
    name: Database Password And MFA Baseline
    description: Database administrative and service identities follow strong password, lockout, timeout, and MFA expectations through centralized identity policy.
  - id: database-mfa-vault-baseline
    name: Database MFA And Vault Baseline
    description: Privileged database credentials are protected through MFA-capable identity flows and managed secret vaulting.
  - id: database-risk-reauthentication
    name: Database Risk Based Reauthentication
    description: Database administrative access can require periodic or risk-based reauthentication and compromised credential handling.

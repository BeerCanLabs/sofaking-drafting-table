architectureNotes:
  serviceAuthentication: Active Directory integrated identities govern administrator and service access to the ETL database.
  scalingApproach: Vertical scaling of a single ETL database instance
  serviceLogging: Database engine and SSIS execution logs are forwarded to centralized logging beyond host-level collection.
  healthCheck: SQL connectivity probe and SSIS package execution monitoring
  healthWelfareMonitoring: SQL connectivity probes, SSIS execution telemetry, and platform monitoring track service welfare.
  secretsManagement: Database credentials and integration secrets stored centrally
  availabilityModel: Single ETL database instance by explicit architectural decision.
  scalabilityModel: Vertical scale-up of the ETL database instance with optional workload tuning.
  recoverabilityModel: Restore the ETL database from backups and re-establish SSIS execution on a rebuilt host.
  failureDomain: Scoped to the shared data-integration service group served by this ETL database.
  internalComponentRationales:
    01KQQ5JT1V-646V: SQL Server Integration Services (SSIS) component providing ETL and data integration execution capabilities.
  backup:
    strategy: Daily full backup with transaction log backup aligned to ETL windows
    platform: SQL Server native backup to managed storage
    rto: 4h
    rpo: 24h
  ha:
    mechanism: none
  encryption:
    atRest: Transparent Data Encryption enabled for all production databases
  accessControl:
    model: Active Directory integrated access with role-based SQL permissions

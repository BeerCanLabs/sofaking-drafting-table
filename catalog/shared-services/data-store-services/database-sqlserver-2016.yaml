architectureNotes:
  minNodes: 3
  autoscaling: none
  loadBalancer: optional
  serviceAuthentication: Active Directory integrated identities govern administrator and service access to the database.
  scalingApproach: scale-up database nodes with secondary replicas where required
  serviceLogging: Database audit and engine logs are forwarded to centralized logging beyond host-level collection.
  healthCheck: SQL listener probe and AG replica health monitoring
  healthWelfareMonitoring: SQL listener probes, replica telemetry, and platform monitoring track service welfare.
  secretsManagement: service accounts and connection secrets stored centrally
  availabilityModel: AlwaysOn Availability Groups provide multi-node database availability.
  scalabilityModel: Vertical scale-up of primary nodes with optional secondary replicas where required.
  recoverabilityModel: Failed nodes are replaced and rejoined to the AG while backups support point-in-time recovery.
  failureDomain: Scoped to the SQL Server availability group serving the dependent application estate.
  backup:
    strategy: daily full plus hourly log backup
    platform: SQL Server native backup to managed storage
    rto: 1h
    rpo: 1h
  ha:
    mechanism: AlwaysOn Availability Groups
  encryption:
    atRest: TDE enabled on all production databases
  accessControl:
    model: Active Directory integrated access with role-based SQL permissions

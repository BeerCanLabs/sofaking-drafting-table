name: PG STL SQL Server Database
description: >-
  Microsoft SQL Server database service backing Sofa King Associate Development's
  PLM/EEM product. The STL database is the system of record for professional
  learning and associate evaluation data and is deployed in a hub-and-spoke
  topology on availability group GRRPGPRDAG01 at the Grand Rapids data center.
  Consumed by the legacy estate (LDMS .NET, LDMS Classic ASP, FORMIX, Report
  Writer) and, indirectly, by the PLM/EEM cloud services tier.

architectureNotes:
  lifecycleRationale: SQL Server 2017 mainstream support ended 2022-10-11 and extended support ends 2027-10-12
    per the Microsoft product lifecycle, as already recorded on TechnologyComponent 01KQQ5JT1T-QKGB. Set
    to existing-only rather than deprecated because roughly fourteen months of extended support remain
    as of 2026-08-20; the 2016 service by contrast is deprecated with its extended support ending 2026-07-14.
    Expect this object to move to deprecated as the 2027 date approaches. See DecisionRecord 01M0GDHSAM-F64B.
  hostSubstrate: 'Provisional, not confirmed. A self-managed DataStoreService must declare a host, so
    this object references Windows Server 2019 on EC2 (01KQQ5JT03-C74W) - the substrate every existing
    SQL Server 2017 object in this catalog already uses, and the closest era-matched host in the generic
    series (the generic 2019 and 2022 services use Windows Server 2022 on EC2, 01KQQ5JT04-JKFX). The
    substrate for the 2017 estate outside SOM was not confirmed by evidence: the only infrastructure
    signal for Digital Stores is the database hostname aldb.dsh-aws.local, which indicates AWS but names
    no OS version. Shared Services owns confirming or correcting this reference - see the open question
    sqlserver-2017-shared-service-completion in DraftingSession 01M0GBWMZJ-8XYB.'
  serviceAuthentication: Not confirmed. Shared Services to complete.
  secretsManagement: Not confirmed. Shared Services to complete.
  serviceLogging: Not confirmed. Shared Services to complete.
  healthWelfareMonitoring: Not confirmed. Shared Services to complete.
  availabilityModel: Not confirmed. The generic 2019 and 2022 services declare AlwaysOn Availability Groups;
    whether the 2017 estate does is unverified and was not copied forward.
  scalabilityModel: Not confirmed. Shared Services to complete.
  recoverabilityModel: Not confirmed. Shared Services to complete.
  failureDomain: Not confirmed. Shared Services to complete.
  patchCurrency: One data point exists. The Digital Stores engine build was reported as 14.0.3495.9 on
    2026-08-20, which is CU31 + GDR (KB5058714, released 2025-07-08). Seven later security GDR builds
    have shipped since, the most recent being 14.0.3540.1 (KB5102337, 2026-07-14). Whether that build
    is representative of the wider 2017 estate is unknown. See DecisionRecord 01M0GDHSAM-F64B.

name: SQL Server 2017 DBMS Service
description: 'Standard SQL Server 2017 database service. Fills the only gap in the generic database-sqlserver-*
  series (2016, 2019, 2022 and 2025 already exist); the three existing SQL Server 2017 objects in this
  catalog are all SOM-specific and are not reusable. Stubbed on 2026-08-20 during the Digital Stores
  composition session because Digital Stores reported engine build 14.0.3495.9 and no generic 2017 service
  existed to reference. Deliberately carries no availability, backup, encryption or access-control posture:
  none of it was evidenced, and copying the 2019 or 2022 boilerplate would assert unverified facts. Shared
  Services owns completing this object - see DraftingSession 01M0GBWMZJ-8XYB.'

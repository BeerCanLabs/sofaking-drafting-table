name: PG Form Service DocumentDB Cluster
description: >-
  Amazon DocumentDB cluster backing the Associate Development form service
  (msvc-pg-forms). Catalogued under SKPG-19589. This object corrects an earlier
  assumption: the repository ships rds-combined-ca-bundle.p7b, which was read as
  evidence of an AWS RDS dependency, but the CDK provisions DocumentDB — which
  uses the same RDS certificate bundle for TLS. PRE-PRODUCTION: its only
  consumer is not believed ever to have been deployed.

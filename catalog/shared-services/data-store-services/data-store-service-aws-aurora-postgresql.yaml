deploymentConfigurations:
  - id: iam-access-control
    name: IAM Authentication and Access Control
    description: Aurora uses IAM database authentication exclusively; no database passwords are issued to applications or administrators. Access is granted through IAM roles with least-privilege policies. Elevated access follows a JIT role-assumption pattern via AWS IAM. IAM authentication tokens expire after 15 minutes, enforcing implicit reauthentication. MFA is enforced via IAM Condition keys on sensitive roles. The root DB user is disabled post-cluster creation.
    addressesQualities:
      - availability
      - recoverability
  - id: vpc-network-security
    name: VPC Network Security and Firewall Configuration
    description: Aurora cluster has no public endpoint. VPC Security Groups restrict inbound access to port 5432 from app-tier security groups only. Network ACLs enforce subnet-level controls. Security Group rules are reviewed every 6 months by the architecture-review-board team to enforce least-privilege network access.
    addressesQualities:
      - recoverability
  - id: automated-backups-and-recovery
    name: Ottoman Production Backup Retention
    description: Production Ottoman Aurora backups are retained daily for 31 days, monthly for 13 months, and annually for seven years using AWS Backup.
    addressesQualities:
      - recoverability
  - id: data-encryption
    name: Encryption in Transit and at Rest
    description: TLS 1.2+ is enforced for all client connections via Aurora parameter group (ssl=1, ssl_min_protocol_version=TLSv1.2). All Aurora cluster storage is encrypted at rest using LVE-875 via AWS KMS customer-managed key, covering data files, automated backups, snapshots, and read replicas.
    addressesQualities:
      - availability
      - recoverability
  - id: cloud-security-baseline
    name: Cloud Security Baseline and Posture Management
    description: Aurora cluster is deployed in a private VPC with no public endpoint exposure. AWS Security Hub is enabled with CIS AWS Foundations Benchmark v3; findings are reviewed by the information security team. GuardDuty monitors for anomalous database access patterns. Billing alarms are configured at the AWS account level. Unused regions are disabled via Service Control Policies (SCPs).
    addressesQualities:
      - recoverability

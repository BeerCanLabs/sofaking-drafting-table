name: PG ASP.NET Core 10 on EKS Application Runtime
description: >-
  Application runtime substrate for the Associate Development PLM/EEM cloud
  services tier. Hosts the containerised .NET services — pg-msvc-plm-eem-api and
  PG-ReportWriterAgent — on Amazon EKS. Added under SKPG-19589: before this
  object, PG components pointed their runsOn directly at the Amazon EKS
  Standard Container Host, so no runtime service existed in the graph for either
  PG compute tier. Follows the convention set by
  runtime-service-recliner-dotnet-eks and
  runtime-service-hcm-rh-aspnet-core-9-eks.

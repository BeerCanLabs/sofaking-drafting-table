architectureNotes:
  serviceAuthentication: Administrators authenticate through the existing Active Directory Authentication Service (owner-confirmed 2026-07-31). Specific group mappings and authorization roles remain unconfirmed.
  secretsManagement: Credentials used to access and monitor devices are stored within PRTG (owner-confirmed 2026-07-31). Encryption, rotation, access-review, and recovery details remain unconfirmed.
  serviceLogging: Audit and application logs are retained within PRTG and are not forwarded to a separate central logging platform (owner-confirmed 2026-07-31). Retention duration remains unconfirmed.
  healthWelfareMonitoring: HPTPRTG2 runs the core server and a local probe; GRRPRTG2 runs the Grand Rapids probe. The Grand Rapids probe monitors GRRNAP1CLU1 and GRRFILES1. Specific checks, thresholds, and alert routing remain unconfirmed.
  alertRouting: Operational alerts are sent through both the shared Opsgenie Alerting Service and email (owner-corrected 2026-07-31). The SMTP relay or email-delivery platform, priorities, responder teams, schedules, and escalation rules remain unconfirmed.
  availabilityModel: HPTPRTG2 is the only PRTG core server and has no standby or failover core (owner-confirmed 2026-07-31). HPTPRTG2 and GRRPRTG2 provide local probe roles, but the core server remains a single point of failure for centralized monitoring and alert processing.
  scalabilityModel: Monitoring coverage is distributed through probes; capacity and scaling procedures remain unconfirmed.
  recoverabilityModel: HPTPRTG2 is restored from a VM backup after failure (owner-confirmed 2026-07-31). Recovery time, recovery point, backup platform, and recovery-test evidence remain unconfirmed.
  failureDomain: Loss of HPTPRTG2 removes the sole PRTG core server and its local probe, affecting centralized monitoring and alert processing. Loss of GRRPRTG2 removes the Grand Rapids probe; detailed buffering or degraded-mode behavior remains unconfirmed.

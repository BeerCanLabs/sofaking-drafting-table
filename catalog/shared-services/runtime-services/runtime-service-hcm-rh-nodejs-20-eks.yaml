name: HCM RH Node.js 20 on EKS Application Runtime
description: >-
  Application runtime substrate for the HCM Recruiting & Hiring Next.js
  applications. The HCM RH App containers run on Amazon EKS using the governed
  Node.js 20 TechnologyComponent.
version: 1.0.0
catalogStatus: incomplete

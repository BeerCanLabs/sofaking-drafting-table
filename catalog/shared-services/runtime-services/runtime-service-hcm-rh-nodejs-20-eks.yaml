architectureNotes:
  minNodes: 2
  autoscaling: required
  loadBalancer: required
  serviceAuthentication: >-
    Ottoman authenticates requests and injects trusted user context before
    traffic reaches the Next.js workloads.
  secretsManagement: >-
    Runtime configuration is injected through Kubernetes ConfigMaps and
    secrets.
  serviceLogging: >-
    Server-side Next.js logs are emitted by the containers for collection by
    the platform logging pipeline.
  healthWelfareMonitoring: >-
    Kubernetes liveness and readiness probes monitor each application
    deployment.
  availabilityModel: >-
    The two Next.js applications use independent multi-replica Kubernetes
    Deployments distributed across EKS worker nodes.
  scalabilityModel: >-
    Horizontal Pod Autoscalers scale the application deployments independently.
  recoverabilityModel: >-
    Stateless containers are restarted by Kubernetes and replaced when pods or
    nodes fail.
  failureDomain: >-
    Failure is isolated to an application Deployment within the regional EKS
    cluster.
deploymentConfigurations:
  - id: multi-replica-hpa
    name: Multi-Replica Deployment with HPA
    description: >-
      Run each Next.js application as a multi-replica Kubernetes Deployment
      with horizontal pod autoscaling.
    addressesQualities:
      - availability
      - scalability
  - id: kubernetes-self-healing
    name: Kubernetes Self-Healing
    description: >-
      Use readiness and liveness probes so Kubernetes removes unhealthy pods
      from service and replaces failed containers.
    addressesQualities:
      - recoverability

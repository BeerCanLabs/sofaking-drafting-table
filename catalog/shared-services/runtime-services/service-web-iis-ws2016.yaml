architectureNotes:
  hostModel: AWS-hosted Windows IIS workloads using this runtime run on Windows Server 2016 EC2 hosts. Database servers are not represented by this runtime and are modeled separately.
  serviceAuthentication: Web identities and administrative access use centralized identity and certificate services.
  scalingApproach: Horizontal scaling behind an application load balancer
  serviceLogging: IIS and application logs are forwarded to centralized logging beyond host event collection.
  healthCheck: HTTP endpoint probe monitored by the load balancer and synthetic monitoring
  healthWelfareMonitoring: Endpoint probes, synthetic monitoring, and platform telemetry monitor service welfare.
  secretsManagement: Application secrets and certificates sourced from centralized secret storage
  availabilityModel: Multiple IIS instances behind a load balancer when deployed in HA mode.
  scalabilityModel: Horizontal scaling behind an application load balancer.
  recoverabilityModel: Replace failed IIS nodes and return them to service through the standard deployment workflow.
  failureDomain: Scoped to the IIS web-service tier within its deployment environment.

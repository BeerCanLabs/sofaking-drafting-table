architectureNotes:
  minNodes: 3
  autoscaling: required
  loadBalancer: required
  serviceAuthentication: Web identities and administrative access use centralized identity and certificate services.
  scalingApproach: horizontal autoscaling behind load balancer
  serviceLogging: IIS and application logs are forwarded to centralized logging beyond host event collection.
  healthCheck: HTTP 200 endpoint monitored by the load balancer
  healthWelfareMonitoring: Endpoint probes, synthetic URL checks, and platform telemetry monitor service welfare.
  secretsManagement: runtime secrets sourced from centralized secret store
  externalInteractionRationales:
    Enterprise DNS: Service DNS registration and name resolution are modeled as endpoint support dependencies for IIS web services, even though DNS does not satisfy a DRAFT runtime-service requirement.
    Certificate Management Platform: TLS certificate issuance and renewal are modeled as endpoint support dependencies for IIS web services; the service-level secrets requirement is documented separately.
  availabilityModel: Multi-node IIS web tier behind load balancing.
  scalabilityModel: Horizontal autoscaling behind a load balancer.
  recoverabilityModel: Replace failed IIS nodes while remaining nodes continue serving traffic.
  failureDomain: Scoped to the IIS web tier deployment unit behind the load balancer.

name: HCM RH ASP.NET Core 9 on EKS Application Runtime
description: >-
  Application runtime substrate for the HCM Recruiting & Hiring .NET backend
  workloads. The HCM RH Core containers run on Amazon EKS using the governed
  Microsoft ASP.NET Core 9 TechnologyComponent.
version: 1.0.0
catalogStatus: incomplete
lifecycleStatus: candidate

name: Customer Services ASP.NET Core 10 on EKS Application Runtime
description: >-
  Application runtime substrate for Customer Services ASP.NET Core 10 microservice
  APIs hosted on Amazon EKS and delivered by Argo CD. First used by the Shared
  Customer Record services. Replaces their previous placeholder runsOn to the generic .NET Core Application
  Service stub, which names ASP.NET Core 8 as its function and does not match the
  net10.0 services.

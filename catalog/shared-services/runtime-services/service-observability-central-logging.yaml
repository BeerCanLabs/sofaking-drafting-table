architectureNotes:
  serviceAuthentication: Access to the managed logging destination is controlled through AWS IAM and workload identity.
  secretsManagement: Log forwarding endpoint and credential material are supplied through managed cluster secret delivery when required.
  serviceLogging: Fluent Bit forwards platform and workload logs to AWS OpenSearch Service for centralized retention and search.
  healthWelfareMonitoring: Fluent Bit forwarder health, delivery errors, and AWS OpenSearch domain health are monitored through the observability stack.
  availabilityModel: Log forwarding runs as a replicated cluster service and the logging destination uses the AWS OpenSearch managed service availability model.
  scalabilityModel: Forwarder replicas and AWS OpenSearch domain capacity scale independently with log volume.
  recoverabilityModel: Failed forwarder pods are restarted by the container platform and AWS OpenSearch recovery follows the managed service recovery model.
  failureDomain: Scoped to the EKS cluster logging plane and the AWS OpenSearch domain and region.

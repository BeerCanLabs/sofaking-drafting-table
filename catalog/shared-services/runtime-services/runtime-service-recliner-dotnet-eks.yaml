name: Recliner .NET Core 8 on EKS Application Runtime
description: |
  Application runtime substrate for Project Recliner (National SOM). Hosts the
  .NET Core 8 BFF and the eight first-party Recliner core microservices on AWS
  EKS, with each microservice running as an independently scalable Kubernetes
  Deployment. Recliner owns four environment-specific clusters: recliner-dev,
  recliner-test, recliner-stage, and recliner-prod. This is the architecture-layer
  execution environment for the Recliner ProductComponents.

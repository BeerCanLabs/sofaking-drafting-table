name: Java Application Service on Amazon ECS
description: |
  Reusable Java application runtime for containerized workloads deployed as
  Amazon ECS services on EC2-backed ECS clusters. The runtime covers the ECS
  task, service, capacity-provider, load-balancer, image-delivery, and
  CloudFormation-managed replacement behavior used by RT ERP region
  deployments. It does not represent AWS Fargate.

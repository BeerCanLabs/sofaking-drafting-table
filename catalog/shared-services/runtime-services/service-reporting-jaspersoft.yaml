name: JasperSoft Reporting Service
description: 'Per-region JasperSoft reporting service for RT-ERP. The cloud deployment runs as an ECS service on EC2-backed cluster capacity and includes Jasper web application, PostgreSQL repository, ActiveMQ, and buildomatic container roles.

  '

architectureNotes:
  hostModel: AWS-hosted ABBYY FlexiScan workloads using this runtime run on Windows Server 2016 EC2 hosts. Database servers are not represented by this runtime and are modeled separately.
  serviceAuthentication: Scanning service accounts and workflow credentials use centralized secret distribution.
  scalingApproach: Single-instance deployment with vertical scale-up
  serviceLogging: Scanning workflow logs are exported to centrally managed logging and retained with operational telemetry.
  healthCheck: Service-process monitoring and synthetic scanning workflow test
  healthWelfareMonitoring: Service-process monitoring and synthetic scanning workflow tests track service welfare.
  secretsManagement: Runtime credentials sourced from centralized secret storage
  availabilityModel: Single-instance scanning service with no built-in active redundancy.
  scalabilityModel: Vertical scale-up on the assigned host.
  recoverabilityModel: Rebuild the service on a replacement host and restore configuration and workflow dependencies.
  failureDomain: Scoped to the scanning workflow service for the deployment that consumes it.

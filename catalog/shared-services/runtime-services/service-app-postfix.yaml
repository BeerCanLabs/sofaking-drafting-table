name: Postfix Mail Service
description: >-
  Reusable Postfix-based mail relay service. RT ERP uses a single
  region-scoped Gateway-B relay that accepts application SMTP traffic on
  port 25 and relays outbound mail to Amazon SES on port 587.
version: 1.0.0
catalogStatus: incomplete
lifecycleStatus: existing-only

architectureNotes:
  minNodes: 2
  autoscaling: none
  loadBalancer: required
  serviceAuthentication: Mail relay identities and certificates use centralized identity and secret distribution.
  scalingApproach: active-active relay pair behind load balancer
  serviceLogging: SMTP transaction and relay logs are forwarded to centralized logging beyond host-level collection.
  healthCheck: SMTP banner probe and mail queue synthetic monitor
  healthWelfareMonitoring: SMTP banner probes, queue-depth checks, and platform telemetry monitor service welfare.
  secretsManagement: runtime secrets sourced from centralized secret store
  availabilityModel: Active-active relay pair behind load balancing.
  scalabilityModel: Manual horizontal expansion by adding additional relay nodes.
  recoverabilityModel: Rebuild failed relay nodes and return them to the active mail relay pool.
  failureDomain: Scoped to the mail relay tier supporting the routed messaging workload.
  rterpDeployment: >-
    RT ERP uses one Postfix relay on Gateway-B in each region account rather
    than the generic active-active relay-pair configuration.
  rterpUpstream: >-
    The Gateway-B relay sends mail to the Amazon SES SMTP endpoint in
    us-east-2 on port 587 using STARTTLS.
deploymentConfigurations:
  - id: relay-pair-availability
    name: Relay Pair Availability
    description: Two active relay nodes behind a load balancer provide mail relay availability.
    addressesQualities:
      - availability
      - recoverability
  - id: horizontal-relay-expansion
    name: Horizontal Relay Expansion
    description: Additional relay nodes can be added to increase message-processing capacity.
    addressesQualities:
      - scalability
  - id: rt-erp-gateway-b-single-relay
    name: RT ERP Gateway-B Single Relay
    description: >-
      Current RT ERP region baseline: one Gateway-B Postfix relay receives
      application SMTP traffic on port 25 and sends it to Amazon SES in
      us-east-2 on port 587. This configuration does not claim the generic
      relay-pair availability model.

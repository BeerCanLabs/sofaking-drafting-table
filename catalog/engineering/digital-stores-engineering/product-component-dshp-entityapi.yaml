description: ASP.NET Web API 2 backend for Digital Stores Suite+ on .NET Framework 4.6.1, hosted in IIS.
  Serves the /api/v1 REST surface plus two legacy handler endpoints, and reads and writes SQL Server directly
  with hand-written SQL and no ORM. Multi-tenant by store region, with a separate database per region
  resolved per request through a central DS_Admin catalog. Authored from a direct read of BeerCanLabs/sk-server-ang
  on 2026-08-20; architecture facts and their provenance are recorded in DecisionRecord 01M0GBWMZJ-AAX4.
  Availability, scalability, recoverability and failure-domain posture were closed on 2026-09-08 from the
  DRAFT L1 Baseline Questionnaire and the Digital Stores Environment Guide.

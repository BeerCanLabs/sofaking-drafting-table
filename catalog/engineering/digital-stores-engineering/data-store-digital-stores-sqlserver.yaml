schemaVersion: '1.0'
uid: 01M25X9W0R-VQJ3
type: data_store_service
name: Digital Stores SQL Server 2017 Estate
aliases:
- DSHP SQL Server
- Digital Stores region databases
description: >-
  Product-specific SQL Server 2017 data-at-rest service for Digital Stores Suite+. One self-managed
  SQL Server instance per environment tier on a Windows EC2 host in AWS account 472468972873,
  us-west-1, each holding one database per store region plus the shared DS_Admin routing catalog.
  Accessed by the EntityAPI with hand-written SQL and no ORM. Posture facts recorded here were
  confirmed by the Digital Stores engineering owner on 2026-09-08 through the DRAFT L1 Baseline
  Questionnaire and corroborated against the Digital Stores Environment Guide, the AWS Backup Service
  page and the Scheduled Tasks page. Authored in preference to completing the generic SQL Server 2017
  DBMS Service (01M0GDHSAM-586D), whose posture is Shared Services' to establish on estate-wide
  evidence rather than on one product's answers.
version: 1.1.0
catalogStatus: incomplete
lifecycleStatus: existing-only
owner:
  team: digital-stores-engineering
  contact: digital-stores-eng@sofaking.example

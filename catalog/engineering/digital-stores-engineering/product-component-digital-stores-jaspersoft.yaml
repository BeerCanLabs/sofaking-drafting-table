name: Digital Stores Jaspersoft
description: >-
  Stub. A separately paid JasperReports-based custom-report and data-extract service that runs ten
  nightly extracts against the Digital Stores SQL Server estate and delivers them over
  ftp.digital-showrooms.example. Confirmed to exist via answer 7.1 of the DRAFT L1 Baseline Questionnaire
  (2026-09-08) and enumerated in DecisionRecord 01M25X9W0R-56TA (external dependencies) and
  DecisionRecord 01M263WKS2-NR3T (inter-service-connections). Deliberately not modeled on the
  existing RT-ERP-specific JasperSoft Reporting Service (01KQQ5JT1F-737K): that object is an
  ECS-per-region deployment evidenced for a different product, and reusing it here would assert an
  unverified hosting model. Registered now only to anchor the confirmed Jaspersoft-to-SQL-Server
  relationship as a real object rather than a narrative reference; full posture is unconfirmed and is
  the remaining scope of the register-external-dependencies next step in DraftingSession
  01M0GBWMZJ-8XYB.

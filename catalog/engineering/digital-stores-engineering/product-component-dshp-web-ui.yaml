description: Angular single-page application for Digital Stores Suite+ (DSHP). Compiled to static bundles
  and served by IIS from a /dist/ path on the same origin as the EntityAPI. Authored from a direct read
  of BeerCanLabs/sk-main-ang on 2026-08-20; architecture facts and their provenance are recorded in
  DecisionRecord 01M0GBWMZJ-AAX4. Availability, scalability, recoverability and failure-domain posture
  were closed on 2026-09-08 from the DRAFT L1 Baseline Questionnaire and the Digital Stores Environment
  Guide.

  scalingUnit: Shared IIS web tier
  deployableObjects:
  - ref: 01M0GBWMZJ-9DNC
    networkZone: web
    diagramTier: presentation
    notes: >-
      Angular bundles served as static files by IIS from /dist/ on the same origin as the API, per
      web.config and angular.json baseHref. Production PRAngWeb1 in an Auto Scaling group, sandbox
      SBWeb, QA QAWeb, alpha ALWeb4.
- name: Application Tier
  deploymentTarget: aws-us-west-1

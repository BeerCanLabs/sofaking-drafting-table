- name: Data Tier
  deploymentTarget: aws-us-west-1
  scalingUnit: Region SQL Server databases
  notes: >-
    SQL Server 2017 on Windows EC2, one instance per environment tier, each holding one database per
    region plus the shared DS_Admin catalog. No AlwaysOn availability group and no RDS. Now
    references the Digital Stores-specific data store service rather than the generic 2017 stub.
  deployableObjects:
  - ref: 01M25X9W0R-VQJ3
    networkZone: data
    diagramTier: data
    notes: >-
      PRAngDB1 (production, m5.4xlarge, 14.0.3495.9), SUDB (sandbox, m5.xlarge, 14.0.3495.9), QADB
      (QA, c5.large, 14.0.3485.1), ALDB (alpha, c5.large, 14.0.3485.1). Accessed with raw SQL and no
      ORM. TDE is not enabled; extended support ends 2027-10-12.

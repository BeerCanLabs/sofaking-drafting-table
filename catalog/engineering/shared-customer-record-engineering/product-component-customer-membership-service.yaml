name: Customer Membership Service
aliases:
  - ss-msvc-customer-membership
description: >-
  Planned ASP.NET Core (.NET 10) HTTP API owning the Customer Store Association,
  the record that a customer is enrolled at a site for a store year (entry and
  optional exit, entry grade level, membership type, primary-store flag, and
  rollover intent). Spec-complete (Ready to build, 2026-09-29) with initial
  implementation in progress; facts below are taken from the spec and are not yet
  observed in a deployed service. Reads and writes the Customer Membership
  DynamoDB store, validates every GUID reference synchronously against Customer
  Profile, Academic Calendar, and the org-unit (site) service, and publishes change
  events outbound-only to Loveseat via the Customer Membership Event Publisher.

notes:
  sourceRepository: https://github.com/BeerCanLabs/sk-ss-msvc-calendar
  repositoryName: BeerCanLabs/sk-ss-msvc-calendar
  repositoryPrimaryLanguage: C#
  observedRuntimeSignals: dotnet (net10.0), aws-lambda, sqs
  observedManifestPaths: >-
    src/deploy/Deploy/CalendarEventPublisherStack.cs;
    src/deploy/Deploy/Configuration/EventPublisherConfiguration.cs;
    docs/architecture/eventing-pipeline.md;
    docs/deploy/event-publisher-dlq-runbook.md
  eventContract: >-
    EventType-03.03 envelope; event.content is the full canonical CalendarTypeV01,
    SessionTypeV01, or PricingPeriodTypeV01 (state, id, metadata, revision). Source
    is { application: ss, service: calendar }. At-least-once delivery; consumers
    dedupe updates on (content.id, content.revision) and take delete
    unconditionally. CalendarDate and the pricing-period link emit no events of
    their own; they ride as Calendar and Session updates.
  deadLetter: >-
    Each SQS queue has a DLQ (maxReceiveCount 3-5, at least 14-day retention) with
    alerting and a replay runbook. Failed or unchanged writes emit no events.
  authentication: >-
    Okta client credentials with scope plat.loveseat. The owner confirmed on
    2026-10-20 that Okta is the Loveseat auth provider for every Shared Customer Record
    service; the calendar spec's mention of IDM is superseded.

name: Academic Calendar Event Publisher
description: >-
  AWS Lambda worker (.NET 10) that consumes change messages from the
  event-publisher SQS queue (fed by the DynamoDB Streams → EventBridge Pipe → SNS
  fanout), translates Calendar, Session, and PricingPeriod changes into canonical
  customer-domain events (create, update, or delete on tombstone), and publishes
  them to the Sofa King Loveseat event bus. Outbound-only: the Academic Calendar
  service has no inbound worker and no Loveseat subscription.

  keySchema: >-
    Partition key pk (String), sort key sk (String); GSIs gsi1, gsi2, gsi3 each
    with their own partition and sort keys. Billing PAY_PER_REQUEST. Encryption
    AWS-managed (default).
  classificationRationale: >-

type: data_component
ownerRole: engineer
name: Customer Profile Store
description: >-
  DynamoDB single-table store owned by the Customer Profile service, holding
  Customer, Contact, and CustomerContactAssociation entities. Table
  SS_CustomerProfile_{Environment} uses a pk/sk key schema with three global
  secondary indexes (gsi1, gsi2, gsi3), on-demand (PAY_PER_REQUEST) billing, and
  DynamoDB Streams (NEW_AND_OLD_IMAGES) enabled for change-data-capture fanout.

tables:
  - name: SS_CustomerProfile
    description: >-
      Single-table design (pk/sk + gsi1/gsi2/gsi3). Holds Customer, Contact, and
      CustomerContactAssociation item types. Streams enabled (NEW_AND_OLD_IMAGES)
      feeding an EventBridge Pipe → SNS fanout topic → SQS consumer queues.
    containsPII: true
retentionPolicy: >-

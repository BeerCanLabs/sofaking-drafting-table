notes:
  sourceRepository: https://github.com/BeerCanLabs/sk-ss-msvc-customer-membership
  repositoryName: BeerCanLabs/sk-ss-msvc-customer-membership
  repositoryPrimaryLanguage: C#
  observedManifestPaths: >-
    src/service/EventPublisher/Function.cs;
    src/deploy/Deploy/CustomerMembershipEventPublisherStack.cs;
    docs/architecture/membership-service-spec.md
  eventContract: >-
    EventType-03.03 envelope; event.content is the full canonical
    CustomerstoreAssociationTypeV01 with revision = meta.entityVersion. Source is
    { application: ss, service: customer-membership }. Envelope id is a UUIDv5 of
    the stream eventID so redeliveries match; consumers dedupe updates on
    (content.id, content.revision) and take delete unconditionally.
  deadLetter: >-
    Two DLQs: customer-membership-dynamo-fanout-pipe-dlq (Pipe to SNS, 3 retries)
    and customer-membership-event-publisher-dlq (Lambda, maxReceiveCount 5), each
    with 14-day retention. 512 MB, 15s timeout, batch 10.
  authentication: >-
    Okta client credentials with scope plat.loveseat and a dedicated Okta client for
    membership, modeled as an authenticates-via relationship to Okta
    (01KQQ5JT1D-SHXD). Okta is the Loveseat auth provider for every Shared Customer
    Record service (owner-confirmed 2026-10-20). Loveseat client, authority, and base
    URL values are still open provisioning inputs.

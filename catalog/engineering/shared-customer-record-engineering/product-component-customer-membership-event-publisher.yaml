type: product_component
ownerRole: engineer
name: Customer Membership Event Publisher
description: >-
  AWS Lambda worker (.NET 10) that consumes change messages from the
  customer-membership-event-publisher SQS queue (fed by the DynamoDB Streams →
  EventBridge Pipe → SNS fanout), translates CustomerstoreAssociation changes into
  canonical customer-domain events (create, update, delete on tombstone), and
  publishes them to the Sofa King Loveseat event bus. Outbound-only. Planned per the
  service spec; the CDK stacks exist in the repo.

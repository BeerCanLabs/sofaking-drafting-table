runtimeSpec:
  dependencies:
    - ref: 01KQQ5JT05-0C4P
      purpose: Consumes customer-membership-event-publisher-queue (SNS-subscribed SQS).
      interface: SQS queue customer-membership-event-publisher-queue
    - ref: 01KWF3RGCF-T2HM
      purpose: Retrieve the Loveseat client secret.
      interface: AWS Secrets Manager, namespace customer-membership/event-publisher/loveseat-service

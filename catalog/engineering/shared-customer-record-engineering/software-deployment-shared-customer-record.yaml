name: Shared Customer Record
aliases:
  - SSR
  - Customer Data Platform
description: >-
  Shared Customer Record (SSR), formerly the Customer Data Platform. Cloud-native
  Customer Solutions microservices platform on AWS EKS providing core customer
  identity and family-relationship data (Customer Profile), year-scoped calendars,
  sessions, and pricing periods (Academic Calendar), and customer store membership
  (Customer Membership). Each service is an ASP.NET Core HTTP API on .NET 10 with its
  own DynamoDB single-table store and change-data-capture, and event-driven Lambda
  workers that publish canonical customer events to the Loveseat event bus (authenticating
  with Okta); Customer Profile also validates caller-supplied orgPersonIds against the
  Ottoman msvc-org-person service (IDM auth) and consumes Loveseat identity-match events.
  All three services are deployed to le1 in development
  and stage; Customer Membership is still being built. Production is intended for
  Chaise and not yet provisioned.

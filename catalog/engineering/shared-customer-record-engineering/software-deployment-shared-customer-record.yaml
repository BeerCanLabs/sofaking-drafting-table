  discoveryBoundary: >-
    Composition inferred from read-only crawls of the three ss-msvc-* repositories
    (2026-07-17 and 2026-10-20) and of the k8s-deployments manifests for le1
    (2026-10-20), all owner-authorized. Runtime substrate for the APIs is AWS EKS
    per each repository's CLAUDE.md. Network Zone and Connection Elicitation was run
    with the owner on 2026-10-20: Traefik is the only ingress (no Kong); an internal
    Traefik ALB is the only thing in front of it for dev and stage (no WAF or CDN);
    the four network zones and the zone assignment are confirmed; Loveseat and Customer
    Membership's validation calls enter through the per-service Traefik hostnames; and
    all three APIs read AWS Secrets Manager. Same-tier connections were not reviewed.
    The production edge on Chaise, the le1 cluster's own failure and availability
    characteristics, and any Operations rule on service-to-service paths have not been
    elicited.
  deploymentResources: >-
    All three services run one replica per environment with the same resource
    footprint; production on Chaise and any HA target are not yet defined.

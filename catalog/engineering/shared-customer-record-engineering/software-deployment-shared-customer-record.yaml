availabilityRequirement: >-
  No high-availability target is defined yet. Development and stage run each API as a
  single replica with no autoscaler (requests 100m CPU / 256Mi, limits 800m / 2048Mi)
  behind Traefik, with readiness and liveness probes; EKS reschedules a failed pod.
  Event processing relies on AWS-managed regional availability (DynamoDB Streams,
  SNS, SQS with DLQs, Lambda). Production is not provisioned, so no production
  availability requirement is recorded.
dataClassification: >-
  Confidential. Customer Profile and Customer Membership hold FERPA-protected customer
  and family PII (identity, contact, family associations, membership and exit dates
  keyed by customer). Academic Calendar holds structural, non-PII scheduling data and
  is classed internal. Final tier (confidential vs restricted) for Customer Profile
  and Customer Membership is pending Data/Security confirmation; see session
  questions data-classification-confirm and membership-data-classification.
failureDomain:
  scope: service-group
  description: >-
    An API pod failure is isolated to its service and rescheduled by EKS. Each
    service owns its own DynamoDB table, SNS topic, queues, and Lambda, so a data or
    event-pipeline failure is isolated to that service. A le1 cluster or Traefik
    outage takes all three APIs down together in development and stage. Membership
    validates Customer Profile, Academic Calendar, and Core HR Org Unit synchronously
    and fails closed, so an outage of any of those blocks Membership writes (503).
    Lambda, SQS, SNS, and DynamoDB are regional us-east-1 managed-service dependencies.
patternDeviations: >-
  Follows the AWS EKS Multi-Tenant Microservices reference architecture with three
  evidenced deviations: (1) the data tier uses AWS DynamoDB (01KQQ5JT04-K58R,
  preferred) per service rather than the RA's PostgreSQL/S3/Redis data services;
  (2) event processing runs on AWS Lambda (01KQQ5JT05-CT7X) alongside the EKS-hosted
  APIs; (3) ingress is Traefik only, with no Kong gateway or Kong Mesh in the path
  (Academic Calendar's spec records dropping the service mesh deliberately and
  validating Okta JWTs and scopes in-service).
deploymentTargets: >-
  Development and stage are deployed to the le1 EKS cluster by ArgoCD
  (le1.ss-msvc-customer-profile-{dev,stage}, le1.ss-msvc-calendar-{dev,stage}, and
  le1.ss-msvc-customer-membership-{dev,stage}), one namespace per service, behind
  Traefik at customer-profile-{env}, academic-calendar-{env}, and
  customer-membership-{env}.ss.sofaking.example. Each service's AWS resources
  (DynamoDB, Streams, Pipe, SNS, SQS, Lambda) are deployed by CDK into the shared
  AWS account for that environment in us-east-1. Production is intended for Chaise
  and is not yet provisioned for any service (no ArgoCD application or overlay).

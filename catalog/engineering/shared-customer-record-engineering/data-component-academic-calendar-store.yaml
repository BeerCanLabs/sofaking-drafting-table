    docs/architecture/dynamodb-key-design-v3.md;
    docs/architecture/calendar-service-spec.md
  keySchema: >-
    Partition key pk (String), sort key sk (String). gsi1: ORG#{orgId}#YEAR#{year}
    / ENTITY#{id}. gsi2: ORG#{orgId}#YEAR#{year}#SITE#{siteId} / ENTITY#{id};
    used for by-site listing and the pricing-period delete reference check.
    Encryption AWS-managed.
  classificationRationale: >-
    Structural/reference scheduling data with no customer PII per the repo's
    data-classification.md; classified internal. The platform treats all customer
    data as protected regardless of tier, so confirm with Data/Security whether
    internal is sufficient.
  envelope: >-
    Items carry a platform envelope (meta.entityVersion, dataHash, tombstone) and
    a state object; optimistic concurrency and unchanged-write suppression apply.
    Envelope fields are never exposed through the API.

type: data_component
ownerRole: engineer
name: Academic Calendar Store
description: >-
  DynamoDB single-table store owned by the Academic Calendar service, holding
  Calendar (with embedded CalendarDate), Session (with embedded pricing-period
  links), and PricingPeriod items. Table SS_Calendar_{Environment} uses a pk/sk
  key schema with two global secondary indexes (gsi1 list by org/year, gsi2 list
  by site), on-demand billing, and DynamoDB Streams (NEW_AND_OLD_IMAGES) enabled
  for change-data-capture fanout.

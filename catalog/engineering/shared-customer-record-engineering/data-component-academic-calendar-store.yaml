tables:
  - name: SS_Calendar
    description: >-
      Single-table design (pk/sk + gsi1/gsi2). Item types CALENDAR, SESSION, and
      PRICINGPERIOD, all keyed by ORG#{orgId}#YEAR#{year}. CalendarDate and the
      session/pricing-period association are embedded in their parent items.
      Streams enabled (NEW_AND_OLD_IMAGES) feeding an EventBridge Pipe → SNS
      fanout topic → SQS publisher queue.
    containsPII: false
retentionPolicy: >-
  Soft-delete only: records are tombstoned (meta.tombstone / tombstoneAt) and are
  never hard-deleted by the service. Formal retention and purge policy is not yet
  defined. PITR setting per environment not confirmed for this table.
notes:
  sourceRepository: https://github.com/BeerCanLabs/sk-ss-msvc-calendar

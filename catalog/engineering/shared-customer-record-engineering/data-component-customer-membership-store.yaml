schemaVersion: '1.0'
uid: 01M5CS4D93-GMYC
type: data_component
ownerRole: engineer
name: Customer Membership Store
description: >-
  DynamoDB single-table store owned by the Customer Membership service, holding
  CustomerstoreAssociation items and transactional uniqueness-marker items. Table
  SS_CustomerMembership_{Environment} uses a pk/sk key schema with one global
  secondary index (gsi1, list by org and store year), on-demand billing, and
  DynamoDB Streams (NEW_AND_OLD_IMAGES) feeding an EventBridge Pipe that filters
  to CustomerstoreAssociation items only. Planned per the service spec.
version: 0.2.0

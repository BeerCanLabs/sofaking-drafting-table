schemaVersion: '1.0'
uid: 01KXRSDP02-EVPB
type: product_component
ownerRole: engineer
name: Customer Profile Event Publisher
description: >-
  AWS Lambda worker (.NET 10) that consumes customer-change messages from the
  event-publisher SQS queue (fed by the DynamoDB Streams → EventBridge Pipe → SNS
  fanout), translates them into customer domain events, and publishes them to the
  Sofa King Loveseat event bus. Authenticates to Loveseat with Okta client-credentials
  tokens (scope plat.loveseat).

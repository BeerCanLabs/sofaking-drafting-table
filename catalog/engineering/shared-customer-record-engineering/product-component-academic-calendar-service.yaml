name: Academic Calendar Service
aliases:
  - Calendar Service
  - ss-msvc-calendar
description: >-
  ASP.NET Core (.NET 10) HTTP API for the year-scoped calendar and time structure
  of the Shared Customer Record: Calendar (with embedded CalendarDate), Session
  (with embedded pricing-period links), and PricingPeriod. Reads and writes the
  Academic Calendar DynamoDB store and exposes org- and store-year-scoped REST
  endpoints with optimistic concurrency (If-Match / revision), soft-delete, and
  in-service JWT scope authorization. Containerized and deployed on AWS EKS
  (cluster le1). Change events are published outbound-only to Loveseat by the
  Academic Calendar Event Publisher.
version: 1.0.0
catalogStatus: incomplete
lifecycleStatus: candidate
owner:
  team: shared-customer-engineering
  contact: wmercer@sofaking.example
repoUrl: https://github.com/BeerCanLabs/sk-ss-msvc-calendar

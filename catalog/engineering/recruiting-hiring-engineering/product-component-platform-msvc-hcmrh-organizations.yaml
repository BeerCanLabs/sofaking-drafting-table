architectureNotes:
  repositoryName: BeerCanLabs/sk-msvc-hcmrh-organizations
  observedRuntimeSignals: docker, dotnet, readme, terraform
  observedManifestPaths: .vscode/launch.json; .vscode/settings.json; .vscode/tasks.json; Dockerfile; Hcmrh.Msvc.Organizations.sln; cd/codefresh-deploy-manual.yml; cd/demo/cm.yml; cd/demo/deploy.yml; cd/demo/hpa.yml; cd/demo/ingress.yml; cd/demo/service.yml; cd/dev/cm.yml
  framework: ASP.NET Core Web API on .NET 9.0
  dataStore: MongoDB (2 collections - organization_agency with 21K+ docs, organization_store with 144K+ docs) with complex unique partial indexes
  caching: Hybrid cache (local + Redis) with 1-hour output caching and tag-based invalidation
  multiSourceAggregation: Union pattern preventing duplicates from EIS, Platform Org, and Org Unit services
  externalIntegrations: RetailInstitutionService (HTTP) for institution details
  serviceAuthentication: Ottoman trusted header (x-sk-userinfo); OAuth 2.0 for service-to-service
  secretsManagement: Kubernetes secrets and AWS Secrets Manager
  serviceLogging: Structured JSON logging via Serilog with correlation IDs
  healthWelfareMonitoring: Kubernetes liveness/readiness probes
  availabilityModel: Multi-replica with HPA; rolling updates maxSurge 50%, maxUnavailable 0
  scalabilityModel: Horizontal scaling via K8s HPA; extensive MongoDB indexing on organizationId, domainId, siteId, retailInstitutionId
  recoverabilityModel: MongoDB automatic backups; Kubernetes self-healing
  failureDomain: AWS availability zones; Kubernetes node distribution
  circuitBreaker: Polly resilience with 15s attempt, 90s total, 45s circuit breaker sampling
  eventConsumption: Loveseat OrganizationType and SiteType events for real-time synchronization
  loveseatEventSubscriptions: Consumes 2 event types from Loveseat Kafka event bus via HTTP POST callbacks - SiteType create/update/delete (site/store changes from Core HR), OrganizationType create/update/delete (organization changes from Platform team). Demo filtering REQUIRED for both - SiteType inherits demo status from parent Agency, OrganizationType must preserve existing IsDemoOrganization flag during updates.
  loveseatEventEndpoints: /api/institutions/sites/events/sitetype (SiteType create/update/delete), /api/institutions/events/organizationtype (OrganizationType create/update/delete)
  loveseatDemoFiltering: MEDIUM PRIORITY - SiteType looks up parent Agency demo flag and inherits status, OrganizationType preserves existing IsDemoOrganization flag during updates (never overwrite), new organizations default to false (real orgs), log demo context for audit trail
  geospatialSupport: GeoJsonPoint for location-based queries
  externalDependencies:
    serviceDependencies:
      - name: TokenService
        service: SK Identity Gateway
        purpose: OAuth 2.0 service-to-service authentication
      - name: FileService
        endpoint: fileservice.sofaking.example/api/files/
        purpose: Organization image and document storage
      - name: FederalOrgService
        endpoint: retailinstitution.fc.sofaking.example/api/
        purpose: Federal retail institution data
      - name: OrgUnitService
        endpoint: core-hr-organizational-unit.sofaking.example/api/v1/
        purpose: Organizational unit hierarchy data
      - name: PlatformOrgService
        endpoint: organizationservice.sofaking.example/v2/organizations/
        purpose: Platform organization data
      - name: OktaTokenService
        service: Okta federated identity
        purpose: Okta federated identity authentication
    internalPackages:
      - SK.Util.SofaKingModels.DotNet 0.0.156
      - Hcmrh.Logging 1.0.22
notes:
  background: "Production-ready microservice managing 165K+ retail institutions with multi-source data aggregation. Serves both public anonymous discovery and authenticated management endpoints. Processes Loveseat events for real-time synchronization with Core HR and Platform systems. Part of nextgen HCMRH platform (Retailjobspot and Recruit & Hire)."

architectureNotes:
  framework: .NET 9.0 Class Library
  distribution: NuGet package via Sofa King Artifactory
  dependencies: Serilog.AspNetCore 9.0.0, Serilog.Sinks.Async 2.1.0, Serilog.Sinks.Console 6.0.0
  enrichment: Automatic enrichment with correlation IDs, user claims (PersonId, roles, domainId, orgId), HTTP request details, elapsed time
  features: Structured JSON logging with camelCase, correlation ID management, request-scoped context (manual and automatic cleanup patterns), Ottoman user info extraction from x-sk-userinfo header
  middlewareStack: CorrelationIdMiddleware (generates/propagates X-Correlation-ID), RequestStartTimeMiddleware (tracks elapsed time)
  usedByAllServices: All 7 HCMRH microservices use this library for consistent structured logging

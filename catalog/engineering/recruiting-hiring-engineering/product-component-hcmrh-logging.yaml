  description: Request-scoped context management with manual and automatic cleanup
  protocol: other
- name: CorrelationIdMiddleware
  description: Correlation ID generation and propagation
  protocol: other
- name: RequestStartTimeMiddleware
  description: Request timing and elapsed time tracking
  protocol: other

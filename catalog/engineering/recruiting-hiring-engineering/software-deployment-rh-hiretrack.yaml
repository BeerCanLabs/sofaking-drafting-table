name: Legacy Recruiting & Hiring - Pattern
aliases:
  - Sofa King Recruiting & Hiring (Hiretrack / Classic)
description: 'Sofa King Recruiting & Hiring (Hiretrack / Classic) is a legacy, single-tenant ASP.NET Web Forms/VB.NET application hosted primarily on Windows Server 2012 R2 in the Grand Rapids (GRR) datacenter, with non-prod and DR footprints in AWS.

  Source Documentation: - https://sofaking-example.atlassian.net/wiki/spaces/AD/pages/146228956/Architecture+Overview - https://sofaking-example.atlassian.net/wiki/spaces/SAAS/pages/1232696031/Recruiting+Hiring+-+Environment+Guide - https://sofaking-example.atlassian.net/wiki/spaces/SAAS/pages/10583179/Recruiting+Hiring+-+Data+-+Hiretrack+Database+Servers+Overview

  '
version: 1.0.0
catalogStatus: stub

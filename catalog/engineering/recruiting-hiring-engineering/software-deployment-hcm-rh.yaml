name: New Recruiting & Hiring - Pattern
aliases:
  - HCM RH Software Deployment Pattern
description: HCMRH (Human Capital Management Recruit and Hire) is a comprehensive dual-application retail recruitment platform serving both job seekers (Retailjobspot) and employers (Recruit & Hire) with microservices architecture, event-driven messaging via AWS SNS/SQS, MongoDB data storage, and Kubernetes orchestration
version: 1.1.0
catalogStatus: incomplete
lifecycleStatus: preferred
businessContext:
  pillar: business-pillar.people-solutions
  productFamily: HCM Recruiting & Hiring
  notes: Initial pillar assignment inferred from Sofa King product names and current catalog grouping; confirm with product ownership.
owner:
  team: recruiting-hiring-engineering
  contact: recruiting-hiring-eng@sofaking.example
notes:
  background: "Production-ready microservices platform serving RETAIL retail recruitment market with 165K+ retail institutions, supporting job posting management, application tracking, hiring pipelines, and job seeker career goal matching. Integrates with company-wide Loveseat event bus for real-time synchronization with Core HR, Platform, and legacy Recruit systems. Part of nextgen HCMRH platform (Retailjobspot and Recruit & Hire)."
tags:
  - software-deployment-pattern
  - microservices
  - hcm-rh
  - retailjobspot
  - event-driven
  - kubernetes
  - hcmrh
  - mongodb-atlas
architectureNotes:
  architectureStyle: Microservices with event-driven messaging (AWS SNS/SQS), API-first REST services, containerized on Kubernetes
  systemOverview: Dual-application platform - Retailjobspot (job seeker app on port 3002) and Recruit & Hire (employer app on port 3003) backed by 7 .NET Core microservices and 1 Node.js PDF service
  frontendApps: Two Next.js 16 applications in monorepo with React 19, TypeScript, Tailwind CSS, Jotai state management
  backendServices: Job Postings, Applications, Job Seeker, Organizations, Permissions, Core (notifications), PDF Generator
  authentication: Ottoman gateway with x-sk-userinfo header injection providing Person ID, Domain ID, Organization ID, Role, user details
  authorization: Permission-based with Major Actions (PostJobs, ReviewApplications) and Scope-of-View filtering, SuperAdmin capabilities
  dataArchitecture: >-
    MongoDB Atlas is the only database currently used by New Recruiting &
    Hiring. Non-production uses the Sofa King non-production Atlas project and
    production uses the Sofa King production Atlas project, with logical
    separation across the backend services. Aurora PostgreSQL was provisioned
    for the rewrite but the R&H development team confirmed it is not in use.
  dataOwnership: >-
    Tom Sandoval is the confirmed R&H 2.0 data SME. The shared MongoDB Atlas
    service is operationally owned through the Data Management Team catalog
    boundary.
  caching: Redis distributed caching with HybridCache (L1 local + L2 Redis), output caching with tag-based invalidation
  messagingEventDriven: AWS SNS for pub/sub (job posting events), AWS SQS for async processing (notifications), Loveseat Kafka for external event integration
  loveseatIntegration: Company-wide event bus for external system synchronization - identity matching, person profiles, org-person relationships, job openings from legacy Recruit, site changes, organization updates
  externalIntegrations: Textkernel (resume parsing), FileService (document storage), Google Indexing API (job search visibility), EIS (retail institution details), Platform notification service
  deployment: Containerized via Docker, deployed to Kubernetes with rolling updates (maxSurge 50%, maxUnavailable 0), service mesh (Kuma)
  edgeAndIngress: >-
    Authenticated application traffic enters through the shared Ottoman Kong
    Gateway dependency. Traefik v3.3.6 is the confirmed Kubernetes ingress
    controller for the HCM RH application Services in chaise and le1.
  serviceMesh: >-
    HCM RH application pods participate in the default Kong Mesh/Kuma mesh
    through injected Envoy-based kuma-sidecar data planes. Production uses
    Kuma 1.8.0 and stage/lower environments use Kuma 2.8.6.
  liveNetworkEvidence: >-
    Read-only inspection of chaise, le1, prod-ottm, and stage-ottm on
    2026-07-24 confirmed the Traefik controllers, Kuma versions and mesh
    membership, shared multizone control-plane pairings, and AWS NLB exposure
    of the Ottoman Kong proxy Services.
  deploymentTargets: Dev/QA/Stage in shared AWS accounts, Production in dedicated AWS account; all in us-east region
  availabilityRequirement: Multi-replica deployment with horizontal pod autoscaling, Kubernetes liveness and readiness probes
  availabilityIntentEvidence: >-
    The OPS-358008 availability review inspected all six deployable objects.
    Current production manifests in hcmrh-app configure both the job-seeker and
    employer deployments with HPA minimum 2 and maximum 6 replicas; hcmrh-core
    configures HPA minimum 2 and maximum 4 replicas. All three use rolling
    updates with maxUnavailable 0. MongoDB Atlas is confirmed as multi-region,
    while the shared Kong Gateway, Traefik DaemonSet, and multizone Kuma service
    boundaries have documented redundant topologies. Every deployable object is
    therefore explicitly classified `intent: ha`.
  scalabilityModel: Horizontal scaling via K8s HPA, MongoDB indexing strategies, connection pooling, circuit breakers
  recoverabilityModel: MongoDB automatic backups, Kubernetes self-healing, SQS dead-letter queues
  failureDomain: AWS availability zones, Kubernetes node distribution
  dataClassification: PII (job seeker profiles, applications), organizational data, retail institution data
  noApplicablePattern: No existing DRAFT reference architecture matches this dual-application (Retailjobspot + Recruit & Hire) .NET Core and Node.js microservices pattern on Kubernetes with event-driven AWS SNS/SQS messaging and a Kuma service mesh. See decision record 01KTGG6XFP-YNGM.
  externalDependencies: Textkernel (resume parsing), FileService (document storage), Google Indexing API (job-search visibility), EIS (retail institution details), and the Platform notification service. See decision record 01KTGG6XFP-H8HA.
  noPatternDeviations: No applicable reference architecture exists for this pattern, so there are no deviations to record. See decision record 01KTGG6XFP-NT67.
  compliance: Authentication audit trails, application view history tracking, permission-based access control
  observability: Structured JSON logging via Serilog with correlation IDs, request context propagation across services
  resilience: Polly circuit breakers (15s attempt, 90s total, 45s sampling), retry policies, timeout policies
  cicdPipeline: Codefresh CI/CD with Docker build, SonarQube quality gates, Quay/ECR registry, manual approval gates for QA/Stage/Prod
  patternType: microservices
  discoveryBoundary: This pattern was inferred from repository names, GitHub metadata, and safe file-tree signals only.
  sourceRepositories:

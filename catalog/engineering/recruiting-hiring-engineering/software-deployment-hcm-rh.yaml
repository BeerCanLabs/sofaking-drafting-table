serviceGroups:
  - name: HCM RH Frontend Applications
    deploymentTarget: aws-us-east-2
    substrate: 01KYAVGDVV-EKJ2
    deployableObjects:
      - ref: 01KSM38KG5-49X9
        diagramTier: presentation
        networkZone: web
        notes: >-
          Production job-seeker and employer manifests each configure an HPA
          minimum of 2 and maximum of 6 replicas, with rolling updates set to
          maxUnavailable 0.
  - name: HCM RH Backend Services
    deploymentTarget: aws-us-east-2
    substrate: 01KYAVGDVV-09RG
    deployableObjects:
      - ref: 01KSM38KG5-FBRT
        diagramTier: application
        networkZone: app
        notes: >-
          The production backend manifest configures an HPA minimum of 2 and
          maximum of 4 replicas, with rolling updates set to maxUnavailable 0.
  - name: HCM RH Data Platform
    deploymentTarget: aws-us-east-1
    notes: >-
      Existing MongoDB Atlas dependency confirmed as the only database
      currently used by New Recruiting & Hiring. The shared service remains
      deprecated for new adoption, and this existing use is tracked through
      OPS-435884.
    deployableObjects:
      - ref: 01KQQ5JT05-E3FZ
        diagramTier: data
        networkZone: data
        notes: >-
          Vendor-managed Atlas projects provide separate non-production and
          production database boundaries; the production cluster is
          multi-region.
  - name: Edge and Service Mesh
    deploymentTarget: aws-us-east-1
    notes: >-
      Shared Ottoman gateway, Kubernetes ingress, and service-mesh
      dependencies confirmed by application manifests and live cluster
      inspection. The AWS NLB is modeled as a shared Kong Gateway relationship
      rather than HCM RH-owned infrastructure.
    deployableObjects:
      - ref: 01KQQ5JT1E-SW3X
        diagramTier: presentation
        networkZone: web
        notes: >-
          Existing governed Kong Gateway Service used as the logical Ottoman
          entry point for authenticated HCM RH traffic. The shared service is
          implemented as a multi-node Kong cluster.
      - ref: 01KYAXMZ7H-72BR
        diagramTier: presentation
        networkZone: web
        notes: >-
          Traefik v3.3.6 ingress boundary in the chaise and le1 application
          clusters, running as node-distributed DaemonSets behind shared load
          balancing.
      - ref: 01KYAXMZ7H-KJT2
        diagramTier: utility
        networkZone: ops
        notes: >-
          Shared multizone Kuma/Kong Mesh service with injected Envoy-based
          data planes and paired global/zone control-plane boundaries.
deploymentQualities:
  availability:
    target: High availability with multi-replica deployment
    implementation: Kubernetes horizontal pod autoscaling, liveness and readiness probes, rolling updates with zero downtime
    monitoring: Health check endpoints, pod restart monitoring
  scalability:
    approach: Horizontal scaling
    implementation: Kubernetes HPA based on CPU/memory metrics, MongoDB sharding strategies, connection pooling
    limits: Configurable replica counts per service, MongoDB cluster capacity planning
  recoverability:
    backupStrategy: MongoDB automated backups with point-in-time recovery
    failureHandling: Kubernetes self-healing via pod restarts, SQS dead-letter queues for message replay
    rto: Minutes for pod recovery, hours for data restoration
  resilience:
    patterns: Circuit breakers (Polly), retry policies with exponential backoff, timeout policies
    configuration: 15s attempt timeout, 90s total timeout, 45s sampling window
    degradation: Graceful degradation via circuit breakers, fallback responses
  observability:
    logging: Structured JSON logging via Serilog with correlation IDs
    tracing: Request context propagation across microservices
    monitoring: Kubernetes metrics, application-level health checks

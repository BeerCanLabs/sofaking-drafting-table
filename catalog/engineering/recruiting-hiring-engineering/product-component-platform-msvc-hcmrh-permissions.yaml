architectureNotes:
  repositoryName: BeerCanLabs/sk-msvc-hcmrh-permissions
  observedRuntimeSignals: docker, dotnet, readme, terraform
  observedManifestPaths: .vscode/launch.json; .vscode/settings.json; .vscode/tasks.json; Dockerfile; Hcmrh.Msvc.Permissions.sln; cd/codefresh-deploy-manual.yml; cd/demo/cm.yml; cd/demo/deploy.yml; cd/demo/es.yml; cd/demo/hpa.yml; cd/demo/ingress.yml; cd/demo/service.yml
  framework: ASP.NET Core Web API on .NET 9.0
  dataStore: MongoDB (3 collections - permissions_groups, permissions_users, permissions_groupmembers)
  caching: Redis output caching with 1-hour expiry for authorization responses
  permissionModel: Dual model with Primary Permissions (Major Actions like PostJobs/ReviewApplications + Scope-of-View for JobTypes/Departments/Sites) and Additional Permissions (feature flags like ManageFunnels, ViewSensitiveData)
  authorizationLogic: Five-step evaluation - null checks, SuperAdmin authorization, primary permission validation, additional permission check, authorization status
  externalIntegrations: OrgPersonService (HTTP) for organizational data, TokenService (OAuth)
  serviceAuthentication: Ottoman trusted header (x-sk-userinfo); OAuth 2.0 for service-to-service
  secretsManagement: Kubernetes secrets and AWS Secrets Manager
  serviceLogging: Structured JSON logging via Serilog with correlation IDs
  healthWelfareMonitoring: Kubernetes liveness/readiness probes
  availabilityModel: Multi-replica with HPA; rolling updates maxSurge 50%, maxUnavailable 0
  scalabilityModel: Horizontal scaling via K8s HPA; MongoDB indexing on PersonId, DomainId, OrganizationId
  recoverabilityModel: MongoDB automatic backups; Kubernetes self-healing
  failureDomain: AWS availability zones; Kubernetes node distribution
  circuitBreaker: Polly resilience with 15s attempt, 90s total, 45s circuit breaker sampling
  scopeOfView: Supports "All" wildcard and specific entity filtering
  superAdminPermissions: CreateUsersAndManagePermissions capability
  externalDependencies:
    serviceDependencies:
      - name: None
        purpose: This is a dependency sink service that only receives calls from other HCMRH services
    internalPackages:
      - Hcmrh.Logging 1.0.22
notes:
  background: "Production-ready authorization microservice implementing fine-grained RBAC with scope-based access control. Supports group-based permission inheritance and SuperAdmin privileges. Critical security component for HCMRH platform. Part of nextgen HCMRH platform (Retailjobspot and Recruit & Hire)."

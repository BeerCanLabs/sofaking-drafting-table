architectureNotes:
  framework: ASP.NET Core Web API on .NET 9.0
  dataStore: MongoDB (9 collections - jobSeekers, goals, documents, notes, legacyUsers, employerReviewInfo, employerOutreach, outreachStatistics, auditLogs)
  caching: Redis distributed caching for performance optimization
  resumeParsing: Textkernel RT SDK integration for automated resume data extraction
  externalIntegrations: Textkernel (resume parsing), FileService (document storage), TokenService (OAuth), OrgPersonService (org/person data)
  serviceAuthentication: Ottoman trusted header injection (x-sk-userinfo) for user context; OAuth 2.0 client credentials for service-to-service
  secretsManagement: Kubernetes secrets and AWS Secrets Manager
  serviceLogging: Structured JSON logging via Serilog with correlation IDs and request context enrichment
  healthWelfareMonitoring: Kubernetes liveness and readiness probes; health check endpoints
  availabilityModel: Multi-replica deployment with horizontal pod autoscaling; rolling updates with maxSurge 50%, maxUnavailable 0
  scalabilityModel: Horizontal scaling via Kubernetes HPA; MongoDB indexing on PersonId, OrganizationId; geospatial indexing for location-based searches
  recoverabilityModel: MongoDB automatic backups; Kubernetes self-healing
  failureDomain: AWS availability zones; Kubernetes node distribution
  circuitBreaker: Polly resilience with 15s attempt timeout, 90s total timeout, 45s circuit breaker sampling
  eventConsumption: Loveseat events for identity matching, profile synchronization, and org-person relationships
  loveseatEventSubscriptions: Consumes 4 event types from Loveseat Kafka event bus via HTTP POST callbacks - IdentityMatchTransaction (legacy identity matching for migration, filtered by idpId per environment), PersonProfileType delete/update (person profile changes from Core HR), OrgPersonType create/update (organization-person relationships from Core HR, filtered by orgId per environment). All events process real users from HR systems, no demo filtering required as demo job seekers are manually created by sales team.
  loveseatEventEndpoints: /api/jobseeker/events/identitymatch (IdentityMatchTransaction), /api/jobseeker/events/personprofile/delete (PersonProfileType delete), /api/jobseeker/events/personprofile/update (PersonProfileType update), /api/jobseeker/events/orgpersontype (OrgPersonType create/update)
  loveseatEnvironmentConstraints: Production idpId=jobseeker-legacy orgId=73112, Staging idpId=jobseeker-legacy-stage orgId=99147268, QA idpId=jobseeker-legacy-qa orgId=99147268
  legacyMigration: Supports legacy Retailjobspot user migration with identity mapping
  externalDependencies:
    serviceDependencies:
      - name: LegacyTTCore
        endpoint: api.jobs-board.example
        purpose: External legacy job board integration
      - name: EmailService
        endpoint: emailqueueservice.sofaking.example
        purpose: Email notifications to job seekers
      - name: MigrationService
        service: plat-passport-core K8s mesh
        purpose: Identity migration and synchronization
      - name: CoreService
        service: hcmrh-core
        purpose: Central notification and orchestration
      - name: OrgPersonService
        service: SK OrgPerson sync
        purpose: Organization and person data synchronization
    awsServices:
      - name: SQS Queue JobSeeker Events
        resource: JobSeeker-events-queue-{env}
        purpose: Event consumption for asynchronous processing
    externalAPIs:
      - name: Textkernel Tx SDK
        purpose: AI-powered resume parsing and data extraction
    internalPackages:
      - Hcmrh.Logging 1.0.22
notes:
  background: "Production-ready microservice managing job seeker profiles, career goals, and employer relationships. Integrates with Textkernel for AI-powered resume parsing and supports multi-source data synchronization via Loveseat events from Core HR and Platform systems. Part of nextgen HCMRH platform (Retailjobspot and Recruit & Hire)."

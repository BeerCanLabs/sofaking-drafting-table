schemaVersion: '1.0'
uid: 01M3PJVR74-DNXW
type: drafting_session
name: Plumb Snowflake PrivateLink DraftingSession
aliases:
- Plumb Snowflake PrivateLink DraftingSession
description: >
  Captures the finalized target-state AWS network architecture for Plumb's
  private connectivity to Snowflake (including Gong data delivered via
  GONG_ZEROCOPY), based on Jira Initiative OPS-581859 and its child Epics/
  Stories, a Snowflake-provided best-practices document, and a finalized
  architecture diagram. This is a proposal capturing target-state design and
  known gaps, not a validated Product record. Product registration and L1
  evaluation are separately tracked in OPS-549944/109759/109760.
version: 1.0.0
catalogStatus: incomplete
lifecycleStatus: candidate
sessionStatus: open
owner:
  team: architecture-review-board
  contact: Drew Colton, Jake Benton
notes:
  ownerTeamRationale: >
    owner.team is set to architecture-review-board because DraftingSession
    is a governance artifact type without its own product-engineering
    team, and 'Enterprise Systems Engineering' (the team actually running
    this work) is not in the approved teams vocabulary. The Plumb
    product's confirmed product owner is Drew Colton and Jake Benton
    (Enterprise Systems Engineering) per owner.contact above; this should
    be revisited once Plumb is registered as a governed Product with its
    own team assignment.
tags:
- drafting-session
- plumb

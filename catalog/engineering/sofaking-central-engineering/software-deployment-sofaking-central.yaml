ownerRole: engineer
name: Sofa King Central - Pattern
aliases:
  - Sofa King Central (HCM)
description: 'Multi-tenant HCM platform linchpin. Event-sourced microservice architecture  hosted on AWS. Mixed legacy EC2/IIS and modern EKS environment.

  '
version: 1.0.0
catalogStatus: incomplete
lifecycleStatus: preferred
businessContext:
  pillar: business-pillar.people-solutions
  productFamily: Sofa King Central
  notes: Initial pillar assignment inferred from Sofa King product names and current catalog grouping; confirm with product ownership.
owner:
  team: sofaking-central-engineering
  contact: dist_development_HCM_FC@sofaking.example
tags:
  - hcm
  - microservices
  - event-sourcing
  - aws
  - hybrid-hosting
followsReferenceArchitecture: 01KQQ5JT1D-DAAM
notes:
  noCrossBoundaryConnections: Cross-boundary service connections have not been documented for this pattern; no material cross-zone traffic has been identified during catalog import.
  availabilityRequirement: high
  dataClassification: pii
  failureDomain: multi-tenant-shared-infrastructure
  deploymentTargets: 'AWS US-EAST-1 (Production) using EC2 for legacy APIs and EKS for modern services.

    '
  patternDeviations: 'Public/Internal API split creates proxying overhead.

    '
  modernizationStrategy: 'Migrating from EventStore/MongoDB to DynamoDB - not complete: 13 event-sourced services still reference EventStore.Client as of 2026-07-29. Actively migrating from EC2/IIS to EKS; sand-File is fully on net8.0, sand-Employee and sand-Jobtype run net-fx and .NET Core variants concurrently, four sand-* APIs remain net-fx 4.6.1 on IIS.

    '
  drStrategy: 'Only SQL Server compute instances are replicated to US-EAST-2;  full application DR is not currently automated.

    '

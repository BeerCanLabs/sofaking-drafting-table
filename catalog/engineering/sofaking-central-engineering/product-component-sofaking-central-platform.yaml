description: >-
  Product-level aggregate for Sofa King Central. Carries the estate-wide facts that
  belong to no single service: the ingress path, the hybrid runtime estate confirmed
  under OPS-255153, Okta authentication, and central logging. Per-service persistence
  and call edges are modelled on the individual components and are deliberately not
  duplicated here.

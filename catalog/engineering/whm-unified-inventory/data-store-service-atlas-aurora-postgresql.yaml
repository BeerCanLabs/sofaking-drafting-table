name: Atlas Aurora PostgreSQL
description: 'Relational store for Atlas (Unified Inventory): one global database (whm-unified-global, owned by
  Atlas TenantDirectory) and one database per region (whm-unified-shard-NN) on the same RDS cluster, resolved
  per request through TenantDirectory. Dev cluster endpoint read from the Flyway inventory in whm-unified-dbmigration.'

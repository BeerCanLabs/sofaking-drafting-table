type: data_component
ownerRole: engineer
name: Atlas Session and Token Cache
description: >-
  The per-region Redis key spaces Atlas keeps: usercontext (Atlas Identity
  user sessions, 59 minute sliding window) and idmtoken (Atlas Domain's IDM
  client-credentials token cache). They deploy onto Atlas Tenant Redis; a
  region without a redis_connection_string falls back to an in-process cache.

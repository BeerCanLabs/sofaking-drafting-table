retentionPolicy: >-
  Session entries expire on a 59 minute sliding window; token cache entries follow the token lifetime. No durable
  retention.
notes:
  provenance: Source inspection 2026-11-13 of whm-unified-core (Library.Shared.Cache, Identity and Domain
    appsettings); added 2026-11-14 so the Atlas pattern places a data component and the Redis service is reached
    through runsOn, as the 1.4 framework model expects. Not yet confirmed by the owning team.
  inferred: targetEngine other stands for Redis, which the schema enum does not list. dataClassification and

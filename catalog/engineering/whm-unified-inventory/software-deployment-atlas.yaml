type: software_deployment_pattern
name: Atlas
aliases:
- WHM Unified Inventory
- Unified Inventory
description: >-
  Atlas is Sofa King's greenfield Unified Inventory product. Phase 1, Module 1 is
  Request-To-Pay: request intake, catalog check in parallel with approval routing,
  purchasing request to the partnering ERP, receiving that creates asset records
  (with partial receipt), and surplus transfer to sites. A set of .NET microservices
  (Identity front door, TenantDirectory, Workflow, Domain, Integration and planned
  Scheduler, Reports, Notifications, Imports) sits behind a React UI. Each region
  has its own PostgreSQL database, routed through TenantDirectory. Atlas depends on
  Sofa King Platform (Identity, Tasks and Workflows, Loveseat event bridge), HCM Core
  HR and Core Config, and the partnering ERPs. Source: Atlas architecture V1
  diagram (Greenfield Backend Architecture v2, checked against the ATL Jira board).
version: 0.2.0

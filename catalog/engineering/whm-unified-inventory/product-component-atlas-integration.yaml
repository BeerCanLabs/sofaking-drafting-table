schemaVersion: '1.0'
uid: 01M5WY4E7P-C0VE
type: product_component
name: Atlas Integration
description: Integration service for Atlas. Today it manages the Loveseat (Loveseat) event subscription over HTTPS and
  receives PersonProfile events on a webhook. ERP adapters (RT, Oracle, CA, Sofa King National), the outbox and
  event publishing described in the V1 design are not in the repository yet.
version: 0.1.0
catalogStatus: incomplete
lifecycleStatus: candidate
owner:
  team: whm-unified-inventory
  contact: ltorvik@sofaking.example
tags:
- atlas
- unified-inventory
- integration
- erp
- kafka
repoUrl: https://github.com/BeerCanLabs/sk-whm-unified-core
language: C#
classification: api-service
architectureNotes:
  sourcePath: Service.Core.Integration
  eventBridge: Loveseat reached over HTTPS/REST (subscription API plus callback webhook), authenticated with a dedicated
    Okta client; disabled unless EventBus:Enabled. No Kafka client in the code.
  unconfirmed: WS ERP and Sofa King National ERP adapters have unconfirmed owners or are not built.
  sourceInspection: Source inspection 2026-11-13 of whm-unified-core (develop, eece62e).
runtimeSpec:
  ports:
  - number: 8085
    protocol: HTTP
    direction: inbound
    name: rest
    description: REST listener (HTTP/1.1). Port from the local compose table in README.md; deployed ports come from
      the SERVICE_ENDPOINTS secret.
  - number: 8095
    protocol: HTTP/2
    direction: inbound
    name: grpc
    description: gRPC listener for service-to-service calls, guarded by ServiceTokenMiddleware (x-whm-service-token).
      REST port + 10.
  dependencies:
  - ref: 01KWF3RGCF-T2HM
    purpose: Startup configuration. Library.Shared.GlobalConstants fetches SERVICE_ENDPOINTS, SERVICE_TOKEN, GLOBAL_DATABASE_CONNECTION_STRING,
      OKTA_TOKEN_* and M2M_OKTA_* under the whm/unified/<env>/ prefix when AWS_REGION is set. Integration also
      reads EventBus__ClientId and EventBus__ClientSecret.
    interface: AWS SDK (GetSecretValue)

notes:
  provenance: Source inspection 2026-11-13 of whm-unified-dbmigration (develop) and whm-unified-core (develop);
    added 2026-11-14 so the Atlas pattern places a data component and the Aurora cluster is reached through runsOn,
    as the 1.4 framework model expects. Not yet confirmed by the owning team.
  inferred: dataClassification and containsPII are carried from the Atlas pattern's statement (confidential with
    PII) and were not re-verified against the schema; the retention policy is unknown.
  databases: whm-unified-global (regions directory, TenantDirectory) and whm-unified-shard-01 in dev; one shard
    database per region in every environment. Per-region connection strings come from AWS Secrets Manager
    (TENANT_SECRET_<orgId>).
  migrations: Flyway trees in whm-unified-dbmigration (global and per-service, with rollback scripts), run by the
    whm-unified-core image workflow before any image is pushed.

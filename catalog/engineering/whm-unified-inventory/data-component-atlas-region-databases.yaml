name: Atlas Region Databases
description: >-
  The Atlas (Unified Inventory) PostgreSQL databases: the global database
  whm-unified-global, which holds the regions directory owned by Atlas
  TenantDirectory, and one database per region (whm-unified-shard-NN) in
  which every Atlas service reads and writes only its own table prefix, with
  row-level security on org_id. All of them deploy onto the Atlas Aurora
  PostgreSQL cluster and are resolved per request through TenantDirectory.

schemaVersion: '1.0'
uid: 01M5WY4E7P-7P1K
type: product_component
name: Atlas TenantDirectory
description: Maps each region (tenant) to its PostgreSQL database and Redis. Every other Atlas service resolves
  connections over gRPC (ResolveTenantConnection) and caches the result; the REST surface (/api/regions) is an
  admin API guarded by the service token.
version: 0.1.0
catalogStatus: incomplete
lifecycleStatus: candidate
owner:
  team: whm-unified-inventory
  contact: ltorvik@sofaking.example
tags:
- atlas
- unified-inventory
- multitenancy
repoUrl: https://github.com/BeerCanLabs/sk-whm-unified-core
language: C#
classification: api-service
architectureNotes:
  sourcePath: Service.Core.TenantDirectory
  persistence: Global database whm-unified-global on Atlas Aurora PostgreSQL (01M7BNBY4G-329E); per-region connection
    strings and redis_connection_string come from AWS Secrets Manager TENANT_SECRET_<orgId>.
  sourceInspection: Source inspection 2026-11-13 of whm-unified-core (develop, eece62e).
runtimeSpec:
  ports:
  - number: 8081
    protocol: HTTP
    direction: inbound
    name: rest
    description: REST listener (HTTP/1.1). Port from the local compose table in README.md; deployed ports come from
      the SERVICE_ENDPOINTS secret.
  - number: 8091
    protocol: HTTP/2
    direction: inbound
    name: grpc
    description: gRPC listener for service-to-service calls, guarded by ServiceTokenMiddleware (x-whm-service-token).
      REST port + 10.
  dependencies:
  - ref: 01KWF3RGCF-T2HM
    purpose: Startup configuration. Library.Shared.GlobalConstants fetches SERVICE_ENDPOINTS, SERVICE_TOKEN, GLOBAL_DATABASE_CONNECTION_STRING,
      OKTA_TOKEN_* and M2M_OKTA_* under the whm/unified/<env>/ prefix when AWS_REGION is set. TenantDirectory also
      reads each region's TENANT_SECRET_<orgId> connection-string secret through SecretReader (TenantSecrets CacheTtlSeconds
      900).
    interface: AWS SDK (GetSecretValue)

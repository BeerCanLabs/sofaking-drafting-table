architectureNotes:
  noCrossBoundaryConnections: Cross-boundary (tier and zone) service connections are documented in serviceGroups[].connections entries across the Administration & UI Tier, Gateway & Service Mesh Tier, Identity & Authentication Tier, Platform Core Services, and Serverless Functions service groups. Same-zone connections (Kong Backplane → microservices, Lambda-to-Lambda) have not been enumerated and are deferred to a follow-up session.
  configcatNonConformance: 'Kong Backplane featureflag.lua calls ConfigCat directly per-request via HTTP POST with no caching, bypassing the Platform Feature Flag Service abstraction layer. This is a non-conforming pattern flagged as a high-priority stabilization surface in the Ottoman stability audit (Finding #5). ConfigCat bandwidth already exceeded the Enterprise subscription limit by an order of magnitude in 2025. Remediation: route the Kong hot path through the Platform Feature Flag Service (01KQQ5JT0V-H0P5), which centralizes and caches ConfigCat calls. UPDATE 2026-08-03: repository discovery during the Dev-team repo linking pass confirms the same direct-call, no-caching pattern (via the configcat-node SDK) in Ottoman Domain Service, Ottoman Invitation Service, Ottoman Organization Service, and Platform Msvc Org Person — this is a platform-wide pattern affecting at least five services, not an isolated Kong Backplane issue. See each component''s architectureNotes.configcatDirectCall.'
  selectedPatternRationale: 'This deployment follows the AWS EKS Service Mesh Platform pattern because it combines EKS, gateway, mesh, identity, platform data services, serverless functions, and GitOps delivery.

    '
  noPatternDeviations: 'No deviations from the selected Reference Architecture are recorded yet. Kong Gateway, Kong Mesh, Traefik ingress, and their AWS load-balancer paths are modeled as reusable network services.

    '
  availabilityRequirement: high-availability
  dataClassification: confidential PII and identity data; CCPA and SOC II scoped.
  failureDomain: 'Multi-AZ primary operation in AWS us-east-1 with disaster recovery and failover infrastructure in us-east-2. Shared identity, gateway, mesh, and data services create platform-level dependencies for products adopting Ottoman.

    '
  deploymentTargets: 'Production runs in AWS us-east-1 VPC USE1-PRD-MORPH-VPC (vpc-0d49f0e96ba662130) with disaster recovery and failover in AWS us-east-2 VPC USE2-PRD-MORPH-VPC (vpc-0a917ec697c46280d). Stage runs in AWS us-east-1 VPC USE1-STG-MORPH-VPC (vpc-01245ba9b96afbcce) and AWS us-east-2 VPC USE2-STG-MORPH-VPC (vpc-09e23f06442f45af7). Development runs in AWS us-east-1 VPC USE1-DEV-MORPH-VPC (vpc-0c7d07d0dd293cf3e).

    '
  availabilityModel: 'Multi-AZ within us-east-1 for primary production operation, with us-east-2 disaster recovery infrastructure, Aurora read replicas, duplicate VPC and subnet infrastructure, Kong Gateway hybrid mode across clusters, and ArgoCD HA mode.

    '
  serviceMeshModel: 'Kong Gateway and Kong Mesh form the Ottoman gateway and service-mesh tier. Kong Mesh models the Kuma control planes and injected Envoy data planes as internal components; Traefik models the intentional Kubernetes Ingress path.

    '
  tenancyModel: 'Ottoman handles shared identity and application access management across Sofa King RETAIL products. Detailed tenant isolation and data partitioning semantics are unresolved in the source materials.

    '
  hcf_03_1_1: Vulnerability management is not yet documented at the Ottoman Software Deployment Pattern level. Add the approved vulnerability management program, scan ownership, and exception process reference before approving this SDP.
  hcf_03_1_3: Patch management report review is not yet documented for Ottoman. Add the review cadence, reviewing team, evidence location, and escalation path before approving this SDP.
  hcf_03_3_1: EOL management is not yet documented for Ottoman. Add periodic EOL review ownership and formal termination or upgrade plan handling for Ottoman technology components.
  hcf_04_2_1: Formal access provisioning and 24-hour access removal evidence is not yet documented for Ottoman. Confirm the authoritative access workflow and removal SLA evidence before approving this SDP.
  hcf_05_3_1: Ottoman infrastructure and application changes are represented as GitOps and IaC-driven through ArgoCD, GitHub repositories, and Terraform-managed AWS infrastructure. Confirm the formal change-management workflow and approval evidence before approving this SDP.
  hcf_09_1_1: Ottoman is segmented across AWS VPCs and environments, with production and disaster-recovery boundaries documented in the deployment target and failure-domain decisions. Network ACL/security group review evidence remains a lower-level runtime or edge-service responsibility.
  hcf_10_1_1: Ottoman has multi-AZ primary operation in us-east-1 and disaster-recovery infrastructure in us-east-2. Formal DR procedure, BIA linkage, annual recovery testing evidence, RTO, and RPO remain unresolved.
  hcf_10_1_2: Alternative business processes and out-of-band communication channels are not yet documented for Ottoman outage scenarios. Add or link the operational continuity plan before approving this SDP.
  hcf_11_3_1: Secure sharing and non-production production-data restrictions are not yet documented for Ottoman. Confirm whether production identity data is excluded from lower environments or protected through approved masking/synthetic-data controls.
  hcf_11_4_1: Ottoman is classified as processing confidential PII and identity data. Approved AI tool usage, shadow AI monitoring, and sensitive-data location audit evidence are not yet documented for this SDP.
  hcf_14_1_1: Secure code training evidence for Ottoman developers and reviewers is not yet documented at the SDP level.
  hcf_14_1_3: Ottoman has distinct development, stage, production, and disaster-recovery deployment targets. SBOM risk review and no-unmonitored-dev-access-to-production evidence are not yet documented.
  dataDomainInfrastructureBaseline: >-
    OPS-825852 evidence captured 2026-08-07 and clarified 2026-08-11. The Data
    Team owns and operates database infrastructure in every production and
    non-production environment; Ottoman application teams own the schemas,
    data, data models, and application access inside those databases. Aurora PostgreSQL and Neptune are
    Sofa King-hosted AWS services. Development uses us-east-1 only. Stage and
    production use global clusters with a us-east-1 primary and read-only
    us-east-2 secondary that requires manual failover; this is global-cluster
    DR topology, not a Multi-AZ designation. Current development clusters are
    morph-dev-rds-pgsql-cluster-1 (Aurora PostgreSQL 15.15, serverless, one
    instance, seven-day native retention) and morph-dev-neptune-cluster-1
    (Neptune 1.4.5.1, db.t3.medium, one-day native retention). Stage uses
    morph-stg-rds-pgsql-cluster-1 (Aurora PostgreSQL 15.17, two serverless
    instances per region, seven-day native retention) and
    morph-stg-neptune-cluster-1/2 (Neptune 1.4.6.3, two db.r6g.4xlarge
    instances per region, three-day native retention). Production uses
    morph-prod-rds-pgsql-cluster-1 (Aurora PostgreSQL 15.17, two serverless
    instances per region, 31-day native retention) and production Neptune
    global clusters (Neptune 1.4.6.3, two instances per region; db.r6g.4xlarge
    in us-east-1 and db.r6g.xlarge in us-east-2; 31-day native retention).
    Production Aurora PostgreSQL and Neptune follow daily 31-day, monthly
    13-month, and annual seven-year retention; AWS Backup is used for RDS
    across Sofa King solutions. Redis holds a Neptune-derived data cache:
    development and stage are on Data-Team-managed Redis Cloud, production
    remains on ElastiCache because its Redis Cloud target has not been created.
    Redis Cloud is outside Sofa King AWS accounts. No migration Jira exists;
    Dev-team discussions are planned. Org Person uses sk-org-person on shared
    Sofa King Central Atlas MongoDB Cluster 1 environments. Production Atlas
    backups use immutable project-level compliance policy and secondary-region
    snapshots; Data Team owns shared Atlas infrastructure while Platform
    Ottoman owns application data. Peak-season performance spikes motivate a
    proposed future dedicated Atlas cluster, but no approved migration or
    tracking ticket exists. Database infrastructure is manually managed without
    automation. Deletion protection is unintentionally disabled after an
    upgrade; the Data Team plans a future OPS ticket. The two
    morph-dev-iam-neptune-cluster test clusters and the postgress-pps/testing
    PostgreSQL resources are excluded because they are not active Ottoman
    dependencies. Neptune TLS is expected but requires Data Team verification.
    Brett Ames is the Ottoman Application SME responsible for confirming
    authoritative records across Neptune and MongoDB Atlas, Redis cache
    producers and consumers, cross-service database access, and approving data
    classifications.
  auroraPostgresqlDatabaseInventory: >-
    Production application databases: api_gateway_app, skadminservice,
    invitationservice, kong, organizationservice, and passportcoreservice.
    Stage contains those databases plus ai_gateway_db. Development contains
    the common application databases plus ai_gateway_db,
    erp_budget_monitorin (name truncated in supplied evidence), usersntest,
    platforms_dev, platcompliance_dev, plattasks_dev, platworkflow_dev, and
    platnotification_dev. Standard PostgreSQL administration/template
    databases are not application stores. The Data Team owns the database
    infrastructure for all listed environments, while the Ottoman application
    team owns the data inside the databases. Namesake service usage is the
    current mapping; Brett Ames must confirm cross-service access.
  dataDomainEvidence: >-
    Data Team workbook Ottoman DB Infra.xlsx; contributor-provided database
    inventories; FC IDM - Atlas MongoDB Environment; Atlas MongoDB Alerts;

        notes: Observed as the msvc-org-person Kubernetes workload in ottm-dev, ottm-stage, and ottm-prod for OPS-433061. The legacy plat-svc-orgperson component (01KSM38KFX-9EQ8) was removed from this service group 2026-08-04 after a Ottoman developer confirmed it retired (repo no longer exists on GitHub); msvc-org-person is the sole org-person implementation.
      - ref: 01KSM38KFY-PB2S

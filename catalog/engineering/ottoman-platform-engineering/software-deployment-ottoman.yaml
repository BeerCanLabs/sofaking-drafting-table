  productionKubernetesLifecycle: >-
    Kubernetes 1.31 was observed in ottm-prod on 2026-07-31. The user confirmed
    that an approved upgrade plan exists and targets the rolling Kubernetes N-1
    position. The completion schedule is a Platform Engineering team dependency
    and remains deferred until that team supplies evidence.
  edgeNetworkBaseline: >-
    OPS-933430 read-only evidence captured 2026-08-10 from AWS profiles
    Team_Platform_Dev, Team_Platform_Stage, and Team_Platform_Prod and
    kubecontexts ottm-dev, ottm-stage, and ottm-prod. The us-east-1 EKS
    clusters use VPCs vpc-0c7d07d0dd293cf3e (development, 10.117.96.0/19),
    vpc-01245ba9b96afbcce (stage, 10.105.0.0/19), and
    vpc-0d49f0e96ba662130 (production, 10.82.96.0/19). All three clusters
    span us-east-1a and us-east-1b, expose both public and private Kubernetes
    API endpoints, permit public API network reachability from 0.0.0.0/0,
    use CONFIG_MAP authentication, and have all EKS control-plane log types
    enabled. The owner confirmed that AWS SSO controls user authentication and
    that the public endpoint posture is intentional; SSO authentication does
    not itself narrow public network reachability. No Kubernetes NetworkPolicy
    objects were observed, and the owner confirmed that the current
    segmentation model is intentional. Internet-facing NLB Services expose
    Kong proxy TLS 443 to target port 8443 and Kong Mesh ingress TCP 10001;
    internal NLBs serve Kong control-plane paths. Development and stage also
    have named public and internal Traefik ALBs. The owner confirmed that the
    Traefik arrangement and both development test data-plane NLBs are
    intentional. Development has an accepted kuma GatewayClass but no Gateway
    or HTTPRoute objects; Gateway API types were not available in stage or
    production. The owner confirmed that stage and production adoption is
    planned. Production EKS 1.31 and Kong Mesh 1.8.0 trail development
    (EKS 1.35, Kong Mesh 2.8.8) and stage (EKS 1.34, Kong Mesh 2.8.6); the owner
    confirmed that production drift should be reconciled. At the user's
    direction, no new Jira implementation tickets were created; both planned
    changes remain deferred follow-up obligations.
  nodejs24Disposition: >-
    Node.js 24.14.1 is the repository-confirmed current runtime for the active
    scoped product components. It remains a candidate rather than preferred
    implementation; the user directed OPS-433061 to accept this current state
    without a promotion proposal or migration remediation.
  externalDependencies: 'External interactions are declared in serviceGroups[].externalInteractions: ConfigCat, MongoDB Atlas, Loveseat Platform Event Bus, AWS SQS, AWS KMS, AWS Cognito, Prometheus, Velero, Terraform. Kuma control planes and Envoy data planes are internal components of the reusable Kong Mesh network service rather than external gaps.'
networkZones:
  - id: web
    name: Web
    tier: frontend
    description: Internet-facing services including UIs, public APIs, and edge components.
  - id: app
    name: Application
    tier: application
    description: Internal application services, APIs, microservices, and background workers.
  - id: data
    name: Data
    tier: data
    description: Data stores, caches, message brokers, and persistence services.
  - id: ops
    name: Operations
    description: Operational and infrastructure services. No tier classification.
serviceGroups:
  - name: Gateway & Service Mesh Tier
    deploymentTarget: aws-us-east-2
    notes: 'Kong Gateway hybrid mode, Kong Mesh Kuma control planes and Envoy data planes, and the intentional Traefik Kubernetes Ingress path form the Ottoman edge and service-mesh tier. Reusable network-service objects carry the lowest-responsible-level details.

      '
    externalInteractions:
      - name: ConfigCat
        type: external
        notes: NON-CONFORMING direct call. Kong Backplane featureflag.lua calls ConfigCat per-request with no caching, bypassing the Platform Feature Flag Service. See architectureNotes.configcatNonConformance. Remediation is to route this path through 01KQQ5JT0V-H0P5 (Platform Feature Flag Service).
    deployableObjects:
      - ref: 01KQQ5JT05-9P9S
        diagramTier: presentation
        networkZone: web
        notes: Managed through Kubernetes annotations on Kong Helm charts.
      - ref: 01KQQ5JT04-P7QJ
        diagramTier: presentation
        networkZone: web
        notes: Managed by AWS Load Balancer Controller addon.
      - ref: 01KQQ5JT1E-SW3X
        diagramTier: application
        networkZone: app
        notes: Closest existing catalog RBB for Kong Gateway; Ottoman uses Kong in hybrid mode.
      - ref: 01KYAXMZ7H-KJT2
        diagramTier: application
        networkZone: app
        notes: Reusable Kong Mesh service containing the Kuma control-plane and injected Envoy data-plane roles observed across Ottoman environments.
      - ref: 01KYAXMZ7H-72BR
        diagramTier: presentation
        networkZone: web
        notes: Intentional Kubernetes Ingress route represented by Traefik-tagged ALBs and Ingress resources in current read-only evidence.
      - ref: 01KSM38KFX-QMDW
        diagramTier: application
        networkZone: app
        notes: Sofa King-managed Kong configuration, plugins, and prepared-header routing logic.
  - name: Identity & Authentication Tier
    deploymentTarget: aws-us-east-2
    notes: 'Okta integration, Passport Core, and Redis-backed authorization profile cache provide unified SSO and identity orchestration.

      '
    deployableObjects:
      - ref: 01KQQ5JT1D-SHXD
        diagramTier: application
        networkZone: ops
        notes: Primary external identity provider for authentication and SSO.
      - ref: 01KQQ5JT00-191S
        diagramTier: application
        networkZone: data
        notes: Distributed authorization profile cache used by Ottoman identity flows.
      - ref: 01KSM38KFX-9EHD
        diagramTier: application
        networkZone: app
        notes: BFF and API for invitation acceptance, migration flows, and identity workflow orchestration.
  - name: Platform Core Services
    deploymentTarget: aws-us-east-2
    notes: 'First-party microservices implementing Ottoman domains, persons, organizations, invitations, and platform relationship data.

      '
    externalInteractions:
      - name: MongoDB Atlas
        type: external
        notes: 'RESOLVED 2026-08-04: OrgPerson Service (msvc-org-person) persists to MongoDB Atlas cluster FC-PROD1-Cluster1, database sk-org-person, via Mongoose. Modeled as a relationship to the existing MongoDB Atlas data_store_service (01KQQ5JT05-E3FZ); see relationship-platform-msvc-org-person-reads-from-and-writes-to-mongodb-atlas.yaml. Ownership documented at https://sofaking-example.atlassian.net/wiki/spaces/SKENG/pages/113994913/Atlas+MongoDB+-+Database+and+Service+Owning+Teams.'
        capabilities:
          - 01KT0V5MCV-VD0Y
      - name: Loveseat Platform Event Bus
        type: external
        notes: Publishes IdentityMatch, PersonProfile, and OrgService events via HTTP POST (REST proxy in front of Kafka). Auth uses OAuth2 Bearer token.
        capabilities:
          - 01KT0V5MCV-KT72
      - name: ConfigCat
        type: external
        notes: Feature flag SaaS. Canonical access path is through Platform Feature Flag Service (01KQQ5JT0V-H0P5), which centralizes and caches ConfigCat calls. Called by plat-svc-domain, plat-svc-organization, plat-svc-invitation, plat-passport-core, and msvc-org-person through this service.

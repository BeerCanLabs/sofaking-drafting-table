  classificationRationale: >-
    The observed schema contains compliance configuration and audit metadata and
    no explicitly named PII fields. The rule_validation_run.context_json column
    accepts caller-supplied evaluation context, so Internal/no-PII remains
    provisional pending owner confirmation of allowed inputs and Information
    Security review.
  databaseTargetRationale: >-
    The repository uses PostgreSQL 16 for local development. OPS-362835 calls for
    AWS RDS for PostgreSQL in deployed environments but does not identify engine
    version, topology, backup policy, or final service configuration.

    Service (01KSM38KFX-9EQ8, plat-svc-orgperson repo) is retired — its repo
    no longer exists on GitHub — so the prior ambiguity is closed.
  unconfirmedDependencies: >-
    Newly observed and not yet in the catalog, config-only/not independently
    code-confirmed in this pass: a Lambda helper (LAMBDA_URL), S3 (Salesforce
    CSV import), Redis Cloud (session/cache), and the internal Wingman UI
    tool.
  persistence: Aurora PostgreSQL database passportcoreservice, schema passportcore.

architectureNotes:
  repositoryName: BeerCanLabs/sk-plat-passport-monorepo
  runtimeRequirement: >-
    The develop-branch app package and Dockerfile.plat-bff-sofaking-tools both
    pin Node.js 24.14.1. The production image shares the monorepo release tag
    observed across all five Passport workloads.
  serviceAuthentication: >-
    Same header-trust chain as Passport Core (shared UserContextMiddleware
    from libs/plat-nestjs-components), plus an app-specific UserMiddleware
    (apps/plat-bff-sofaking-tools/src/permissions/middleware/user.middleware.ts)
    that builds req.user with a CASL (@casl/ability) AbilityFactory for
    role-based access control. No direct Okta SDK dependency — Okta calls
    appear delegated to Passport Core/Domain Service.
  secretsManagement: >-
    AWS Secrets Manager via ExternalSecrets Operator
    (apps/plat-bff-sofaking-tools/cd/dev/es.yml), same pattern as Passport
    Core but a smaller secret set (no TypeORM/Redis password — this app has
    no database of its own).
  serviceLogging: nestjs-pino + pino-http + pino-pretty, same pattern as sibling apps.
  healthWelfareMonitoring: >-
    /health/live, /health/ready, /health/startup are trivial (no local DB);
    /health pings core-svc (Passport Core), domain-svc, and invitation-svc via
    HttpHealthIndicator. A separate health-check-proxy module also exists,
    presumably for the UI.
  availabilityModel: 2 replicas, RollingUpdate maxUnavailable 0/maxSurge 50%. HPA min 2/max 4 (CPU 70%/mem 80%). PodDisruptionBudget maxUnavailable 1.
  scalabilityModel: Horizontal Pod Autoscaler on CPU and memory utilization.
  recoverabilityModel: No circuit breaker or explicit retry logic found in this app; relies on the shared HTTP client stack from libs/plat-nestjs-components.
  failureDomain: Scoped to the internal Ottoman administration tier.

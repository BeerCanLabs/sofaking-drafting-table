architectureNotes:
  repositoryName: BeerCanLabs/sk-plat-passport-monorepo
  runtimeRequirement: >-
    The develop-branch app package and Dockerfile.plat-bff-sofaking-admin both
    pin Node.js 24.14.1. The production image shares the monorepo release tag
    observed across all five Passport workloads.
  serviceAuthentication: >-
    Same header-trust chain as the other BFF/Passport Core apps
    (UserContextMiddleware + local UserMiddleware, CASL @casl/ability), plus a
    domain-context guard unique to this app
    (src/common/middleware/domain-context.middleware.ts,
    src/common/guards/domain-context.guard.ts) that reads the x-sk-domainid
    header and cross-checks it against the caller's authProfile.domains,
    throwing ForbiddenException on mismatch — this is the concrete mechanism
    behind Ottoman's per-domain tenant isolation for administration actions,
    partially answering the Ottoman SDP's open tenancy-model question.
  secretsManagement: >-
    AWS Secrets Manager via ExternalSecrets Operator
    (apps/plat-bff-sofaking-admin/cd/dev/es.yml). This app has its own
    Postgres connection (TYPEORM_SCHEMA=skadmin, TYPEORM_DATABASE=ottoman-core),
    so TYPEORM_PASSWORD is also secret-sourced here.
  serviceLogging: nestjs-pino + pino-http + pino-pretty, same pattern as sibling apps.
  healthWelfareMonitoring: >-
    /health/live, /health/ready, /health/startup are trivial; /health pings
    only domain-svc — it does NOT check Passport Core or Invitation Service
    despite depending on both, a monitoring coverage gap relative to its
    sibling Tools BFF (which checks all three of its dependencies).
  availabilityModel: 2 replicas, RollingUpdate maxUnavailable 0/maxSurge 50%. HPA min 2/max 4 (CPU 70%/mem 80%). PodDisruptionBudget maxUnavailable 1.
  scalabilityModel: Horizontal Pod Autoscaler on CPU and memory utilization.
  recoverabilityModel: No circuit breaker or explicit retry logic found in this app.
  failureDomain: Scoped to the customer-facing Ottoman administration tier.

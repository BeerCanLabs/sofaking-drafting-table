  - Sofa King CIS - Lakeshore (Tillbook)
description: 'Multi-tenant CIS serving Lakeshore store regions through ITCs.  Each ITC has a dedicated server stack hosted at the LSRCN data center.

  '
version: 1.1.2
catalogStatus: stub
lifecycleStatus: preferred
businessContext:
  pillar: business-pillar.customer-solutions
  productFamily: CIS Lakeshore
  notes: Initial pillar assignment inferred from Sofa King product names and current catalog grouping; confirm with product ownership.
owner:
  team: lakeshore-cis-tillbook-engineering
  contact: marcus.bell@sofaking.example
tags:
  - sis
  - lakeshore
  - tillbook
  - lsrcn
  - hybrid-hosting
followsReferenceArchitecture: 01KQQ5JT1D-N9DB
architectureNotes:
  noCrossBoundaryConnections: Confirmed data relationships are cataloged for the core per-ITC database access, the LSRCN Pristine sync flow, and the Azure Central/CloudCentral flow. Other cross-boundary connections remain unconfirmed and must not be inferred.
  availabilityRequirement: high
  dataClassification: pii
  failureDomain: per-itc-isolation
  deploymentTargets: LSRCN Data Center (primary) and Azure (shared services).
  patternDeviations: 'CentralAdmin is a single host per ITC without load balancing (SPOF).  Hard dependency on external LDAP for authentication with no fallback.

    '
  itcTenancyModel: 'Each ITC receives a fully dedicated server stack. Multi-tenancy occurs  at the database layer within an ITC.

    '
  sharedStorageBlastRadius: 'Shared storage at LSRCN creates a larger potential blast radius than  individual server isolation suggests.

    '
  serviceGroupConsolidation: 'Consolidated on 2026-07-28 from five separate module-level SoftwareDeploymentPatterns (LSCIS - Central, DataMap, Salesbook, Householdaccess, CustomerInformation), which were retired. LSCIS is one product with one dedicated server stack per ITC ("site"), not five independently deployed products; the modules below are service groups within this single pattern. Topology rebuilt from an owner-provided architecture whiteboard diagram of a single ITC. See DraftingSession session-lakeshore-cis-infrastructure-2026-07-28 for source material, assumptions, and open questions.

    '
  removedGenericReferences: 'The prior serviceGroups referenced Kong Gateway and Amazon Neptune under an "API Gateway & Traffic" group, and a generic "Lakeshore CIS (Tillbook) Suite" placeholder standing in for multiple distinct portals. Amazon Neptune (a graph database) has no evident relationship to this product and does not appear in the 2026-07-28 diagram; it looks like a mismatched auto-discovery artifact and was dropped from the topology rather than carried forward unverified. Flag for cleanup confirmation if genuinely unused. Kong Gateway was also dropped in that same pass, but the product owner corrected this on 2026-07-28: Kong Gateway is real, confirmed infrastructure that hosts LSCIS''s authentication layer, and has been reinstated below as its own service group with supporting relationship objects.

    '
  authenticationIntegration: 'LSCIS has an external authentication integration with Ottoman (the shared Sofa King identity platform, soon to be rebranded Sofa King ID), fronted by Kong Gateway, confirmed by the product owner on 2026-07-28. How this relates to the "hard dependency on external LDAP for authentication" noted in patternDeviations above (same integration under stale documentation, or a separate still-active dependency) is an open question — see DraftingSession session-lakeshore-cis-infrastructure-2026-07-28.

    '
  batchUtilityAuthPattern: 'Confirmed by product owner on 2026-07-31, as a general pattern rather than a per-component confirmation: most batch/utility tooling (syncers, patchers, migrators, exporters, and similar sis-util-* components) authenticates by talking directly to the database rather than through IdentityServer3, Okta, or AWS API Keys. Document publishers that write to the Document Vault (CIS Util Salesbook Report Card Publish, CIS Util Salesbook Year End Reports) are a confirmed exception, using AWS API Keys. If a batch utility needs to call a service hosted within its ITC, the owner believes it likely uses a client-credentials OAuth2 flow against that ITC''s CIS App Centraladmin, but this has not been confirmed per component. Individual sis-util-* entries have not been bulk-updated with this generalization; treat it as the default assumption pending per-component confirmation.'
networkZones:
  - id: web
    name: Web
    tier: frontend
    description: Internet-facing services including UIs, public APIs, and edge components.
  - id: app
    name: Application
    tier: application
    description: Internal application services, APIs, microservices, and background workers.
  - id: data
    name: Data
    tier: data
    description: Data stores, caches, message brokers, and persistence services.
  - id: ops
    name: Operations
    description: Operational and infrastructure services. No tier classification.
serviceGroups:
  - name: Ingress / Authentication
    deploymentTarget: enterprise-shared-services
    notes: >-
      Kong Gateway hosts LSCIS's authentication layer and routes web traffic
      into the per-ITC stack; LSCIS authenticates through the shared Ottoman
      identity platform (soon to be rebranded Sofa King ID), itself backed by
      Okta. Confirmed by the product owner on 2026-07-28. See relationship
      objects relationship-kong-gateway-routes-lscis and
      relationship-lscis-authenticates-through-okta-ottoman, and the open
      question about how this relates to the LDAP dependency noted in
      patternDeviations — DraftingSession session-lakeshore-cis-infrastructure-2026-07-28.
    deployableObjects:
      - ref: 01KQQ5JT1E-SW3X
        diagramTier: application
        networkZone: web
      - ref: 01KQQ5JT1D-SHXD
        diagramTier: application
        networkZone: ops
        notes: Okta, the vendor IdP behind Ottoman/Sofa King ID.
  - name: Web Services
    deploymentTarget: lsrcn-iaas
    substrate: 01KQQ5JT1E-9CKW

  - name: Database Services
    deploymentTarget: lsrcn-iaas
    notes: Per-ITC Microsoft SQL Server 2019 on Windows Server 2019. The deployment-specific service is a two-replica Always On availability group with a writable primary, readable secondary, and automatic failover. CustomerInformation, Salesbook Master, and Salesbook Region run on this service.
    deployableObjects:

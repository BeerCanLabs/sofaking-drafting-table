        diagramTier: data
        networkZone: data
        notes: Lakeshore CIS SQL Server 2019 Always On Availability Group; two replicas with automatic failover. This is the deployment-specific HA service, not the generic SQL Server catalog entry.
      - ref: 01KSM38KFP-25CX
        diagramTier: data

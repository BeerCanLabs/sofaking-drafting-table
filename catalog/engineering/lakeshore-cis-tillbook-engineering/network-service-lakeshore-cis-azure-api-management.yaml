architectureNotes:
  origin: Captured on 2026-07-31 per product owner during a conversation about VendorLink and 3rd-party auth. Previously unmodeled — the routing hop between CIS Svc CloudCentral and each ITC's CIS Svc Vendorlink had no catalog representation.
  role: 'Vendor calls carry an OAuth2 token issued by CIS Svc CloudCentral (01KYNVC9SQ-M9SZ). This gateway reads a custom routing claim in that token to route the call to the correct ITC''s CIS Svc Vendorlink — it does not itself validate the token; validation happens at CIS Svc Vendorlink against trust data held in the ITC''s CIS App Centraladmin. Also hosts the actual live vendor developer portal via Azure API Management''s built-in developer-portal functionality. A separate custom-built portal, Sa Vendorlink Portal (01KSM38KGA-D3BJ), was attempted but never launched to production.'
  serviceAuthentication: Reads the routing claim from the OAuth2 token issued by CIS Svc CloudCentral; does not validate the token and does not itself issue tokens.

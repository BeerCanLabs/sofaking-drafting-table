schemaVersion: '1.0'
uid: 01KSM38KGH-A6GC
type: software_deployment_pattern
ownerRole: engineer
name: Project Recliner (National SOM)
description: 'Next-generation national Special Orders Management (SOM) platform from the Customer

  Solutions LOB. Per-region, AWS-hosted, microservices-based architecture. Angular

  micro-frontends (MFEs) in an Nx monorepo delivered via CloudFront/S3; a public

  Backend-for-Frontend (BFF) layer on EKS; internal Recliner core microservices on EKS;

  per-region SQL Server databases on RDS with regional clustering; document storage

  in a single S3 bucket; Snowflake is planned for analytics. Current repository evidence

  shows a dedicated internet-facing Traefik ALB as BFF ingress; the proposed

  Kong/Ottoman gateway hop remains unconfirmed. Okta (Ottoman) is the stated identity

  provider, and mesh participation is currently evidenced only for the Loveseat subscriber.

  Each state is logically isolated at the network, data, and service layers to

  support compliance, data separation, versioning, and scalability.

  '
version: 1.8.0
catalogStatus: incomplete
lifecycleStatus: preferred
businessContext:
  pillar: business-pillar.customer-solutions
  productFamily: SOM Recliner
  notes: Customer Solutions LOB. Confirmed via the Recliner Infrastructure Architecture Confluence page (Customer Solutions space).

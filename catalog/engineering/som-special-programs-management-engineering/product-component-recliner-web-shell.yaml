name: Recliner Web Shell
description: 'Angular micro-frontend shell and remote MFEs for Project Recliner. Single Nx

  monorepo with Webpack Module Federation for independently deployable MFEs.

  Static assets are served via CloudFront from S3; the application entry

  point (index.html) is served from the Recliner BFF. The frontend''s exact API

  base URL and any upstream gateway hop remain explicitly unconfirmed.

  '

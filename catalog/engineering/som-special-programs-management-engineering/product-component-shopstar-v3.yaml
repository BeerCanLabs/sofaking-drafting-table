  hostingEvidence: >-
    All production Tomcat servers run this same shopstar v3 application. The
    current Tomcat estate uses GRRSHS3TC* Ubuntu 22.04 VMware hosts with PRC,
    PRT, and PRS role segmentation. Older RHEL/CentOS Tomcat inventories are
    historical and are not asserted as current infrastructure.
  tenancyModel: >-
    All states and production Tomcat pools share this codebase. F5 routes
    login.cusord.example, tx.cusord.example, and cobblestone.cusord.example to preferred pools,
    but those URLs do not enforce tenant isolation. DD_DATASOURCES uses orgID
    to select the tenant database, and PRI_ORGS_PLATFORM_MAP maps Sofa King
    platform organizations to shopstar organizations.
  databaseRouting: >-
    Every production Tomcat pool connects to the same shared Admin DB.
    DD_DATASOURCES then selects the tenant database by orgID. Active tenant
    databases are RT1-RT7, MA1-MA2, and Lakeside NI. PA, IL, NC, and WI are
    churned and excluded from active topology; NI remains active but is planned
    to churn. The current migration inventory, updated 2026-08-17, records
    InnoDB complete for RT1, RT2, RT3, RT4, RT7, NI, MA1, and MA2. RT5 and RT6
    are pending migration confirmation or approval, with a documented target
    window of 2026-08-28 through 2026-08-30. Production replication uses a
    primary with a read-only/reporting replica, not MySQL Group Replication.
    The migration inventory tracks primary host groups and does not establish
    replica engine status independently.
  databasePrimaryReplicaMappings: >-
    RT1 grrv3db1ppr/ptxcmb1m -> grrv3db1prpl/ptxcmb1s; RT2
    grrv3db2ppr/ptxcmb2m -> grrv3db2prpl/ptxcmb2s; RT3
    grrv3db3ppr/ptxcmb3m -> grrv3db3prpl/ptxcmb3s; RT4
    grrv3db4ppr/ptxcmb4m -> grrv3db4prpl/ptxcmb4s; RT5
    grrv3db5ppr/ptxcmb5m -> grrv3db5prpl/ptxcmb5s; RT6
    grrv3db6ppr/ptxcmb6m -> grrv3db6prpl/ptxcmb6s; RT7
    grrv3db7ppr/ptxcmb7m -> grrv3db7prpl/ptxcmb7s; NI
    grrv3db8ppr/pnicmb1m -> grrv3db8prpl/pnicmb1s; MA1/MA2
    grrv3db10ppr/pmacmb1m+pmacmb2m ->
    grrv3db10prpl/pmacmb1s+pmacmb2s.

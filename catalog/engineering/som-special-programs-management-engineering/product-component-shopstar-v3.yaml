  serviceAuthentication: >-
    Sofa King Identity users authenticate through the Sofa King IdM gateway
    using OIDC. Ottoman users authenticate through the Ottoman/Okta OIDC
    flow. Legacy and pass-through users are validated from FE-prefixed PBKDF2
    password hashes in PRI_USERS.
  secretsManagement: >-
    Secret Server is the confirmed store for operational, server, and database
    credentials, and Ansible Vault is used by infrastructure automation. Exact
    runtime injection for OIDC client secrets, LDAP credentials, SMTP
    credentials, RabbitMQ credentials, and application JDBC credentials
    remains unresolved.
  serviceLogging: >-
    Centralized V3 application-log aggregation or SIEM handling is not
    established by current V3-only evidence.
  healthWelfareMonitoring: >-
    Current Ubuntu hosts run Nagios agent and Dynatrace OneAgent. Exact
    application-level health-check behavior remains unresolved.

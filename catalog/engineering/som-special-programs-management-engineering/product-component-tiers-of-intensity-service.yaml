notes:
  businessPurpose: |
    Centralizes TEA-aligned Tiers of Intensity calculation logic for Sofa King
    products. The 2026-27 model scores Assortment & Instruction, Behavior,
    Communication, Independent Functioning, and Personal Care/Health from 0
    to 3, then combines those results into the customer's overall tier.
  ruleOwnership: |
    The API keeps product applications from separately implementing the same
    TEA calculation rules, reducing drift risk as state advisory evolves.
  deploymentModel: |
    Deployed as the som-tier-calc-api container on the shared Amazon EKS
    Standard Container Host in AWS us-east-1. Development, QA, and staging use
    LE1; production uses Chaise. ArgoCD reconciles environment manifests under
    k8s-deployments/manifests/som/tier-calc-api. Stage and production traffic
    enters through the environment-specific internal Traefik load balancer.
  runtimeEvidence: |
    Directory.Build.props defaults TierCalcTargetFramework to net10.0. The API
    project uses Microsoft.NET.Sdk.Web, and the Dockerfile builds with
    mcr.microsoft.com/dotnet/sdk:10.0 and runs on
    mcr.microsoft.com/dotnet/aspnet:10.0.
  deploymentEvidence: |
    All four checked-in environments run two replicas with readiness and
    liveness probes, CPU and memory requests/limits, and an HPA from two to four
    replicas at 70 percent CPU. Traefik routes a ClusterIP Service on port 80 to
    container port 8080. Stage uses the LE1 internal endpoint
    dualstack.internal-le1-ilb-traefik-ss-38425194.us-east-1.elb.amazonaws.com;
    production uses the Chaise internal endpoint
    dualstack.chaise-xalb-ssl-traefik-fe-393192678.us-east-1.elb.amazonaws.com.
  dataHandling: |
    The calculation path is stateless and performs no database or remote lookup.
    Requests contain FERPA-protected customer information and PII.
  sourceRepository: https://github.com/BeerCanLabs/sk-som-tiers-of-intensity
  repositoryName: BeerCanLabs/sk-som-tiers-of-intensity
  repositoryPrimaryLanguage: C#
  observedRuntimeSignals: ASP.NET Core 10, REST, SNS publishing, Docker, EKS, health probes
  observedManifestPaths: |
    src/TierCalc.Api, Dockerfile, .github/workflows/tier-calc-api-ci.yml,
    k8s-deployments/manifests/som/tier-calc-api/{dev,qa,stage,prod}
  discoveryBoundary: |
    Application origin/main commit fc727888dd2bd3be32ccde3363417c20152ac376

schemaVersion: '1.0'
uid: 01KX18GPWW-93YA
type: product_component
ownerRole: engineer
name: Tiers of Intensity Service
description: |
  Sofa King-authored API service for centralized TEA Tiers of Intensity
  calculations. The stateless service exposes synchronous calculation,
  detailed-result, explanation, funding-tool, ruleset, health, and queue-batch
  endpoints. The queue path receives requests from the Tiers of Intensity SQS
  Poller Lambda, and the API owns publication of calculated results to
  product-specific SNS topics.
version: 1.0.0
catalogStatus: complete
lifecycleStatus: existing-only
owner:
  team: som-special-programs-management-engineering
  contact: special-programs-management-som-eng@sofaking.example
runsOn: 01KQQ5JT02-75QN
runtimeRequirement: ASP.NET Core on .NET 10 (net10.0)
language: C#
tags:
  - som
  - recliner
  - tiers-of-intensity
  - tier-calc-api
  - domain-score
  - eks
repoUrl: https://github.com/BeerCanLabs/sk-som-tiers-of-intensity
classification: api-service
interfaces:
  - name: Synchronous Tiers of Intensity API
    protocol: REST
    path: /v1/intensity-calculations
    authenticationModel: other
    description: >-
      Synchronous calculation, detailed-result, explanation, and ruleset
      endpoints. The current source installs no application authentication
      middleware; the open risk record preserves that observed boundary.
  - name: Queue batch API
    protocol: REST
    path: /v1/intensity-calculations/queue-batches
    authenticationModel: api-key
    description: >-
      Lambda-facing batch endpoint with optional X-TierCalc-Queue-Key support.
      Current deployment enablement and secret delivery remain tracked as an
      implementation risk.
  - name: Tiers of Intensity output topics
    protocol: other
    authenticationModel: iam
    description: Publishes processed result messages to SE-TOI, Shopstar-TOI, and SOM-TOI SNS topics.
networkBindings:
  - port: 8080
    protocol: HTTP
    direction: inbound
    description: ASP.NET Core application listener targeted by the Kubernetes Service.
  - port: 443
    protocol: HTTPS
    direction: outbound
    description: AWS SDK publication to product SNS topics.
environmentConfiguration:
  - name: QueueEndpointAuth__Enabled
    description: Enables shared-key validation on the queue-batch endpoint.
    required: false
    sensitive: false
  - name: QueueEndpointAuth__ApiKey
    description: Shared key expected from the Lambda queue worker.
    required: false
    sensitive: true
  - name: AwsMessaging__EnableSnsPublishing
    description: Enables API-owned publication of calculation result notifications.
    required: false
    sensitive: false
  - name: AwsMessaging__ProductTopics__{ProductId}__TopicArn
    description: Product-specific result topic mapping.
    required: false
    sensitive: false

notes:
  triggerConfiguration: |
    Terraform configures batch size 10, no batching window, 30-second timeout,
    512 MB memory, reserved concurrency 10, and ReportBatchItemFailures. SQS
    uses a 300-second visibility timeout, four-day message retention, five
    receives before redrive, and fourteen-day DLQ retention.
  serviceInvocation: |
    The worker calls the environment API over HTTPS and supports
    X-TierCalc-Queue-Key. The optional-key deployment state and production
    hostname mismatch are tracked in the authentication and configuration risk
    record.
  runtimeEvidence: |
    The tier-calc-api CI workflow defines sqs-worker-image-build with
    dotnet-version 10.0.x, image-name som-tiers-of-intensity-sqs-worker, and
    Dockerfile path src/TierCalc.Lambda.SqsWorker/Dockerfile. Current source
    contains the Lambda handler, queue application/domain/infrastructure
    projects, partial-batch response mapping, HTTPS client, and tests.
  logging: Terraform creates the Lambda CloudWatch log group with 365-day retention.
  sourceRepository: https://github.com/BeerCanLabs/sk-som-tiers-of-intensity
  repositoryName: BeerCanLabs/sk-som-tiers-of-intensity
  repositoryPrimaryLanguage: C#
  observedRuntimeSignals: .NET 10, AWS Lambda, SQS event mapping, partial batch failures, HTTPS
  observedManifestPaths: |
    src/TierCalc.Lambda.SqsWorker, src/TierCalc.Queue.Application,
    src/TierCalc.Queue.Domain, src/TierCalc.Queue.Infrastructure,
    tests/TierCalc.Queue.Tests
  discoveryBoundary: |

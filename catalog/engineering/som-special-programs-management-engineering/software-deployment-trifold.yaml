schemaVersion: '1.0'
uid: 01KSM38KGH-DBFS
type: software_deployment_pattern
ownerRole: engineer
name: Trifold
description: >-
  Software Deployment Pattern for Trifold — a legacy ASP.NET/IIS and Windows
  Service suite (KIOTrifold) hosted on a dedicated Windows Server 2022
  physical host at the Grand Rapids Data Center, backed by SQL Server.
  Service composition reconstructed from the KIOTrifold TFS codebase;
  several facts remain open pending owner confirmation (see notes and the
  linked DraftingSession).
version: 1.2.0
catalogStatus: incomplete
lifecycleStatus: preferred
businessContext:
  pillar: business-pillar.customer-solutions
  productFamily: Trifold
owner:
  team: som-special-programs-management-engineering
  contact: special-programs-management-som-eng@sofaking.example
tags:
  - software-deployment-pattern
  - special-programs
  - trifold
  - cdp
followsReferenceArchitecture: 01KQQ5JT1D-N9DB
notes:
  availabilityRequirement: Availability requirement was not confirmed by owner interview.
  dataClassification: confidential
  failureDomain:
    scope: service-group
    description: >-
      Legacy dedicated-stack deployment; a Windows host failure affects the
      whole Trifold service group (web, application services, and batch all
      run on the same host). Not yet confirmed by owner interview.
  patternDeviations: >-
    Deviates from the Hosted Dedicated Windows and SQL Server Suite RA's
    "Traffic and API Routing" tier: no Kong Gateway or Redis cache is present
    in this legacy stack — traffic routing is handled directly by IIS with no
    API gateway or caching layer. Windows Service components (Maintenance,
    Email, Report, Sync, Batch) attach directly to the Host substrate rather
    than a dedicated RuntimeService, since no non-deprecated Windows Service
    RuntimeService object exists in the catalog yet (tracked as a Shared
    Services gap in the linked DraftingSession).
networkZones:
  - id: web
    name: Web
    tier: frontend
    description: Internet-facing services including UIs, public APIs, and edge components.
  - id: app
    name: Application
    tier: application
    description: Internal application services, APIs, microservices, and background workers.
  - id: data
    name: Data
    tier: data
    description: Data stores, caches, message brokers, and persistence services.
  - id: ops
    name: Operations
    description: Operational and infrastructure services. No tier classification.
serviceGroups:
  - name: Web Tier
    deploymentTarget: grr-datacenter
    substrate: 01KQQ5JT04-PGTY
    deployableObjects:
      - ref: 01KX421X4Q-R73N
        diagramTier: presentation
        networkZone: web
        notes: Corvid Front End Web — main Trifold CDP portal, includes the Financing billing web UI.
      - ref: 01KX421X4P-S9K4
        diagramTier: presentation
        networkZone: web
        notes: SKSS.Authentication.Trifold authentication API.
      - ref: 01KXK81789-T026
        diagramTier: presentation
        networkZone: web
        notes: >-
          Trifold Identity Hub (identity.cdpdirect.example) — discovered via the
          CDP Direct WAF Info Confluence page; relationship to the existing
          Trifold Authentication API not yet confirmed.
      - ref: 01KXK81788-D45P
        diagramTier: presentation
        networkZone: web
        notes: >-
          Trifold Document Repository (docs.cdpdirect.example) — discovered via
          the CDP Direct WAF Info Confluence page; likely fronts the

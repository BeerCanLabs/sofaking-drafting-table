  deploymentModel: >-
    Deployed separately from the main shopstar v3 Tomcat application on
    grrshs3idm01 and grrshs3idm02 on port 8889. RabbitMQ is also installed on
    both production IDM hosts, and an F5 service pool exists for IDM
    Integration. The exact RuntimeService catalog binding and current broker
    cluster membership remain unresolved, so no generic Java runtime binding
    is asserted.
  synchronizationScope: >-
    RabbitMQ carries asynchronous organization, user, permission, and
    enable-user synchronization. Historical V3 documentation defines a

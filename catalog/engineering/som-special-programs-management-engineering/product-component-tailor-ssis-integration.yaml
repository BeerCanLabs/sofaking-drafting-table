      inventoryLimit: Datacenters_GRR_vm_Tailor_2022_UAT_SSIS
      hosts:
        - GRRTLRUATSIS01
        - GRRTLRUATSIS02
        - GRRTLRUATSIS03
        - GRRTLRUATSIS04

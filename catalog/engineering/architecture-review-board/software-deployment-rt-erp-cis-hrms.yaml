name: RT ERP & CIS - Pattern
aliases:
  - RT-ERP/CIS/HRMS (Sofa King ERP)
description: 'Software Distribution Manifest for Sofa King RT-ERP/CIS/HRMS. Single-tenant monolithic Java application deployed per region in AWS ECS. Current cloud scope covers the region-hosted AWS deployment model only; on-premise deployments are intentionally excluded from this SDM and should be captured separately.

  '
version: 1.1.0
catalogStatus: incomplete
lifecycleStatus: preferred
businessContext:
  pillar: business-pillar.business-solutions
  ownerNode: team.rt-erp-cis-engineering
  additionalPillars:
    - business-pillar.customer-solutions
    - business-pillar.people-solutions
  productFamily: RT-ERP/CIS/HRMS
  notes: Initial pillar assignment inferred from Sofa King product names and current catalog grouping; confirm with product ownership.
owner:
  team: rt-erp-cis-engineering
  contact: business-solutions-erp-cis-rt-eng@sofaking.example
tags:
  - sdm
  - rt-erp
  - sis
  - hrms

architectureNotes:
  serviceAuthentication: Product identities and administrative access use the SOM application authentication model and centralized secret distribution.
  secretsManagement: Product secrets and certificates are sourced from centralized secret storage.
  serviceLogging: Product application logs are forwarded to centralized logging beyond the underlying runtime tier.
  healthWelfareMonitoring: Product telemetry, synthetic application checks, and runtime monitoring track service welfare.
  availabilityModel: Intended to run as a highly available multi-instance application service, though current deployment remains a single instance.
  scalabilityModel: Horizontal scale-out behind the application load-balancing pattern when HA remediation is completed.
  recoverabilityModel: Rebuild failed instances from the deployment package and rejoin them to the active service pool.
  failureDomain: Scoped to the SOM application tier within a single sub-environment.

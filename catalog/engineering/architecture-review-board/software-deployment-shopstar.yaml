architectureNotes:
  lifecycleRationale: >-
    Deprecated 2026-07-29. Superseded by the curated shopstar v3 - Pattern
    (01KSM38KGG-871T), which is the authoritative, interviewed deployment
    model for the shopstar product. This repository-discovered pattern is
    retained for provenance. Of its eight source repositories, shopstar-account-api,
    shopstar-idm-integration, shopstar-parent, shopstar-user-sync, and shopstar-v3 were
    folded into the curated pattern's service groups. shopstar-sandbox is
    explicitly non-deployed experimental code and was not carried forward.
    shopstar and shopstar-scheduler are shopstar V5 components (per their own
    descriptions) and were intentionally excluded from this v3-scoped
    pattern per product-owner decision on 2026-07-29 — see the shopstar v3
    Infrastructure Source Reconciliation session.
  supersededBy: 01KSM38KGG-871T

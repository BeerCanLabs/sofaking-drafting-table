architectureNotes:
  serviceAuthentication: AWS IAM roles and service credentials govern access to the bulk ingestion function and its dependencies.
  secretsManagement: Function secrets and credentials are sourced from centralized AWS secret management.
  serviceLogging: Function execution logs and workflow events are forwarded to centralized logging beyond the underlying Lambda platform.
  healthWelfareMonitoring: Invocation success rates, error telemetry, and platform monitoring track function welfare.
  availabilityModel: AWS Lambda provides multi-AZ serverless execution availability for the function runtime.
  scalabilityModel: The function scales elastically through Lambda concurrency as demand increases.
  recoverabilityModel: Failed invocations are retried through the ingestion workflow and the function is redeployed from source if configuration corruption occurs.
  failureDomain: Scoped to shared AWS bulk import functionality. Transfer Family, S3, or Lambda workflow failure affects bulk imports; FSx failure has wider web-server impact because FSx hosts IIS configuration and site files.

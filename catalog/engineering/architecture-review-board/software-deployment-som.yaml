followsReferenceArchitecture: 01KQQ5JT1D-NMRQ
architectureNotes:
  interServiceConnections: Network and data flows are not yet modeled as relationship objects. Development-owned service definitions are expected to provide those flows.
  availabilityRequirement: 24x7
  productOfferings: 'AWS-hosted SOM customers receive both Plan Management and Service Management.

    '
  deploymentTargets: 'The SOM AWS deployment boundary is the Team_Quickfit_Prod AWS account in AWS US East 2. Service placement is divided between repeatable sub-environment boundaries and Team_Quickfit_Prod shared-services operational boundaries. Production Microservices is a separate AWS account in the same region that hosts shared Chaise EKS services, Nagios, and Sofa King IDM. Customer-level websites, application pools, and backend databases are deployed inside the assigned Team_Quickfit_Prod sub-environment.

    '
  computeHostingModel: 'AWS SOM runs on EC2 instances. Non-database Windows EC2 application servers currently run Windows Server 2016. SQL/database servers are excluded from this Windows EC2 baseline and are modeled separately in the SOM SQL Server 2017 database services.

    '
  architectureDetailBoundary: 'DRAFT records the stable SOM deployment pattern, service boundaries, shared dependencies, and risk posture. Implementation details that vary by customer density or operational tuning, such as EC2 instance size and per-server placement choices, are not treated as stable architecture facts.

    '
  subEnvironmentTopology: 'Each AWS sub-environment is architecturally identical: the same service roles exist in every sub-environment. Web servers live in an Auto Scaling Group and span availability zones through that service pattern. Application server and job server roles are single-server deployments. Separate AWS Application Load Balancers exist for the web tier and the import/data-ingestion tier. Instance sizing and exact per-server availability-zone placement are engineering/operations details rather than stable architecture facts.

    '
  awsNetworkLayout: 'AWS SOM currently uses a single VPC with a subnet per availability zone. The subnets used by SOM are private. Detailed routing, network-control, and network-policy questions beyond this boundary should be answered by the networking team.

    '
  trafficPath: 'For AWS SOM, public DNS directs client traffic through the external Imperva WAF SaaS service before it enters AWS. Imperva then connects to an AWS Application Load Balancer in the Team_Quickfit_Prod account. The AWS ALB terminates SSL using the load-balancer certificate. No origin restriction to Imperva is known today. The AWS ingress path is open to Imperva on TCP 443, and traffic from the load balancer to backend targets uses TCP 80.

    '
  securityGroupPosture: 'Current AWS SOM security groups are very wide open and should be treated as a networking review/remediation item. Exact rule design is owned by the networking team rather than encoded here as application architecture.

    '
  windowsEc2ApplicationHostBaseline: 'AWS-hosted SOM non-database Windows application servers currently run Windows Server 2016 on EC2. This applies to the IIS/web and .NET application runtime tiers, not to SQL Server/database hosts. Production Windows servers in AWS are joined to the rotaprod.example domain. EDR is provided by CrowdStrike. Dynatrace OneAgent is installed for APM, monitoring, and logging; its controller platform is an external SaaS service outside Sofa King and AWS. Outside the SQL/data tier, infrastructure is treated as ephemeral and recoverable or rebuildable from code rather than backed up as persistent server state.

    '
  dnsModel: 'External DNS for SOM is hosted in AWS Route 53 in the Production Microservices account. Internal DNS uses the rotaprod.example domain and is stored on domain controllers.

    '
  edgeProtection: 'Imperva WAF is an external SaaS edge-security service, outside both AWS and the Sofa King environment, that fronts all SOM public URLs.

    '
  customerConnectivity: 'Customers do not connect to SOM through VPNs, private circuits, or other private customer connectivity paths.

    '
  observabilityModel: 'Pingdom is an external SaaS service outside Sofa King and AWS that performs uptime and synthetic monitoring against public SOM URLs. Dynatrace OneAgent is installed on SOM systems for APM, monitoring, and logging; the Dynatrace controller platform is an external SaaS service outside Sofa King and AWS. SQL and other logs may still be local depending on component rollout status. Nagios is the standard host and service monitoring platform and is hosted in the separate Production Microservices AWS account. Zabbix still exists in Webloom but has mostly migrated to Nagios.

    '
  dataClassification: 'FERPA-protected. Customer CDP records including health-adjacent information. Data residency and DPA requirements apply to all SaaS Services in this SDM.

    '
  failureDomain: 'Customer-level websites, application pools, and backend databases provide the first single-tenant isolation boundary. Sub-environment service groups bound broader infrastructure failures to the customer population assigned to that sub-environment. AWS Transfer Family, S3, or Lambda bulk-ingestion failures affect bulk import functionality. FSx failure has a wider blast radius across web servers because FSx hosts IIS web config and site files. Team_Quickfit_Prod shared services such as RabbitMQ and data integration create broader cross-sub-environment impact when unavailable. Production Microservices Chaise EKS services, Nagios, Sofa King IDM, Grand Rapids CommWeb, and external SaaS dependencies can also affect SOM availability but are outside the Team_Quickfit_Prod deployment boundary.

    '
  bulkImportFlow: 'AWS customers use a single shared AWS Transfer Family SFTP service across Quickfit AWS customers. AWS Transfer Family saves incoming files to S3 object storage. Lambda automation moves files from S3 to AWS FSx customer-specific locations. S3 is partitioned per customer under a top-level bucket. AWS Secrets Manager stores customer mappings to S3 bucket partitions and environment/FSx folders; onboarding automation populates those mappings.

    '
  sftpImplementations: 'AWS customers use AWS Transfer Family. Webloom legacy customers use Bitvise SFTP Server hosted on a Windows server in Webloom and modeled separately in the Webloom legacy pattern.

    '
  fsxDependency: 'SOM uses AWS FSx for Windows File Server in a Multi-AZ configuration for customer-specific bulk-import landing locations and for IIS web config and site files. FSx is Active Directory integrated by default in this deployment. Mount points, folder access, and file permissions use Active Directory-integrated folder and permission controls. No FSx backup configuration is currently configured. Transfer Family, S3, or Lambda failures affect bulk import functionality; FSx failure has a wider blast radius across web servers because IIS configuration and site files depend on FSx.

    '
  tenancyModel: 'AWS SOM uses customer-level single-tenant deployments: each customer has its own website, application pool, and backend database. Customers are assigned across repeatable sub-environments. Each sub-environment is created equal with the same infrastructure and configuration pattern and has its own SQL Server cluster. Customer density is the capacity signal for when to provision another sub-environment. The number and names of sub-environments are point-in-time operational inventory, not stable deployment-pattern facts.

    '
  databaseInventory: 'SOM database categories identified by the database team: customer application databases are single-tenant in AWS and use the PRDSOM_Quickfitplan_CUSTOMERNAME naming pattern; SOM Solo is related to Financing Billing and is a shared service for all customers across AWS and Webloom; QuickfitImport is a shared customer-upload database for AWS customers; no dedicated reporting database was identified; SKDBA exists on each SQL Server as the local central logging location for system-related tasks and logs; SSISDB exists once per SQL Server; no legacy Webloom-specific database category applies to the AWS pattern.

    '
  databasePlatform: 'AWS SOM uses Microsoft SQL Server 2017 Enterprise. Each sub-environment has its own SQL Server cluster. Exact AWS SQL host inventory requires confirmation.

    '
  databaseAvailabilityAndRecovery: 'AWS SOM uses two-node SQL Server Always On clusters with cross-AZ behavior. Deployment is mixed today and moving toward synchronous replication. Passive nodes are used only for HA, not reporting workloads. Backups include full, differential, and transaction-log backups created with SQL Server DBA Tools and uploaded to S3 through CloudBerry. RPO is 15 minutes. RTO varies by client database size. Annual backups are retained for 7 years, monthly backups for 12 months, and full backups for 30 days; local backup copies are retained for roughly one week. S3 backups are encrypted and protected by compliance lock controls, requiring appropriate decryption keys for restore. Customer-level restore is supported for single-tenant databases. Restore process is documented in the AWS S3 DB Backups Download & Restore Tools runbook.

    '
  sharedDatabaseModel: 'SOM Solo is a Financing Billing shared service for all customers across AWS and Webloom; detailed usage and ownership still require follow-up with the application owners. QuickfitImport is a shared database for all AWS customers and is used for customer upload data, staging, and incoming-data transformation. The shared import database uses organization ID segregation and guardrails to prevent data mixing between clients; Development follow-up is needed for the detailed import flow. SKDBA and SSISDB are per-SQL-server databases, not single global shared databases.

    '
  ssisIntegrationModel: 'SSIS service is installed on all SQL Servers. SSISDB exists once per SQL Server. SSIS operates against both AWS and Webloom client databases, reads from and writes to client-specific databases, and supports imports, reporting, warehouse feeds, state reporting, migrations, and Financing/claims extracts. SSIS packages may be scheduled on the SSIS server or through SQL Agent jobs local to the SQL Server. SSIS authentication uses a SQL password service account.

    '
  reportingAnalyticsFlows: 'No dedicated reporting database was identified. Passive SQL nodes are used only for HA, not reporting workloads. Snowflake feeds are populated through SOM data pulls, with extract work still in progress. Direct queries from reporting tools were not identified; authorized production queries may be run through SSMS.

    '
  sensitiveDataBoundaries: 'SOM customer data lives in the main per-customer database. SOM databases contain FERPA/CDP data, Financing or claims-related data, health-adjacent data, audit records, file import metadata, and credentials/tokens/integration secrets. EBS volumes and SQL backups are encrypted at rest. SQL connections are not believed to be encrypted in transit because internal PKI is not a strong current practice. Sensitive-table inventory and data-obfuscation scripts are pending from the database team and Development. Customer data deletion for churned clients follows the documented SOM Data Deletion - Churning Clients Process; churned customer data is archived to S3 and retained under the 7-year backup/compliance retention posture rather than deleted immediately from S3.

    '
  fileToDatabaseFlow: 'QuickfitImport is leveraged by the Data Import Service for customer upload data, staging, and incoming-data transformation. Development follow-up is needed for the detailed consumer and write flow. Database-side import/export processing uses local SSIS packages and SFTP/customer file locations for most operations; the exact FSx handoff boundary with application-owned ingestion still requires Development confirmation. Import status, errors, and audit trails are logged and notifications are sent. No purge policy exists today; purge automation is in process and the current process is manual. S3 is long-term storage for database backups; FSx is short-term storage for local backups and failover support.

    '
  databaseRoadmapUncertainty: 'The database conversation referenced upgrade planning from SQL Server 2017 toward newer SQL Server versions, but target version, target environment, and timeline require confirmation before being modeled as current state.

    '
  databaseRestoreProcessReference: 'AWS S3 DB Backups Download & Restore Tools: https://sofaking-example.atlassian.net/wiki/spaces/SaaSIO/pages/15477171876

    '
  customerDataDeletionProcessReference: 'SOM Data Deletion - Churning Clients Process: https://sofaking-example.atlassian.net/wiki/spaces/PRODMGMT/pages/15787982433/SOM+Data+Deletion+-+Churning+Clients+Process

    '
  patternDeviations: 'This SDM keeps several capabilities centralized in shared-services rather than replicating them per sub-environment, contains intentional single-instance debt and accepted SA decisions documented in linked ARDs, and still follows the nearest sharded AWS SQL Server ReferenceArchitecture even though the actual SOM AWS model is customer-level single tenancy inside repeatable sub-environments. A better reusable ReferenceArchitecture may be needed.

    '
  authenticationDependencyPath: 'AWS SOM web servers authenticate through the Tri-State CommWeb server group in the Grand Rapids Data Center. CommWeb brokers the connection to Sofa King IDM, a separate product hosted in the Production Microservices AWS account. This path is required for SOM authentication troubleshooting but does not make Tri-State or IDM part of the SOM deployment pattern.'
  externalDependencies: 'The diagram includes cross-boundary dependencies so their operating locations are explicit: external Imperva WAF, Pingdom, and Dynatrace SaaS services; Tri-State CommWeb in Grand Rapids; and Sofa King IDM, Nagios, and Chaise EKS downstream services in the separate Production Microservices AWS account. The SOM Data Ingestion to AWS FSx connection is modeled as a relationship object in catalog/governance/relationships/.'
scalingUnits:
  - name: sub-environment
    type: replicable
    instanceCount: 1
    notes: 'The instance count represents one archetypal sub-environment in the deployment pattern, not the live number of deployed sub-environments. Each AWS sub-environment is created from the same infrastructure and configuration pattern, carries an assigned population of customer-level single-tenant deployments, and has its own SQL Server cluster. Each customer has its own website, application pool, and backend database within the assigned sub-environment. New sub-environments are provisioned when customer density or capacity decisions require additional infrastructure. Current names and counts are operational inventory and should not be treated as stable deployment-pattern facts.

      '
  - name: shared-services
    type: shared
    notes: 'AWS shared-services layer serving the SOM sub-environments. Scales independently based on aggregate load and can create broader blast radius when unavailable.

      '
  - name: production-microservices-shared
    type: shared
    notes: 'Shared services hosted in the separate Production Microservices AWS account. These services are external dependencies of SOM rather than part of the Team_Quickfit_Prod deployment boundary.

      '
  - name: external-services
    type: shared
    notes: 'Vendor SaaS and separate-product dependencies outside the Team_Quickfit_Prod AWS account.

      '
networkZones:
  - id: web
    name: Web
    tier: frontend
    description: Internet-facing services including UIs, public APIs, and edge components.
  - id: app
    name: Application
    tier: application
    description: Internal application services, APIs, microservices, and background workers.
  - id: data
    name: Data
    tier: data
    description: Data stores, caches, message brokers, and persistence services.
  - id: ops
    name: Operations
    description: Operational and infrastructure services. No tier classification.
  - id: external
    name: External
    description: Services operated outside the Team_Quickfit_Prod AWS account.
serviceGroups:
  - name: External Edge Security - Imperva
    deploymentTarget: saas-imperva
    scalingUnit: external-services
    notes: Vendor-managed SaaS WAF outside AWS and the Sofa King environment.
    deployableObjects:
      - ref: 01KQQ5JT1D-MY47
        diagramTier: presentation
        networkZone: external
        notes: Imperva WAF fronts all SOM public URLs before traffic enters AWS.
  - name: Team_Quickfit_Prod AWS - Ingress
    deploymentTarget: aws-us-east-2
    scalingUnit: sub-environment
    notes: AWS ingress within each repeatable SOM sub-environment. Separate ALBs exist for the web and import/data-ingestion tiers.
    deployableObjects:
      - ref: 01KQQ5JT04-P7QJ
        diagramTier: presentation
        networkZone: web
        notes: AWS Application Load Balancer. SSL terminates at the ALB; backend target traffic uses TCP 80.
  - name: Team_Quickfit_Prod AWS - Repeatable Frontend UI
    deploymentTarget: aws-us-east-2
    scalingUnit: sub-environment
    notes: Web servers live in an Auto Scaling Group and use a dedicated AWS Application Load Balancer for the web tier.
    deployableObjects:
      - ref: 01KSM38KEW-Q2SE
        diagramTier: application
        networkZone: web
  - name: Team_Quickfit_Prod AWS - Repeatable Data Ingestion
    deploymentTarget: aws-us-east-2
    scalingUnit: sub-environment
    notes: Import/data-ingestion traffic uses a separate AWS Application Load Balancer from the SOM web tier.
    deployableObjects:
      - ref: 01KSM38KEW-G59V
        diagramTier: application
        networkZone: web
        riskRef: 01KQQ5JT01-ZQ56
  - name: Team_Quickfit_Prod AWS - Repeatable File Services
    deploymentTarget: aws-us-east-2
    scalingUnit: sub-environment
    deployableObjects:
      - ref: 01KQQ5JT05-FMR5
        diagramTier: application
        networkZone: data
        notes: 'FSx for Windows is deployed Multi-AZ, Active Directory integrated, and permissioned through Active Directory-backed folder permissions. It supports customer-specific bulk-import landing locations and shared file storage for archived imports from Data Ingestion. It also hosts IIS web config and site files for the web servers, giving FSx a broader blast radius than SFTP/S3/Lambda bulk import intake. No FSx backup configuration is currently configured.

          '
  - name: Team_Quickfit_Prod AWS - Repeatable Application Services
    deploymentTarget: aws-us-east-2
    scalingUnit: sub-environment
    notes: Application server roles are single-server deployments within each AWS sub-environment.
    deployableObjects:
      - ref: 01KQQ5JT1F-1YGS
        diagramTier: application
        networkZone: ops
        riskRef: 01KQQ5JT01-FK72
      - ref: 01KSM38KEW-D1VD
        diagramTier: application
        networkZone: app
        riskRef: 01KQQ5JT01-FH3N
  - name: Team_Quickfit_Prod AWS - Repeatable Event Processing
    deploymentTarget: aws-us-east-2
    scalingUnit: sub-environment
    deployableObjects:
      - ref: 01KSM38KEW-2GGC
        diagramTier: application
        networkZone: app
  - name: Team_Quickfit_Prod AWS - Repeatable Utility Services
    deploymentTarget: aws-us-east-2
    scalingUnit: sub-environment
    notes: Job server roles are single-server deployments within each AWS sub-environment.
    deployableObjects:
      - ref: 01KSM38KEW-VCQS
        diagramTier: application
        networkZone: ops
        riskRef: 01KQQ5JT01-5Q7C
  - name: Team_Quickfit_Prod AWS - Repeatable Data Services
    deploymentTarget: aws-us-east-2
    scalingUnit: sub-environment
    deployableObjects:
      - ref: 01KWF5PCRR-8FHN
        diagramTier: application
        networkZone: data
        notes: 'Database HA is provided by SQL Server 2017 Enterprise Always On Availability Groups. Each AWS SOM sub-environment has its own two-node SQL Server cluster with cross-AZ failover behavior. Passive nodes are HA-only and are not used for reporting workloads.

          Database backup and restore uses full, differential, and transaction-log backups. Backups are created with SQL Server DBA Tools and uploaded to S3 through CloudBerry. RPO is 15 minutes. RTO varies by customer database size. Annual backups are retained for 7 years, monthly backups for 12 months, full backups for 30 days, and local backup copies for roughly one week. S3 backups are encrypted and protected by compliance lock controls. Customer-level restore is supported for AWS single-tenant customer databases.

          '
  - name: Team_Quickfit_Prod AWS - Shared Bulk Ingestion
    deploymentTarget: aws-us-east-2
    scalingUnit: shared-services
    deployableObjects:
      - ref: 01KQQ5JT05-BZFX
        diagramTier: application
        networkZone: ops
        notes: Shared AWS-hosted Transfer Family SFTP service used across all Quickfit AWS customers.
      - ref: 01KQQ5JT05-KT3Z
        diagramTier: application
        networkZone: data
        notes: S3 backend for AWS Transfer Family inbound files. A top-level bucket is partitioned per customer.
      - ref: 01KWF3RGCF-T2HM
        diagramTier: application
        networkZone: data
        notes: AWS Secrets Manager stores customer mappings to S3 bucket partitions and environment/FSx folders. Onboarding automation populates these mappings.
      - ref: 01KSM38KEW-9M3M
        diagramTier: application
        networkZone: ops
        notes: Lambda automation moves inbound files from S3 to AWS FSx customer-specific locations.
  - name: Team_Quickfit_Prod AWS - Shared RabbitMQ
    deploymentTarget: aws-us-east-2
    scalingUnit: shared-services
    deployableObjects:
      - ref: 01KQQ5JT1E-JBCV
        diagramTier: application
        networkZone: ops
        notes: Shared messaging service inside the Team_Quickfit_Prod account, consumed by all AWS SOM sub-environments. It is not part of the repeatable sub-environment boundary.
  - name: Production Microservices AWS - Chaise EKS Services
    deploymentTarget: aws-us-east-2
    scalingUnit: production-microservices-shared
    notes: Downstream shared services hosted in the Chaise EKS cluster in the separate Production Microservices AWS account.
    deployableObjects:
      - ref: 01KSM38KEX-M6N9
        diagramTier: application
        networkZone: app
      - ref: 01KSM38KEW-PEGN
        diagramTier: application
        networkZone: app
  - name: Production Microservices AWS - Nagios
    deploymentTarget: aws-us-east-2
    scalingUnit: production-microservices-shared
    notes: Standard host and service monitoring platform hosted in the separate Production Microservices AWS account.
    deployableObjects:
      - ref: 01KQQ5JT1F-E2CC
        diagramTier: utility
        networkZone: ops
  - name: External Observability - Pingdom
    deploymentTarget: saas-pingdom
    scalingUnit: external-services
    notes: Vendor SaaS uptime and synthetic monitoring service outside AWS and the Sofa King environment.
    deployableObjects:
      - ref: 01KXK7BD4N-FV9X
        diagramTier: utility
        networkZone: external
  - name: External Observability - Dynatrace
    deploymentTarget: saas-dynatrace
    scalingUnit: external-services
    notes: Vendor SaaS Dynatrace controller platform outside AWS and the Sofa King environment. OneAgent runs on SOM systems for APM, monitoring, and logging.
    deployableObjects:
      - ref: 01KXK7BD4N-93KS
        diagramTier: utility
        networkZone: external
  - name: Grand Rapids - Tri-State CommWeb
    deploymentTarget: grr-datacenter
    scalingUnit: external-services
    notes: Tri-State-owned CommWeb server group that brokers SOM authentication to Sofa King IDM. Detailed server design is pending Tri-State architect confirmation.
    deployableObjects:
      - ref: 01KXK7BD4N-4ART
        diagramTier: application
        networkZone: external
  - name: Production Microservices AWS - Sofa King IDM
    deploymentTarget: aws-us-east-2
    scalingUnit: production-microservices-shared
    notes: Separate Sofa King identity-management product hosted in the Production Microservices AWS account; consumed through CommWeb for AWS SOM authentication.
    deployableObjects:
      - ref: 01KXK7BD4N-8Z19
        diagramTier: application
        networkZone: external
  - name: Team_Quickfit_Prod AWS - Shared Data Integration
    deploymentTarget: aws-us-east-2
    scalingUnit: shared-services
    deployableObjects:
      - ref: 01KWF5PCRR-ZJE9
        diagramTier: application
        networkZone: data
        notes: SOM SQL Server 2017 SSISDB integration service. SSIS operates against AWS and Webloom client databases and uses a SQL password service account.

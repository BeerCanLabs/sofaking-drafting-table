schemaVersion: '1.0'
uid: 01KSM38KEX-R400
type: software_deployment_pattern
ownerRole: engineer
name: Sofa King SOM PM & SM - AWS Platform
aliases:
  - SOM (Special Orders Management)
  - Sofa King SOM (Inc PM & SM) - Pattern
description: 'Current-state AWS deployment pattern for Sofa King SOM (Special Orders Management), formerly known as Quickfit, supporting both Plan Management and Service Management. Region-facing product enabling administrators to create and track customer Individual Retail Plans (CDPs) for Custom Orders. Primary user: Director of Custom Orders.

  Deployed in AWS as customer-level single-tenant deployments inside repeatable sub-environments. Each customer has its own website, application pool, and backend database. Each sub-environment is created from the same infrastructure and configuration pattern, has its own SQL Server cluster, and carries an assigned population of single-tenant customer deployments. Customer density is used as the capacity signal for when to provision another sub-environment; names and counts are point-in-time operational inventory rather than stable deployment-pattern facts. This AWS pattern is distinct from the Webloom/Colohub legacy SOM Service Management-only environment, which is modeled separately.

  Database HA is provided by SQL Server 2017 Enterprise Always On Availability Groups. Each AWS SOM sub-environment has its own two-node SQL Server cluster with cross-AZ failover behavior. Passive nodes are HA-only and are not used for reporting workloads. Database backup and restore uses full, differential, and transaction-log backups created with SQL Server DBA Tools and uploaded to S3 through CloudBerry. RPO is 15 minutes, and RTO varies by customer database size.

  '
version: 1.0.0
catalogStatus: incomplete
lifecycleStatus: preferred

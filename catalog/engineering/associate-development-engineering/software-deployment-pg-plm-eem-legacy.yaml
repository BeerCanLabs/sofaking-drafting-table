name: 'PG: PLM/EEM — Legacy Estate'
aliases:
  - PLM/EEM Legacy Deployment Pattern
  - STL LDMS and FORMIX
description: >-
  The long-lived tier of Sofa King Associate Development's PLM (Professional
  Learning Management) and EEM (Employee Evaluation Management) product. LDMS is
  PLM's predecessor system and FORMIX is EEM's; both remain in service. A Classic
  ASP and .NET Framework estate on Windows/IIS behind the GRR F5 BIG-IP,
  backed by a hub-and-spoke SQL Server database (STL) plus the FORMIXFORMS
  database. Modelled as a pattern separate from the cloud tier
  (01M1F8WB4E-8WVS) at the direction of the DRAFT programme, following the
  rh-hiretrack / hcm-rh precedent. Authored for APEX L1 Baseline under
  SKPG-19589; unresolved items are tracked in DraftingSession 01M1F8WB4E-0GSN
  rather than asserted here.

name: Interaction Service
description: Node.js and TypeScript (Hapi.js) microservice, built and deployed as a Docker image (repository BeerCanLabs/sk-msvc-InteractionService). Receives interaction events from the Resource Library (xAPI statements) and stores them in PostgreSQL, then forwards them to Kafka through a sidecar API. Also exposes callback endpoints for third-party integrations (SCORM Cloud, Canvas, GCN/LTI).

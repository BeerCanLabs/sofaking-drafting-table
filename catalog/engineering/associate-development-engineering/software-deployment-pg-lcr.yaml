    deploymentTarget: aws-us-east-1
    notes: The Universal Resource Library UI Module is a Settee UI module loaded inside Settee. Owner-confirmed deployment by Octopus to environment aws_prod, three Listening Tentacle targets tagged Settee and UIModules (Default Machine Policy), in the Production Microservices account (736016846305), us-east-1.
    deployableObjects:
      - ref: 01M71NWZVQ-M1PQ
        diagramTier: presentation
        notes: Universal Resource Library UI Module (Settee). TeamCity build, Octopus deploy.

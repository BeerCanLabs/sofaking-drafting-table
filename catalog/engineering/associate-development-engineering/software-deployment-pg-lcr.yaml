    deploymentTarget: aws-us-east-1
    notes: Three Windows EC2 instances running IIS, deployed by Octopus (two in environment prod_ottm, which is Ottoman production, and one in aws_prod, which is IDM production). Owner-confirmed as AWS region us-east-1 in the Production Microservices account (736016846305).
    deployableObjects:
      - ref: 01M71NWZVQ-SVSV
        diagramTier: presentation
        notes: Learning Designer App (.NET 4.8 on IIS). TeamCity build, Octopus deploy.

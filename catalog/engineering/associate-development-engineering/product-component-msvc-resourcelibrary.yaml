  observedDependencySignals: package.json lists pg, sequelize, ioredis, redis, elasticsearch and aws-sdk. ConfigMap also references IDM and Organization APIs (login.sofaking.example, api2.sofaking.example), the External API Service, the Interaction Service, and a Kafka sidecar API (sc-resourcelib.use1.sofaking.example) for events and subscriptions.

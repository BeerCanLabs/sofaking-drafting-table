architectureNotes:
  repositoryName: BeerCanLabs/sk-WHM_Brannock_NET
  observedRuntimeSignals: dotnet
  observedManifestPaths: Brannock.NET.sln; Brannock.NET/Brannock.NET.csproj
  serviceAuthentication: Not applicable - the library performs no authentication itself; it provides an APIRequest/APIResponse wrapper pattern for consumers (APIRequest.cs, APIResponse.cs).
  secretsManagement: Not applicable - no secrets used or handled by this library.
  serviceLogging: Uses NLog internally for its own diagnostic logging (catches/logs exceptions inside APIRequest.ProcessAndMeasure* helpers) but does not configure any NLog targets itself - that is left to the consuming application.
  healthWelfareMonitoring: Provides a reusable block-timing helper (Performance/Measure.cs - Measure.Block, Measure.TaskBlock) used by consumers to emit elapsed-time telemetry/log entries; a lightweight instrumentation helper, not a monitoring system itself.
  availabilityModel: Distributed as a versioned NuGet package (Publish-nuget.cmd, targets netstandard2.0 and net452), consumed as a compiled reference by other applications rather than deployed/run independently.
  scalabilityModel: Not applicable - a library, not a runtime service; scalability is entirely inherited from the consuming application.
  recoverabilityModel: Not applicable - no persistence or state of its own.
  failureDomain: Contained to whatever call the consuming app makes through APIRequest.ProcessAndMeasure*/ProcessAsTask - these wrap consumer code in try/catch and normalize failures into a well-formed APIResponse.Error(...), so a failure here is scoped to the specific consumer call.
  externalDependencies: None beyond two NuGet dependencies of its own (Newtonsoft.Json, NLog) - no network/DB/cloud SDK calls in the library itself.
  primaryDataStores: None - no database access code in this repository.

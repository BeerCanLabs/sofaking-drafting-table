architectureNotes:
  serviceAuthentication: HHD_Login supports tenant-specific SSO and non-SSO entry flows (SAML, Azure, Google, ClassLink, ADFS, Rapid Identity, OneLogin) and routes authenticated users into the correct experience.
  configurationModel: Login runtime behavior is driven by environment-specific configuration externalized in Amazon S3 (login config).
  serviceLogging: Frontend telemetry and request logging flow through Application Insights and the shared observability stack.
  healthWelfareMonitoring: Synthetic checks plus Application Insights and CloudWatch-backed telemetry monitor the login experience.
  availabilityModel: Runs as replicated ECS tasks behind the Imperva WAF web ingress path.
  scalabilityModel: Scales horizontally within the shared ECS environment.
  recoverabilityModel: Failed tasks are replaced by ECS service orchestration.
  failureDomain: Scoped to the HelpDesk web/login tier of the GetHelp platform.

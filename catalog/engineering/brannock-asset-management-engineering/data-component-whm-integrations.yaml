description: Heterogeneous per-region CIS integration and ETL system for RETAIL regions. Not a single application — comprises ~126 per-region SSIS/SSDT projects run as SQL Server Agent jobs on 4 named shared production hosts, 2 always-on Windows Services, newer Python ETL pipelines (including an LLM-based post-job log monitor), and an AWS Lambda/Node.js microservice stack ("Brannock" integrator). Enriched from a direct repository read; corrects the prior "TSQL primary / containsPII false" repository-discovery assumptions.

  serviceAuthentication: 'Username/password login posted to a per-region base URL (UseCaseLogin.kt), returning an app-specific security token; also supports SSO via a WebView-hosted flow (SsoLoginActivity, WebViewSsoActivity, WvSsoViewModel.kt). Token/expiry stored client-side and refreshed via RefreshTokenCaller.kt, which calls back into the Mobile API on expiry.'
  secretsManagement: 'No secrets vault; the per-tenant API URL and access token are stored in Android Jetpack DataStore preferences (PreferencesManager.kt). Socket Mobile scanner SDK app key/developer ID are hardcoded in AndroidManifest.xml.'
  serviceLogging: 'Custom LogUtils wrapper used app-wide; no centralized cloud log shipping found client-side (crash/analytics telemetry covers operational visibility instead - see healthWelfareMonitoring).'
  healthWelfareMonitoring: 'Crash/usage telemetry via Microsoft App Center (analytics + crashes) and Firebase Analytics. No dedicated health-check endpoint (client apps do not expose one).'
  availabilityModel: 'Not applicable - client app, distributed as APK/IPA rather than a server deployment.'
  scalabilityModel: 'Not applicable - client-side.'
  recoverabilityModel: 'Local Room database cache (TrackwebItDatabase) allows some offline continuity; session-expiration is actively checked and forces logout on expiry.'
  failureDomain: 'Scoped to a single mobile device/session; app enforces network security via a network-security-config that blocks cleartext except to localhost.'
  externalDependencies: 'Socket Mobile barcode/RFID scanner SDK; Zebra RFID SDK framework (iOS); ZXing barcode scanning; Firebase; Microsoft App Center. All backend calls go to the Mobile API (01KSM38KFB-D6MJ).'
  primaryDataStores: 'Local only - Android Room database (TrackwebItDatabase) plus DataStore preferences; no direct external database access from the client.'

  serviceLogging: 'Confirmed by direct repository read (TRK-680 dev spike) plus cross-check with the product engineering owner: logging is split across five uncoordinated mechanisms with no shared correlation identifier — the tblUnvLog database table (BLL/LogManagement/Log.cs, ~2 call sites), Windows Event Log (Global.asax.vb, CustomTelemetryInitializer.vb), System.Diagnostics.Trace to a local FileLogTraceListener (SSOCommon.vb, PendoHelper.cs, login.aspx.vb, ResetPassword.aspx.vb), Application Insights (automatic, per-region InstrumentationKey region preference), and tblErrors/stpro_Errors_ins/error.aspx (reached from ~100 code-behind catch blocks, also displays raw exception detail to the end user). None of the four non-AppInsights mechanisms is centrally consumable without direct region-database or local-file access. NLog + CloudWatch shipping is planned under TRK-350 but not yet implemented.

    '
  healthWelfareMonitoring: 'Confirmed by direct repository read (TRK-680 dev spike): no health-check endpoint exists anywhere in the Trackweb tree today. A full search found only two unrelated .ashx handlers (ImageDisplay.ashx, pdfHandler.ashx); neither is a health probe, and no external uptime monitor is configured. TRK-859 will port AM''s SiteDbCheck.ashx / SiteRenderCheck.aspx pattern, blocked on WHM_IM having no RegionName region preference for the DB probe (see runtime-service-whm-im-iis, Q8J31D44E3-F22K, for the hosting-runtime side of this gap).


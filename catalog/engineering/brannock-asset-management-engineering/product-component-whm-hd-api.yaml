architectureNotes:
  serviceAuthentication: API access uses tenant-specific identity context from HHD_Login flows plus backend authorization enforcement.
  tenantContextResolution: The API resolves tenant identity and selects the appropriate tenant or environment SQL Server database before persistence access.
  secretsManagement: Runtime secrets and environment configuration are externalized outside the image through the shared S3-hosted environment configuration model (API appsettings).
  serviceLogging: API logs and traces are forwarded to Application Insights and the shared observability stack.
  healthWelfareMonitoring: API health is tracked through telemetry, runtime probes, and platform monitoring.
  availabilityModel: The API backend runs as replicated ECS tasks in the shared service environment.
  scalabilityModel: The API backend scales horizontally within ECS as tenant demand increases.
  recoverabilityModel: Failed API tasks are replaced through ECS service orchestration and redeployed from the coordinated release package.
  failureDomain: Scoped to the shared HelpDesk API tier serving the multi-tenant product.
  integrations: Integrates with Sofa King Asset Management / Trackweb (the WHM_HD_API repo references a TrackwebNotifications connected service) and coordinates Lambda-backed background processing.

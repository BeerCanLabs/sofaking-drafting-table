schemaVersion: '1.0'
uid: 01KSM38KF8-TKMW
type: software_deployment_pattern
ownerRole: engineer
name: Asset Management - Pattern
aliases:
  - Sofa King Inventory Management – Asset Management
  - Trackweb-IT
description: >-
  Asset Management (AM) is Sofa King's RETAIL asset/inventory management product,
  branded Trackweb-IT (repo family BeerCanLabs/sk-WHM_AM_*). It is a legacy
  ASP.NET Web Forms + MVC application (.NET Framework 4.8) with a per-region
  single-tenant SQL Server data tier, an identity/SSO subsystem, a mobile
  client and backend API, integration and reporting APIs, and a modern AWS
  Lambda-based serverless ETL layer for third-party MDM sync (InTune, Mosyle,
  JamfStore, Google Workspace) and a planned Sofa King ERP integration. This
  pattern previously conflated AM with Display Materials Management
  (IMM) and the obsolete IM Refresh (IMR) rebuild. Product ownership confirmed
  on 2026-08-06 that AM and IMM require separate DRAFT entries and that IMR no
  longer exists as a current product. IMM is described by 01KSM38KFD-1G0D.
  See DecisionRecord 01KYRT1P14-Y2RH for the scope-correction rationale.

  Source Documentation: - https://sofaking-example.atlassian.net/wiki/spaces/AR/pages/17893014094/Asset+Management+Architecture
  - https://sofaking-example.atlassian.net/wiki/spaces/~7120201cb9eab1a3cf41c0930d3cf95a4e749e/pages/16800335071/Asset+Management+Product+Ownership+and+Component+Verification+Questions
version: 2.1.0
catalogStatus: incomplete
lifecycleStatus: preferred
businessContext:
  pillar: business-pillar.business-solutions
  ownerNode: team.brannock-asset-management-engineering
  productFamily: Asset Management
  notes: Product ownership confirmed the Business Solutions pillar, Brannock Asset Management Engineering ownership, and Group_dev_whm@sofaking.example contact on 2026-08-06.
owner:
  team: brannock-asset-management-engineering
  contact: Group_dev_whm@sofaking.example

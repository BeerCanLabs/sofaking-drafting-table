serviceGroups:
  - name: Web Edge and Frontend Workloads
    deploymentTarget: aws-us-east-1
    substrate: 01KQQ5JT02-KJHA
    notes: |
      Region-facing web path for the three Angular SPAs HHD_Login, HHD_UI, and
      HHD_UP hosted on the shared Amazon ECS container runtime. Signal Sciences and
      NGINX are part of the runtime request path and browser traffic enters through
      Imperva WAF.
    externalInteractions:
      - name: Identity Providers
        type: external
        notes: |
          Tenant-specific identity integrations include SAML, Azure, Google,
          ClassLink, ADFS, Rapid Identity, OneLogin, and configured non-SSO flows.
          Modeled here as an external interaction rather than a first-class
          relationship because no identity-provider catalog objects exist yet.
        capabilities:
          - 01KQQ4Q026-MHJM
    deployableObjects:
      - ref: 01KQQ5JT1D-MY47
        diagramTier: application
        networkZone: web
        notes: Imperva WAF front door for region-facing browser traffic.
      - ref: 01KSM38KFC-KKH6
        diagramTier: presentation
        networkZone: web
        notes: HHD_Login Angular SPA - tenant login and SSO redirect entry point.
      - ref: 01KSM38KFC-FM2A
        diagramTier: presentation
        networkZone: web
        notes: HHD_UI Angular SPA - technician and admin help desk workflows.
      - ref: 01KSM38KFC-WKD2
        diagramTier: presentation
        networkZone: web
        notes: HHD_UP Angular SPA - end-user support portal experience.
  - name: API and Tenant Application Services
    deploymentTarget: aws-us-east-1
    substrate: 01KQQ5JT02-KJHA
    notes: |
      HHD_API is the .NET backend for tenant-aware business logic, queue and
      routing workflows, notification orchestration, authorization, and
      integrations with adjacent systems, hosted on the shared Amazon ECS
      container runtime.
    externalInteractions:
      - name: Sofa King Asset Management / Trackweb
        type: external
        notes: Asset-linked workflows, ticket context enrichment, and asset-aware request handling.
        capabilities:
          - 01KT0V5MCV-RZV0
      - name: Email Infrastructure
        type: external
        notes: Supports outbound notifications and inbound email-to-ticket or update workflows.
      - name: HCM Onboarding Integration
        type: external
        notes: HHD_API validates and processes onboarding records and exposes integration-status operations for the HCM consumer.
      - name: Email-to-Ticket Processing
        type: external
        notes: Other services call ProcessEmail and FinalizedEmailAttachments to create or update tickets from inbound email.
      - name: Sofa King Applications / Integrations
        type: external
        notes: Additional ecosystem integrations through HHD_API and surrounding platform services.
    deployableObjects:
      - ref: 01KSM38KFB-X6P1
        diagramTier: application
        networkZone: app
        notes: Shared HHD_API backend for business rules, tenant context resolution, and integrations.
  - name: Background Processing and Runtime Configuration
    deploymentTarget: aws-us-east-1
    substrate: 01KQQ5JT03-FGYJ
    notes: |
      Split execution model for asynchronous jobs, scheduled work, integration
      processing, and shared runtime configuration. Lambda artifacts and S3
      configuration are part of the coordinated release unit.
    externalInteractions:
      - name: Amazon S3 Runtime Configuration
        type: external
        notes: |
          Stores API appsettings, UI and login config, notification config, NGINX
          config, Signal Sciences config, and maintenance assets.
        capabilities:
          - 01KT0V5MCV-E9TN
      - name: Microsoft Application Insights
        type: external
        notes: Working application telemetry for diagnostics and incident investigation.
        capabilities:
          - 01KQQ4Q026-NB1W
      - name: Amazon CloudWatch
        type: external
        notes: Working infrastructure telemetry for ECS, Lambda, and platform-level monitoring.
    deployableObjects:
      - ref: 01KQQ5JT0M-PM3P
        diagramTier: application
        networkZone: ops
        notes: Lambda-backed background jobs, scheduled tasks, and integration processing.
  - name: Data Services
    deploymentTarget: aws-us-east-1
    notes: |
      SQL Server is the system of record. The platform uses shared environment
      databases plus many tenant-specific production databases such as HelpDesk,
      HelpDeskTranslations, HelpDeskSandbox, HelpDeskBeta, GH-SofaKingSD, and
      GH-Validation. HelpDesk production releases currently target shared Brannock
      AG listeners AWSBRSPRDLIST1, 2, 3, 4, and 6 on port 60173. The underlying
      platform documents asynchronous secondary instances in us-east-2a.
      HelpDesk has no defined RPO or RTO at this time; backup policy and restore
      testing remain unconfirmed.
    deployableObjects:
      - ref: 01KQQ5JT01-Z39K
        diagramTier: application
        networkZone: data
        notes: |
          Multi-tenant data tier with tenant isolation primarily enforced through
          separate SQL Server databases on shared Always On availability-group
          listener families. A listener or AG failure can affect multiple tenants.
  - name: Runtime Security and Observability
    deploymentTarget: aws-us-east-1
    notes: |
      Signal Sciences WAF is part of the ECS and NGINX runtime protection path.
      Application Insights and CloudWatch are the active observability systems.
      Dynatrace is intentionally not modeled as an active dependency because the
      current setup is not working.
    deployableObjects:
      - ref: 01KQQ5JT1D-TK06
        diagramTier: application
        networkZone: ops
        notes: Signal Sciences protection integrated into the ECS and NGINX request path.

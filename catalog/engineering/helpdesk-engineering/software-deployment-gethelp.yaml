name: Help Desk - Pattern
aliases:
  - GetHelp (HelpDesk)
  - HelpDesk / GetHelp
description: |
  Current-state software deployment pattern for the HelpDesk / GetHelp
  multi-tenant support platform. The platform is built from three Angular
  single-page applications (HHD_Login, HHD_UI, HHD_UP), a .NET API backend
  (HHD_API), tenant-isolated SQL Server databases, AWS Lambda background
  processing, and S3-hosted environment configuration deployed into
  environment-specific AWS ECS clusters.
version: 1.12.1
catalogStatus: incomplete
lifecycleStatus: existing-only
businessContext:
  pillar: business-pillar.business-solutions
  ownerNode: team.brannock-asset-management-engineering
  productFamily: HelpDesk / GetHelp
  notes: |
    Current-state evidence comes from the Help Desk Infrastructure & Deployment
    Architecture page (updated July 22, 2026), the Brannock HelpDesk GitHub Actions
    CI/CD overview (updated July 16, 2026), and the shared Brannock Data AWS
    Connectivity inventory (updated July 1, 2026). Supporting evidence includes
    the non-customer environment matrix, the July 2026 production tenant
    inventory, four project/component overviews, the Jenkins customer
    installation procedure, current release recaps and smoke plans, performance
    and rollback results, the Asset Management staff/customer sync description,
    the Sofa King Central onboarding procedure, the customer-export SQL process,
    the August 4 version 14 HelpDesk accountability Q&A, and the August 6
    version 11 Brannock KPF table. The latest answers reconcile the six production
    Lambdas, document component and service ownership boundaries, clarify
    BETA/VALIDATION core-flow evidence, and preserve only the remaining
    dependency-registration, ingress-ownership, parity-approval, and validation
    gaps.

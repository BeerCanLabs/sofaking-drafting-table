architectureNotes:
  technologyStack: Angular SPA frontends, .NET Web API backend, SQL Server persistence, AWS Lambda, and S3-hosted runtime configuration.
  deploymentModel: Coordinated AWS ECS release across HHD_Login, HHD_UI, HHD_UP, HHD_API, SQL release scripts, Lambda artifacts, and S3 configuration.
  tenantIsolationModel: Shared application runtime with tenant isolation primarily enforced at the SQL Server database layer.
  securityModel: Signal Sciences WAF in the ECS and NGINX path, tenant-specific authentication flows, and backend authorization enforcement.
  observabilityModel: Application Insights and CloudWatch are the active observability systems; Dynatrace is currently excluded from the active architecture.
  runtimeRequirement: Current-state runtime spans shared ECS workloads, Lambda background execution, and externalized environment configuration.

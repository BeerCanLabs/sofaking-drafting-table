name: GetHelp (HelpDesk) Platform
description: |
  Multi-tenant help desk platform composed of three Angular SPAs
  (HHD_Login, HHD_UI, HHD_UP), the HHD_API .NET backend, tenant-isolated SQL
  Server databases, AWS Lambda background processing, and S3-hosted environment
  configuration in AWS ECS-hosted environments.

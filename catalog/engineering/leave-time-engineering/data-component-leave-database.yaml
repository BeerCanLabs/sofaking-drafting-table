  reportingAuditFlows:
    - name: KES Snowflake Data Warehouse Audit
      status: work-in-progress-documentation
      purpose: Compare Snowflake data warehouse data with production Rota database data.
      sourceListener: PRDLVADBCN3.rotaprod.example
      sourcePort: 5659
      auditServer: GRRDWAUDIT01.rotaprod.example
      schedule: 'Saturday at 12:01 AM'
      averageRuntime: 1.5 hours
      movementPath: Production Rota read-only AG listener to audit server, then S3, then Snowflake comparison queries.
      s3Bucket: Snowflake-databucket/ABS_DF
      monitoring: Nagios Task Scheduler monitor alerts through OpsGenie.
  serviceAuthentication: Applications use both Windows-integrated authentication and SQL authentication. Human administrators use separate privileged AD accounts; access is granted through AD ACL groups mapped to environment- and responsibility-specific database roles.
  accessGovernance:
    owner: DBRE team
    scopeModel: Human database access is scoped by application, environment, and role.
    productionApproval: Production access requires manager approval.
    validation: Automated daily checks verify that ACL members remain active in AD and report discrepancies to the Data team.
  secretsManagement: SQL-authenticated application credentials originate in Secret Server and are also stored as Octopus variables for application connectivity and deployments. No password rotation policy currently exists, and these passwords are not routinely rotated.
  serviceLogging: Logging approach was not confirmed by repository tree discovery; assume central logging is required until confirmed.
  healthWelfareMonitoring:
    sqlPerformance: SolarWinds DPA monitors SQL Server performance indicators.
    hostResources: Host-level monitors cover CPU, disk, and related resources.
    databaseHealth: Custom SQL query-based Nagios checks cover blocking, availability-group health, tempdb capacity, tempdb contention, and other database conditions.
    incidentRouting: Nagios alerts route through OpsGenie and Jira Service Management.
    historicalBlocking: A DBRE-developed Block Monitor captures and retains blocking data on each SQL instance for retrospective analysis.
    runbooks: DBRE maintains runbook documentation for triaging tempdb capacity and contention alerts.
  availabilityModel: Production and DR use SQL Server AlwaysOn Availability Groups with documented listeners; Stage also uses paired AGs.
  capacityModel:
    combinedDataAndLogTb: 11.5
    rotaDataAndLogTb: 10.8
    averageCompressedBackupTb: 2.5
    tempdbDataAndLogGb: 272
    tempdbStorage: Separate dedicated drive.
  scalabilityModel: The production estate has no known sustained CPU, memory, or storage constraint. Short-lived tempdb contention can occur during peak store-year workload periods and is monitored through Nagios.
  maintenanceModel:
    rotaDatabase: Weekly DBCC integrity checks, index maintenance, and statistics maintenance; selected highly utilized tables receive daily statistics maintenance.
    supportingDatabases: Daily integrity, index, and statistics maintenance.
    tooling: Rota index maintenance uses the internally developed Process Defrag utility. Other integrity, index, statistics, backup, and cleanup processes use the Ola Hallengren maintenance solution.
    capacityManagement: DBRE-managed automated processes report database space consumption and related capacity indicators.
    owner: DBRE team
  recoverabilityModel:
    publishedRpo: 5m/15m; the meaning of each value has not been independently confirmed. Production transaction-log backups run every five minutes.
    publishedRto: Four hours; technically considered achievable but not demonstrated through a recent production-scale exercise.
    backupCadence: Weekly full backups, daily differential backups, and transaction-log backups every five minutes.
    backupProtection: Backups are encrypted with LVE-875, written first to a local file share, and copied through CloudBerry/MSP Backup to an immutable AWS S3 bucket.
    backupRetention: Governed by the Sofa King Disaster Recovery (DR) and Data Retention source-of-truth document.
    validation: Transaction-log backups are exercised daily through AWS DR log shipping. Full and differential backups are tested when DR log shipping must be reseeded.
    exerciseHistory: No production-scale restore or DR exercise has occurred in at least several years.
    observedRecoveryDuration: Approximately 14 hours for the most recently recalled end-to-end database recovery, including downloading the latest full, differential, and transaction-log backups to both DR servers, restoring each server independently, and joining the databases to preconfigured availability groups.
  dependencyModel: The Rota database is a critical shared dependency of the core Leave Management and Time & Attendance applications. A complete upstream and downstream dependency map requires SRE and Engineering validation.
  recentImprovements: Application and database changes during the past year, including a SQL Server hardware and DBMS version upgrade in July 2025, materially improved system stability and performance.
  knownOperationalRisks:
    - The published four-hour RTO has not been validated recently; the most recently recalled end-to-end database recovery took approximately 14 hours.
    - SQL-authenticated application credentials have no defined password rotation policy and are not routinely rotated.
    - Historical incidents show that severe database blocking or unhealthy Web/API server state can require IIS or application-server restarts to restore service health; SRE/DevOps runbook coverage has not been confirmed.
  failureDomain: Failure of the shared multi-tenant Rota database can affect multiple customers and both core Leave Management and Time & Attendance applications.


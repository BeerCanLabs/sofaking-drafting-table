  eksSecretsManagement: Production EKS workloads are provisionally believed to use a combination of AWS Secrets Manager and Kubernetes Secrets. Where pods access Secrets Manager, they use IAM roles associated with their Kubernetes service accounts rather than stored AWS access keys (owner-confirmed 2026-08-05). Workload-level assignments, classic IRSA versus EKS Pod Identity, synchronization, and rotation behavior remain unconfirmed.
  productionHostInventory: >-
    Grand Rapids production web applications and .NET services run on VMware.
    Microsoft IIS hosts only the web applications; it does not host the separate
    .NET services. Those .NET services run as Windows Services on the
    VMware-hosted Windows servers. Each server assigned to a function runs one
    instance of that function's Windows Service; functions may be deployed to
    different numbers of servers. When multiple servers support the same
    function, all Windows Service instances run actively at the same time.
    IIS web applications run concurrently across multiple Grand Rapids web
    servers in active-active pools behind the F5.
    GRRLVEAG*, GRRLVEMC*, GRRLVEBOTWEB*, GRRLVEAPIWEB*, GRRLVENAVWEB*,
    GRRLVEWS*, GRRLVEEAN*, GRRLVEPIC*, GRRLVERA1, GRRLVEDL1, GRRJAMS1, and
    GRRJAMS2 run Windows Server 2012. GRRLVEEVP*, GRRLVEMHAPI1-5,
    GRRLVEMBAPI1-9, GRRLVELEGEA1, GRRLVEPLATEA1,
    GRRLVELWEA1, GRRLVERWEA1, GRRIDMEA1, GRRLVEUTIL1, and GRRMAIL1-6 run
    Windows Server 2016. GRRCONWEB1-3, GRRSUBIT1, and GRRFTP1 remain active on Windows Server
    2008 R2. The Windows Server 2003 Fulfillment Engine estate also remains
    active pending the JAG 2.0 production rollout tracked by WFMAT-57071, for
    which the ETA is still TBD. SQL node names are intentionally not required
    at this conceptual pattern level; the confirmed boundary is a multi-server
    Windows Server 2022 physical failover cluster using SQL Server 2022 Always
    On availability groups and listeners, with every replica in Grand Rapids.
    Additional active Grand Rapids workloads are Event Analyzer on GRRLVEEAN*,
    Prior Image Cache on GRRLVEPIC*, Report Agent on GRRLVERA1, and Data
    Importer on GRRLVEDL1; all four run as .NET Windows Services. Nagios
    monitors both host health and Windows-service health for all four. None of
    GRRLVEEAN*, GRRLVEPIC*, GRRLVERA1, or GRRLVEDL1 is protected by Veeam VM
    backups; this is an unplanned recoverability gap with no remediation
    ticket. JAMS is a
    third-party JAMS Scheduler 6.3.26.0 deployment with GRRJAMS1 normally active
    and automatic failover to standby GRRJAMS2. Nagios monitors both host health
    and the JAMS Scheduler service on both nodes, routing those alerts to the
    CloudOps-HCM Opsgenie team. Only GRRJAMS1 is protected by Veeam; the lack
    of Veeam coverage for standby GRRJAMS2 is an unplanned recoverability gap
    with no remediation ticket.
    All listed servers run Windows Server 2012.
    Both JAMS nodes use the JAMS scheduling database on the shared Grand Rapids
    SQL Server 2022 platform; this is distinct from the Rota database.
    The JAMS deployment is a shared platform serving Leave and PG\PLM-EEM,
    owned and operated by the approved CloudOps Support team. Component
    repositories or COTS ownership evidence and remaining
    instance-specific deployment details remain unresolved. Support status is
    not inferred from the installed version alone.
    GRRMAIL1-3 and GRRMAIL6 form the MDaemon high-priority pool, while
    GRRMAIL4-5 form the low-priority pool. All six mail servers run Windows
    Server 2016 behind F5 and run MDaemon 19.5.2. CloudOps Support owns and
    operates the shared platform. No active plan or ticket exists to upgrade
    MDaemon 19.5.2; vendor-support status remains unverified and is not inferred
    from the installed version alone. Administrators RDP to the GRRMAIL servers
    using AD admin accounts, with access granted through an AD CloudOps group;
    MDaemon opens without an additional application login after Windows
    authentication.
  mdaemonOperationalProfile: >-
    The Grand Rapids MDaemon platform is shared by Leave & Time, Platform,
    and IDM. GRRMAIL1, GRRMAIL2, GRRMAIL3, and GRRMAIL6 form the high-priority
    F5 pool; GRRMAIL4 and GRRMAIL5 form the low-priority pool. F5 automatically
    removes a failed member and routes new traffic to the remaining servers.
    Each server stores its mail queue locally, so messages already queued on a
    failed node remain unavailable until that node is restored. All six servers
    are currently protected by Veeam VM backups, correcting the earlier
    no-backup finding; OPS-961456 is complete. Veeam runs incremental backups
    Sunday through Friday and a full backup Saturday, retaining 13 restore
    points. It restores the whole
    server, including MDaemon configuration and its local queue, with no post-restore
    configuration required, but no GRRMAIL Veeam restore has been tested. There
    is no documented recovery-time objective for restoring a failed GRRMAIL
    server or its local queue. MDaemon application
    and mail-processing logs remain
    local to each server for three months and are not centrally forwarded.
    MDaemon configuration is not synchronized: Chef formerly synchronized the
    servers but no longer functions for this platform. No authoritative
    off-server configuration export and no separate configuration-remediation
    ticket or plan exist. There are no active tickets or plans to upgrade
    MDaemon 19.5.2 or Windows Server 2016; MDaemon vendor-support status remains
    unverified. Administrators authenticate to Windows over RDP with AD admin
    accounts authorized by an AD CloudOps group, then open MDaemon without
    another application login. The exact AD group name and whether MDaemon
    records administrator-attributed configuration changes are unknown. Nagios
    monitors MDaemon service health and queue depth and routes alerts to the
    CloudOps-HCM Opsgenie team. Rota Legacy, Letter Writer, Report Writer, and
    static-filename report SMTP delivery use GRRMAILLOW; Rota Platform Email
    Agent uses GRRMAILHIGH. GRRMAIL delivers outbound messages directly to
    recipient mail systems rather than through another SMTP relay; whether
    direct delivery uses opportunistic TLS is unknown. The
    raw-message SMB connections and direct SMTP delivery are unencrypted within Grand Rapids (source-reviewed and
    owner-confirmed through 2026-09-03).
  sharedStorageAndFileTransfer: >-
    GRRNAP1CLU1 is a shared, Cloud Engineering / Infrastructure-owned,
    two-node NetApp FAS2720 cluster with multiple Storage VMs. GRRFILES1 is the
    Leave-only Storage VM, is accessed exclusively through SMB, and is not
    used by Time & Attendance. GRRFTP1 is a separate, single-server file-transfer
    boundary that hosts its own shares, runs Globalscape EFT Server 6.5.0.40 on
    Windows Server 2008 R2, and supports FTP, FTPS, and SFTP over SSH. GRRFTP1
    accounts are managed locally in Globalscape and authenticate with username
    and password or SSH public keys. Authentication and transfer logs are stored
    locally and transferred to Amazon S3. GRRFTP1 has no standby but can be
    restored from a VM backup; recovery objectives and restore-test evidence
    remain unconfirmed.
  monitoringAndAlerting: >-
    Monitoring responsibility is split. Nagios monitors Grand Rapids Leave
    server availability and resource health, Windows services and processes,
    IIS websites and application pools, and basic endpoint availability.
    Direct host and Windows Service process checks are confirmed for Leave
    Event Processor, Email Agent, JAG, and MOS Job Checker. SKIntegrationService
    remains the confirmed exception with host-only Nagios coverage. Nagios also
    monitors MDaemon service health and mail queue depth across GRRMAIL1-6;
    those alerts route to the CloudOps-HCM Opsgenie team.
    MDaemon application and mail-processing logs are stored only on each
    GRRMAIL server for three months and are not centrally forwarded; logs on
    a failed server are unavailable with that server.
    Dynatrace monitors application performance, transaction traces, and
    application errors across Grand Rapids and both production EKS clusters,
    and is confirmed to monitor EKS cluster, node, and pod health. Additional
    EKS monitoring through CloudWatch or another platform is unconfirmed.
    Both monitoring platforms send Leave operational alerts to the CloudOps-HCM
    Opsgenie team for the confirmed Grand Rapids path. Dynatrace multi-service
    problem alerts mentioning leave-prod and chaise have also been observed
    routing to CloudOps-HCM, but individual EKS workload alert routing is not
    confirmed. PRTG monitors the supporting GRRNAP1CLU1 cluster and GRRFILES1
    Storage VM and sends operational alerts through both Opsgenie and email.
    Application and container logs from production EKS workloads are collected
    through the Central Logging Service in AWS OpenSearch. leave-prod and
    chaise use separate OpenSearch domains hosted in their corresponding AWS
    accounts; the exact forwarding configuration, domain names, and endpoints
    remain unconfirmed.
    GRRLVEUTIL1 is an explicit exception to the general Nagios Windows-service
    coverage: Nagios monitors its host health but does not directly monitor
    SKIntegrationService. Alert priorities, detailed escalation rules, and the
    PRTG email-relay path remain unconfirmed.
    Production Terraform configures CloudWatch log groups for all four confirmed
    Leave Lambda functions. The reviewed Terraform contains no CloudWatch alarm
    or Dynatrace instrumentation evidence, so Lambda health monitoring and alert
    routing remain unconfirmed rather than inferred from logging alone.
  operationalCoverage: >-
    CloudOps Support is the primary operational responder for production
    Leave EKS workload incidents. CloudOps-HCM is the distinct Opsgenie team
    used for the confirmed alert-routing paths and should not be treated as the
    owning DRAFT team. When CloudOps Support determines that an incident is
    caused by application code, it escalates remediation to Leave & Time
    Engineering while retaining overall incident coordination until resolution.
    Leave & Time Engineering is reached through the AT_Dev_team Opsgenie team
    and its AT_Office_Out_schedule for after-hours application-code incidents.
    AT_Office_In_schedule provides the corresponding office-hours coverage; the
    schedule windows can change with team demands, and Opsgenie remains the
    authoritative source for their current configured hours. CloudOps Support
    has no blanket authority for application-impacting restart or redeployment
    decisions; authority depends on incident context, and most application
    decisions may require feedback from Leave & Time Engineering. CloudOps
    Support may independently restart a pod when an approved operational
    runbook explicitly authorizes that action; current workload-level runbook
    coverage remains unconfirmed. Leave & Time Engineering owns the
    application code for all active production abs-* and at-* EKS workloads;
    it also owns rota-frontend-reactjs and rota-frontend-reactjs-ml, covering
    the complete confirmed active production Leave EKS workload inventory.
    CloudOps-HCM alerts automatically route through
    CloudOps_HCM_Office_In_Schedule or CloudOps_HCM_Office_Out_Schedule. During
    daylight time, weekday Office-In coverage is 12:00 AM-6:00 PM EDT and
    Office-Out coverage is 6:00 PM-29:00 AM EDT. During standard time,
    Office-In is 11:00 PM-6:00 PM EST and Office-Out is 6:00 PM-15:00 PM EST.
    Office-Out provides continuous weekend coverage from Friday 6:00 PM through
    Monday 12:00 AM. Start times can vary with offshore staffing.

architectureNotes:
  interServiceConnections: >-
    Modeled relationships capture F5 BIG-IP ingress to the Grand Rapids Leave web/API tier, the Grand Rapids web/API tier to shared storage and GRRFTP1, GRRFTP1 to Amazon S3, and the active GRRFTP1-to-Sofa King Central file exchange. The F5 distributes traffic across active IIS servers and uses URL health checks for pool-member health. Session persistence is application-specific: the GRRLVENAVWEB* and GRRLVEWS* F5 pools both host Leave Web MVC and use cookie-based persistence; GRRLVEWS* does not host Leave Web API. The GRRLVEAPIWEB* and GRRLVEMBAPI* Leave Web API pools, the GRRLVEMHAPI* Leave IVR Menu Handler API pool, and the GRRLVEBOTWEB* Leave Job API pool do not use session persistence, so requests may move between active pool members. Persistence is not inferred for other IIS pools. Each production EKS cluster has an internet-facing and an internal AWS Application Load Balancer, for four distinct ALB deployment instances across the two clusters; the ALBs terminate client TLS. rota-frontend-reactjs and rota-frontend-reactjs-ml are explicitly exposed through the chaise internet-facing ALB. HTTP is the contributor's provisional best guess for the backend ALB-to-EKS protocol but is not confirmed; listener counts and routing for the remaining workloads remain unconfirmed. Workloads in leave-prod do not communicate directly with workloads in chaise. Whether any EKS workload accesses GRRFTP1 or GRRFILES1 is unknown, so no AWS-to-Grand Rapids file-service relationship is inferred. Same-tier connections within each cluster and the remaining repository-discovered service graph have not been reviewed.
  patternType: repository-discovered core services; Grand Rapids compute, runtime, database, and shared-storage boundaries confirmed by owner interview on 2026-07-29 (OPS-049026).
  noApplicablePattern: Reference Architecture conformance has not been confirmed by owner interview.
  deploymentTargets: Hosted across Grand Rapids and AWS. Grand Rapids web and API tiers run on Sofa King-owned VMware infrastructure. SQL Server 2022 runs on dedicated physical Windows Server 2022 hosts in a Grand Rapids-only failover cluster with Always On availability groups, shared with Time & Attendance (owner-confirmed 2026-07-29). Production EKS workloads run in AWS us-east-1 rather than Grand Rapids. Five active workloads run in the leave-prod cluster in the Team_Leave_Prod account (829641239427); all other active EKS workloads run in the chaise cluster in the Production Microservices account (736016846305). Four production Leave AWS Lambda functions also run in the Production Microservices account, two on .NET 6 and two on .NET 8 (console evidence supplied 2026-08-05).
  availabilityRequirement: High availability within Grand Rapids; must remain operational through a single server or infrastructure-node failure (owner-confirmed 2026-07-29). IIS web applications run active-active across multiple web servers behind the F5, which uses URL health checks to remove unhealthy application instances from rotation. The MDaemon high- and low-priority pools use the same failure-handling model; F5 automatically removes a failed GRRMAIL member and routes new traffic to remaining members. Messages already in the failed member's local queue remain unavailable until that server is restored. Each Grand Rapids .NET service server runs one Windows Service instance, while the number of servers varies by function. Where a function has multiple servers, all service instances run active-active rather than using a passive standby; per-function server counts remain to be verified. JAMS is an exception to that active-active service model; GRRJAMS1 is normally active and automatically fails over to standby GRRJAMS2. Production EKS workloads in both leave-prod and chaise are distributed across multiple AWS Availability Zones in us-east-1 and run with multiple pod replicas (owner-confirmed 2026-08-05); exact replica counts remain unconfirmed.
  externalDependencies: Shared F5 BIG-IP ingress fronts all Grand Rapids web/API endpoints. Shared GRRNAP1CLU1 NetApp cluster provides file storage via the Leave-only GRRFILES1 Storage VM. GRRFTP1 managed file-transfer service supports FTP, FTPS, and SFTP, and forwards logs to Amazon S3. The shared Grand Rapids MDaemon mail platform serves Leave & Time, Platform, and IDM through high- and low-priority F5 pools and supports SMTP plus raw-file queues used by email agents. Rota Legacy and New Rota Letter Writer and Report Writer delivery use GRRMAILLOW; Rota Platform Email Agent uses GRRMAILHIGH. Static-filename Rota reports bypass the Email Queue and Email Agent and send directly over SMTP to GRRMAILLOW. JAMS Scheduler 6.3.26.0 on GRRJAMS1/GRRJAMS2 is shared with PG\PLM-EEM and stores scheduling state in the JAMS database on the shared Grand Rapids SQL Server 2022 platform. The active Sofa King Central dependency is implemented by the running SKIntegrationService Windows service on the Windows Server 2016 VMware VM GRRLVEUTIL1 under service account SVC_AES_PRD_UTIL_SCH; it watches Sofa King Central export folders on GRRFTP1 and writes transformed files to Leave ToRota folders (owner-confirmed through 2026-08-13).
  dataClassification: Restricted. Leave Management uses the shared, multi-tenant Rota database, which contains personally identifiable information (owner-confirmed 2026-07-29).
  failureDomain: Grand Rapids data center for the legacy application and database boundary. The shared Rota database, shared GRRNAP1CLU1 NetApp cluster, shared F5 BIG-IP ingress, JAMS scheduler shared with PG\PLM-EEM, single-instance GRRFTP1 file-transfer service, and single GRRLVEUTIL1 VM running SKIntegrationService with no standby are additional shared or single-server exposures within that domain. MDaemon continues accepting new traffic after a single GRRMAIL failure through F5 pool-member removal, but each server stores its mail queue locally; messages already queued on a failed server remain unavailable until that server is restored. JAMS reduces scheduler-node exposure through automatic failover from GRRJAMS1 to standby GRRJAMS2, but its JAMS database remains on the shared Grand Rapids SQL platform and only the normally active GRRJAMS1 VM is protected by Veeam; standby GRRJAMS2 is not backed up (owner-confirmed through 2026-09-03). AWS EKS workloads in both production clusters span multiple Availability Zones in us-east-1; zone count and identities are intentionally not inferred (owner-confirmed 2026-08-05).
  patternDeviations: F5 BIG-IP terminates client TLS and forwards unencrypted HTTP to Grand Rapids backend servers; plain HTTP is a proposed non-standard connectionProtocols value pending vocabulary review. Leave Email Agent raw-message SMB traffic and direct report SMTP traffic to GRRMAILLOW and GRRMAILHIGH are also unencrypted within Grand Rapids. GRRLVEAG*, GRRLVEMC*, GRRLVEBOTWEB*, GRRLVEAPIWEB*, GRRLVENAVWEB*, GRRLVEWS*, GRRLVEEAN*, GRRLVEPIC*, GRRLVERA1, GRRLVEDL1, GRRJAMS1, and GRRJAMS2 remain active on end-of-support Windows Server 2012 with no active upgrade or retirement plan and no approved risk acceptance. GRRFTP1 runs Globalscape EFT Server 6.5.0.40 on a single Windows Server 2008 R2 host with no active retirement plan. GRRCONWEB1-3 and GRRSUBIT1 remain active on Windows Server 2008 R2 with no active retirement or upgrade plan and no identified risk acceptance. The Windows Server 2003 Fulfillment Engine estate remains active pending the JAG 2.0 replacement, which has no committed delivery date. GRRLVEUTIL1 runs the deprecated Windows Server 2016 VM host standard with no active upgrade or retirement plan. GRRMAIL1-6 no longer have synchronized configuration because their former Chef automation is not functioning, creating configuration-drift and rebuild risks. SKIntegrationService is a single-instance file-transformation service without a Nagios Windows-service check or automatic restart after process failure, and no remediation plan or ticket exists. Two production AWS Lambda functions, use1-lambda-prd-abs-ivr-tts-processor and use1-lambda-prd-abs-func-add-new-sub-to-default-pref-list, run on end-of-support Microsoft .NET 6; remediation or exception evidence remains unconfirmed (owner and console evidence through 2026-09-03).
  legacyRisks: Active, unremediated end-of-support production systems — GRRLVEAG*, GRRLVEMC*, GRRLVEBOTWEB*, GRRLVEAPIWEB*, GRRLVENAVWEB*, GRRLVEWS*, GRRLVEEAN*, GRRLVEPIC*, GRRLVERA1, GRRLVEDL1, GRRJAMS1, and GRRJAMS2 on Windows Server 2012; GRRCONWEB1, GRRCONWEB2, GRRCONWEB3, GRRSUBIT1, and GRRFTP1 on Windows Server 2008 R2; and the Windows Server 2003 Fulfillment Engine estate pending JAG 2.0 (WFMAT-57071, no committed ETA). GRRLVEUTIL1 and GRRMAIL1-6 use the deprecated Windows Server 2016 VM host standard; GRRMAIL1-6 have no active operating-system upgrade plan or ticket. GRRMAIL1-6 are protected by Veeam VM backups, correcting the earlier finding; OPS-961456 is complete, but no GRRMAIL restore test has been performed. Their former Chef synchronization is inactive, no separate authoritative off-server configuration export exists, and no ticket or plan addresses active configuration synchronization or export. No approved risk acceptance or exception has been identified for the end-of-support estate; lifecycle and recovery disposition remain open governance items.
  deploymentQualities: Availability and failure-domain boundaries are confirmed for the Grand Rapids production runtime (see availabilityRequirement, failureDomain). JAMS provides automatic scheduler-node failover from normally active GRRJAMS1 to standby GRRJAMS2 and stores scheduling state in its database on the shared Grand Rapids SQL Server 2022 platform; failover-test evidence remains unconfirmed. Only GRRJAMS1 is protected by Veeam, leaving standby GRRJAMS2 without VM-backup coverage. Event Analyzer on GRRLVEEAN*, Prior Image Cache on GRRLVEPIC*, Report Agent on GRRLVERA1, and Data Importer on GRRLVEDL1 also lack Veeam VM-backup coverage. Leave MOS Job Checker on GRRLVEMC* is protected by Veeam, while Leave Event Processor on GRRLVEEVP* and Leave JAG on GRRLVEAG* are not. None of the five Leave Email Agent servers—GRRLVELEGEA1, GRRLVEPLATEA1, GRRLVELWEA1, GRRLVERWEA1, and GRRIDMEA1—is protected by Veeam. GRRSUBIT1 is protected by Veeam, while GRRCONWEB1, GRRCONWEB2, and GRRCONWEB3 are not; the missing GRRCONWEB coverage is an unplanned recoverability gap with no remediation ticket. VM-backup coverage for the Windows Server 2003 Fulfillment Engine estate remains unknown; GRRLVEUTIL1 is confirmed recoverable from a VM backup but its backup product remains unconfirmed, while GRRFTP1 and GRRMAIL1-6 are confirmed protected by Veeam VM backups. The AWS EKS workloads are distributed across multiple Availability Zones and run with multiple pod replicas. Pod autoscaling is workload-specific and depends on hpa.yaml availability; exact replica counts and the active production HPA map remain unconfirmed. EKS workload recovery is provisionally believed to use redeployment from source-controlled configuration and deployment pipelines, but the runbook and recovery-test evidence are unconfirmed. GRRLVEUTIL1 is recoverable from VM backup, but its recovery objective and restore-test evidence remain unconfirmed. SKIntegrationService starts automatically when the VM boots but is not configured to restart after an isolated service crash. Nagios monitors GRRLVEUTIL1 host health but not the SKIntegrationService Windows service, leaving application-level failure detection incomplete. A conjectured reactive process has Sofa King users notice a missing transformation and then inspect the service over RDP; this is not verified monitoring evidence. SKIntegrationService processing and error-log destinations are unknown. Scalability and recoverability details for the shared NetApp platform and GRRFTP1 remain open follow-ups.
  awsRuntimeBoundary: >-
    ProductComponents with production Kubernetes evidence are grouped under the
    Amazon EKS Standard Container Host and run in AWS us-east-1, not on
    Grand Rapids VMware. Production deployment manifests and Terraform establish
    the region. The product owner confirmed on 2026-08-04 that all at-api-* and
    at-svc-* EKS workloads belong exclusively to Leave, not Time & Attendance.
    The workloads run across two separate production EKS clusters
    (owner-confirmed 2026-08-04). The leave-prod cluster is in the
    Team_Leave_Prod account (829641239427) and actively runs
    abs-api-availability, abs-api-moschecker, abs-svc-availability-loader,
    abs-svc-availability-processor, and abs-svc-moschecker-processor. All other
    active workloads run in the chaise cluster in the Production Microservices
    account (736016846305). An abs-api-availability deployment
    also exists in the Production Microservices cluster but has no running pods.
    Production workloads in both clusters are distributed across multiple
    Availability Zones in us-east-1 and run with multiple pod replicas; zone
    identities and exact replica counts are not modeled. Horizontal Pod
    Autoscaling is workload-specific and depends on hpa.yaml availability; the
    active production HPA map remains unverified.
    at-api-PlatformSyncPublic, at-api-performance, and
    at-svc-leaveeventpublishing remain outside this group because the product
    owner confirmed they are not running in production.
    AWS Lambda is a separate confirmed production runtime in the Production
    Microservices account. Four functions were observed: use1-lambda-prd-abs-ivr-tts-processor
    (.NET 6), use1-lambda-prd-abs-partner-billing-processor (.NET 8),
    use1-lambda-prd-abs-func-add-new-sub-to-default-pref-list (.NET 6), and
    use1-lambda-prd-abs-mpn-syncuserregistrationstatus (.NET 8). The IVR TTS
    four functions are implemented in BeerCanLabs/sk-abs-lambdafunctions
    and provisioned by production Terraform in
    BeerCanLabs/sk-abs-infrastructure (authenticated GitHub evidence,
    2026-08-05). Leave & Time Engineering owns the application code for all
    four confirmed production functions. A fifth repository project,
    abs-func-jag-purge-processor, is not observed in the current production AWS
    Lambda inventory and remains outside the active production map unless later
    deployment evidence establishes it.
    Production Terraform confirms SQS event-source mappings for IVR TTS and
    add-new-sub, an SNS subscription plus SQS dead-letter queues for MPN sync,
    and two enabled monthly EventBridge Scheduler invocations for partner
    billing. The IVR TTS function also uses the production IVR organization-files
    S3 bucket. Partner-billing source configuration names an RotaBilling
    database hosted on the same shared Grand Rapids SQL Server 2022 physical
    failover cluster as the main Rota database. This creates a confirmed
    cross-boundary dependency from AWS Production Microservices to the
    Grand Rapids database failure domain; the RotaBilling endpoint and data
    classification are now partially resolved: it contains PII and is classified
    restricted. Its authoritative schema or migration repository remains
    unidentified, so a separate DataComponent is deferred to an Leave & Time
    Engineering or DBRE follow-up.
    IVR TTS, add-new-sub, and partner billing are attached to private VPC subnets
    in us-east-1a and us-east-1c. MPN sync has no VPC configuration in its
    production function Terraform. The classification of the partner-billing
    report S3 bucket remains unresolved.

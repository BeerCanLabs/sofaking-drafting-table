  partnerBillingDataEvidence: Source configuration names PartnerBillingDb and PartnerBillingDbReadOnly connections to an RotaBilling database. Owner confirmation on 2026-08-05 places RotaBilling on the same shared Grand Rapids SQL Server 2022 physical failover cluster as the main Rota database and confirms restricted classification with PII; the endpoint and authoritative schema repository remain unconfirmed.

unresolvedQuestions:
  - id: lambda-trigger-configuration
    question: What Lambda and SQS trigger settings are deployed?
    status: answered
    currentBestGuess: >-
      Batch size 10, no batching window, 30-second timeout, 512 MB memory,
      reserved concurrency 10, partial batch failures, 300-second visibility,
      four-day queue retention, five receives before redrive, and fourteen-day
      DLQ retention.
    relatedObjects:
      - ref: 01KX18GPWW-8CJS
      - ref: 01KQQ5JT05-0C4P
  - id: service-invocation-network-and-auth
    question: How does the Lambda reach and authenticate to the EKS API?
    status: answered
    currentBestGuess: >-
      The worker calls the environment API over HTTPS and supports an optional
      X-TierCalc-Queue-Key. Current enablement, secret delivery, and the
      production hostname mismatch are recorded as an open implementation risk.
    relatedObjects:
      - ref: 01KX18GPWW-8CJS
      - ref: 01KX18GPWW-93YA
      - ref: 01KYMPFAPR-YF1D
  - id: sns-sqs-policy-and-encryption
    question: What protects the SNS-to-SQS path?
    status: answered
    currentBestGuess: >-
      SQS-managed server-side encryption, denial of insecure transport, and a
      queue policy limited to configured SNS topic ARNs. IAM protects AWS
      service access.
    relatedObjects:
      - ref: 01KQQ5JT05-HTRA
      - ref: 01KQQ5JT05-0C4P
  - id: data-classification-confirmation
    question: What data classification applies to Tiers of Intensity payloads?
    status: answered
    currentBestGuess: >-
      Restricted FERPA-protected customer information and PII. The API is
      stateless; transient queue and logging retention are documented.
    relatedObjects:
      - ref: 01KYMPHRH4-9VP1

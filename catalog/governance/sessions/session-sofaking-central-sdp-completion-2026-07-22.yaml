    Five aggregate data-store relationships generated by this session were removed on
    2026-07-29 and are no longer listed in generatedObjects above: Sofa King Central
    Platform to MongoDB Atlas, AWS DynamoDB, Sofa King Central AWS Aurora PostgreSQL,
    SQL Server 2019 DBMS Service, and AWS Simple Queue Service. Source inspection
    replaced them with per-service persistence edges on the individual Sofa King
    Central components, making the aggregate edges redundant. The component itself was
    retained and renamed to Sofa King Central Estate, keeping uid 01KQQ5JT0K-TN7W and
    the former name as an alias, because it still carries the ingress, runtime, Okta
    and central-logging edges. This also resolves the sand-star-remainder-count
    question recorded below.

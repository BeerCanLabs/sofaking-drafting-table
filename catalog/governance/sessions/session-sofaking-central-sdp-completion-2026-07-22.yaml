unresolvedQuestions:
  - id: cross-team-notification-required
    question: >-
      26 ProductComponents previously owned by ottoman-platform-engineering
      (24) and identity-management-idm-engineering (2) were re-homed to
      sofaking-central-engineering at the Sofa King Central EM's direction,
      removing them from the Platform SDP and the Settee SDP. Have Ottoman
      Platform, IDM, and Architecture Review Board been notified?
    status: open
    currentBestGuess: Not yet notified — this happened in an authoring session, not a cross-team conversation.
    impact: >-
      CODEOWNERS will route the PR to sofaking-central-engineering based on
      new file paths, but the diff also shrinks two other teams' SDPs; those
      teams should see this before merge, not just via automated review routing.
    relatedObjects:
      - ref: 01KQQ5JT1J-DWT1
  - id: hearthstone-disposition-not-claimed
    question: >-
      The Production environment tier's complianceScope includes the active
      Sofa King HEARTHSTONE RequirementGroup (01KQQ5JT20-M5R2), but this SDP does not
      claim any requirementGroups. Should Sofa King Central claim and
      disposition HEARTHSTONE now?
    status: open
    currentBestGuess: Yes — this is a production, PII-handling, multi-tenant platform and should claim HEARTHSTONE.
    impact: RA completeness dimension will remain a gap until requirementGroups + requirementImplementations are added.
    relatedObjects:
      - ref: 01KQQ5JT1J-DWT1
  - id: presentation-application-connection-granularity
    question: >-
      The Presentation→Application and Application→Data connections were
      authored as coarse tier-boundary relationships (one representative pair
      per crossing/data-store) rather than exact per-service pairs. Should
      these be refined to specific UI-module-to-microservice mappings later?
    status: open
    currentBestGuess: Refine when someone with direct repository/architecture knowledge is available.
    impact: Topology diagrams will show aggregate crossings rather than precise per-service call graphs.
    notes: >-
      Formerly pointed at relationship 1C8VC0TVJP-QNTM (React Root Application
      → Platform), removed when the React Root Application product component
      was retired.
  - id: sand-star-remainder-count
    question: >-
      "Sofa King Central Platform" (01KQQ5JT0K-TN7W) is kept as a remainder
      placeholder for legacy sand-* services beyond the 24 now individually
      modeled, based on its own "30+ services" description. The exact
      remaining count and identity of those services is unconfirmed.
    status: open
    currentBestGuess: Roughly 6+ legacy sand-* services still un-modeled.
    impact: Catalog under-represents the true legacy surface area until decomposed further.
    relatedObjects:
      - ref: 01KQQ5JT0K-TN7W
  - id: postgresql-data-component-target-engine-mismatch
    question: >-
      "Sofa King Central Postgresql Database" (data component 01KQQ5JT0K-46AZ)
      had targetEngine set to mssql and ran on the generic PostgreSQL 17 DBMS
      Service. Should it instead target the confirmed Sofa King Central Aurora
      PostgreSQL service?
    status: answered
    reason: >-
      Confirmed during OPS-561258 follow-up: production uses Aurora PostgreSQL
      16.11 with username/password authentication, one writer, two readers,
      Multi-AZ deployment, and immutable AWS Backup copies in S3.
    currentBestGuess: >-
      Corrected to targetEngine postgresql and runsOn Sofa King Central AWS
      Aurora PostgreSQL (01KYAAZF97-HS3C).
    impact: >-
      Data classification and engine-specific requirement checks now resolve
      against the confirmed PostgreSQL engine and FC-specific service.
    relatedObjects:
      - ref: 01KQQ5JT0K-46AZ
      - ref: 01KYAAZF97-HS3C
  - id: uat-dev-tier-deployment-targets
    question: What are the deployment targets for the UAT and Dev environment tiers?
    status: open
    reason: Session scoped to Staging and Test only this round per user direction.
    currentBestGuess: Likely same AWS account/region pattern as Staging and Test; unconfirmed.
    impact: tierVariants block is incomplete for 2 of 5 declared environment tiers.
    relatedObjects:
      - ref: 01KQQ5JT1J-DWT1
assumptions:
  - id: umbrella-as-tier-representative-source
    statement: >-
      "Sofa King Central Platform" is used as the source/target for all coarse
      tier-boundary and external-dependency relationships, standing in for the
      undifferentiated application-tier service pool rather than any one
      specific microservice.
    rationale: >-
      Avoids falsely attributing a specific outbound call (e.g. to Okta or
      DynamoDB) to one named microservice when the actual caller is unconfirmed.
    relatedObjects:
      - ref: 01KQQ5JT0K-TN7W

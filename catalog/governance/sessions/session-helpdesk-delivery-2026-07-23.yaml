unresolvedQuestions:
  - id: api-control-evidence
    question: >-
      Is the HelpDesk endpoint inventory generated from the deployed OpenAPI or
      Swagger definition, and for each production endpoint family what public or
      internal exposure, authentication, authorization, tenant-isolation,
      sensitive-data, rate-limit, timeout, retry, idempotency, versioning,
      security-test, and KPF-monitoring controls apply?
    status: deferred
    reason: >-
      The endpoint page maps consumers and integrations but does not establish
      deployed-route currency or control effectiveness. Several routes carry
      tenant, user, ticket, staff/customer, attachment, permission, and reporting
      identifiers, and some GET routes appear to execute state-changing work.
    currentBestGuess: >-
      HHD_API applies shared JWT and tenant-aware authorization patterns, while
      service integrations use separately configured credentials; exact
      endpoint-level enforcement requires implementation and runtime evidence.
    impact: >-
      API boundaries and candidate KPFs are materially clearer, but authorization,
      tenant isolation, data protection, resilience, lifecycle, security testing,
      and monitoring remain incomplete for L1.
    relatedObjects: [{ref: 01KQQ5JT1J-BRF4}]

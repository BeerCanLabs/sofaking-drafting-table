unresolvedQuestions:
  - id: public-eks-api-posture
    question: Is public EKS API reachability from 0.0.0.0/0 intentional?
    status: answered
    reason: The owner confirmed the posture is intentional and that user authentication is controlled through AWS SSO.
    currentBestGuess: >-
      Record the current posture as accepted evidence while distinguishing AWS
      SSO authentication from public network reachability.
    impact: No architecture uncertainty remains for this L1 discovery.
  - id: network-policy-posture
    question: Is the leave of Kubernetes NetworkPolicy objects intentional?
    status: answered
    reason: The owner confirmed that the current segmentation model is intentional.
    currentBestGuess: Record zero observed NetworkPolicy objects as accepted current state.
    impact: No NetworkPolicy implementation is inferred by the catalog.
  - id: production-version-drift
    question: Should production EKS and Kong Mesh version drift be reconciled?
    status: answered
    reason: The owner confirmed that production drift should be reconciled.
    currentBestGuess: Preserve observed versions and track implementation outside this session.
    impact: Production remains on EKS 1.31 and Kong Mesh 1.8.0 until an approved rollout completes.
  - id: traefik-arrangement
    question: Is the observed Traefik Ingress and ALB arrangement intentional?
    status: answered
    reason: The owner confirmed the arrangement is intentional.
    currentBestGuess: Model Traefik as an existing network service while retaining incomplete object-level mapping evidence.
    impact: No topology not supported by read-only evidence is inferred.
  - id: development-test-dataplane-nlbs
    question: Are both development test data-plane NLBs necessary?
    status: answered
    reason: The owner confirmed both are necessary.
    currentBestGuess: Retain both as intentional current-state infrastructure.
    impact: No cleanup action is proposed by this session.
  - id: gateway-api-adoption
    question: Is Gateway API adoption planned for stage and production?
    status: answered
    reason: The owner confirmed adoption is planned.
    currentBestGuess: >-
      Preserve development's accepted kuma GatewayClass and the leave of
      Gateway API types in stage and production as current state.
    impact: Rollout remains an implementation obligation outside this session.

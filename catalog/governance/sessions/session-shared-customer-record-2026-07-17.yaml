sourceArtifacts:
  - name: ss-msvc-customer-profile repository
    type: repository
    location: https://github.com/BeerCanLabs/sk-ss-msvc-customer-profile
    notes: >-
      Implemented .NET 10 microservice. Crawled read-only on 2026-07-17: API
      (ASP.NET Core), EventPublisher and OrgPersonWorker Lambdas, DynamoDB
      single-table store with Streams → EventBridge Pipe → SNS → SQS fanout, and
      outbound dependencies on Loveseat, Ottoman OrgPerson, Sofa King IDM, and AWS
      Secrets Manager. Runtime substrate taken as AWS EKS from the repo CLAUDE.md.
      The OrgPersonWorker and OrgPerson provisioning were later removed (ADR-006,
      TBSPS-4319); see the 2026-10-20 recrawl entry.
  - name: ss-msvc-customer-membership repository
    type: repository
    location: https://github.com/BeerCanLabs/sk-ss-msvc-customer-membership
    notes: >-
      Recrawled read-only 2026-10-20. docs/architecture/membership-service-spec.md
      (Ready to build, 2026-09-29), CONTEXT.md, CDK stacks, and Terraform IRSA
      exist; the API controllers are not yet present. Modeled from the spec.
  - name: ss-msvc-calendar repository
    type: repository
    location: https://github.com/BeerCanLabs/sk-ss-msvc-calendar
    notes: >-
      Recrawled read-only 2026-10-20. Implemented: controllers for Calendar,
      Session, and PricingPeriod, CDK stacks, event publisher, spec, and security
      docs. Stage host academic-calendar-stage.ss.sofaking.example on le1.
      The repo CLAUDE.md "scaffold" line is stale.
  - name: ss-msvc-customer-profile repository (recrawl)
    type: repository
    location: https://github.com/BeerCanLabs/sk-ss-msvc-customer-profile
    notes: >-
      Recrawled 2026-10-20 for gap-fill: scopes, full route surface, and the
      inbound Loveseat identity-match callback, subscriptions endpoint, and SQS
      quarantine queue that the July model missed. Also found that ADR-006 removed
      the OrgPerson Worker and provisioning; the API now validates a caller-supplied
      orgPersonId through a read-only OrgPerson client (IDM auth), and the Event
      Publisher moved from IDM to Okta (TBSPS-9834).

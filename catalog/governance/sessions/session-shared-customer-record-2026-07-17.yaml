name: Shared Customer Record SDP Drafting Session
description: >-
  Drafting session that created the Shared Customer Record SoftwareDeploymentPattern
  and its components from an owner-authorized read-only crawl of the three
  Customer Services ss-msvc-* repositories on 2026-07-17. Resumed 2026-10-20 after
  the platform was rebranded from Customer Data Platform to Shared Customer Record
  (SSR): ss-msvc-calendar (Academic Calendar) is now modeled from its
  implementation and spec, ss-msvc-customer-membership from its Ready-to-build spec
  with implementation in progress, and the Customer Profile model was gap-filled.
  ss-msvc-course-catalog is deferred until its spec is complete.

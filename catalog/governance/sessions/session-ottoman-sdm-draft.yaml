  - ref: 01KSM38KFH-NYK5
- id: mesh-component-cataloging
  question: Should Kuma control planes and Envoy sidecars become reusable RBB or ABB objects?
  status: answered
  reason: Kong Mesh Service (01KYAXMZ7H-KJT2) now models Kuma control planes and injected Envoy data planes as reusable internal components.
  currentBestGuess: Reference the Kong Mesh network service from the Ottoman SDP and do not duplicate Kuma or Envoy as external interactions.
  impact: The Gateway & Service Mesh tier now satisfies lowest-responsible-level modeling for the service-mesh path.

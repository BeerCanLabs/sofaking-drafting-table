unresolvedQuestions:
- id: org-person-repo-consolidation
  question: >-
    The catalog carries three org-person-like ProductComponents:
    Ottoman OrgPerson Service (plat-svc-orgperson, 01KSM38KFX-9EQ8, still a
    stub with no confirmed runtime placement), Platform Msvc Org Person
    (msvc-org-person, 01KSM38KFH-NYK5, the actual observed EKS workload with
    a full architecture-notes profile), and Platform Msvc Orgperson
    (plat-msvc-orgperson, 01KSM38KFZ-HYKP, a distinct C#/.NET stub). The Dev
    team's repo list for this linking pass named only msvc-org-person. Which
    of the other two repos, if any, are still active?
  status: answered
  reason: >-
    A Ottoman developer confirmed 2026-08-04 that msvc-org-person is the
    only org-person service they know of; plat-svc-orgperson returns a 404 on
    GitHub (repository no longer exists) and plat-msvc-orgperson's last commit
    was 2019-01-28. Both are confirmed dead, independently verified via
    GitHub's commit history.
  currentBestGuess: >-
    Both plat-svc-orgperson (01KSM38KFX-9EQ8) and plat-msvc-orgperson
    (01KSM38KFZ-HYKP) are set lifecycleStatus retired. Removed
    01KSM38KFX-9EQ8 from the Ottoman SDP's Platform Core Services service
    group.
  impact: >-
    Passport Core, Sofa King Tools BFF, and Sofa King Admin BFF
    dependencyCorrection notes updated to reflect resolution — msvc-org-person
    is the sole confirmed dependency. One external relationship (the former
    Customer Profile OrgPerson Worker sync, owned by the Shared Customer Record
    team) targeted the now-retired 01KSM38KFX-9EQ8; it was later deleted along
    with the worker — see the customer-data-platform-orgperson-sync-target
    question below.
  relatedObjects:
  - ref: 01KSM38KFX-9EQ8
  - ref: 01KSM38KFH-NYK5
  - ref: 01KSM38KFZ-HYKP
- id: standalone-repo-staleness
  question: >-
    Platform BFF Sofa King Tools (01KSM38KFX-AF27, standalone plat-bff-sofaking-tools
    repo) and the earlier-noted standalone plat-ui-sofaking-tools repo both
    appear superseded by their equivalent apps inside plat-passport-monorepo
    (which carry the same production release tag observed on 2026-07-31).
    Are the standalone repos retired?
  status: answered
  reason: >-
    A Ottoman developer confirmed 2026-08-04 that plat-passport-monorepo is
    the only way this service deploys today. Independently verified via
    GitHub: both standalone repos' last commit is 2022-09-06, and
    plat-bff-sofaking-tools' final commit is itself titled "add note
    regarding decommissioning of repo."
  currentBestGuess: >-
    Platform BFF Sofa King Tools (01KSM38KFX-AF27) set lifecycleStatus
    retired. No separate catalog object exists for the standalone
    plat-ui-sofaking-tools repo — its supersession is recorded as a note on
    Platform UI Sofa King Tools (01KSM38KG0-P6RD).
  impact: Avoided carrying duplicate, stale ProductComponents for the same runtime behavior.
  relatedObjects:
  - ref: 01KSM38KFX-AF27
  - ref: 01KSM38KG0-P6RD
- id: customer-data-platform-orgperson-sync-target
  question: >-
    The former Customer Profile OrgPerson Worker sync relationship (owned by the
    Shared Customer Record team, formerly the Customer Data Platform team) targeted
    the now-retired legacy Ottoman OrgPerson Service (01KSM38KFX-9EQ8). Should
    that sync now target Platform Msvc Org Person (01KSM38KFH-NYK5) instead?
  status: answered
  reason: >-
    Surfaced as a side effect of retiring 01KSM38KFX-9EQ8 on 2026-08-04. Answered
    2026-10-20 by the Shared Customer Record team: the OrgPerson Worker and its
    sync were removed (ADR-006, TBSPS-4319), so the relationship was deleted. The
    Customer Profile API now validates a caller-supplied orgPersonId against
    msvc-org-person (01KSM38KFH-NYK5), read-only, with an IDM token.
  currentBestGuess: Resolved; no catalog relationship targets 01KSM38KFX-9EQ8 any longer.
  impact: None remaining. The new Customer Profile API to Platform Msvc Org Person relationship is owned by the Shared Customer Record team.
  relatedObjects:
  - ref: 01KSM38KFX-9EQ8
  - ref: 01KSM38KFH-NYK5
- id: ottoman-core-catalog-scope
  question: >-
    Plat Ottoman Core (plat-ottoman-core) is a local developer-environment
    orchestrator (Docker Compose + CLI) with no deployment of its own. Should
    it remain a governed ProductComponent, or should it be tracked only as
    developer-tooling documentation outside the SDP's deployable-object
    boundary?
  status: open
  reason: It was one of the six repos the Dev team asked to link, but it has no runtime placement to add to serviceGroups.
  currentBestGuess: Keep it stubbed in the catalog but excluded from Ottoman SDP serviceGroups until the engineering leader confirms intent.
  impact: Affects whether this component needs a runsOn/host resolution at all.
  relatedObjects:
  - ref: X5EM83VCQP-721F
- id: secrets-hygiene-contrast-security
  question: >-
    plat-svc-domain and plat-svc-invitation both have a plaintext Contrast
    Security API key and service key committed to source at
    contrast_security.yaml. Is this a live credential, and should it be
    rotated and removed from source control?
  status: open
  reason: Discovered during repository research; out of scope for the Draftsman to remediate directly.
  currentBestGuess: Flag for the engineering leader and security team; do not treat as resolved until confirmed rotated/removed.
  impact: Potential credential-exposure risk if the key is live.
  relatedObjects:
  - ref: 01KSM38KFW-WA83
  - ref: 01KSM38KFX-ETDW
- id: secrets-management-inconsistency
  question: >-
    Secrets are sourced three different ways across Ottoman first-party
    services: AWS Secrets Manager via ExternalSecrets Operator (Invitation
    Service, all five Passport monorepo apps), a plain Kubernetes Secret
    manifest populated at deploy time by Codefresh (Organization Service),
    and a Kubernetes Secret of unconfirmed upstream origin (Domain Service,
    Platform Msvc Org Person). Should the platform standardize on one
    mechanism?
  status: open
  reason: Discovered during repository research; a platform-wide standardization decision, not a per-component fix.
  currentBestGuess: No standardization proposed yet; raise with the engineering leader.
  impact: Affects secret-rotation consistency and audit posture across the platform.
  relatedObjects:
  - ref: 01KSM38KFW-WA83
  - ref: 01KSM38KFX-ETDW
  - ref: 01KSM38KFX-DQGA
  - ref: 01KSM38KFH-NYK5
- id: jira-tracking-non-standard-tech
  question: >-
    L1 architecture maturity requires every non-standard technology choice to
    have a Jira tracking item (target dates not required at L1). Four
    non-standard choices are documented in the catalog with no linked ticket:
    (1) Node.js 24 in active use platform-wide vs. the preferred Node.js 22
    baseline, (2) Kubernetes 1.31 on ottm-prod pending the approved N-1
    rolling upgrade, (3) the ConfigCat direct-call pattern bypassing the
    Platform Feature Flag Service (confirmed in Domain, Invitation,
    Organization, and OrgPerson Service), (4) Ottoman Load Test's upgrade
    path off EOL Node.js 14 (see product-component-ottoman-load-test.yaml
    architectureNotes.upgradePathUpdate — path itself is now also unconfirmed).
  status: open
  reason: >-
    A Ottoman developer confirmed 2026-08-04 that no ticket exists for
    items 1, 3, or 4, and none is known for item 2 (developer's guess: owned
    jointly by OPS and Identity teams, unconfirmed). Not this developer's area
    to open tickets on OPS's/Identity's behalf.
  currentBestGuess: Tickets need to be opened; ownership for the K8s N-1 item needs confirmation from OPS/Identity leadership.
  impact: Blocks the "non-standard technology choices tracked in Jira" L1 maturity criterion until tickets exist and are linked back into the catalog.
  relatedObjects:
  - ref: 01KSM38KG2-ZB6W
  - ref: 01KSM38KFW-WA83
  - ref: 01KSM38KFX-ETDW
  - ref: 01KSM38KFX-DQGA
  - ref: 01KSM38KFH-NYK5
  - ref: 01KZ2MRPH7-10AD
- id: lambda-shutdown-plan
  question: Is Platform Msvc Org Person's parallel AWS Lambda deployment path (serverless.yaml) live or dead code?
  status: answered
  reason: >-
    A Ottoman developer confirmed 2026-08-04 that the Data/AI team plans to
    shut it down within the next couple of weeks (target: mid-to-late August
    2026). Recorded on the ProductComponent as architectureNotes.lambdaShutdownPlan.
  currentBestGuess: EKS is the sole authoritative deployment path once the Data/AI team completes the Lambda shutdown.
  impact: No catalog action needed now; revisit after the shutdown to remove the serverless.yaml path from architectureNotes.failureDomain if confirmed complete.
  relatedObjects:
  - ref: 01KSM38KFH-NYK5
- id: operational-resilience-gaps
  question: >-
    Several resilience gaps surfaced during repository research: Invitation
    Service and Organization Service both have graceful-shutdown hooks either
    disabled or never wired despite a configured terminationGracePeriodSeconds;
    Platform Msvc Org Person has no PodDisruptionBudget at all (unlike its
    NestJS siblings) and no app-level SIGTERM handler; Sofa King Admin BFF's
    /health check does not cover Passport Core or Invitation Service despite
    depending on both; Organization Service runs LOG_LEVEL=debug in
    production. Should these be tracked as a remediation backlog?
  status: open
  reason: Discovered during repository research; requires engineering-leader/platform-team prioritization.
  currentBestGuess: Track as a follow-up backlog item rather than blocking this catalog pass.
  impact: Operational maturity gaps that do not block cataloging but affect production resilience.
  relatedObjects:
  - ref: 01KSM38KFX-ETDW
  - ref: 01KSM38KFX-DQGA
  - ref: 01KSM38KFH-NYK5
  - ref: 01KSM38KFW-W42S

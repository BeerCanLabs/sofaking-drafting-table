- id: document-database-selection
  question: Is OrgPerson Service backed by MongoDB Atlas, AWS DocumentDB, or another MongoDB-compatible service?
  status: answered
  reason: >-
    Repository discovery on msvc-org-person (2026-08-03) found a
    mongodb+srv:// SRV connection string against a .mongodb.net cluster and
    an explicit ATLAS: true config flag in src/connection.js — conclusive
    evidence of MongoDB Atlas, not AWS DocumentDB.
  currentBestGuess: Platform Msvc Org Person (01KSM38KFH-NYK5) persists to MongoDB Atlas.
  impact: Resolved — no new PaaS object needed; MongoDB Atlas is recorded directly on the ProductComponent's architectureNotes.persistence.
  relatedObjects:

unresolvedQuestions:
  - id: new-sdps-deployment-target
    question: >-
      Where do Corvid Intranet, Nysdcb Directors, Translation Direct, and CT
      Data Extraction Tool actually deploy (datacenter/host)? Connection
      strings reference a server named CDPINTMISC for Nysdcb Directors and
      Translation Direct, which was not previously seen in the Trifold
      family's evidence.
    status: answered
    reason: >-
      No direct evidence of datacenter placement was found in the repo for
      these four products; grr-datacenter and the existing Windows Server
      2022 physical host were assumed by extrapolation from the rest of the
      Trifold family, not confirmed. ANSWERED 2026-09-10: owner confirmed
      Nysdcb Directors, Translation Direct, Advisory Direct, and Corvid
      Intranet all run on GRRCDPMISCWEB11 (prod, grr-datacenter) /
      HPTCDPDEVMISC1 (QA, high point-datacenter). CDPINTMISC believed to
      be an outdated/retired server name, not a distinct host. CT Data
      Extraction Tool separately confirmed as grr-datacenter / Windows
      Server 2022 (now retired).
    currentBestGuess: >-
      Nysdcb Directors, Translation Direct, Advisory Direct, Corvid
      Intranet: GRRCDPMISCWEB11 (prod) / HPTCDPDEVMISC1 (QA). CT Data
      Extraction Tool: grr-datacenter / Windows Server 2022 (retired).
    impact: Wrong deployment target would misstate the failure domain and physical topology for these four SDPs.
    relatedObjects:
      - ref: 01KX4A2T71-8YPE
      - ref: 01KX4A2T72-0MXK
      - ref: 01KX4A2T73-AHA1
      - ref: 01KX4A2T71-YMWR
      - ref: 01KXK822CN-M74S
  - id: docrepositorydb-shared-services-gap
    question: >-
      Should Shared Services model DocRepositoryDB as a proper shared
      DataStoreService, since it appears to serve document storage for
      multiple applications rather than being owned by a single product?
    status: open
    reason: Not authored in this session per owner direction to flag it as a gap instead.
    currentBestGuess: Treat as a Shared Services catalog gap; do not author from an Engineering session.
    impact: >-
      CorvidPortal's DocumentViewerAPI dependency on document storage is
      currently undocumented as a relationship target. UPDATE (2026-07-15):
      a live public web app, "Trifold Document Repository"
      (docs.cdpdirect.example, ref 01KXK81788-D45P in
      session-trifold-service-composition-2026-07-09.yaml), was discovered
      and is likely the front-end over this same gap — increases confidence
      this is shared, actively-used infrastructure, not dormant.
    relatedObjects:
      - ref: 01KX4A2T70-N90K
      - ref: 01KXK81788-D45P
  - id: zendesk-vocabulary-gap
    question: Should "Zendesk" be added as an approved SaaS vocabulary entry in deployment-targets.yaml, similar to saas-okta/saas-salesforce/saas-servicenow?
    status: open
    reason: Zendesk is referenced as an externalTarget on a relationship rather than a declared deploymentTargets vocabulary value, since it is not currently in the approved list.
    currentBestGuess: Leave as externalTarget until a vocabulary proposal is submitted.
    impact: Minor — does not block validation, but means Zendesk is not filterable/groupable the way other approved SaaS vendors are.
    relatedObjects:
      - ref: 01KX4A2T71-MWBT

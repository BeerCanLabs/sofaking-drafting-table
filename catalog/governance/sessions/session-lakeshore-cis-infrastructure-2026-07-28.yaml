  question: Is "HouseholdaccessBFF" a genuinely new/separate service from the existing "CIS BFF Exago" catalog entry, or the same service under a different name?
  status: answered
  currentBestGuess: 'Answered 2026-07-30: it is real and genuinely separate — a distinct deployment (Householdaccess.Mobile.Api) of the sis-app-householdaccess repo, CIS-team-owned, consumed by the Mobile team''s mobile app. Not the same service as CIS BFF Exago.'
  impact: Affects whether a duplicate catalog object exists and whether relationships should target Exago or the new stub.
  relatedObjects:
  - ref: 01KSM38KFQ-X2TJ
  - ref: 01KYNVC9SP-QNB7
- id: Q2
  question: Does "CISAdminBFF" exist at all, and if so is it distinct from CIS BFF Exago and CIS BFF Householdaccess?
  status: answered
  currentBestGuess: 'Answered 2026-07-30: it is the same component as CIS Svc Mobile API. Retired as a duplicate.'
  impact: Affects whether this stub should be promoted, merged, or deleted.
  relatedObjects:
  - ref: 01KYNVC9SP-WPVW
  - ref: 01KSM38KFQ-0HE2
- id: Q3
  question: Where does the "Sync website" and "pristine DB" at LSRCN actually live, and what do they do?
  status: answered
  currentBestGuess: 'Answered 2026-07-30: the "Sync website" is the same component as CIS Svc Syncer (the DASLSync API), retired as a duplicate. The "pristine DB" is hosted at LSRCN separately from all per-ITC hosting and is a copy of CIS Db Customerinformation; it has no separate codebase.'
  impact: These two objects cannot be scored as complete on any dimension (deployment target, availability, data classification) until located.
  relatedObjects:
  - ref: 01KYNVC9SQ-DPNP
  - ref: 01KYNVC9SP-9ARM
- id: Q4
  question: How does the Azure-hosted "CIS DB" relate to the three per-ITC databases (CustomerInformation, Salesbook Master, Salesbook Region) — separate database, central aggregate, or naming overlap?
  status: open
  currentBestGuess: Modeled as a fully separate database pending confirmation.
  impact: Affects whether cross-database relationships/replication need to be modeled between Azure and LSRCN.
  relatedObjects:

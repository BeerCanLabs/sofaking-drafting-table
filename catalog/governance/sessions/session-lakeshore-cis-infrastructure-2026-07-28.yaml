sourceArtifacts:
- name: LSCIS Single-ITC architecture whiteboard diagram
  type: diagram
  location: Provided inline by the product owner in chat, 2026-07-28.
  notes: 'Box diagram labeled "Single ITC" showing: a Web Services tier (Customer Information, Salesbook, DataMap, CentralAdmin, Specialservices, VendorLink, Householdaccess, HouseholdaccessBFF, and a "CISAdminBFF ?" the author themself marked uncertain); a Utility Services tier (JAMS Scheduler); an App Services tier (Calculators, Schedule Services, Syncer); Redis OSS sitting between the web and DB tiers; a Database Services tier ("Primary DB Cluster: DB1, DB2, DBR <- Customers Access"); an Azure box (CloudCentral for VendorLink routing, and a separate "CIS DB"); a box labeled "Server at LSRCN - Separate Service" with the handwritten note "(need to locate Sync website & pristine DB)"; an AWS box (Document Vault, Lambda -> S3); a "Server at HPT" box (Course Library); and, outside the ITC box, mobile clients "CIS Admin Mobile (new)", "CIS Admin Mobile (legacy)", and "Parent Admin Mobile".'
- name: Owner clarification - SDP structure
  type: interview
  location: Chat conversation, 2026-07-28.
  notes: 'Owner corrected an initial proposal to treat each LSCIS module as its own SoftwareDeploymentPattern: LSCIS is one product with one dedicated server stack per ITC ("site"), not five separately deployed products. This drove retiring the five module-level SDPs (LSCIS - Central, DataMap, Salesbook, Householdaccess, CustomerInformation) and their paired decision-record stubs in favor of service groups on the single product-level SDP (01KSM38KFR-BPTG).'
- name: Owner clarification - Kong/Ottoman authentication
  type: interview
  location: Chat conversation, 2026-07-28.
  notes: >-
    Owner corrected the removal of Kong Gateway from the topology: Kong Gateway
    is confirmed infrastructure that hosts LSCIS's authentication layer.
    LSCIS has an external integration with Ottoman (soon to be rebranded
    Sofa King ID) for authentication. Reinstated as an "Ingress /
    Authentication" service group and two relationship objects. Owner was not
    sure how this relates to the pre-existing "hard dependency on external
    LDAP for authentication" patternDeviations note.
- name: GitHub repository reconciliation
  type: repository-discovery
  location: BeerCanLabs GitHub org, via GitHub MCP, 2026-07-30.
  notes: Searched the org for all repos matching the sis-app-/cis-db-/cis-lib-/cis-svc-/cis-msvc-/cis-util- naming conventions plus the two known one-offs (sis-bff-exago, sis-ui-backpack-design). Found 86 sis-prefixed repos total; cross-referenced against all 47 existing catalog entries to fill repoUrl gaps and surface undocumented repos.
- name: Owner clarification - whiteboard stub resolution
  type: interview
  location: Chat conversation, 2026-07-30.
  notes: 'Owner resolved most remaining whiteboard-only stubs from the 2026-07-28 session: CIS Svc CloudCentral is a deployment variant of CIS App Centraladmin (not separate code); CIS Svc Course Library maps to BeerCanLabs/sk-cis-app-salesbook-content-library (API + website, split into two catalog entries); CIS Svc JAMS Scheduler is the third-party JAMS COTS product, not Sofa King code; CIS Svc Schedule Services maps to BeerCanLabs/sk-cis-util-customerinformation-asc-timetable (legacy ASC Timetables vendor integration, in maintenance mode); CIS Svc LSRCN Sync Website is a duplicate of CIS Svc Syncer (both are the DASLSync API); CIS BFF Householdaccess is real — a separate deployment of the sis-app-householdaccess repo (Householdaccess.Mobile.Api), CIS-team-owned, consumed by the Mobile team''s app; CIS BFF CISAdmin is a duplicate of CIS Svc Mobile API; CIS App Parent Admin Mobile is a React Native app owned by the Mobile team, out of scope for this catalog. CIS Svc Calculators remains unconfirmed (working theory: may refer to WIRIS, a 3rd-party MathML editor dependency, not a standalone component).'
- name: Owner clarification - Syncer repo split
  type: interview
  location: Chat conversation, 2026-07-30.
  notes: BeerCanLabs/sk-cis-util-customerinformation-syncer contains two components — a Sync API (DASLSync, ASMX web service reading from the Pristine DB) and a Syncer console app (DASLSyncer, deployed to each ITC, calls the Sync API to update the local region DB). Split into two catalog entries accordingly (CIS Svc Syncer for the API, CIS Util Customerinformation Syncer for the console app). This also resolved CIS Db LSRCN Pristine — hosted centrally at LSRCN, a copy of CIS Db Customerinformation, with no separate codebase.
- name: Owner clarification - Document Vault and Specialservices retirements
  type: interview
  location: Chat conversation, 2026-07-30.
  notes: CIS Svc Document Vault (legacy Lambda/S3 service) is decommissioned, replaced by CIS Msvc Document Vault (BeerCanLabs/sk-cis-msvc-document-vault, CDK-deployed .NET microservice). Specialservices is retired as a product line; every Specialservices-labeled component (CIS App Specialservices, CIS App Specialservices Classic, CIS Util Specialservices Patcher, CIS Util Specialservices Classic Migrator) marked retired accordingly. CIS Svc Tillbook Customersearch never launched (retired, dead). CIS Svc Tillbook Web Help replaced by the Sofa King Learning Center (retired). CIS App Mobile CIS Admin is being phased out in favor of a React Native app owned by the Mobile team, but remains an active LS CIS component today (deprecated, not retired).
- name: Owner clarification - sis-util-* backlog review
  type: interview
  location: Chat conversation, 2026-07-30.
  notes: Reviewed 15 previously-undocumented sis-util-* repos and 1 sis-app-* repo (sis-app-salesbook-content-library) discovered via the GitHub reconciliation. Owner provided function/status for all but two (CIS Util Customerinformation ACE MSB and CIS Util Customerinformation DASL Agent — names/context known, exact function not). Decided not to catalog any sis-lib-* repos (14 found) since they are shared libraries, not independently deployed components. Also confirmed data-store-service-lakeshore-cis-sqlserver-2019 uses SQL Server Authentication.

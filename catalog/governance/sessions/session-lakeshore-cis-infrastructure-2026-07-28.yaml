assumptions:
- id: A1
  statement: '"CIS Admin Mobile (new)" in the diagram is the existing "CIS App Mobile CIS Admin" catalog entry (01KSM38KFP-WBNG), and "CIS Admin Mobile (legacy)" is the existing native "iOS Tbcis Admin" (01KSM38KFE-MRVH) and "Android Tbcis Admin" (01KSM38KFD-4CPA) entries.'
  rationale: Naming similarity (TBCIS Admin = Tillbook CIS Admin) and the new entry being a hybrid/Cordova app consistent with a modernization effort.
  impact: If wrong, the Mobile Clients service group misattributes three existing components and "new" vs "legacy" labeling in the topology is incorrect.
  relatedObjects:
  - ref: 01KSM38KFP-WBNG
  - ref: 01KSM38KFE-MRVH
  - ref: 01KSM38KFD-4CPA
- id: A2
  statement: 'The diagram''s "Primary DB Cluster: DB1, DB2, DBR" maps to the three existing catalog databases (CustomerInformation DB, Salesbook Master DB, Salesbook Region DB), with DBR representing a customer-facing read replica of that same cluster rather than a fourth database.'
  rationale: These are the only three per-ITC MSSQL databases already cataloged for LSCIS, and the diagram's cluster sits in the same Database Services position they already occupy.
  impact: If wrong, the Database Services group under-represents the actual cluster and a DBR read-replica may need its own catalog entry.
  relatedObjects:
  - ref: 01KSM38KFP-25CX
  - ref: 01KSM38KFP-1J9Y
  - ref: 01KSM38KFP-YGZ8
- id: A3
  statement: '"HPT" in the diagram is the High Point, MI data center (workspace deployment target high point-datacenter).'
  rationale: HPT is a natural abbreviation for High Point, and no other approved deployment target matches.
  impact: That vocabulary entry is documented as non-production/Sofa King-owned hardware, which conflicts with Course Library appearing to be a production dependency in the diagram. Needs owner confirmation before being treated as validated.
notes:
  assumptionsVsQuestions: The three assumptions above (A1-A3) are best-effort guesses made to keep drafting moving. The "Not sure yet" items below (Q1-Q4) were deliberately left unresolved rather than guessed, per explicit owner direction during the 2026-07-28 session. Q1, Q2, and Q3 were resolved on 2026-07-30.
unresolvedQuestions:

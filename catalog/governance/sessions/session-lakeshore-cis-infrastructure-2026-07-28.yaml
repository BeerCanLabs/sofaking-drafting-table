- id: Q5
  question: For every module in the consolidated SDP, what is the actual availability requirement, data classification, and failure domain — the prior module-level stubs all had these marked "requires owner interview."
  status: open
  impact: Blocks scoring several SDP Completeness Rubric dimensions (AV, DC, FD) per the SDP Completion Interview protocol. As of 2026-07-30, nearly every product_component and data_component in this catalog directory still has serviceAuthentication, secretsManagement, serviceLogging, healthWelfareMonitoring, availabilityModel, scalabilityModel, recoverabilityModel, and failureDomain unconfirmed — this is the largest remaining body of work.
- id: Q6
  question: How does the confirmed Kong/Ottoman (Sofa King ID) authentication integration relate to the SDP's pre-existing "hard dependency on external LDAP for authentication with no fallback" patternDeviations note — is LDAP stale documentation for the same integration, or a separate still-active dependency (e.g. for a different user population or module)?
  status: open
  currentBestGuess: Not guessed — both notes are kept side by side in architectureNotes pending clarification.
  impact: Affects whether the LDAP patternDeviations note should be corrected/retired, and whether a second externalTarget relationship for LDAP needs to be modeled separately from the Okta/Ottoman relationship.
  relatedObjects:

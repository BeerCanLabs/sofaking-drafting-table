description: Rebuilding LSCIS (Sofa King CIS - Lakeshore) infrastructure documentation from a single-ITC architecture whiteboard diagram, after consolidating five incorrectly-separate module-level SoftwareDeploymentPatterns into one product-level pattern with service groups. Extended on 2026-07-30 with a full GitHub repository reconciliation, resolving most whiteboard-only stubs against real repos and documenting the broader lakeshore-cis-tillbook-engineering repo backlog.

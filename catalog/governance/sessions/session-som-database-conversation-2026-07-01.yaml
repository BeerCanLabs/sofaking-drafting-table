unresolvedQuestions:
  - id: som-solo-details
    question: What are the detailed ownership, usage, access pattern, and customer-data boundaries for the SOM Solo Financing Billing shared database/service across AWS and Webloom?
    status: open
    reason: The meeting confirmed SOM Solo is shared across AWS and Webloom and related to Financing Billing, but its detailed usage still needs follow-up with Sean and TK.
    currentBestGuess: Treat SOM Solo as a shared Financing Billing database/service dependency for all SOM customers until the application owners provide detailed boundaries.
    impact: Failure domain, sensitive-data mapping, and restore/delete semantics for Financing Billing remain incomplete.
    relatedObjects:
      - ref: 01KSM38KEX-R400
      - ref: 01KWF246JB-VNFC
      - ref: 01KWF5PCRR-8FHN
      - ref: 01KWF5PCRR-BMD4
  - id: sensitive-table-obfuscation-inventory
    question: Which SOM tables contain sensitive data, and which data-obfuscation scripts or processes apply to those tables?
    status: open
    reason: The database team committed to provide the table list and obfuscation scripts after Development updates are available.
    currentBestGuess: Catalog sensitive data at the database-category level until the table-level inventory is supplied.
    impact: Data classification, lower-environment data handling, and deletion/retention evidence remain incomplete.
    relatedObjects:
      - ref: 01KWF5PCRR-8FHN
      - ref: 01KWF5PCRR-BMD4
  - id: churn-delete-vs-archive-process
    question: What is the authoritative customer churn data handling process for AWS and Webloom, including when data is deleted, archived, or retained under S3 backup/compliance controls?
    status: open
    reason: The meeting indicated churned customer data is archived and S3 data is retained for seven years, while the referenced deletion process still needs verification for AWS and Webloom specifics.
    currentBestGuess: Treat active customer data deletion as process-driven, with S3 archive/backup data retained under the seven-year compliance posture.
    impact: Customer deletion expectations and compliance evidence need explicit reconciliation.
    relatedObjects:
      - ref: 01KSM38KEX-R400
      - ref: 01KWF246JB-VNFC
      - ref: 01KWF5PCRR-8FHN
      - ref: 01KWF5PCRR-BMD4
  - id: sql-version-roadmap
    question: What is the authoritative SQL Server upgrade target and timeline for AWS and Webloom SOM environments?
    status: open
    reason: The meeting referenced movement from SQL Server 2017 toward newer versions, but the Zoom summary used ambiguous Webloom/WebEx wording and no authoritative target/timeline was confirmed.
    currentBestGuess: Keep current state modeled as SQL Server 2017 Enterprise for both AWS and Webloom until the roadmap is confirmed.
    impact: Lifecycle risk and modernization planning cannot be scored accurately until the SQL version roadmap is known.
    relatedObjects:
      - ref: 01KWF5PCRR-8FHN
      - ref: 01KWF5PCRR-BMD4
  - id: import-flow-service-boundary
    question: What is the exact boundary between AWS Transfer/S3/Lambda/FSx, local SSIS/SFTP file processing, QuickfitImport, and the application-owned Data Import Service?
    status: open
    reason: The meeting clarified database-side processing uses local SSIS packages and SFTP/customer file locations for most operations, while prior infrastructure discussion identified AWS Transfer Family moving S3 files to FSx customer locations.
    currentBestGuess: Treat AWS Transfer/S3/Lambda/FSx as the AWS file-intake and landing path, and treat SSIS/QuickfitImport/Data Import Service as the database ingestion path pending Development confirmation.
    impact: End-to-end import failure domains, audit trails, and purge ownership remain incomplete.
    relatedObjects:
      - ref: 01KSM38KEW-G59V
      - ref: 01KWF5PCRR-8FHN
      - ref: 01KWF5PCRR-ZJE9

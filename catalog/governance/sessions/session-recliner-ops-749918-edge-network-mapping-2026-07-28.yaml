unresolvedQuestions:
  - id: exact-platform-ingress-path
    question: >-
      What is the exact ordered load-balancer, ingress-controller, DNS, and TLS
      certificate path between the shared Kong Gateway and each Recliner
      environment?
    status: answered
    reason: >-
      Answered in part on 2026-08-05 for OPS-306834 by reading the som-recliner
      repository directly. The BFF's own public hostname does not go through
      Kong at all — see relationship 01KZ9NXCX5-M6SK. What remains
      genuinely unresolved is narrower: whether Kong (or another gateway)
      still sits upstream of the separate Imperva-fronted browser app-route
      hostname, which this repository does not control or define.
    currentBestGuess: >-
      The BFF's public API hostname (recliner-bff-api*.ss.sofaking.example)
      is a Route53 CNAME resolving directly to a dedicated internet-facing
      Traefik ALB per environment — confirmed in
      infra/platform/aws_services.tf and the per-environment
      terraform.tfvars files in github.com/BeerCanLabs/sk-som-recliner. No
      Kong Gateway reference exists anywhere in that repository's
      infrastructure code. The Imperva-fronted browser app-route hostname
      (customer*.stage-retail.ss...) is a separate naming scheme whose upstream
      path is owned outside this repository and remains unconfirmed.
    impact: >-
      Corrects the SDP's edgeNetworkStrategy and the two Kong relationships
      (now catalogStatus: incomplete) to stop asserting a Kong-to-BFF hop as
      settled fact. The narrower app-route-ingress question is preserved
      below as a new deferred item.
    relatedObjects:
      - ref: 01KQQ5JT1E-SW3X
      - ref: 01KSR5D4EB-33Q3
      - ref: 01KZ9NXCX5-M6SK
  - id: imperva-app-route-upstream-path
    question: >-
      Does Kong Gateway (or another gateway) sit between Imperva and the
      Recliner Angular app shell on the browser-facing app-route hostname
      (customer*.stage-retail.ss.sofaking.example), given that the BFF's
      own hostname bypasses Kong entirely?
    status: deferred
    reason: >-
      That hostname and its upstream path are owned by the shared platform
      team outside the som-recliner repository, so repo-only evidence cannot
      answer this.
    currentBestGuess: >-
      Unknown. The BFF hostname evidence in this session does not extend to
      the separate Imperva-fronted app-route hostname.
    impact: >-
      Does not block Architecture L1 for Recliner; the product-owned ingress
      boundary (Traefik ALB to BFF) is confirmed. Route to the platform team
      for the shared-platform portion of the path.
    relatedObjects:
      - ref: 01KSM38KGH-A6GC
  - id: confirm-waf-posture
    question: >-
      Does Recliner's public CloudFront or Kong path use a product-specific WAF,
      or is application-layer filtering entirely provided by the shared
      platform?
    status: deferred
    reason: >-
      The reviewed Recliner sources do not identify Imperva, AWS WAF, or another
      product-specific WAF dependency.
    currentBestGuess: >-
      No Recliner-owned WAF is asserted; any filtering is part of the shared edge
      platform until confirmed otherwise.
    impact: >-
      A confirmed WAF can be linked later without blocking the currently
      evidenced CloudFront and Kong L1 dependencies.
    relatedObjects:
      - ref: 01KSM38KGH-A6GC
      - ref: 01KQQ5JT04-6F8T
      - ref: 01KQQ5JT1E-SW3X
  - id: observe-mesh-injection
    question: >-
      Which Recliner namespaces and workloads have Kuma sidecar injection enabled,
      and which mesh and traffic policies apply?
    status: answered
    reason: >-
      Answered in part on 2026-08-05 for OPS-306834 by reading the Helm
      charts in the som-recliner repository directly. Live traffic-policy and
      control-plane detail remains deferred (still no live cluster access),
      but which charts opt into sidecar injection is now directly evidenced
      from checked-in chart source rather than assumed from Confluence intent.
    currentBestGuess: >-
      Only the recliner-loveseat-subscriber chart sets
      `kuma.io/sidecar-injection: enabled`. The recliner-bff, recliner-backend,
      recliner-user-profile, and recliner-entity-locking charts carry no mesh
      sidecar-injection annotations, so the BFF and core-service runtime is
      not currently a mesh participant.
    impact: >-
      Corrects the SDP's serviceMeshStrategy and relationship 01KSKZV5ZK-7ZME
      to stop asserting mesh participation as the current state for the
      primary Recliner runtime; it remains accurate only for
      recliner-loveseat-subscriber. Live traffic policy and control-plane
      configuration for that one workload remain deferred.
    relatedObjects:
      - ref: 01KRZX0C11-QH66
      - ref: 01KYAXMZ7H-KJT2
      - ref: 01KSKZV5ZK-7ZME

unresolvedQuestions:
- id: q1
  status: open
  question: Do both the .NET Framework and .NET Core variants of sand-Employee and sand-Jobtype serve production traffic simultaneously, or is one dark?
  reason: Both variants are present in each repository and the .NET Core variants ship Kubernetes manifests.
  currentBestGuess: Both live, with traffic shifting to the .NET Core variant.
  impact: Determines whether each repository needs one ProductComponent or two with different hosting and persistence.
- id: q2
  status: open
  question: 'Is the SQL Server dependency in msvc-FormTemplate and sand-Employee''s .NET Core variant live, or an unused transitive reference?'
  reason: System.Data.SqlClient and Microsoft.Data.SqlClient appear alongside Npgsql with no SQL Server connection string in source.
  impact: 'Two persistence relationships are currently marked confidence: unconfirmed.'
- id: q3
  status: open
  question: Is the Sofa King Central Event Listener (Util-EventListener-NetCore) the same service as Platform Msvc Eventlistener (msvc-EventListener)?
  reason: Different repositories and solution names, but overlapping event-listener responsibilities. Modelled separately to avoid a wrong merge.
  currentBestGuess: 'Distinct: msvc-EventListener updates Permissions ObjectContext, Util-EventListener-NetCore writes the Aurora read model.'
  relatedObjects:
  - ref: 01KYQ4D9SD-RPM9
  - ref: 01KSM38KFY-PW52
- id: q4
  status: open
  question: Should the Platform SDP stop referencing the twelve ProductComponents now homed in sofaking-central-engineering?
  reason: 'The 2026-07-22 re-homing left the Platform SDP referencing the five it moved; this session followed that precedent for six more rather than editing another team''s SDP.'
  impact: Both SDPs currently claim the same components.
  relatedObjects:
  - ref: 01KQQ5JT1J-DWT1
- id: q5
  status: open
  question: 'Is the residual redisPrefix=hangfire-SandFile key in sand-File''s Web.config dead configuration?'
  reason: The net8.0 project references no Hangfire package.
  currentBestGuess: Dead config left from before the .NET 8 rewrite; no Redis relationship was authored.
- id: q6
  status: answered
  question: Which team owns msvc-ProductAccess and at-svc-OrgPersonProcessor?
  reason: Both are called by Sofa King Central but catalogued elsewhere.
  currentBestGuess: 'Confirmed 2026-07-29: IDM owns msvc-ProductAccess (its endpoint resolves to login.sofaking.example/api) and Leave/Time owns at-svc-OrgPersonProcessor. Left in place; FC calls edges authored against their existing uids.'
- id: q7
  status: answered
  question: 'Are the api2 List, Location and Organization APIs Sofa King Central''s or Platform''s?'
  reason: They back endpoint keys the FC frontend consumes but no repository exists locally.
  currentBestGuess: 'Platform''s: sand-List, sand-Location and sand-Organization all exist under ottoman-platform-engineering. Left in place.'
- id: q8
  status: open
  question: Which modules serve /ec-useraccess/ and is Settee-UI-Module-Universal-Data-Importer the /ec-data-importer/ module?
  reason: Neither repository is on the inspected device. The Data Importer module exists in the catalog under ottoman-platform-engineering.
  currentBestGuess: Universal-Data-Importer serves /ec-data-importer/. No candidate found for /ec-useraccess/.
assumptions:
- id: a1
  statement: 'EventStore.Client and MongoDB.Driver entries in the four stateless sand-* proxies are transitive SK.ServiceChassis dependencies, not direct persistence.'
  rationale: The .NET Core rewrites of JobTypeApi and PermissionApi reference only SK.ServiceChassis and SK.PermissionsClient, and none of the four declares a connection string. No persistence relationships were authored for them.
  impact: If wrong, four services are missing store edges.
- id: a2
  statement: The window.buildConfig endpoint map in Jarvis src/env-configs/production.json is the authoritative endpoint-key-to-service mapping for both shells.
  rationale: 'fc-ui-shell reproduces the same key shape from .env via CONFIG_KEYS, and the shared React libraries read window.buildConfig.endpoint.<key> in both hosts.'
  impact: All 40 frontend-to-API relationships derive from this mapping.
- id: a3
  statement: Loveseat and Elasticsearch are recorded as externalTarget rather than new shared-service objects.
  rationale: Neither has a catalog object, and existing relationships elsewhere in this catalog already reference Loveseat Event Bus as an external target.
  impact: If Shared Services later models either, these edges should be repointed to the new uid.

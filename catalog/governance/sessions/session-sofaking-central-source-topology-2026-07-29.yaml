notes:
  confluenceDeltas: 'Eight deltas against DEV/36544380944: two live frontend shells rather than one; msvc-fc-credential is PostgreSQL only, not Mongo; four CoreHR services are absent from the page; fc-msvc-mesh-bff is absent; EventStore removal is described as a goal but is incomplete; msvc-Permissions carries Elasticsearch, EventStore, DynamoDB and Mongo in addition to SQL Server; retail-institution search is OpenSearch; and the sand-* tier is not uniformly proxying - sand-Employee and sand-Form own a read model and Hangfire queue in the public tier.'
  reuseDiscipline: 'An initial pass created duplicate sand-Form and sand-Jobtype components because the inventory scan was scoped to the sofaking-central-engineering folder. The duplicates were deleted before commit and a full-catalog repoUrl scan was run instead, which found 14 edge-list repositories already modelled under other teams'' folders.'
  relationshipGraph: '301 relationship objects were generated, counted by label: 169 calls (129 declared service dependencies plus 40 frontend-to-API), 69 reads from and writes to, 32 composes, 13 sends events to, 9 loads at runtime, 7 publishes canonical events to, 1 registers event subscriptions with, 1 consumes events from. They are not enumerated individually in generatedObjects.'
  generationMethod: Catalog content was generated from the section 6 edge list of the topology analysis rather than hand-authored, so every component and relationship traces to a named source-file observation.
  estateAggregateDisposition: 'Sofa King Central Platform (01KQQ5JT0K-TN7W) was reviewed for deletion once per-service modelling superseded its placeholder role. Deleting it was tested and rejected: it would have introduced 22 validation failures, 9 of them dangling references from the OPS-255153 runtime-mapping session, the 2026-07-22 SDP completion session, and the accepted legacy-runtime-versions decision record. It also carried nine edges nothing else models - three inbound ingress routes, four runs-on runtimes confirmed by the product owner under OPS-255153, Okta authentication, and central logging, none of which the per-service components express. Software deployment patterns are used as a relationship source zero times in this catalog, so the edges had no conventional alternative anchor. Resolution: renamed to Sofa King Central Estate with the former name kept as an alias, description rewritten to state the aggregate role, and only the six now-redundant data-store calls edges removed.'

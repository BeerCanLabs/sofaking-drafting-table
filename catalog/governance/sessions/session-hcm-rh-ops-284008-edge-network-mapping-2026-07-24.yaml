unresolvedQuestions:
  - id: exact-kong-route-order
    question: >-
      What is the exact ordered hop sequence for each HCM route on the remote
      hybrid Kong control plane?
    status: deferred
    reason: >-
      The data-plane clusters do not contain the remote control-plane route
      configuration, and Architecture L1 requires the dependency rather than a
      complete request-path design.
    currentBestGuess: >-
      Kong is the logical Ottoman entry point and Traefik is the confirmed
      application-cluster ingress boundary.
    impact: >-
      The logical relationships are sufficient for L1; a later topology review
      may refine the ordered path without changing the dependency inventory.
    relatedObjects:
      - ref: 01KYAXMZ7H-5XYC
      - ref: 01KYAXMZ7H-70YJ
  - id: exact-envoy-builds
    question: >-
      Which Envoy builds are bundled in the deployed Kuma 1.8.0 and 2.8.6
      data-plane images?
    status: deferred
    reason: >-
      Exact embedded build discovery would require deeper image or in-pod
      inspection and is not required for Architecture L1.
    currentBestGuess: >-
      The version is managed as part of the corresponding Kong Mesh/Kuma image.
    impact: >-
      The Envoy TechnologyComponent remains a visible stub until the shared
      platform owner enriches it.
    relatedObjects:
      - ref: 01KYAXMZ7H-4VRV
assumptions:
  - id: confirmed-l1-product-boundary
    statement: >-
      HCM RH App and HCM RH Core are the independently deployed L1 product
      components requiring edge and mesh dependency mapping.
    rationale: >-
      Toby Hanley confirmed the New Recruiting & Hiring product inventory for
      OPS-598732, and both components have current live ingress and mesh
      evidence.
    relatedObjects:
      - ref: 01KSM38KG5-49X9
      - ref: 01KSM38KG5-FBRT
  - id: shared-nlb-ownership
    statement: >-
      The AWS NLB is modeled as a shared Ottoman gateway relationship and not
      as HCM RH-owned infrastructure.
    rationale: >-
      The load balancers are created by the Kong proxy Services in prod-ottm
      and stage-ottm, not by the HCM application clusters.
    relatedObjects:
      - ref: 01KYAXMZ7H-WX76

unresolvedQuestions:
- id: db-engine-selection
  question: Is each region deployment expected to run exactly one database platform, or can multiple platforms appear in the same deployment boundary?
  status: answered
  reason: 'Documented pre-existing single-tenant architecture (2026-06-17): RT-ERP/CIS has always been single-tenant. Each region runs in its own dedicated AWS account with its own database instance running exactly one platform — Db2, SQL Server 2019, or PostgreSQL 17 — co-resident in the same account as the ECS application services. Oracle is dev/test/legacy only and out of cloud scope. No architectural decision was made; this was a documentation clarification.'
  currentBestGuess: The three Data Services entries are documented as mutually exclusive per-region alternatives via SDM architectureNotes.databasePlatformSelection and per-entry notes; decision record 01KQQ5JT02-0MBH is resolved.
  impact: Resolved. Residual risk is limited to misreading the Data Services group as co-deploying all three platforms if the single-tenant, one-platform-per-region rule is overlooked.
  relatedObjects:
  - ref: 01KSM38KEY-JC4K
  - ref: 01KQQ5JT02-0MBH
- id: database-availability-model
  question: Does the read-only database replica provide a true high-availability failover path for the selected region database engine?
  status: answered
  reason: >-
    Engineering clarification in OPS-188334 on 2026-08-04 confirms that the
    read-only replica is not a true HA setup and does not provide automatic
    promotion or failover for the writable primary.
  currentBestGuess: >-
    Each region has one writable primary and one read-only replica for its
    selected Db2, SQL Server, or PostgreSQL engine. The writable primary is a
    region-scoped single point of failure; read-only replication and
    backup/restore are not database HA.
  impact: >-
    Loss of the primary interrupts database writes and can make RT-ERP
    workflows unavailable for the affected region. Region isolation
    limits the blast radius to that region.
  relatedObjects:
  - ref: 01KSM38KEY-JC4K
  - ref: 01KZ9A3RR6-NA48
- id: ecs-runtime-pattern
  question: What reusable ECS-native Java runtime artifact should the RT-ERP application bind to in DRAFT?
  status: answered
  reason: The CloudFormation source and deployment runbook confirm an ECS-on-EC2 runtime using ECS-optimized Amazon Linux 2023, an EC2 Auto Scaling Group capacity provider, ALB, ECR, and CodeBuild. Fargate is not used.
  currentBestGuess: Resolved by Java Application Service on Amazon ECS (01KYQN2WDV-223J); the RT-ERP application component is bound to that runtime.
  impact: Resolved. Revalidate only if the product changes container orchestration or adopts Fargate.
  relatedObjects:
  - ref: 01KSM38KEX-PX7B
  - ref: 01KQQ5JT02-ZR18
- id: identity-fallback-model
  question: Should LDAP and database authentication remain first-class runtime dependency services or be treated as region-specific exception interactions?
  status: answered
  reason: >-
    Sofa King IDM is the preferred path. The LDAP runbook confirms LDAPS 636 as
    a region-hosted alternate path; database-local authentication is retained
    as a region-specific exception rather than a standard service.
  currentBestGuess: >-
    Resolved by decision record 01KQQ5JT02-V402 and the explicit RT ERP
    application-to-region-LDAP relationship.
  impact: >-
    Resolved. The installed-base alternatives remain visible without being
    presented as the preferred identity baseline.
  relatedObjects:
  - ref: 01KSM38KEY-JC4K
  - ref: 01KQQ5JT02-V402
- id: jaspersoft-runtime-topology
  question: Is JasperSoft truly a standalone per-region reporting service, and if so, what substrate does it run on?
  status: answered
  reason: The CloudFormation source, Jasper operations runbook, and a representative production cluster confirm per-region Jasper ECS services on EC2-backed capacity. Legacy Jasper and Jasper 9 service definitions may coexist during migration; the active-version baseline uses one desired task and an EFS-backed PostgreSQL repository.
  currentBestGuess: Resolved as JasperSoft Reporting Service (01KQQ5JT1F-737K) on the Amazon ECS Standard Container Host. The runtime represents the reporting capability across legacy Jasper and Jasper 9 service variants; RDS remains a migration path.
  impact: Resolved for the current cloud baseline. Revalidate during Jasper 9 or RDS migration.
  relatedObjects:
  - ref: 01KQQ5JT1F-737K
  - ref: 01KQQ5JT02-T523
- id: observability-artifacts
  question: Which lower-level ABBs and runtime artifacts should represent CloudWatch and Glowroot in DRAFT?
  status: open
  reason: Observability is clearly required at runtime, but the current model keeps those dependencies at group level rather than as fully cataloged runtime artifacts.
  currentBestGuess: Treat CloudWatch and Glowroot as runtime observability dependencies while tracking the missing lower-level artifacts separately.
  impact: The SDM stays valid, but the lowest-responsible-level modeling rule is not fully satisfied yet.
  relatedObjects:
  - ref: 01KSM38KEY-JC4K
  - ref: 01KQQ5JT02-DHQV
- id: gateway-a-operational-baseline
  question: >-
    What production HA, secret distribution, certificate rotation,
    centralized logging, and automated recovery standard applies to each
    region Gateway-A?
  status: open
  reason: >-
    The reviewed implementation runbooks establish the current tunnel and
    access topology but do not establish a redundant gateway or centralized
    secret and certificate lifecycle.
  currentBestGuess: >-
    Preserve the current single Gateway-A per region as an existing-only
    baseline and track the gap through risk 01KYT589B4-B0Y1.
  impact: >-
    A Gateway-A failure can interrupt one region's tunneled connectivity;
    region isolation limits the blast radius.
  relatedObjects:
  - ref: 01KYT589B4-1XSE
  - ref: 01KYT589B4-B0Y1
assumptions:
- id: cloud-only-scope
  statement: This session covers only the cloud-hosted region deployment model; on-premise deployments will be captured in a separate SDM later.
  rationale: The source material mixes cloud and on-premise, but the current drafting pass needed a single deployment boundary to stay coherent.
  impact: On-premise topology and controls remain out of scope for this session.
  relatedObjects:
  - ref: 01KSM38KEY-JC4K
- id: runtime-observability-best-guess
  statement: CloudWatch and Glowroot are treated as runtime observability dependencies because they answer ODC and Hearthstone monitoring concerns even though their full artifact model is incomplete.
  rationale: The product clearly depends on them at runtime and the SDM should reflect that dependency now.
  impact: Lower-level ABB and RBB artifacts still need to be added later.
  relatedObjects:
  - ref: 01KSM38KEY-JC4K
  - ref: 01KQQ5JT02-DHQV
- id: external-network-boundary
  statement: >-
    Customer-hosted stunnel servers, Netskope publishers, region LDAP
    servers, and Synergis clocks remain external relationship targets rather
    than deployable objects inside the cloud SDP.
  rationale: >-
    These systems are customer-owned or shared access dependencies outside the
    per-region AWS deployment boundary.
  impact: >-
    DRAFT records their traffic paths without implying that RT ERP deploys or
    owns those external systems.
  relatedObjects:
  - ref: 01KSM38KEY-JC4K
  - ref: 01KYT589B4-1XSE

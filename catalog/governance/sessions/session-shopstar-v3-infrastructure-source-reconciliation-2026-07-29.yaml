assumptions:
  - id: A1
    statement: >-
      This drafting session and assessment cover shopstar V3 only. shopstar V5 is
      inactive and explicitly excluded; no V5 evidence is used to infer V3
      behavior.
    rationale: Explicit scope confirmation received 2026-08-19.
    impact: No shopstar V5 drafting session or architecture changes are part of this work.
  - id: A2
    statement: The candidate AccuRoute AWS deployment is represented as one runtime service with alternate AAP and Terraform deployment configurations.
    rationale: AAP currently discovers one host per active environment, while the Terraform feature branch models two logical roles in one product modernization.
    impact: The runtime may need to split into scan-extract and document-fetch-store services if the Terraform design is selected.
  - id: A3
    statement: The existing Customer Solutions pillar and SOM engineering ownership are retained without reinterpretation.
    rationale: They predate this session and no owner correction was provided.
    impact: Business taxonomy and owner fields must change if the product owner identifies a different pillar or accountable team.
  - id: A4
    statement: >-
      There is only one shopstar product deployment pattern. The
      repository-discovery stub "shopstar - Households Portal - Pattern"
      (01KSM38KEX-DF2H) was deprecated with supersededBy pointing to this
      session's primary object. shopstar-parent (parent-facing web tier) and
      shopstar-user-sync (shared IDM/user-sync eventing) were folded into this
      pattern's service groups; shopstar-sandbox (never deployed) was not.
    rationale: User-directed consolidation on 2026-07-29; confirmed only one shopstar product exists.
    impact: Resolves Q6 and preserves the V3-only boundary for future resumptions.
    relatedObjects:
      - ref: 01KSM38KEX-DF2H
unresolvedQuestions:
  - id: Q1
    question: Does the AAP/Ansible EC2 build supersede the sys-shopstar-terraform AccuRoute feature branches, or are both intended to coexist?
    status: open
    currentBestGuess: AAP is the more current operational path because its branch is active through July 27, 2026 and dev/stage jobs are documented as successful.
    impact: Determines whether S3/SQS/ASG relationships remain candidate, become preferred, or are removed.
    relatedObjects:
      - ref: 01KYRAQ0KC-MPJQ
  - id: Q2
    question: Has AccuRoute 8 been installed and configured in dev or stage since the checked-in variables disabled application, database, and service configuration?
    status: open
    currentBestGuess: Infrastructure and prerequisites are ready, but vendor application installation remains manual.
    impact: Determines whether the candidate runtime can move beyond incomplete/candidate status.
    relatedObjects:
      - ref: 01KYRAQ0KC-MPJQ
  - id: Q3
    question: Has production AccuRoute AWS infrastructure run or cut over, and can the Windows Server 2003 R2 / SQL Server 2000 appliance be retired?
    status: open
    currentBestGuess: No; the June AAP record shows prod templates unexecuted and zero discovered hosts.
    impact: Controls lifecycle status for both legacy and target AccuRoute services.
    relatedObjects:
      - ref: 01KS4DGJVK-Q9GY
      - ref: 01KYRAQ0KC-MPJQ
  - id: Q4
    question: Which operating-system and host family is current for the shopstar V3 Tomcat estate?
    status: answered
    currentBestGuess: >-
      The current Tomcat estate uses GRRSHS3TC* Ubuntu 22.04 hosts with PRC,
      PRT, and PRS role segmentation. Older RHEL/CentOS Tomcat inventories are
      historical and are not current infrastructure.
    impact: Closes the prior ambiguity that treated old RHEL/CentOS Tomcat nodes as potentially current.
  - id: Q5
    question: Do production secondary MySQL replicas exist in AWS?
    status: answered
    currentBestGuess: >-
      No. The current owner clarification states that secondary replicas exist
      in the GRR datacenter; no production secondary MySQL replicas exist in
      AWS. AWS is used as the rebuild-and-restore destination during a
      datacenter recovery.
    impact: Confirms Grand Rapids as the production database failure domain and removes AWS replica failover from the current architecture.
  - id: Q6
    question: Should a separate shopstar v5 drafting session be opened after this v3 infrastructure reconciliation?
    status: answered
    currentBestGuess: >-
      No. This session and assessment are V3 only, and shopstar V5 is inactive and
      explicitly out of scope. The repository-discovered
      "shopstar - Households Portal - Pattern" stub (01KSM38KEX-DF2H) was deprecated
      and merged into this session's primary object; its two V5-labeled
      repositories (shopstar, shopstar-scheduler) were intentionally excluded rather
      than reconciled. V5 architecture, infrastructure, RabbitMQ, print
      services, monitoring, incidents, deployment patterns, and documentation
      must not be used as evidence for V3.
    impact: Keeps all V5 evidence out of the current V3 assessment.
  - id: Q7
    question: Is Customer Solutions the confirmed business pillar for shopstar, and is SOM Special Orders Management Engineering the accountable owner?
    status: open
    currentBestGuess: Existing catalog values retained pending owner confirmation.
    impact: Required to remove the existing inferred-pillar caveat.
  - id: Q8
    question: How do the approved backup windows map to formal RPO and RTO values?
    status: answered
    currentBestGuess: >-
      The documented RPO is 24 hours. Formal RTO is undefined and has not been
      established. The legacy 48-72 hour transactional backup/restore
      operational SLA is not the formal RTO.
    impact: Corrects the prior 72-hour RTO claim and preserves the distinction between a recovery objective and an operational backup/restore SLA.
    relatedObjects:
      - ref: 01KSM38KGG-871T
  - id: Q9
    question: Is the MySQL Enterprise Audit Plugin enabled on every production instance, and where are audit events retained, alerted on, and reviewed?
    status: open
    currentBestGuess: The guide defines the intended audit configuration and optional SIEM integrations, but does not prove production deployment, retention, alert ownership, or review cadence.
    impact: Prevents the documented audit design from being treated as an implemented production control.
    relatedObjects:
      - ref: 01KSM38KGG-871T
  - id: Q10
    question: What approval, recertification, removal, and rotation processes govern human and shared MySQL production access?
    status: open
    currentBestGuess: RBAC, first-login password expiry, DBA-only OS root access, Secret Server storage, and most account owners are documented; lifecycle evidence and several incomplete shared-account rows remain.
    impact: Blocks complete production access-governance evidence.
    relatedObjects:
      - ref: 01KSM38KGG-871T
  - id: Q11
    question: What data may be used in QA and RC, and how are non-production data refresh, masking, access, retention, purge, and manual changes controlled?
    status: open
    currentBestGuess: Separate Ubuntu 22.04 QA and RC database hosts are documented, but the selected sources do not describe their data-handling controls.
    impact: Blocks completion of the non-production data strategy.
    relatedObjects:
      - ref: 01KSM38KGG-871T
  - id: Q12
    question: What are the active shopstar V3 production primary/read-only-replica mappings?
    status: answered
    currentBestGuess: >-
      RT1 grrv3db1ppr/ptxcmb1m maps to grrv3db1prpl/ptxcmb1s; RT2
      grrv3db2ppr/ptxcmb2m to grrv3db2prpl/ptxcmb2s; RT3
      grrv3db3ppr/ptxcmb3m to grrv3db3prpl/ptxcmb3s; RT4
      grrv3db4ppr/ptxcmb4m to grrv3db4prpl/ptxcmb4s; RT5
      grrv3db5ppr/ptxcmb5m to grrv3db5prpl/ptxcmb5s; RT6
      grrv3db6ppr/ptxcmb6m to grrv3db6prpl/ptxcmb6s; RT7
      grrv3db7ppr/ptxcmb7m to grrv3db7prpl/ptxcmb7s; NI
      grrv3db8ppr/pnicmb1m to grrv3db8prpl/pnicmb1s; and MA1/MA2
      grrv3db10ppr/pmacmb1m+pmacmb2m to
      grrv3db10prpl/pmacmb1s+pmacmb2s. All are in GRR and use
      primary/read-only-reporting-replica topology, not MySQL Group
      Replication. No production secondary replicas exist in AWS.
    impact: Closes the active primary/replica mapping question and confirms the GRR database failure domain.
    relatedObjects:
      - ref: 01KSM38KGG-871T
  - id: Q13
    question: What is the most recent successful shopstar restore test and associated evidence?
    status: open
    currentBestGuess: >-

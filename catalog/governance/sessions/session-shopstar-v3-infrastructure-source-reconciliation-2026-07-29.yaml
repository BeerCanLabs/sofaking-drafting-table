  - id: Q26
    question: What GRR datacenter edge and network facts are confirmed for shopstar v3?
    status: answered
    currentBestGuess: >-
      shopstar production is hosted at the GRR Lakeshore Data Centers facility, formerly
      Datavault, and is explicitly listed in the CIS DMZ behind GRR firewalls
      100 and 101. DMZ 10 is VLAN 56 at 172.19.56.0/22, DMZ 9 is VLAN 50 at
      172.19.50.0/23, and internal server ranges include 10.173.0.0/16.
      Observed shopstar 172.25.58.x hosts fall within DMZ 10, while observed
      database, print, and batch hosts fall within 10.173.0.0/16. The GRR DIA
      uses active/passive HSRP and dual-threaded connectivity with 2 Gbps
      service and a 2.2 Gbps burst allowance.
    impact: Establishes the GRR production placement, perimeter, address-space, and circuit context needed for L1.
    relatedObjects:
      - ref: 01KSM38KGG-871T

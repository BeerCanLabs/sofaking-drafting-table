  - id: Q15
    question: What are the documented single points of failure in the shopstar v3 database architecture?
    status: answered
    currentBestGuess: >-
      Each active primary is the sole production write dependency for its
      database group. The GRR replicas are read-only and cannot be used as a
      failover tier; all primaries and replicas share the GRR datacenter
      failure domain. Static history groups 14-16 are primary-only with no
      replicas. There are no production database replicas in AWS, so GRR site
      loss requires infrastructure rebuild and S3 restore rather than failover.
      MyISAM's limited crash-recovery and backup capabilities increase the
      impact and duration of failures for the workloads that remain on
      MyISAM.
    impact: Makes the database availability risks explicit for L1 review and ties remediation to the InnoDB conversion and disaster-recovery work.
    relatedObjects:
      - ref: 01KSM38KGG-871T

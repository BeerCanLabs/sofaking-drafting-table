  question: What are the real availability, backup, encryption, authentication and logging postures of the SQL Server 2017 estate, so the generic service object can move from stub to complete?
  status: answered
  reason: 'Answered 2026-09-08 for the Digital Stores estate, which is what this session needed, and deliberately not answered for the generic service. Answers 4.1 through 4.6 supplied backup (AWS Backup EBS snapshots and AMIs, 30-day retention, cross-region copies), encryption at rest (TDE not enabled), authentication (reported as SQL auth, conflicting with the checked-in SSPI connection strings), host substrate (four EC2 instances, per-tier types, not RDS) and build scope. Availability and recoverability were derived from that evidence rather than stated: single instance per tier, no availability group, no RDS anywhere in the account, restore-from-snapshot only, no tested RTO. Rather than pour one product''s answers into the generic 2017 service, a product-specific data store service (01M25X9W0R-VQJ3) was authored and the Data Tier repointed to it.'
  currentBestGuess: Not applicable for Digital Stores - resolved. The generic SQL Server 2017 DBMS Service (01M0GDHSAM-586D) remains a stub and remains Shared Services' to complete on estate-wide evidence; that is now a separate concern rather than a Digital Stores blocker.
  impact: The Data Tier no longer resolves to a stub, which removes the blocker this question named. The new service is itself catalogStatus incomplete, because database-level audit logging, secrets sourcing, capacity data and tested recovery remain absent or unevidenced.
  relatedObjects:
  - ref: 01M0GDHSAM-586D
  - ref: 01M25X9W0R-VQJ3
- id: availability-target-not-expressible
  question: What is the Digital Stores production availability target, RTO and RPO, expressed as measurable figures?
  status: open
  reason: 'Asked twice in the questionnaire - as the product SLA in 2.1 and as the SQL Server tier RPO and RTO in 4.2 - and answered "100%" both times on 2026-09-08. That is not an expressible target: it names no measurement window, no allowance and no recovery objective, and it is contradicted by the confirmed posture of a single-instance data tier per tier, restore-from-snapshot recovery, and non-production tiers deliberately powered off outside scheduled hours. It was therefore not adopted as the availability requirement.'
  currentBestGuess: None. The confirmed posture supports an RPO of up to roughly 24 hours and an RTO bounded by snapshot or AMI restore time, but neither is a target and the restore time has never been measured.
  impact: 'The availability-requirement entry of mandatory requirement group 01KQQ4Q027-VK45 is recorded as not-compliant, which is one of the two reasons the pattern keeps catalogStatus incomplete. Tracked as DecisionRecord 01M25X9W0R-GKSK. This question is deliberately separated from the closed deployment-target question because it needs a different answerer: a product and business owner setting a commitment, not an engineer reporting a configuration.'
  relatedObjects:
  - ref: 01KRZ1GCH3-99RF
  - ref: 01M25X9W0R-GKSK
- id: backup-posture-implemented-state
  question: Is the AWS Backup design described on the 2023-02-28 Digital Stores AWS Backup Service page actually implemented as written, and are the SQL Server volumes tagged into it?
  status: open
  reason: The backup and retention posture now asserted on the pattern and on data store service 01M25X9W0R-VQJ3 rests entirely on a page dated 2023-02-28 that is written prospectively - "we are planning to implement the AWS Backup Service" - and that describes tag-driven selection (AWS-Backup:daily on volumes, AWS-Backup:weekly on instances) without listing which resources carry those tags. The owner cited it as the answer to the backup question rather than describing the live state.
  currentBestGuess: Probably implemented, since the page records the CPM tool it replaced as decommissioned and the Environment Guide's infrastructure table marks CPM as decommissioned in favour of it. Whether PRAngDB1, SUDB, QADB and ALDB carry the selection tags is a separate matter and is not evidenced.
  impact: If the SQL Server volumes are not tagged, the product has no recorded backup at all rather than a 30-day snapshot chain, and the recoverability posture on both the pattern and the data store service is wrong rather than merely untested. This should be confirmed before the L1 packet is signed off.
  relatedObjects:
  - ref: 01M25X9W0R-VQJ3
  - ref: 01M25X9W0R-GKSK
- id: aws-instance-scheduler-configuration
  question: What schedules, resource tags, regions and AWS accounts does AWS Instance Scheduler actually use for the Digital Stores non-production hosts, now that it is confirmed as the scheduling tool in place of Park My Cloud?
  status: open
  reason: 'Corrected 2026-10-20. The Digital Stores Scheduled Tasks page (re-read 2026-10-20, current last-modified date 2026-10-15) strikes through its prior "Park My Cloud (PMC)" text for the Datapipelines row and replaces it with "AWS Instance Scheduler", confirming the tool identity, and links a SharePoint document for further detail that was not opened as part of this correction. That page gives the tool name only; it does not give AWS Instance Scheduler''s own configuration. The specific start/stop windows previously attributed to Park My Cloud on this pattern''s tierVariants (sandbox 05:00-21:00 PST, QA and alpha unspecified) and in the Environment Guide''s per-host Data Pipeline Schedule column have not been re-confirmed as AWS Instance Scheduler''s actual configuration, and no tag, region or account detail for AWS Instance Scheduler is evidenced anywhere cited in this session.'
  currentBestGuess: None. The tool identity is corrected; its configuration is not evidenced and must not be assumed to match the previously recorded Park My Cloud schedule exactly.
  impact: Does not block L1 on its own, since the prior Park My Cloud scheduling fact was already recorded narratively rather than as a structured requirement. Should be confirmed by the owner before this correction is treated as fully validated, and before any new schedule-dependent fact is added to the pattern.

assumptions:
- id: containers-are-dev-tooling
  statement: The Dockerfile and docker-compose.yml in server-ang are development tooling and are not used in any deployed environment.
  rationale: 'No deployed-environment container evidence was found in either repository, and the build and deploy path that does exist is MSBuild plus a PowerShell script to an IIS file layout. Strengthened 2026-09-08: the Environment Guide records plain Windows EC2 hosts running IIS across all four tiers and names no container runtime anywhere.'
  impact: If containers are in fact used in production, the Application Tier substrate and the whole hosting model change. The 2026-09-08 evidence makes this materially less likely.
  relatedObjects:
  - ref: 01M0GBWMZJ-E0NF
- id: single-iis-origin
  statement: The SPA and the API are served from a single IIS site per region subdomain, with the SPA under /dist/.
  rationale: 'web.config rewrites non-file requests to /dist/, angular.json sets baseHref to /dist/, the API base URL is derived from window.location.hostname, and build-alpha.ps1 copies both build outputs into one deploy root. Corroborated 2026-09-08: the Environment Guide lists exactly one web host per tier, not a web host and a separate API host.'
  impact: Both ProductComponents reference the same IIS runtime service. If they are actually separate sites or separate hosts, the service groups need different substrates.
  relatedObjects:
  - ref: 01M0GBWMZJ-9DNC
  - ref: 01M0GBWMZJ-E0NF
- id: sandbox-maps-to-staging
  statement: The Digital Stores sandbox or SU tier maps to the Staging environment tier (FQ696EE1DA-SWEN), QA maps to Test (AYQ5RCPK7C-MK58), and alpha maps to Development (SZJVW70BTN-V6GX).
  rationale: The Environment Guide titles the section "Sandbox/SU Environment (Stage)", which is the product's own equation of sandbox with stage. Sandbox is also the tier from which the production AMI is built, which is staging behaviour. Alpha is the lowest tier, is refreshed alongside QA, and carries the smallest instances. Digital Stores has no fifth tier, so UAT (DEBGENPE77-DJ1A) has no variant.
  impact: If the mapping is wrong the four tierVariants attach to the wrong environment_tier objects, and any tier-scoped requirement evaluation inherits that error. The product's four bands do not map one-to-one onto the workspace's five tiers, so this is a modelling choice rather than a confirmed fact. Note also that the Staging tier object declares availabilityExpectation high-availability and expects staging to mirror production replica counts, which the Digital Stores sandbox tier does not do.
  relatedObjects:
  - ref: 01KRZ1GCH3-99RF
unresolvedQuestions:
- id: reference-architecture-fit
  question: Should Digital Stores be filed against the Sharded Multi-Tenant AWS SQL Server reference architecture with a recorded deviation, or does database-per-tenant-with-central-catalog warrant its own reference architecture?
  status: open
  reason: 'The referenced pattern defines a shard as a replicated sub-environment with a shard-scoped data tier. Digital Stores has one shared application tier and shards only the database, and its DS_Admin catalog is an explicit cross-shard data dependency that the pattern''s checklist disallows without a decision record. Answered in part 2026-09-08: the owner confirmed in answer 8.1 that this shape is the intended long-term architecture, not a transitional state, which settles the intent but not the disposition. The remaining question is the Architecture Review Board''s.'
  currentBestGuess: File against the existing pattern with the deviation recorded, which is what this session did, and let the Architecture Review Board choose between accepting the deviation and commissioning a database-per-tenant reference architecture. Now tracked as DecisionRecord 01M25X9W0R-0Q0X.
  impact: Does not block L1 - the questionnaire itself flagged 8.1 as informational. Should be settled before Digital Stores is used as a conformance example, and should be dispositioned alongside the failure-domain risk in 01M25X9W0R-GKSK so the two decisions stay consistent.
  relatedObjects:
  - ref: 01KRZ1GCH3-99RF
  - ref: 01M25X9W0R-0Q0X
- id: deployment-target-unconfirmed
  question: Which deployment target hosts Digital Stores - AWS account, region and VPC for each of the four environment tiers?
  status: answered
  reason: 'Answered 2026-09-08 by the engineering owner in answer 1.1: all four tiers run in AWS account 472468972873 in us-west-1. Corroborated independently by the 2026-01-28 AWS API resource discovery of that account, which found 36 EC2 instances, 8 subnets and 2 load balancers in us-west-1 and zero RDS instances in any region, and by the Environment Guide''s per-tier host inventory. Tier separation is by host inside one account and region rather than by account or region. VPC identifiers were left blank in the questionnaire and remain unconfirmed, but per-tier VPC and subnet identifiers belong in the environment_tier parameterSurface rather than on the pattern, so they do not block the pattern. Answer 1.2 stated that no infrastructure-as-code exists; that is correct for the application and data tiers but not for the estate, since BeerCanLabs/sk-digital-stores-aws-backup holds Terraform for AWS Backup.'
  currentBestGuess: Not applicable - resolved. A new deployment-targets vocabulary value, aws-us-west-1, was required because the approved list carried only us-east-2 and us-east-1.
  impact: All four AWS service groups now carry aws-us-west-1 instead of the owner-interview-required sentinel, which unblocked the four tierVariants and the deployment-targets requirement disposition. Supersedes the do-not-assign-a-deployment-target decision recorded in DecisionRecord 01M0GBWMZJ-AAX4.
  relatedObjects:

  - ref: 01M25X9W0R-VQJ3
- id: edge-and-waf
  question: Is there a WAF, CDN or load balancer in front of *.digital-showrooms.example, and if so which one?
  status: answered
  reason: 'Answered 2026-08-27 by the workspace owner: Imperva WAF forwards to an AWS Application Load Balancer in front of *.digital-showrooms.example. Partly corroborated and partly complicated 2026-09-08: the Environment Guide names PRLB-155628125.us-west-1.elb.amazonaws.com in front of the production web tier and SBLB-3852661381.us-west-1.elb.amazonaws.com in front of sandbox, and the 2026-01-28 account discovery counts exactly two load balancers in us-west-1, which matches. But that DNS naming is classic-ELB shaped rather than ALB shaped, and QA and alpha have no load balancer recorded at all. Whether the balancers are Application or Classic, and where TLS terminates, is unconfirmed.'
  currentBestGuess: Two load balancers exist in us-west-1, fronting production and sandbox only. Type and TLS termination point unconfirmed and recorded as a conflict on the pattern.
  impact: Unblocks a satisfied disposition on Hearthstone HCF.09.1.3 for the production and sandbox tiers. QA and alpha are internet-reachable per the CORS allow-list but have no recorded balancer, which the Hearthstone disposition work should address rather than assume.
  relatedObjects:
  - ref: 01KRZ1GCH3-99RF
  - ref: 01KQQ5JT1D-MY47
  - ref: 01KQQ5JT04-P7QJ
- id: authorization-gap-intent
  question: Was the server-side per-screen authorization check in BaseController.IsAuthorized() disabled deliberately, and does it need to be restored?
  status: open
  reason: 'Answered as to intent 2026-08-27 - deliberate - and this question was closed at that time on the owner''s statement that the check had moved to SecurityAL::GetSecurityList(). Reopened 2026-09-10. Question 5.1 asked for the GetSecurityList() implementation by file and line and for confirmation that it runs on every per-screen request path. The 2026-09-08 answer supplies no file or line and describes the opposite arrangement: IsAuthorized() runs on every incoming REST request, GetSecurityList() is called by the front end only once at sign-in, and the security list is cached client-side. Read against the 2026-08-20 direct finding that the per-screen block inside IsAuthorized() is commented out and isScreenEnabled() returns true unconditionally, per-screen authorization is enforced only by the Angular route guard against a client-cached list. The in-flight encryption added after the 2021 security review protects that list in transit; it does not restore server-side enforcement.'
  currentBestGuess: No equivalent server-side per-screen check exists on the request path. This needs a direct read of server-ang to confirm or refute, and then an Information Security disposition, not another owner statement.
  impact: DecisionRecord 01M0GBWMZJ-TMGD returned from mitigated to open. Does not block the catalog composition, but it is the most consequential finding in this round and should not travel with the L1 packet as a closed item.
  relatedObjects:
  - ref: 01M0GBWMZJ-E0NF
  - ref: 01M0GBWMZJ-TMGD
- id: deployment-mechanism-nonalpha
  question: How are the production, QA and sandbox tiers built and deployed, given that build-alpha.ps1 targets alpha only and neither repository has a CI pipeline?
  status: answered
  reason: 'Answered 2026-08-27 by the workspace owner: dshpDeploy drives all four tiers the same way build-alpha.ps1 drives alpha, one branch per tier (angular, QAAng, Sandbox, PRAng). Production is built manually and pushed to QA, then promoted QA -> Sandbox -> Production by branch rather than rebuilt per tier. Completed 2026-09-08 by answers 6.1 and 6.2: a developer triggers each promotion manually, the same build is exercised in QA then sandbox then production, there is no validation or approval gate before a promotion goes live, and Cloud Engineering can obtain read access to dshpDeploy through Beanstalk.'
  currentBestGuess: Not applicable - resolved at the process level. The dshpDeploy repository has still not been read directly, but access is now available, so this can be confirmed by evidence rather than statement.
  impact: Resolves the shape of the pattern deviation - manual build-and-promote with no gate - and records it on the pattern's patternDeviations field. The leave of any promotion gate is a finding in its own right for the Hearthstone disposition work, given that the same artifact reaches production without an approval step.
  relatedObjects:
  - ref: 01KRZ1GCH3-99RF
- id: hearthstone-requirement-disposition
  question: Which Hearthstone Cybersecurity Framework 2026 requirements does Digital Stores claim, and with what evidence?
  status: open
  reason: 'The workspace activates requirement group 01KQQ5JT20-M5R2 against software_deployment_pattern. Substantially more evidence is now available than when this was raised, and it points in both directions. HCF.09.1.3 (WAF) can move to satisfied for production and sandbox but not obviously for QA and alpha. HCF.03.3.1 and HCF.03.3.3 (end-of-life) remain blocked on the missing SQL Server 2017 termination plan. HCF.03.1.2 and HCF.03.2.1 (security updates) are now bounded rather than unbounded - two builds across four instances - but still unremediated. HCF.06.1.1 and HCF.06.1.2 (logging and retention) are now clearly not satisfied: there is no central log aggregation, no database-level audit specification, and the application''s own LoggingEngine writes per-host flat files deleted after 31 days. The encryption findings in 01M25X9W0R-4HSX also attach here.'
  currentBestGuess: A first pass can now be attempted with real dispositions rather than blanks, and several will be not-compliant rather than satisfied. That is a better outcome than deferral, but it is requirement-catalog work rather than composition work and it needs the Hearthstone requirement owner, not the product owner.
  impact: Blocks a complete catalog status for the pattern independently of the two mandatory-requirement gaps already recorded. Does not block the L1 Baseline rubric, which asks for declared unknowns rather than satisfied controls.
  relatedObjects:
  - ref: 01KRZ1GCH3-99RF
- id: sqlserver-patch-scope
  question: Which Digital Stores environment tiers and region database instances are at build 14.0.3495.9, and is any instance further behind than that?
  status: answered
  reason: 'Answered 2026-09-08 by the engineering owner in answer 4.6 and corroborated host by host against the Environment Guide: production PRAngDB1 and sandbox SUDB are at 14.0.3495.9, and QA QADB and alpha ALDB are at 14.0.3485.1, one GDR band further behind. The owner wrote production as "14.3.3495.9", which is not a released SQL Server build and is read as a transcription of 14.0.3495.9. Because the tenancy model puts every region database inside one instance per tier, the build is per tier rather than per region, so there is no per-region drift to bound: four instances, two builds.'
  currentBestGuess: Not applicable - resolved.
  impact: Removes the scope qualifier from DecisionRecord 01M0GDHSAM-F64B and gives the remediation a concrete sequence - alpha and QA are two bands behind current, production and sandbox one. It also shows that the two instances furthest behind are the ones refreshed with production data.
  relatedObjects:
  - ref: 01M25X9W0R-VQJ3
  - ref: 01M0GDHSAM-F64B
- id: sqlserver-2017-termination-plan
  question: What is the target version and date for migrating Digital Stores off SQL Server 2017 before extended support ends on 2027-10-12?
  status: open
  reason: Hearthstone HCF.03.3.1 requires a formal termination plan for end-of-life systems and none is recorded. The questionnaire did not ask for one, so this round produced no movement. Roughly thirteen months remain. Answer 8.1 makes the surrounding architecture a settled long-term position, which means the engine migration is a discrete upgrade rather than something a re-platforming would absorb.
  currentBestGuess: None recorded. The catalog's preferred engine is SQL Server 2022 (01KQQ5JT01-950D, extended support to 2033-01-11); SQL Server 2025 (01KRZVZXDK-7XC1) is a candidate. The migration is the natural point to close the encryption-at-rest and data-tier availability findings too.
  impact: Blocks a satisfied disposition on Hearthstone HCF.03.3.1 and HCF.03.3.3 for this pattern. The leave of any test project in either repository means compatibility testing against the hand-written-SQL data layer has no automated safety net.
  relatedObjects:
  - ref: 01KRZ1GCH3-99RF
  - ref: 01M0GDHSAM-F64B

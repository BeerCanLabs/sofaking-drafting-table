notes:
  reuseDiscipline: 'No new infrastructure objects were created in either round. Both ProductComponents reference the existing shared IIS Standard Web Service (01KQQ5JT1F-HZTZ, catalogStatus complete, lifecycleStatus existing-only, host Windows Server 2022 on EC2). The deprecated IIS on Windows Server 2016 service (01KQQ5JT1F-JCA7) was rejected because no WS2016 evidence exists, and the .NET Core Application Service (01KQQ5JT1E-9CKW) was rejected because this is .NET Framework 4.6.1, not .NET Core. Data tier: the existing Microsoft SQL Server 2017 TechnologyComponent (01KQQ5JT1T-QKGB) was reused rather than duplicated, first by the generic 2017 service stubbed on 2026-08-20 and now by the product-specific service authored on 2026-09-10. The individual EC2 hosts named in the Environment Guide were deliberately not minted as host objects: that is Apex-maturity resolution, not an L1 requirement, and the questionnaire produced instance types and IPs rather than the ownership and lifecycle facts a host object needs. The new data store service instead references the existing shared preferred Windows Server 2022 on EC2 Standard Host (01KQQ5JT04-JKFX) as a stand-in, the same reuse pattern already used by other self-managed SQL Server data-store-services in shared-services, so that deliveryModel self-managed can declare a host without minting a new, unprecedented host object for four non-uniform instances.'
  generationMethod: Two rounds. Direct repository read of main-ang and server-ang via the GitHub API on 2026-08-20, requested explicitly by the workspace owner. Then a targeted questionnaire authored against the gaps this session had recorded, answered inline by the engineering owner and last modified 2026-09-08, read together with the five Confluence pages it cites. Every architecture note distinguishes facts confirmed by file or page citation from facts that remain unconfirmed, and derived facts are labelled as derived.
  answerQuality: 'The questionnaire closed six of the ten questions it targeted, and its value was not limited to what it asserted. Three of the most consequential findings in this round came from reading the cited evidence rather than from the answers themselves: the Jaspersoft extract path to SFTP, the monthly refresh of lower environments from production data, and the per-tier SQL Server build split. Five answers conflict with other evidence and were recorded as conflicts on the pattern rather than adopted - database authentication reported as SQL auth against checked-in SSPI connection strings, infrastructure-as-code reported as absent against an existing Terraform repository, an Application Load Balancer reported against classic-ELB-shaped DNS names, load-balanced redundancy reported for a tier set where QA and alpha have one host each, and a production engine build reported as 14.3.3495.9 which does not exist. Two answers - "100%" to both availability questions - were not usable and generated a new open question rather than closing one. One answer, 5.1, refuted the mitigation it was asked to confirm and reopened a security finding. None of that makes the round unsuccessful: it moved the pattern from asserting almost nothing to asserting a defensible current state with its uncertainties named.'
  scopeBoundary: The 2026-08-20 round covered composition and provenance and did not attempt requirement dispositions, tier variants or connection elicitation. The 2026-09-10 round added tier variants, the mandatory requirement dispositions and the confirmed infrastructure and data-tier posture. It did not attempt Hearthstone requirement dispositions, did not author the missing relationship objects, and did not register the newly confirmed external dependencies as objects. Those three remain the substantive DRAFT work outstanding for this product.

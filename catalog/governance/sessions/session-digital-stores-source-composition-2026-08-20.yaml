  - ref: 01M0GBWMZJ-AAX4
- id: sqlserver-engine-version
  question: Which SQL Server engine version backs Digital Stores, and should the Data Tier reference the shared SQL Server 2019 (01KQQ5JT01-QFN5) or SQL Server 2022 (01KQQ5JT01-950D) service, or a product-specific object?
  status: answered
  reason: 'Answered 2026-08-20 by the workspace owner: engine build 14.0.3495.9, which is SQL Server 2017 CU31 + GDR (KB5058714). Neither of the two services proposed when this question was raised was correct - SQL Server 2019 (01KQQ5JT01-QFN5) and 2022 (01KQQ5JT01-950D) are both the wrong major version. The catalog had no generic 2017 service, only three SOM-specific ones, so a generic SQL Server 2017 DBMS Service (01M0GDHSAM-586D) was stubbed and referenced. Revised 2026-09-10: the product-specific answer the question also offered is now the one taken, because the 2026-09-08 posture answers describe the Digital Stores estate specifically and cannot be generalized. The Data Tier now references Digital Stores SQL Server 2017 Estate (01M25X9W0R-VQJ3).'
  currentBestGuess: Not applicable - resolved.
  impact: The Data Tier references a product-specific service carrying real posture rather than a generic stub. Two follow-on risks remain open; see DecisionRecords 01M0GDHSAM-F64B, 01M25X9W0R-4HSX and 01M25X9W0R-GKSK.

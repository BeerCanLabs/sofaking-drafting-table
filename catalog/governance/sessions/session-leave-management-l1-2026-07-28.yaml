  - ref: 01KSM38KEQ-JS8E
  - ref: 01KQQ5JT04-P7QJ
- id: leave-eks-redeployment-recovery
  statement: Production Leave EKS workloads are likely recovered by redeployment from source and deployment pipelines rather than by restoring workload backups.
  rationale: The contributor believes workloads are redeployed but explicitly cannot confirm the recovery process.
  impact: Keep EKS workload recoverability provisional until CI/CD or recovery-runbook evidence is available; persistent data recovery remains a separate concern.

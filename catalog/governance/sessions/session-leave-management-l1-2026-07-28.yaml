  - Time & Attendance does not use GRRFILES1; that Storage VM is an Leave-only SMB storage boundary on the shared GRRNAP1CLU1 NetApp cluster.
  - Leave Management has a high-availability expectation within Grand Rapids and should remain operational through a single server or infrastructure-node failure.
  - Leave Management uses the restricted data classification because it processes personally identifiable information in the shared Rota database.
  - All Grand Rapids Leave Management web and API endpoints are fronted by the shared F5 BIG-IP service.
  - F5 BIG-IP terminates TLS and forwards unencrypted HTTP to the Grand Rapids Leave Management backend servers.
  - GRRFTP1 hosts its own shares and is a separate Grand Rapids service boundary from the GRRFILES1 Storage VM.
  - GRRFTP1 is an FTP server and should be modeled as a file-transfer service rather than a file-storage service.

- id: grand rapids-only-session-scope
  statement: The original session scope covered Grand Rapids production and excluded entries labeled DR or Disaster Recovery; on 2026-08-04 the owner expanded the scope to include production AWS workload placement.
  rationale: The owner explicitly began reconciliation of EKS workload placement after completing the Grand Rapids review.
  impact: Production AWS runtime groups may now be corrected, while disaster-recovery objects and topology remain out of scope.
  relatedObjects:
  - ref: 01KSM38KEQ-JS8E
- id: environment-guide-current-unless-corrected
  statement: Grand Rapids production server roles and operating systems in version 49 of the Environment Guide are treated as current unless the owner corrects them during this session.

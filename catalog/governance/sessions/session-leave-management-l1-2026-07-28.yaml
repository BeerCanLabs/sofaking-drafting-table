  statement: Sofa King users may detect failed transformations from missing output and then inspect SKIntegrationService manually over RDP.
  rationale: The contributor explicitly identified this as conjecture rather than a confirmed operating procedure.
  impact: Do not treat this as monitoring evidence; keep the application-service monitoring gap open until an owner verifies the process or implements an automated check.
  relatedObjects:
  - ref: 01KSM38KEQ-JS8E
- id: leave-eks-alb-backend-http
  statement: The production Leave Application Load Balancer likely forwards requests to EKS workloads using HTTP after terminating client TLS.
  rationale: The contributor believes the backend protocol is HTTP but explicitly cannot confirm it.
  impact: Treat HTTP as a provisional working assumption only; do not represent backend transport as owner-confirmed until configuration evidence or an infrastructure owner validates it.

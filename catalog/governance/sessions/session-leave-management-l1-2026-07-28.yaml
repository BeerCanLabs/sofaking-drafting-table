- id: owner-attestation-supersedes-discovery
  statement: Owner answers in this session supersede the repository-discovered placement currently recorded on the Leave Management pattern.
  rationale: The existing pattern is a stub whose placement was inferred from repositories rather than confirmed by compute and runtime owners.
  impact: The pattern and component hosting references require reconciliation.

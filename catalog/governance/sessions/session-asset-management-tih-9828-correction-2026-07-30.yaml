unresolvedQuestions:
- id: runsOn-runtime-mismatch
  question: 'Six AM components (QFJ1, XZ3E, YGSN, D6MJ, 7ZWT, XABQ) declare runsOn 01KQQ5JT1E-9CKW (".NET Core Application Service" stub), but all six are confirmed .NET Framework 4.x IIS-hosted applications, not .NET Core. What is the correct shared runtime_service/host pairing for AM''s legacy IIS estate?'
  status: answered
  reason: 'Resolved 2026-07-30 (user spotted the wrong technology rendering in the DRAFT browser for QFJ1 and asked directly). Repointed all 6 components to 01KQQ5JT1F-HZTZ (''IIS Standard Web Service'' - host 01KQQ5JT04-JKFX, Windows Server 2022 EC2, non-deprecated; technology Microsoft IIS 10), the same host the pre-merge hand-authored ''Legacy Trackweb-IT Platform'' stub (former VQ4B) already used, rather than either deprecated WS2016-on-EC2 alternative. See DecisionRecord 01KYSEGRA5-W41Q.'
  currentBestGuess: HZTZ is a solid fit for the IIS/technology-stack correction. Whether the underlying host is truly EC2 or actually the on-prem brannocksoft.local network-share estate described in repo research remains a residual, lower-priority precision question - not reopened here since it doesn''t change the runtime_service selection.
  impact: runsOn now correctly reflects .NET Framework/IIS instead of .NET Core; resolves both the browser display issue and the Established (2)/Apex (3) maturity gap.
  relatedObjects:
  - ref: 01KSM38KFB-QFJ1
  - ref: 01KSM38KFB-XZ3E
  - ref: 01KSM38KFB-YGSN
  - ref: 01KSM38KFB-D6MJ
  - ref: 01KSM38KFB-7ZWT
  - ref: 01KSM38KFB-XABQ

unresolvedQuestions:
  - id: iis-ec2-variant-unconfirmed
    question: >-
      Which IIS/EC2 runtime service matches the current legacy fleet: IIS
      Standard Web Service (existing-only, 01KQQ5JT1F-HZTZ) or IIS Web Service
      on Windows Server 2016 (deprecated, 01KQQ5JT1F-JCA7)?
    status: answered
    reason: >-
      Cloud Engineering's current Sofa King Central Packer definitions select
      the IDM-base-sk-2022 base image and identify Windows Server 2022 as the
      operating system.
    currentBestGuess: >-
      IIS Standard Web Service (01KQQ5JT1F-HZTZ) is the accurate relationship
      target. The deprecated Windows Server 2016 variant does not apply.
    impact: >-
      The last runtime category is now structurally represented from the
      aggregate Sofa King Central Platform component.
    relatedObjects:
      - ref: 01KQQ5JT0K-TN7W
      - ref: K0JG3TB3AH-4GY5
assumptions:
  - id: runtime-categories-confirmed
    statement: >-
      Sean Holt's runtime category list (legacy .NET Framework/IIS on EC2,
      .NET Core/.NET containers on EKS, SQS-triggered Lambda, Node.js, and
      Redis/ElastiCache) was confirmed accurate by Noah Pardee (Group
      Lead) on 2026-07-24, satisfying OPS-255153 closure item #1.
    relatedObjects:
      - ref: 01KQQ5JT0K-TN7W
  - id: legacy-version-stubs-not-wired-to-shared-runtimes
    statement: >-
      The 4 new legacy TechnologyComponent stubs are referenced only via the
      new decisionRecord, not via primaryTechnologyComponent on the shared
      IIS/.NET Core Application Service runtime_service objects.
    rationale: >-
      Those runtime_service objects are shared infrastructure owned by
      architecture-review-board and used by many other products; overwriting
      their primaryTechnologyComponent to a single legacy version would
      misrepresent every other consumer. The version gap is documented as a
      decision/risk instead.
    impact: >-
      A future company-wide effort to version-pin shared runtime patterns per
      consumer (or split them by version) would let this decision record be
      superseded by a structural fix.
    relatedObjects:
      - ref: 2YPE08XABA-QDW5

  Associate Development PLM/EEM — APEX L1 Baseline DRAFT Registration (SKPG-19589)
description: >-
  Registers Sofa King Associate Development's PLM (Professional Learning
  Management) and EEM (Employee Evaluation Management) product in DRAFT for APEX
  Turn 01 Architecture L1 Baseline. Establishes two SoftwareDeploymentPatterns —
  a legacy estate (01M1F8WB4E-RWQB) and a cloud services tier (01M1F8WB4E-8WVS)
  — catalogues the data stores, runtime services and edge dependencies that had
  no objects, and records the non-standard technology choices. Dependency
  evidence was gathered by reading the PLM/EEM repositories directly rather than
  by owner interview, and in the third round by reading Sofa King's own
  infrastructure documentation, so this session carries a substantial set of
  unresolved questions. Per the DRAFT Architecture Maturity Rubric, explicitly
  tracked unknowns do not block L1 Baseline; silently blank fields do.

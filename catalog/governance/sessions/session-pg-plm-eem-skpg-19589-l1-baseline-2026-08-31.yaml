notes:
  scoringMethod: >-
    Phase 1 (Validate & Verify) of the five-phase procedure in
    ARCHITECTURE_MATURITY.md was run against both patterns. Phases 2 and 3
    (Established and Apex) were not executed — out of scope for an L1 Baseline
    ticket.
  evidenceBasis: >-
    Rounds one and two traced every dependency to a specific artifact in a
    PLM/EEM repository: the production ConfigMap for external dependencies, S3,
    DynamoDB and Step Functions; cd/*/ingress.yml for the Traefik ingress
    class; committed connection strings for the SQL Server estate; CDK
    manifests for SNS, SQS, API Gateway and DocumentDB. Round three added
    Sofa King's own infrastructure documentation, which outranks precedent and
    inference in the DRAFT evidence hierarchy and resolved four questions the
    repositories could not settle. No owner interview has been held at any
    point, which is why pillar, data classification, RTO/RPO and the form
    service's production status remain unconfirmed.
  reviewFeedback: >-
    Round two: Trevor Lane raised two gaps against APEX Architecture L1 -
    missing runtime and edge service objects under criterion 2, and missing
    Jira tracking items under criterion 5. All five factual claims verified
    correct, including a third component defect the original sweep missed. One
    correction back: the cloud tier was NOT complete, because msvc-pg-forms
    fronts on API Gateway and persists to DocumentDB rather than the assumed
    RDS. Round three: the legacy edge object and Windows host version, left
    deliberately open pending CloudOps, were both found in Sofa King's own
    documentation rather than needing an interview - along with answers to the
    database hosting boundary and FORMIXFORMS co-location. Direction given in
    round three was that work still in development or in progress should be
    noted rather than modelled, which is recorded as the
    in-flight-work-is-noted-not-modelled assumption and applied to the form
    service, the Ottoman migration and the EEM MongoDB design.
  encodingRepair: >-
    This file was committed in the previous change with a UTF-8 byte-order mark
    and double-encoded em-dashes (rendering as a-circumflex sequences
    throughout). Both are repaired here; the file is now plain UTF-8 without a
    BOM. No content was changed by the repair.
  boundaryDecisions: >-
    Twenty-nine objects in catalog/engineering/associate-development-engineering
    were reviewed. Nine were claimed across the two patterns. Trainscape (three
    objects, repositories confirmed deleted), Elevate (two objects, repositories
    dormant since 2022 and 2023), and msvc-pg-activity and msvc-pg-content
    (GitHub topics p-fc and s-hcm place them with Sofa King Central, not PG)
    were excluded on Miles Chandler's confirmation. The remaining
    exclusions are other PG sub-products (LX, Micro-Credentials, LCR) and
    non-deployable shared libraries. LIMITATION found in round three: this
    review covered only the PG engineering folder, so PLM/EEM-named services
    catalogued under other teams were never assessed. See unresolved question
    plm-eem-adjacent-services-boundary.

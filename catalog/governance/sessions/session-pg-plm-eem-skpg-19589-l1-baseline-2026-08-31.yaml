      Ottoman migration completes?
    status: deferred
    reason: >-
      Recorded rather than modelled, per the in-flight-work-is-noted-not-modelled
      assumption. OPS-94649 records Octopus deployments of LDMS.Net, LDMS
      Legacy, FORMIX and the PG Report Writer Service to a prod_ottm target as
      already complete, with only the PlmEem Orchestra pipeline outstanding
      (OPS-18728), under PG epic SKPG-82566. The legacy pattern therefore
      describes a topology that is actively changing.
    currentBestGuess: >-
      The legacy applications are gaining a Ottoman production footprint
      alongside, or eventually instead of, the GRR web farm. Whether GRR
      remains, and whether the F5 edge survives the move, is not established.
    impact: >-
      Does not block L1 Baseline - the GRR topology is the established state and
      is documented. Re-model deployment targets when the migration completes,
      and expect the edge and host references to change with it.
    relatedObjects:
      - ref: 01M1F8WB4E-RWQB
  - id: business-pillar-confirmation
    question: >-
      Which business pillar do the PLM/EEM patterns belong to?
    status: deferred
    reason: >-
      business-pillar.people-solutions was carried over from the sibling PG LCR
      pattern rather than confirmed by product ownership. AGENTS.md is explicit
      that pillar IDs are proper nouns and must be assigned by asking the owner,
      never inferred.
    currentBestGuess: >-
      business-pillar.people-solutions, matching the other Associate Development
      entry in the catalog.
    impact: >-
      Does not block L1 Baseline validation, but an incorrect pillar
      misclassifies the product in every business-context rollup.
    relatedObjects:
      - ref: 01M1F8WB4E-8WVS
      - ref: 01M1F8WB4E-RWQB
  - id: data-classification-ratification
    question: >-
      Is "confidential — associate personal data" the correct classification, and
      is payment data in scope?
    status: deferred
    reason: >-
      The classification recorded on both patterns is the authoring team's
      assessment from repository evidence, not an Information Security review.
      STL-LDMS.Net contains an STLI.Shared.Integration.CreditCards project,
      which if live would bring payment data and its associated obligations into
      scope.
    currentBestGuess: >-
      Confidential associate PII is certainly in scope. The credit-card
      integration may be dormant; its status is unknown.
    impact: >-
      Does not block L1 Baseline. Materially affects the security and compliance
      requirement groups and must be settled before any L2 claim.
    relatedObjects:
      - ref: 01M1F8WB4E-RWQB
      - ref: 01M1F8WB4E-MBKA
  - id: component-defects-from-discovery
    question: >-
      Should the mis-recorded component objects be corrected in this change or a
      separate cleanup?
    status: answered
    reason: >-
      RESOLVED, and there were THREE defects, not two. Repository discovery
      recorded STL-FORMIX (01KSM38KG2-8JV3) as JavaScript on Node.js when every
      manifest is a .csproj or .sln; recorded PG-ReportWriter (01KSM38KG3-PN95)
      the same way against an 11-project .NET solution, caught in review and
      missed by the original sweep; and recorded pg-msvc-plm-eem-api
      (01KSM38KG3-P3SC) as running on AWS Lambda Serverless Host when its
      manifests are Kubernetes. All three are corrected.
    currentBestGuess: >-
      Not applicable, resolved. A broader lesson stands: the
      repository-discovery import mis-detected language on at least two of nine
      PG components, so discovery-sourced language and runtime fields should not
      be trusted without checking the repository.
    impact: >-
      Does not block L1 Baseline. Now closed: STL-FORMIX and PG-ReportWriter
      record C# on .NET, and pg-msvc-plm-eem-api points at the PG ASP.NET
      Core 10 on EKS runtime service. STL-FORMIX keeps its .NET Core Application
      Service runsOn deliberately, being a mixed IIS-plus-Lambda estate whose
      split needs an owner decision.
    relatedObjects:
      - ref: 01KSM38KG2-8JV3
      - ref: 01KSM38KG3-PN95
      - ref: 01KSM38KG3-P3SC
  - id: non-standard-tech-jira-items
    question: >-
      What Jira tickets should track the non-standard technology exceptions?
    status: open
    reason: >-
      APEX Architecture L1 criterion 5 requires non-standard technology choices
      to be documented in the catalog "with a tracking item in Jira". Five
      decision records now exist and none has a dedicated ticket; SKPG-19589 is
      still the only tracking item. The five are New Relic (01M1F8WB4E-2ND0),
      Classic ASP and the build/deploy chain (01M1F8WB4E-XJM2), LaunchDarkly
      and Avalara (01M1F8WB4E-9C7X), Salesforce (01M1HJY7E4-CJ8C), and
      ASP.NET Core 10 (01M1F8WB4E-BE9M). Note the last has been narrowed to
      one technology, and that two of the five - Salesforce and ASP.NET
      Core 10 - are organisation-wide cataloguing actions rather than PG
      exceptions. Related work exists but does not satisfy the criterion:
      SKPG-35699 is a backlog Classic ASP modernization epic from a
      story-generator POC, SKPG-38812 is LaunchDarkly flag hygiene under epic
      SKPG-43094, and OPS-320032 shows DocumentDB access already provisioned
      elsewhere at Sofa King. A Jira search across all projects for New Relic,
      LaunchDarkly, Avalara, Classic ASP and DocumentDB since 2025 found no
      existing exception tracking items.
    currentBestGuess: >-
      One ticket per decision record, linked from the record, raised as Tasks
      under epic SKPG-97916 rather than Sub-tasks, since SKPG-19589 and its
      siblings are the Task layer.
    impact: >-
      This is now the ONLY item gating the APEX Architecture L1 claim. Every
      other criterion is met.
    relatedObjects:
      - ref: 01M1F8WB4E-2ND0
      - ref: 01M1F8WB4E-XJM2
      - ref: 01M1F8WB4E-9C7X
      - ref: 01M1HJY7E4-CJ8C
      - ref: 01M1F8WB4E-BE9M
  - id: rds-dependency-uncatalogued
    question: >-
      What managed database does msvc-pg-forms connect to?
    status: answered
    reason: >-
      RESOLVED, and the original premise was wrong. This question assumed an AWS
      RDS dependency because the repository ships rds-combined-ca-bundle.p7b.
      Reading SK.PG.FormService.CDK/FormServiceDbStack.cs shows the CDK
      provisions Amazon DocumentDB: an Amazon.CDK.AWS.DocDB DatabaseCluster with
      a docdb4.0 parameter group and a db.t3.medium instance. DocumentDB uses
      the same RDS certificate bundle for TLS, which is what made that file look
      like RDS evidence.
    currentBestGuess: >-
      Not applicable, resolved from source. Catalogued as data store
      01M1HJY7E4-3NGA with Technology Component 01M1HJY7E4-SKZN, both
      lifecycleStatus candidate and both now recorded as pre-production.
    impact: >-
      Closed the last uncatalogued data dependency against Architecture L1
      criterion 2. The Mongo-compatible platform question it opened is deferred
      rather than an L1 item, because the consuming service is not in
      production.
    relatedObjects:
      - ref: 01KSM38KG3-8PKZ
      - ref: 01M1HJY7E4-3NGA
  - id: form-service-production-status
    question: >-
      Has msvc-pg-forms ever actually been deployed to production?
    status: open
    reason: >-
      STRENGTHENED in the third round from two signals to five, all pointing the
      same way. (1) The repository has no cd/ directory and no codefresh.yml -
      its root holds only cdk.json, windowsBuild.cmd, src/, README.md and the CA
      bundle - so it has no deployment pipeline, where every other claimed
      PLM/EEM component has one. (2) It is absent from the PG pipeline
      inventory in "PG Work Left for PG" (Confluence 39199080479), which lists
      STL-LDMS-Legacy, STL-LDMS.Net, STL-FORMIX, plm-Dashboard-BFF,
      pg-msvc-plm-eem-api, STL-Identity, pg-plm-ui, msvc-ResourceLibrary and
      PG-ReportWriter. (3) FormServiceDbStack.cs leaves DeletionProtection
      commented out, annotated "uncomment when we are ready to go live".
      (4) FormServiceLambdaStack.cs hardcodes the authorizer's idmUrl to
      idgatewayawsstage.skqa.example, a QA endpoint, with a TODO. (5) The authorizer
      runs the end-of-life nodejs14.x Lambda runtime. The conclusion is acted on
      - the component is reclassified lifecycleStatus candidate and its
      dependencies recorded as pre-production - but this question stays OPEN
      because no owner has confirmed it. Evidence-complete is not the same as
      confirmed.
    currentBestGuess: >-
      Built and deployed to lower environments at most, never promoted to
      production.
    impact: >-
      Acting on this simplified the L1 position considerably: DocumentDB, API
      Gateway and the Node.js 14 runtime move out of decision record
      01M1F8WB4E-BE9M and out of the criterion 5 ticket set, and the two
      hardest ARB questions - DocumentDB against the deprecated MongoDB Atlas
      object, and API Gateway as an edge standard - leave the L1 path. If an
      owner confirms the service IS live, all of that reverses and three
      exception tickets are needed.
    relatedObjects:
      - ref: 01KSM38KG3-8PKZ
      - ref: 01M1HJY7E4-3NGA
      - ref: 01M1HJY7E4-RPTG
  - id: dynamodb-and-s3-inventory
    question: >-
      What is the full DynamoDB table inventory, and are the five S3 buckets the
      complete set?
    status: deferred
    reason: >-
      Table names are environment-prefixed at runtime (AwsDynamoTablePrefix) and
      provisioned across CDK stacks, so no static list exists in configuration.
      The five S3 buckets come from the production ConfigMap and may not include
      buckets referenced only in code.
    currentBestGuess: >-
      The five named buckets are the primary set; the DynamoDB footprint is at
      least the EemEvalRights table.
    impact: >-
      Does not block L1 Baseline — both services are catalogued as dependencies.
      Per-resource inventory would be needed for L3 IaC composability.
    relatedObjects:
      - ref: 01M1F8WB4E-8WVS

assumptions:
  - id: l1-scope-is-baseline-only
    statement: >-
      SKPG-19589 requires DRAFT L1 Baseline maturity (rubric level 1) — a valid,
      schema-passing SoftwareDeploymentPattern with unknowns tracked in a
      DraftingSession — not Established or Apex maturity.
    rationale: >-
      The parent epic is titled "APEX L1 Certification" and the acceptance
      criteria match the Baseline criteria in ARCHITECTURE_MATURITY.md.
      Reference-architecture alignment, scalability boundaries, and HA evidence
      are L2 Established criteria and are deliberately not attempted here.
    relatedObjects:
      - ref: 01M1F8WB4E-8WVS
      - ref: 01M1F8WB4E-RWQB
  - id: two-patterns-not-one
    statement: >-
      PLM/EEM is modelled as two SoftwareDeploymentPatterns rather than one,
      split by deployment shape.
    rationale: >-
      Directed by Jordan Hale's team on 2026-08-31, following the
      rh-hiretrack / hcm-rh precedent where a legacy predecessor and its
      modern successor are modelled apart. Note that the split is NOT justified
      by an impending retirement — Miles Chandler confirmed the legacy
      estate is not on a short-term funded retirement plan. The justification is
      the difference in deployment shape and operational model.
    relatedObjects:
      - ref: 01M1F8WB4E-RWQB
      - ref: 01M1F8WB4E-8WVS
  - id: ldms-formix-are-plm-eem-lineage
    statement: >-
      LDMS is PLM's predecessor system and FORMIX is EEM's, so both belong inside
      the PLM/EEM boundary rather than being separate products.
    rationale: >-
      STL-FORMIX contains an EemEvaluationRightsAutomation project, and
      PG-ReportWriter describes itself as the "Report Writer for LDMS and
      Formix". The cloud tier's Step Function is named
      sk-pg-prod-EemEvalRightsAutomation, tying the cloud EEM surface directly
      to the FORMIX automation.
    relatedObjects:
      - ref: 01M1F8WB4E-RWQB
  - id: in-flight-work-is-noted-not-modelled
    statement: >-
      Work that is still in development or in progress is recorded as a note
      against the affected objects rather than modelled as established
      architecture.
    rationale: >-
      Directed during the third-round review. Applied to three things: the
      Ottoman migration of the legacy estate, which is mid-flight per
      OPS-94649 and OPS-18728; msvc-pg-forms and its exclusive dependencies,
      which are pre-production; and the EEM forms-to-MongoDB direction under
      SKPG-68686, which is a design sketch. The purpose is to keep the patterns
      describing deployed state, while preserving the discovery so it is not
      re-found later.
    relatedObjects:
      - ref: 01M1F8WB4E-RWQB
      - ref: 01M1F8WB4E-8WVS
      - ref: 01KSM38KG3-8PKZ
unresolvedQuestions:
  - id: legacy-database-hosting-boundary
    question: >-
      Does the STL SQL Server estate run in the Grand Rapids data center, or on
      AWS-hosted Windows servers joined to the corporate domain?
    status: answered
    reason: >-
      RESOLVED in the third round: grr-datacenter, and the AWS hostname was a
      red herring. The PLM/EEM Environment Guide (Confluence 648381633) lists
      the production database tier as GRRPGDB01 (10.219.40.87) and GRRPGDB02
      (10.175.40.88) on Windows Server 2022 at GRR, and the PG maintenance plan
      inventory (Confluence 604045714) names the two availability groups
      GRRPGPRDAG01 and GRRPGPRDAG02 that hold STL and FORMIXFORMS. The
      Data Source=AWSPGDB01S.corp.flp string that created the contradiction
      follows the Environment Guide's own environment-suffix convention -
      AWSPLMWEB01Q is QA, AWSPLMWEB01S is stage, and AWSPGDB01Q is documented
      as the QA database in Confluence 422904436 - so AWSPGDB01S is the AWS
      STAGE database, read out of a release configuration file. tcp:ag1 is a GRR
      availability group.
    currentBestGuess: >-
      Not applicable, resolved from infrastructure documentation.
    impact: >-
      Removes the blocker this question placed on selecting a reference
      architecture at L2, since the two candidate patterns differed on exactly
      this point. The legacy pattern's deployment target is now asserted rather
      than caveated.
    relatedObjects:
      - ref: 01M1F8WB4E-RWQB
      - ref: 01M1F8WB4E-MBKA
  - id: database-host-and-version-assumed
    question: >-
      What host and SQL Server version do the STL and FORMIXFORMS databases
      actually run on?
    status: answered
    reason: >-
      SUPERSEDED in the third round - split into its two halves, one resolved
      and one not. The OS version is resolved: Windows Server 2022, per the
      Environment Guide, so both data store objects are repointed from Windows
      Server 2019 Physical Standard Host (01KQQ5JT04-F2AX) to Windows Server
      2022 Physical Standard Host (01KQQ5JT04-PGTY). Two residues remain and
      are tracked separately: legacy-windows-host-hypervisor and
      database-version-assumed. This question is closed only so that its two
      successors can be tracked distinctly; the SQL Server version is still an
      assumption in the graph.
    currentBestGuess: >-
      Not applicable, superseded.
    impact: >-
      The highest-priority follow-up from the first round is half closed. One
      unverified technology fact remains in the graph - the SQL Server version -
      and it now has evidence pointing away from the declared value.
    relatedObjects:
      - ref: 01M1F8WB4E-MBKA
      - ref: 01M1F8WB4E-R0RG
  - id: database-version-assumed
    question: >-
      Which SQL Server version runs the STL and FORMIXFORMS production estate?
    status: open
    reason: >-
      Successor to database-host-and-version-assumed. Microsoft SQL Server 2019
      (01KQQ5JT1T-F6Q1) remains declared on both data store objects because the
      schema requires a primaryTechnologyComponent when deliveryModel is
      self-managed. It is unverified, and the evidence now points away from it:
      the Environment Guide records the DR pair DRPGDB01/DRPGDB02 running SQL
      Server 2016 Enterprise Edition, and a DR replica normally matches or
      trails production. SQL Server 2016 is marked deprecated in this catalog,
      so if production is 2016 this becomes an L2 Established finding as well
      as a factual correction.
    currentBestGuess: >-
      Possibly SQL Server 2016 Enterprise rather than 2019, on the strength of
      the DR pair. Not asserted - substituting one unverified value for another
      would not be an improvement.
    impact: >-
      One unverified technology fact remains in the graph looking
      authoritative. The PG database Confluence pages are authored by Tony
      Sandoval and Jared Kemp, who should be able to confirm quickly.
    relatedObjects:
      - ref: 01M1F8WB4E-MBKA
      - ref: 01M1F8WB4E-R0RG
  - id: legacy-windows-host-hypervisor
    question: >-
      Is the GRR PLM/EEM Windows estate physical or VMware?
    status: open
    reason: >-
      Successor to database-host-and-version-assumed and to
      legacy-windows-host-version. The OS version is settled at Windows Server
      2022, but the catalog splits Windows Server 2022 into a physical host
      object (01KQQ5JT04-PGTY, lifecycleStatus preferred) and a VMware host
      object (01KQQ5JT04-A7W8, lifecycleStatus deprecated). The
      deployment-targets vocabulary describes GRR as Sofa King-owned VMware
      hardware, which would point at the deprecated object. The physical object
      is declared instead, because asserting deprecated infrastructure on the
      strength of a vocabulary description would be the worse of the two
      errors.
    currentBestGuess: >-
      Unknown. If VMware is confirmed, both data store objects and the three
      IIS components should be repointed at 01KQQ5JT04-A7W8, and the deprecated
      lifecycle of that host becomes an L2 Established finding for the estate.
    impact: >-
      Does not block L1 Baseline - the runtime-service layer is resolved either
      way. Determines whether the legacy estate carries a deprecated host
      dependency at L2. CloudOps or Axonius should have this.
    relatedObjects:
      - ref: 01M1F8WB4E-MBKA
      - ref: 01M1F8WB4E-R0RG
      - ref: 01KSM38KG3-05HQ
  - id: formixforms-production-host
    question: >-
      Where does the FORMIXFORMS database run in production, and is it
      co-located with the STL database?
    status: answered
    reason: >-
      RESOLVED in the third round, and the original assumption was correct. The
      PG maintenance plan inventory (Confluence 604045714) lists FORMIXFORMS on
      availability group GRRPGPRDAG01 alongside STL, FORMIXAUDIT and SSISDB, and
      the Associate Development Data Life Cycle Policy (Confluence 640421777)
      states that two production SQL Server instances host the PG databases.
      The two databases are co-located, so the legacy pattern's data service
      group does not need splitting.
    currentBestGuess: Not applicable, resolved.
    impact: >-
      Closes the risk that the legacy pattern's data service group
      misrepresented two separate platforms as one.
    relatedObjects:
      - ref: 01M1F8WB4E-R0RG
  - id: legacy-edge-gateway-unconfirmed
    question: >-
      What terminates ingress for the legacy web tier?
    status: answered
    reason: >-
      RESOLVED in the third round: F5 BIG-IP, from documentation rather than
      precedent. The PLM/EEM Environment Guide (Confluence 648381633) carries an
      explicit F5 pool column in its GRR Production Environment table,
      assigning pool Prod_LDMS_80 to the six-node web farm GRRPLMWEB01P-06P and
      pool Prod_LDMS_ReportWriter_80 to GRRPLMRW01-02. Corroborated by the GRR
      Patching Guide (Confluence 26214756) and by the IDM rollout runbook
      (Confluence 145694490), which disables nodes from an F5 pool before
      deploying LDMS Legacy, LDMS .Net and FORMIX. F5 BIG-IP (01KQQ5JT00-Z6WV)
      is now referenced from a Web Edge and Routing service group on the legacy
      pattern, matching the rh-hiretrack shape that was originally only
      precedent.
    currentBestGuess: Not applicable, resolved.
    impact: >-
      Closes the last outstanding element of APEX Architecture L1 criterion 2.
      The legacy pattern's web zone now has a terminating edge object.
    relatedObjects:
      - ref: 01M1F8WB4E-RWQB
      - ref: 01KQQ5JT00-Z6WV
  - id: legacy-windows-host-version
    question: >-
      Which Windows Server version hosts the IIS-based legacy components?
    status: answered
    reason: >-
      RESOLVED in the third round: Windows Server 2022. The Environment Guide's
      GRR Production Environment table records Windows Server 2022 for every
      production PLM/EEM server - the six web/app nodes, both report writers,

      legacy-windows-host-hypervisor.
    currentBestGuess: Not applicable, resolved.
    impact: >-
      Removes the risk of repeating the assumed-host mistake, and gives the
      three IIS components and both data stores a defensible host reference.
    relatedObjects:
      - ref: 01KSM38KG3-05HQ
      - ref: 01KSM38KG3-2N7T
      - ref: 01KSM38KG3-PN95
  - id: imperva-in-legacy-inbound-path
    question: >-
      Does Imperva Web Application Firewall sit in front of the legacy F5 for
      PLM/EEM?
    status: open
    reason: >-
      Raised in the third round alongside the F5 resolution. Imperva Web

  - id: stl-identity-pattern-ownership
    question: >-
      Which pattern should own STL-Identity — the cloud tier it runs on, or the
      legacy tier it exists to integrate with — and does its queue processor
      run on Lambda at all?
    status: open
    reason: >-
      WIDENED in the third round. The original question was one of pattern
      placement: STL-Identity runs as CDK-deployed Lambda functions, which
      places it in the cloud tier, but its purpose is the STL integration queue
      processor, which serves the legacy estate. A runtime question now sits
      underneath it. The Environment Guide records a pg-queueprocessor-prod EC2
      instance (i-7d014351, 172.28.4.33) in the Sofa King_STL account
      (248376931381), described as a utility service whose alerts can show as
      ftp-server-2. If the integration queue processor runs on that instance,
      then this component's runsOn of AWS Lambda Runtime describes only its PG
      Lambda half, and a host or second runtime is missing from the graph.
    currentBestGuess: >-
      Placed in the cloud services pattern on the basis of its Lambda estate.
      The queue processor most plausibly runs on the pg-queueprocessor-prod EC2
      instance, which would make the component a two-runtime service that may
      warrant splitting.
    impact: >-
      Does not block L1 Baseline; the component references a runtime service.
      Placement determines which pattern carries the relationship object at L2,
      and the runtime split determines whether the graph is accurate.
    relatedObjects:
      - ref: 01M1F8WB4E-8WVS
      - ref: 01M1F8WB4E-RWQB
      - ref: 01KSM38KG2-Y4KV
  - id: plm-eem-adjacent-services-boundary
    question: >-
      Should plm-Dashboard-BFF and Rubric Designer be claimed by the PLM/EEM
      patterns, or do they correctly belong to the Ottoman platform?
    status: open
    reason: >-
      Raised in the third round. The boundary review in this session considered
      only the 29 objects in catalog/engineering/associate-development-engineering,
      so two PLM/EEM-named services with live PG deployment pipelines were never
      assessed. Both are catalogued under ottoman-platform-engineering:
      plm-Dashboard-BFF (product-component-plm-dashboard-bff) and Rubric
      Designer (product-component-platform-msvc-rubricdesigner). "PG Work Left
      for PG" (Confluence 39199080479) lists plm-Dashboard-BFF in the PG
      pipeline inventory and shows plm-dashboard-bff pods running on
      stage-ottoman, and OPS-57657 tracks Rubric Designer PROD deployment with
      msvc-rubricdesigner-deployment-prod-ml pods. Rubrics are core EEM
      functionality and the BFF is PLM-named.
    currentBestGuess: >-
      Both are genuinely PG functionality hosted on the shared platform, which
      is a legitimate reason for the Ottoman placement - but the placement was
      never a decision, it is where repository discovery put them. An owner
      should confirm rather than the placement being inherited by default.
    impact: >-
      Potentially material to APEX Architecture L1 criterion 1, which requires
      the pattern to define the app's components. If either service is properly
      PLM/EEM, the patterns are incomplete. Recorded as a question rather than
      a gap because both objects do exist in the catalog and the platform
      placement is defensible.
    relatedObjects:
      - ref: 01M1F8WB4E-8WVS
      - ref: 01M1F8WB4E-RWQB

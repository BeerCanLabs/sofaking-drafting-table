unresolvedQuestions:
  - id: confirm-diagram-listed-external-integrations
    question: >-
      Which diagram-listed integrations are implemented today, and what are
      their exact Recliner source components and protocols: AI Gateway,
      DevExpress, Ad-hoc Reporting, AI Goals, Financing, RTI, Collaboration
      Portal, Cross-Platform Customer Transfer, and SOM Sync?
    status: deferred
    reason: >-
      These names came from architecture material, but this repository pass
      did not provide enough evidence to create trustworthy first-class
      relationships for every integration.
    currentBestGuess: >-
      DevExpress and ad-hoc reporting consume the Report Data Provider;
      document transfer uses the Document Sharing and Transferring logical
      service. The remaining source components and protocols require owner
      confirmation.
    impact: >-
      Does not block L1 Baseline because the integrations are explicitly
      tracked rather than silently asserted. Confirmed paths should be added
      later as relationship objects.
    relatedObjects:
      - ref: 01KSM38KGH-A6GC
  - id: confirm-waf-posture
    question: >-
      Does Recliner's public CloudFront or BFF Traefik-ALB path use a
      product-specific WAF, or is application-layer filtering entirely
      provided by the shared platform?
    status: deferred
    reason: >-
      Carried forward from OPS-749918. The som-recliner repository's Terraform
      does not define a product-specific WAF resource for either path, but
      that leave does not prove no shared-platform WAF applies upstream.
    currentBestGuess: >-
      No Recliner-owned WAF is evidenced in the repository; any filtering is
      part of shared platform infrastructure until confirmed otherwise.
    impact: >-
      Does not block L1 Baseline; a confirmed WAF posture can be linked
      later without changing the product boundary.
    relatedObjects:
      - ref: 01KSM38KGH-A6GC
      - ref: 01KZ9NXCX5-M6SK
  - id: frontend-api-base-url-confirmation
    question: >-
      What API base URL does the built Recliner Angular application actually
      call in each environment — the BFF's own Traefik-fronted hostname, or
      some other gateway-fronted hostname?
    status: deferred
    reason: >-
      No environment configuration file exposing a literal API base URL was
      found during this session's repository review; the conclusion that the
      web shell calls the BFF's own hostname is inferred from the BFF serving
      the application's starting index.html, not from a directly observed
      config value.
    currentBestGuess: >-
      The web shell most plausibly calls the BFF's own Traefik-fronted
      hostname directly, matching the confirmed Traefik-to-BFF ingress path.
    impact: >-
      Confirming this would let relationship-recliner-web-shell-calls-kong-gateway.yaml
      be replaced outright rather than left downgraded to incomplete.
    relatedObjects:
      - ref: 01KSR5D4EA-6642
      - ref: 01KZ9NXCX5-M6SK
assumptions:
  - id: repo-supersedes-confluence-for-verified-claims
    statement: >-
      Where the som-recliner repository's checked-in infrastructure code and the
      Recliner Infrastructure Architecture Confluence page disagree on a
      specific, directly-observable claim, the repository is treated as
      current source of truth and the Confluence page as a proposed design
      that has since diverged, per the requester's explicit instruction.
    rationale: >-
      The Confluence page's own title carries a "[DRAFT]" suffix, and its
      content describes itself as "our proposed infrastructure architectural
      diagram" — it was never asserted as confirmed current state for the
      specific claims corrected in this session.
    relatedObjects:
      - ref: 01KSM38KGH-A6GC
  - id: turn-1-scope-is-baseline-only
    statement: >-
      OPS-306834 requires DRAFT L1 Baseline Maturity (rubric level 1) — a
      valid, schema-passing SDP with explicit unknowns tracked in a
      DraftingSession — not Established or Apex maturity.
    rationale: >-
      The ticket title ("Turn 1 — DRAFT L1 Baseline Adoption") and Definition
      of Done match the Baseline criteria in ARCHITECTURE_MATURITY.md, not
      the Established or Apex criteria.
    relatedObjects:
      - ref: 01KSM38KGH-A6GC

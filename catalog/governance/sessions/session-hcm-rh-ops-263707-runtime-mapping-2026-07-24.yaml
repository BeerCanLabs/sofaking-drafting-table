unresolvedQuestions:
  - id: loveseat-shared-service-object
    question: >-
      Which governed shared-service object should represent the Loveseat event
      bus?
    status: deferred
    reason: >-
      The current catalog has no shared Loveseat service object, and creating
      that cross-product service is outside this product-specific L1 review.
    currentBestGuess: >-
      Use externalTarget "Loveseat Event Bus" for the evidenced HCM RH
      relationship until the shared service is catalogued.
    impact: >-
      The dependency is explicit and does not block L1 closure, but it cannot
      yet inherit lifecycle and capability metadata from a shared object.
    relatedObjects:
      - ref: 01KYAVGDVV-D7YM
  - id: unversioned-repository-components
    question: >-
      Which exact runtime versions apply to the remaining repository-discovered
      HCM RH components that currently record only generic .NET, Node.js,
      PowerShell, Swift, or host-level EKS signals?
    status: deferred
    reason: >-
      OPS-263707 requires only the confirmed Node.js frontend and ASP.NET Core
      backend L1 mapping; unversioned component enrichment is a deeper
      inventory task.
    currentBestGuess: >-
      Preserve their existing host/runtime signals until owners confirm exact
      versions rather than assigning the new version-specific runtimes by
      inference.
    impact: >-
      Those lower-level repository stubs remain candidates for later catalog
      enrichment but do not change the confirmed L1 product boundary.
assumptions:
  - id: confirmed-l1-boundary
    statement: >-
      The L1 product boundary uses HCM RH App, HCM RH Core, and HCM RH Fork
      Util Organization API, as confirmed by Toby Hanley for OPS-598732.
    impact: >-
      Runtime mapping focuses on the independently deployed frontend and
      backend workloads; the Fork Util client library remains catalogued but
      is not represented as an independent deployment.
    relatedObjects:
      - ref: 01KSM38KG5-49X9
      - ref: 01KSM38KG5-FBRT
      - ref: 01KSM38KG5-VM7E
  - id: current-state-lifecycle
    statement: >-
      Node.js 20 is recorded as the observed current state even though its
      governed TechnologyComponent is deprecated.
    rationale: >-
      Architecture L1 records the deployed runtime and its lifecycle signal;
      OPS-263707 explicitly excludes upgrades and remediation dates.
    relatedObjects:
      - ref: 01KYAVGDVV-EKJ2
  - id: fork-util-is-a-library
    statement: >-
      HCM RH Fork Util Organization API is a C# client library rather than an
      independently deployed API service.
    rationale: >-
      Its existing description identifies it as an Organization API client
      library and the repository evidence lists a library csproj and test
      project, with no independent deployment manifest.
    impact: >-
      Its inaccurate EC2-backed runtime link is removed and it is not placed in
      an SDP deployment service group.
    relatedObjects:
      - ref: 01KSM38KG5-VM7E

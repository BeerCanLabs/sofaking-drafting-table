unresolvedQuestions:
  - id: reconcile-ticket-and-implementation
    question: >-
      Is the Python/FastAPI, S3, Lambda, SQS, Bedrock, and EKS-worker flow in
      OPS-362835 still the intended target, or has the Node/Express two-service
      implementation replaced it?
    status: open
    reason: The Jira design and current repository materially disagree.
    currentBestGuess: >-
      The current Node/Express API and React/NGINX frontend define the initial
      deployment; the AWS asynchronous workflow is a future phase.
    impact: >-
      Determines whether worker and Lambda ProductComponents and AWS dependency
      relationships must be added.
    relatedObjects:
      - ref: 01KY5775KP-RYCC
      - ref: 01KY5775KP-FZPJ
  - id: confirm-rds-standard
    question: >-
      What RDS PostgreSQL engine version, Multi-AZ topology, authentication,
      encryption, backup, retention, RTO, and RPO should the deployed service use?
    status: open
    reason: OPS-362835 names RDS PostgreSQL but does not define its configuration.
    currentBestGuess: Private AWS-managed RDS PostgreSQL; exact standard pending Cloud Engineering.
    impact: The candidate AWS RDS for PostgreSQL service cannot be approved or marked complete.
    relatedObjects:
      - ref: 01KY5775KP-YBP0
      - ref: 01KY5775KP-AXH7
  - id: confirm-data-classification
    question: >-
      Is internal/no-PII the correct classification for compliance policy,
      rules, and validation-run context and audit metadata?
    status: open
    reason: >-
      The observed schema has no explicitly named PII fields, but
      rule_validation_run.context_json accepts caller-supplied evaluation input
      and governance classification was not documented.
    currentBestGuess: internal; containsPII false
    impact: Drives data protection, retention, and active-control requirements.
    relatedObjects:
      - ref: 01KY5775KP-AXH7
      - ref: 01KY5775KP-RYCC
  - id: confirm-authentication
    question: What user and service authentication protects the web UI and REST API?
    status: open
    reason: No authentication middleware or production ingress configuration is present in the repository.
    currentBestGuess: Platform-standard identity at ingress or application layer; not yet evidenced.
    impact: Identity, access-control, and secrets requirements cannot be closed.
    relatedObjects:
      - ref: 01KY5775KP-9YH4
      - ref: 01KY5775KP-FZPJ
  - id: network-zone-elicitation
    question: Are ingress, application pods, and database segmented into distinct network zones in LE1 and Chaise?
    status: open
    reason: The required Network Zone and Connection Elicitation interview has not been run.
    currentBestGuess: ALB ingress, private EKS application, and private data boundaries; not asserted in the SDP.
    impact: Network-zone assignments and boundary-crossing relationships may be incomplete.
    relatedObjects:
      - ref: 01KY5775KP-RYCC
  - id: availability-and-dr
    question: What production availability target, replica range, RTO, RPO, and disaster-recovery posture apply?
    status: open
    reason: HPA is planned for stage/prod, but service-level objectives and recovery posture are absent.
    currentBestGuess: HPA on Chaise with provider-managed EKS recovery; database HA unresolved.
    impact: Availability and failure-domain decisions remain incomplete.
    relatedObjects:
      - ref: 01KY5775KP-RYCC
      - ref: 01KY5775KP-YBP0
  - id: confirm-mesh-onboarding-details
    question: >-
      Which Kubernetes namespaces, mesh name, injection labels or annotations,
      and traffic policies will onboard the frontend and API to Kong Mesh?
    status: open
    reason: >-
      Mesh participation is owner-confirmed future architecture, but the
      workload and namespace manifests are not yet linked.
    currentBestGuess: >-
      The frontend and API use injected Envoy-based data planes in the shared
      default Kuma mesh; the migration Job is not mesh-injected.
    impact: >-
      Exact workload identity, mTLS, traffic policy, and sidecar behavior cannot
      be verified until the deployment manifests are available.
    relatedObjects:
      - ref: 01KY5775KP-9YH4
      - ref: 01KY5775KP-FZPJ
      - ref: 01KYAXMZ7H-KJT2
assumptions:
  - id: current-source-precedence
    statement: The current Node/Express and React/NGINX source tree is implementation reality; conflicting Jira details are planned architecture.
    rationale: Repository manifests and source are direct implementation evidence and OPS-507039 confirms an initial two-service deployment.
    impact: Ticket-only AWS workflow components are deferred rather than represented as deployed.
    relatedObjects:
      - ref: 01KY5775KP-RYCC
  - id: cluster-region
    statement: Staging deploys to LE1 and production deploys to Chaise; both are EKS deployment contexts in AWS us-east-1.
    rationale: >-
      The architecture owner confirmed the stage/production cluster split on
      2026-07-27; Atlassian EKS and External Secrets documentation supplies the
      region/account context.
    relatedObjects:
      - ref: 01KY5775KP-RYCC
  - id: team-vocabulary-mapping
    statement: Platform Engineering maps to the approved Ottoman / Platform Engineering team.
    rationale: The owner selected Platform Engineering and that is the matching approved team entry.
    relatedObjects:
      - ref: 01KY5775KP-RYCC
  - id: rds-service-stub
    statement: AWS RDS for PostgreSQL is modeled as a candidate shared-service stub rather than substituting the existing Aurora PostgreSQL standard.
    rationale: OPS-362835 explicitly requests RDS PostgreSQL, and Aurora is not assumed equivalent.
    relatedObjects:
      - ref: 01KY5775KP-YBP0
  - id: argocd-gitops-delivery
    statement: >-
      Platform Compliance Engine is delivered through ArgoCD GitOps to staging
      on LE1 and production on Chaise.
    rationale: >-
      The architecture owner confirmed ArgoCD as the deployment method, and DRAFT
      already provides the preferred shared ArgoCD GitOps Service
      (01KQQ5JT1E-01JZ).
    relatedObjects:
      - ref: 01KY5775KP-RYCC
      - ref: 01KQQ5JT1E-01JZ
  - id: kong-mesh-participation
    statement: >-
      The frontend and API application workloads will participate in the shared
      Kong Mesh through Kuma/Envoy data planes; mesh participation is not
      asserted for the one-shot database migration Job.
    rationale: >-
      The architecture owner confirmed that the service will be mesh-connected.
      The repository separates the service into frontend, API, and migration
      workloads, and the shared Kong Mesh standard already covers LE1 and
      Chaise.
    relatedObjects:
      - ref: 01KY5775KP-9YH4
      - ref: 01KY5775KP-FZPJ
      - ref: 01KYAXMZ7H-KJT2

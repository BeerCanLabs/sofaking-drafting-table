unresolvedQuestions:
- id: region-reconciliation-1g0d
  question: 'What are the correct AWS regions for 1G0D''s service groups - both the three IMR groups still carrying the owner-interview-required sentinel, and the three legacy tiers (Legacy Trackweb-IM Web Tier, Legacy Database Tier, Legacy Integration & ETL) that assert aws-us-east-1 without confirmed evidence?'
  status: open
  reason: 'This is the original spike''s flagged "aws-us-east-1 vs aws-us-east-2" inconsistency (TRK-870 AC item 3). Revised 2026-08-22 - leaving aws-us-east-2 in place was itself a silent assertion of an unverified fact, so the three affected IMR service groups now carry the owner-interview-required sentinel instead, matching the convention already used for Client Tooling. Revised again 2026-08-25 - the developer questionnaire confirms the region question is not answerable by the product team and needs CloudOps or the AWS console, and it also surfaced that the three legacy tiers'' aws-us-east-1 values were carried over from the original catalog import and have never been confirmed either. The questionnaire notes no IaC exists in any IMM repository (no serverless.yml, SAM/CloudFormation, or deploy workflows; IMR-IaC has had no commits since March 2022), so Terraform is not an available authoritative source - CloudOps, the AWS console, or CMDB is.'
  currentBestGuess: For IMR, the specific account 126293295630 / VPC vpc-045b95b44db215688 / subnet detail is more likely to reflect a real, confirmed deployment than a generic vocabulary default, but this is not independently verified. For the legacy tiers, no informed guess - the value has never been evidenced. If imr-retirement-scope resolves as confirmed, the IMR half of this question becomes moot.
  impact: Does not block Baseline (1) - the requirement is deployment targets be recorded and unknowns tracked, not perfectly reconciled. Blocks the "deployment model internally consistent" row of the questionnaire's own L1 closure table. Should be resolved before claiming Established (2).
  relatedObjects:
  - ref: 01KSM38KFD-1G0D
- id: imr-retirement-scope
  question: Is IMR (IM Refresh) actually retired, and if so what is the full scope of the retirement - was the rebuild cancelled before deployment, or was deployed infrastructure decommissioned, and what became of any regions already migrated onto it?
  status: open
  reason: 'The IMM DRAFT L1 developer questionnaire records "IMR is retired - confirmed by Kiran Aziz, Slack, 2026-08-20" and directs that the six IMR service groups be removed from 1G0D. That has not been done here, for three reasons. First, the evidence is a single Slack statement with no decision record, no scope, and no confirmation that the speaker owns the IMR estate; DRAFT''s evidence hierarchy accepts SME statements but requires them recorded and attributed, and this one drives a destructive change. Second, 1G0D describes IMR infrastructure with named, specific resources (AWS account 126293295630, EKS cluster imr-prod v1.35, VPC vpc-045b95b44db215688, three AZ subnets, public ALB imr-prod-traefik with ACM, multi-tenant Aurora PostgreSQL with RLS, node autoscaling 1-50) - if any of that still exists, deleting it from DRAFT makes the catalog stop reflecting reality, which is the failure mode DRAFT exists to prevent. Third, retiring IMR is a pattern-wide change, not a service-group deletion: this object''s description, aliases, tags (imr, microservices), followsReferenceArchitecture link to 01KQQ5JT1D-DAAM, and six architectureNotes fields (failureDomain, deploymentTargets, patternDeviations, availabilityModel, itcTenancyModel, migrationStrategy) all assert IMR as current, as does DecisionRecord 01KT16XHME-YWTR. Removing only the service groups would leave the pattern internally inconsistent - failing the exact L1 row the change is meant to close.'
  currentBestGuess: 'Not determined. The pattern''s own description says regions were actively migrating from legacy to IMR, so "retired" most likely means the rebuild programme was stopped, but whether infrastructure was decommissioned, whether any region ever ran on IMR, and where those regions run now are all unanswered. The eight IMR deployable objects (01KQQ5JT04-6F8T, 01KQQ5JT04-P7QJ, 01KQQ5JT1E-4060, 01KQQ5JT1D-MY47, 01KQQ5JT00-X90C, 01KQQ5JT1E-HCBR, 01KQQ5JT05-12C2, 01KQQ5JT05-WX2Z) are shared-infrastructure objects that may be referenced by other SDPs, so their disposition is a separate question from this pattern''s service groups.'
  impact: Blocks a clean answer to region-reconciliation-1g0d for the IMR half. Does not block Baseline (1) now that the claim is explicitly recorded rather than silently applied. A confirmed retirement needs its own decision record and a pattern-wide pass before any content is removed.
  relatedObjects:
  - ref: 01KSM38KFD-1G0D
- id: whm-integrations-repo-not-found
  question: 'EN0P''s cataloged repoUrl (https://github.com/BeerCanLabs/sk-WHM_Integrations) returned a flat 404 on the GitHub API as of 2026-08-19, with no rename redirect. Was this repository deleted, transferred out of the BeerCanLabs org, or renamed to something that does not obviously match?'
  status: answered
  reason: 'Resolved 2026-08-19 via Slack: the repository was never deleted, transferred, or renamed - it has existed continuously since 2022 and was last updated 2026-08-12. The 404 was a personal GitHub access gap on the reporting account. Kiran Aziz (repo owner) confirmed this directly ("You probably just don''t have access to that WHM Integrations repo. I will add you to it.") and granted access the same day. A subsequent clone and direct repository read (see decision record 01M0DH79Q9-B3AP) confirms the repository is real, live, and matches the original 2026-05 bulk-discovery content.'
  currentBestGuess: Not applicable - resolved. BeerCanLabs/sk-IMR-Integration remains a distinct, unrelated, IMR-scoped stub and should not be linked to EN0P.
  impact: No longer blocks EN0P enrichment; enrichment is complete as of this update.
  relatedObjects:
  - ref: 01KSM38KFC-EN0P

- id: whm-integrations-runson-host-mapping
  question: Does runsOn (01KQQ5JT01-QFN5, a single SQL Server host) correctly represent WHM_Integrations' real infrastructure, or does it need to become a multi-host/multi-runtime relationship?
  status: open
  reason: 'Direct repository read identified 4 distinct named production SQL Server hosts (AWSBRSPRDLIST1-4.brannocksoft.local) running the SSIS/SQL-Agent majority, plus 2 always-on Windows Services and an AWS Lambda/Node.js stack (BrannockIntegratorAws/) that don''t map to a single SQL Server host at all. Narrowed 2026-08-25 by the developer questionnaire, which supplied real host detail for two of the three substrates: both Windows Services run on prod BRSSSISPRDDB1\BRSSSISPRDDB1,58776, stage AWSBRSPRDLIST6.brannocksoft.local\AWSBRSPRDLIST6,60173, and dev BRSDEVDB1/BRSDEVDB2.brannocksoft.local,64121; the Lambda/Node stack runs in AWS account 675180657723, us-east-1. Those facts are now recorded in EN0P''s runtimeHostMapping. What remains open is narrower: the four shared SQL Agent hosts were left without DRAFT or CMDB identifiers in the questionnaire (the identifier column and the confirmed-by column are both blank for all four rows), so there is still no valid object for runsOn to point at, and none of the four rows carries a confirming name or date.'
  currentBestGuess: Likely needs Host objects for AWSBRSPRDLIST1-4 plus separate objects for the Windows Services and the Brannock AWS/Node stack, rather than one runsOn value. DRAFT's runsOn is single-valued and structurally cannot express three coexisting substrates, so the component's availabilityModel, failureDomain, and runtimeHostMapping carry that detail instead - an accepted modelling limitation, not an omission.
  impact: Does not block Baseline (1) - the gap is explicitly tracked here. Should be resolved before claiming Established (2). Creating the four Host objects needs CMDB identifiers that nobody has supplied yet.
  relatedObjects:
  - ref: 01KSM38KFC-EN0P
- id: whm-integrations-lambda-iac-source
  question: Which repository or pipeline deploys the WHM_Integrations AWS Lambda/Node "Brannock" stack into account 675180657723?
  status: open
  reason: Confirmed 2026-08-25 by the developer questionnaire that no IaC exists inside WHM_Integrations - no serverless.yml, no SAM or CloudFormation template, and no .github/workflows - yet the stack is real and running (BrannockIntegratorAws/Lambda/launchInstanceTemplateFromS3Event.js responds to S3 ObjectCreated:Put by calling EC2.runInstances, alongside Node services under DataMapper/, EmailActivities/, BrannockApiGateway/, and Integrator/intg-dash/). It is therefore deployed from somewhere outside the repository that has not been identified.
  currentBestGuess: No informed guess - needs CloudOps or whoever administers account 675180657723 to identify the deploying repository, pipeline, or manual process.
  impact: Does not block Baseline (1). An undeployable-from-source component blocks Apex (3), which requires deployable IaC metadata, and leaves a real operational gap - nobody has identified how this stack is redeployed if lost.
  relatedObjects:
  - ref: 01KSM38KFC-EN0P
- id: whm-integrations-secrets-hygiene
  question: Do the six tracked (non-gitignored) config.yaml files under WHM_Integrations' Python ETL pipelines contain live secrets, and if so, do they need rotation?
  status: open
  reason: 'Direct repository read found six config.yaml files tracked in git (not gitignored) under _Python_Integration/AI_Log_Monitor, CommonOps_ETLPipeline/PullRemoteSTFPFile, Custom_Integrations/ChargesPayments_MyStoreBucks, Custom_Integrations/Export_ETLPipeline, Custom_Integrations/MDM_ETLPipeline, and CIS_ETLPipeLine/Arbor - one of which (AI_Log_Monitor/config.yaml.example) contains a comment falsely claiming these files are gitignored. File contents were deliberately not opened, per the workspace''s secrets-handling rule. Separately, _Python_Integration/CIS_ETLPipeLine/Arbor/src/api_client.py logs the Arbor API certificate value on every call. Revised 2026-08-25 - the developer questionnaire''s secrets-hygiene remediation table was left entirely blank (no ticket, no owner, no status for any of the four findings), so five days after the finding was raised there is still no tracked remediation, in contrast to the analogous Zebra Tools credential which is ticketed as TRK-686 with a named owner.'
  currentBestGuess: Not determined - requires the developer's own review of the tracked files' actual contents and, if secrets are present, rotation plus a .gitignore fix. The certificate-in-logs defect is independent of the config files and needs its own fix regardless of what the config files contain.
  impact: 'Security concern, separate from and not blocking TRK-870''s DRAFT catalog closure. Weight increased by the confirmed containsPII=true correction: this system stages full customer and parent directory PII and CustomerID-linked payment records. Needs a ticket and an owner before the L1 decision is signed.'
  relatedObjects:
  - ref: 01KSM38KFC-EN0P
- id: whm-integrations-classification-fit
  question: Is data_component the right object type for WHM_Integrations long-term, given it includes 2 always-on Windows Services and an AWS Lambda/Node application stack alongside its SSIS/SQL-Agent/schema majority?
  status: open
  reason: data_component's definition is first-party data-structure code (schemas, migrations, stored procedures, scheduled jobs), the data-layer peer of ProductComponent. WHM_Integrations' Windows Services and Lambda/Node stack are application runtime code, not data structures, and sit awkwardly under that definition. Revised 2026-08-25 - the developer questionnaire asked whether the Windows Services and Brannock AWS stack should become separate product_component records while SSIS/SQL remains the data_component, and the recorded answer is "Yes". However the questionnaire's own "Decision and owner/date" field captured only the word Yes, with no owner and no date, so there is no accountable decision to implement against. Left unimplemented rather than acting on an unattributed answer.
  currentBestGuess: Split into separate product_component objects for the two Windows Services and the Brannock AWS/Node stack, leaving a narrower data_component for the SSIS/SQL-Agent/schema side - this is the direction the team indicated, and it also unblocks a sensible runsOn per object. Needs a named decision owner and date before implementation.
  impact: Does not block Baseline (1). Implementing it would resolve much of whm-integrations-runson-host-mapping as a side effect, since each split object would have a single natural runtime substrate.
  relatedObjects:
  - ref: 01KSM38KFC-EN0P
- id: whm-zebra-tools-deployment-target
  question: Where is WHM_Zebra_Tools' (0A26) installer artifact actually built, stored, and distributed from today?
  status: answered
  reason: 'Resolved 2026-08-25 by the Trackweb-IM development team via the IMM DRAFT L1 developer questionnaire. The installer is built manually with InstallShield inside Visual Studio - no pipeline, consistent with the leave of .github/workflows in the repository. The completed installer is kept only on the builder''s local machine and is deliberately not archived or checked in because it is an executable. Regions obtain it by file share or email. Packaging, publishing, versioning, and support are owned by the Trackweb-IM development team. Because the application is deployed to and runs on region-operated workstations, 1G0D''s Client Tooling service group is now customer-hosted rather than owner-interview-required. The solution file''s legacy CD_ROM/DVD-5/SingleImage configurations are confirmed history, not current practice. See decision record 01M0CVDXKH-B9BW.'
  currentBestGuess: Not applicable - resolved.
  impact: Unblocks the last owner-interview-required sentinel on 1G0D. The answers themselves surfaced a new supportability finding - see zebra-tools-artifact-lifecycle.
  relatedObjects:
  - ref: 01KSM38KFC-0A26
  - ref: 01KSM38KFD-1G0D
- id: zebra-tools-artifact-lifecycle
  question: How should a released WHM_Zebra_Tools installer be reproduced, reinstated, or rolled back, given that no released installer is archived anywhere and the build is manual and local-only?
  status: open
  reason: Surfaced 2026-08-25 by the developer questionnaire answers rather than asserted by DRAFT. The team confirmed there is no rollback process and no previous-installer process, and that the built installer is never archived or checked in. Combined with a manual build on a single developer's machine, this means a previously released version cannot be reliably reproduced, there is no artifact provenance for installers already deployed in regions, and a lost or corrupted build machine loses the shipping artifact. It compounds the hardcoded-credential exposure tracked as TRK-686 - remediating that credential requires rebuilding and redistributing the installer to every region, with no existing distribution or rollback mechanism to lean on.
  currentBestGuess: 'Minimum viable fix is artifact retention: archive each released installer to a durable, access-controlled location with a version stamp, and record which regions received which version. Full automation of the build is a larger change and not required to close the immediate gap.'
  impact: Does not block Baseline (1) now that it is recorded. It is a real operational risk with no owner, and it should be weighed before the L1 decision is signed, since it directly affects whether the TRK-686 credential remediation is executable.
  relatedObjects:
  - ref: 01KSM38KFC-0A26
- id: whm-im-remaining-fields
  question: What are WHM_IM's (STJH) real serviceAuthentication, secretsManagement, availabilityModel, scalabilityModel, recoverabilityModel, and failureDomain facts?
  status: open
  reason: TRK-680 confirmed serviceLogging and healthWelfareMonitoring directly; it did not investigate these six remaining fields. Not covered by the 2026-08-25 developer questionnaire either, which scoped itself to regions, Zebra Tools, and Integrations host mapping.
  currentBestGuess: No informed guess beyond what is already in architectureNotes.
  impact: Does not block Baseline (1) since the unknowns are explicitly tracked here, but should be resolved before claiming Established (2).
  relatedObjects:
  - ref: 01KSM38KFC-STJH
- id: shared-infra-handoff-resolution
  question: Are HTRA, 0C4P, and CT7X (handed off by AM session 01KYRVK1NJ-M3CN) current IMM infrastructure needing a home in 1G0D, or obsolete IMR artifacts?
  status: answered
  reason: Resolved 2026-08-17 by cross-referencing the catalog - all three are generic multi-tenant AWS platform runtime services (SQS, and by the same pattern SNS and a Glue/Lambda/Step-Functions substrate) already correctly homed under catalog/shared-services/ and consumed by numerous unrelated SDPs (Tiers of Intensity, Customer Data Platform, Sofa King Central, Core HR, HCM RH Core). See DecisionRecord 01M07T82GS-FGWX, sharedInfraDisposition.
  currentBestGuess: Not IMM-exclusive; no relocation into 1G0D needed unless IMM's real messaging design is later confirmed to use them.
  impact: Closes the last open item from TRH-9828's session that was explicitly deferred to this ticket.
  relatedObjects:

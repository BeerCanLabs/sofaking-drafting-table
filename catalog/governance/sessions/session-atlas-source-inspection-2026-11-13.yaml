assumptions:
- id: A1
  statement: The database behind the dev RDS cluster endpoint is Aurora PostgreSQL.
  rationale: Endpoint form .cluster-<id>.rds.amazonaws.com and the Aurora writer/reader discussion in .agentic/10-connection-topology.md.
  impact: Data store object name and vendor fields.
- id: A2
  statement: Okta, Sofa King IDM and the Loveseat Event Bus referenced in code are the catalog's Okta (01KQQ5JT1D-SHXD),
    Sofa King IDM (01KXK7BD4N-8Z19) and the Loveseat Event Bus externalTarget already used by other patterns.
  rationale: Name match only; no uid appears in the code.
  impact: Relationship targets.
- id: A3
  statement: Secrets Manager is modeled as a runtimeSpec dependency rather than a relationship on each service.
  rationale: The product-component schema names configuration stores as the purpose of runtimeSpec.dependencies.
  impact: Rendered as derived edges.
unresolvedQuestions:
- id: Q1
  question: Which AWS region and platform (EKS or other Kubernetes, ECS) host Atlas in production?
  status: open
  reason: Pattern records aws-us-east-2 on EKS; dev evidence is us-east-1 and Kubernetes via ArgoCD.
  impact: Deployment target of every service group and the reference-architecture choice.
- id: Q2
  question: Aurora or RDS PostgreSQL, and which engine version, per environment?
  status: open
- id: Q3
  question: What hosts the per-region Redis?
  status: open
- id: Q4
  question: Is the separate Request-To-Pay module still the plan now that its flows live in Atlas Workflow?
  status: open
  relatedObjects:
  - ref: 01M5WY4E7P-WSNT
  - ref: 01M5WY4E7P-YC9P
- id: Q5
  question: Which catalog objects stand for the Platform Tasks API, the Platform Workflows API, Wingman, Passport
    and the Kong edge Atlas uses?
  status: open
  currentBestGuess: Platform Msvc Workflowinstance/Workflowdefinition, Settee Wingman, Ottoman Passport Core
    Service, Kong Gateway Service.
- id: Q6
  question: What serves /api/session/me, which the UI calls?
  status: open
- id: Q7
  question: When do the ERP adapters, AP Desk events, Core HR reads, Wingman notifications and the importer land,
    so the pattern can carry them as relationships?
  status: deferred

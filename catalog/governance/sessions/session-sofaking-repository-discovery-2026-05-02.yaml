unresolvedQuestions:
- id: confirm-service-ownership
  question: Which product teams own each repository-discovered Product Service stub?
  status: open
  reason: Ownership was inferred from repository naming conventions and existing Draft patterns, not from authoritative team declarations.
  impact: Owner metadata must be confirmed before approving these stubs.
- id: confirm-runtime-standards
  question: Do the inferred runsOn standards match the actual production runtime for each generated Product Service?
  status: open
  reason: Runtime was inferred from language, manifest, Docker, Kubernetes, and serverless file-tree signals.
  impact: Incorrect runtime mappings would affect host, logging, monitoring, patching, and compliance requirements.
- id: cluster-deployment-patterns
  question: Which generated Product Service stubs belong together in true Software Deployment Patterns?
  status: open
  reason: Product grouping was inferred from repository naming conventions and should be reviewed with product owners.
  impact: Deployment topology, data flows, and failure domains remain incomplete until confirmed.
- id: deferred-repositories
  question: Which deferred repositories represent runtime services rather than libraries, automation, documentation, or test evidence?
  status: open
  reason: 995 repositories were not stubbed because the evidence was lower confidence or supporting-only.
  impact: Some real services may still need Draft stubs after owner review.
assumptions:
- id: no-source-content-copied
  statement: Repository discovery used metadata and file-tree signals only; it did not copy source file contents into Draft.
  rationale: This avoids pulling secrets or proprietary implementation content into architecture stubs.
- id: existing-only-active-repositories
  statement: Generated Product Service stubs use lifecycleStatus existing-only because the source repositories are active and not archived.
  rationale: Repository activity does not prove preferred status; existing-only is the conservative catalog disposition for discovered existing workloads.
- id: deferred-summary
  statement: already_represented_by_source_repo=3, archived=9, insufficient_runtime_evidence=79, not_high_runtime_candidate=881, supporting_or_non_runtime_name=23
  rationale: The Draft catalog should model architecture, not every supporting repository as a runtime object.
nextSteps:
- id: owner-review
  action: Review generated stubs with product owners and convert true runtime services from stub to draft.
  status: open
  owner: cloud-architecture
- id: deployment-pattern-review
  action: Confirm service grouping, deployment targets, external interactions, and data stores for each generated Software Deployment Pattern stub.
  status: open
  owner: cloud-architecture
- id: deferred-repo-triage
  action: Review deferred repositories for missed runtime services and supporting evidence.
  status: open
  owner: cloud-architecture

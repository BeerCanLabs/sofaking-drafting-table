assumptions:
  - id: single-shared-host
    statement: >-
      All Web Tier and Application Services Tier components run on the same
      dedicated Windows Server 2022 host, consistent with the legacy
      single-box deployment pattern observed in the repo (IIS site and
      Windows Services co-located).
    rationale: >-
      No evidence in the repo of separate host boundaries per service; the
      Hosted Dedicated Windows and SQL Server Suite RA also models
      Presentation and Application tiers on the same host UIDs.
    impact: If services actually run on separate hosts, service groups need to be split accordingly.
    relatedObjects:
      - ref: 01KSM38KGH-DBFS
  - id: report-service-combined
    statement: >-
      CorvidReportService.exe and its ReportServerAdmin.exe companion admin
      UI are modeled as a single ProductComponent rather than two, since they
      are tightly coupled and deploy together.
    rationale: Owner approved this grouping when reviewing the proposed tier breakdown.
    impact: If finer-grained tracking is needed later, ReportServerAdmin can be split into its own ProductComponent.
    relatedObjects:
      - ref: 01KX421X4R-YEMQ
  - id: batch-jobs-combined
    statement: >-
      DemographicNotify/DemographicNotifyBatch and MDClaimService/MDClaimServiceBatch
      are modeled as a single "Trifold Batch Processing" ProductComponent
      rather than four separate components.
    rationale: Owner approved this grouping when reviewing the proposed tier breakdown.
    impact: If finer-grained tracking is needed later, each batch job can be split into its own ProductComponent.
    relatedObjects:
      - ref: 01KX421X4P-FE7F
  - id: financing-ui-merged-into-frontend
    statement: >-
      The Financing billing web UI is modeled as part of Corvid Front End Web
      rather than as its own ProductComponent.
    rationale: Owner directed this merge on 2026-07-09.
    impact: If Financing-specific tracking is needed later, it can be split back out into its own ProductComponent.
    relatedObjects:
      - ref: 01KX421X4Q-R73N
  - id: advisory-direct-pillar
    statement: Advisory Direct is assigned business-pillar.customer-solutions.
    rationale: Owner confirmed this on 2026-07-15.
    impact: If ownership actually differs, businessContext.pillar needs correction.
    relatedObjects:
      - ref: 01KXK822CN-M74S
  - id: sifsupport-database-out-of-scope
    statement: >-
      The SIFSUPPORT database is excluded from this catalog. The Sync
      Service's SIF integration is modeled only via its external relationship
      to the region CIS platform.
    rationale: Owner directed this exclusion on 2026-07-09.
    impact: If the SIFSUPPORT database later becomes architecturally relevant (e.g. for data-classification or backup evidence), it can be re-added as a DataComponent.
    relatedObjects:
      - ref: 01KX421X4R-0KCD

unresolvedQuestions:
  - id: sql-server-version
    question: What SQL Server version actually hosts the Director / DirectorMaster databases in production?
    status: answered
    reason: >-
      Confirmed on 2026-07-15 via the "Trifold - System Requirements"
      Confluence page: production DBMS hosts run "SQL Server 2016 (SP3-GDR)
      (KB5029186) or greater Enterprise Edition". The catalog's only SQL
      Server 2016 DataStoreService (01KQQ5JT01-Z39K) is deprecated, so the
      SDP continues to reference the preferred SQL Server 2019
      DataStoreService (01KQQ5JT01-QFN5) per the "never reference deprecated
      objects" rule — this is now a known inaccuracy, not an open question.
    currentBestGuess: >-
      Confirmed SQL Server 2016 SP3-GDR Enterprise Edition in production per
      the Confluence System Requirements page; catalog reference remains SQL
      Server 2019 DataStoreService (01KQQ5JT01-QFN5) as a placeholder since
      no preferred 2016 object exists. SUPERSEDED 2026-08-11: owner directly
      confirmed the GRRCDPDBSQL19\CDPPROD19 instance (Director,
      DirectorMaster, Corvid Portal Database) actually runs engine build
      16.0.42551.1 — SQL Server 2022, not 2016. The Confluence page's
      fleet-wide claim may be stale, or other Trifold SQL instances may
      still be on 2016; this is not yet reconciled across the whole data
      tier.
    impact: >-
      SQL Server 2016 mainstream support ended 2021; extended support ends
      July 2026. Modeling the data tier as SQL Server 2019 understates EOL
      risk. Needs a Shared Services decision: un-deprecate/refresh the 2016
      object, or confirm an in-flight upgrade to 2019+. Given the 2026-08-11
      finding, this EOL risk may not apply to the GRRCDPDBSQL19\CDPPROD19
      instance specifically — needs re-scoping to whichever instances are
      still actually on 2016.
    relatedObjects:
      - ref: 01KX421X49-VNRW
      - ref: 01KX421X49-TV6R
  - id: windows-service-runtime-gap
    question: >-
      Should Shared Services author a non-deprecated Windows Service
      RuntimeService object (distinct from IIS) for legacy .NET Windows
      Services, since the only existing candidate
      (.NET Application Service on Windows Server 2016) is deprecated?
    status: open
    reason: >-
      MaintenanceService, EmailService, CorvidReportService, and CorvidSync
      currently attach directly to the Host substrate in the SDP rather than a
      RuntimeService layer, because no non-deprecated Windows Service
      RuntimeService exists in the catalog.
    currentBestGuess: >-
      Treat this as a Shared Services catalog gap rather than model a new
      RuntimeService from an Engineering session.
    impact: >-
      Service-level RequirementGroup evidence (health monitoring, patch
      management) for these Windows Services has no dedicated RuntimeService
      object to attach to until this gap is resolved.
    relatedObjects:
      - ref: 01KX421X4Q-YSDR
      - ref: 01KX421X4Q-MZW2
      - ref: 01KX421X4R-YEMQ
      - ref: 01KX421X4R-0KCD
  - id: host-substrate-vmware-vs-physical
    question: >-
      Is Trifold's Windows Server 2022 host physical hardware or a VMware
      VM? The grr-datacenter vocabulary notes describe the facility generally
      as "Sofa King-owned hardware, VMware," but the owner specifically
      confirmed "Windows Server 2022" without specifying physical vs. VMware.
    status: answered
    reason: >-
      Confirmed on 2026-07-15 via the "Trifold - System Requirements"
      Confluence page: every server tier (Application, Reporting, Session,
      Web, DBMS) has "VMware Tools 12.5.0" installed — substrate is VMware,
      not physical hardware. host-windows-2022-vmware-standard
      (01KQQ5JT04-A7W8) is deprecated, so the SDP continues to reference the
      preferred host-windows-2022-physical-standard (01KQQ5JT04-PGTY) per the
      "never reference deprecated objects" rule — this is now a known
      inaccuracy, not an open question.
    currentBestGuess: >-
      Confirmed VMware; catalog reference remains
      host-windows-2022-physical-standard (01KQQ5JT04-PGTY) as a placeholder
      since no preferred VMware host object exists.
    impact: >-
      Wrong host object misstates virtualization posture and lifecycle risk.
      Needs a Shared Services decision: un-deprecate/refresh the VMware host
      object, or confirm this Trifold finding is itself wrong.
    relatedObjects:
      - ref: 01KX421X4Q-R73N
      - ref: 01KX421X4Q-YSDR
  - id: identity-hub-vs-auth-api-overlap
    question: >-
      Is Trifold Identity Hub (identity.cdpdirect.example) the same system as
      the already-modeled Trifold Authentication API
      (SKSS.Authentication.Trifold, ref 01KX421X4P-S9K4), a successor to it,
      or a genuinely separate component?
    status: open
    reason: >-

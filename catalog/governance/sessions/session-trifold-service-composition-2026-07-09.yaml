notes:
  frameworkFinding: >-
    tools/repair_uids.py appears to unconditionally propose a reference
    rewrite in .draft/framework/configurations/requirement-groups/
    requirement-group-drafting-session.yaml on every invocation, regardless of
    which files are targeted via --file. This looks like a pre-existing
    framework-owned issue unrelated to this session's catalog changes; UIDs
    for this session's new objects were assigned by hand instead of running
    the tool's write phase, to avoid touching the vendored framework copy.
    Recommend the user consider filing this upstream to getdraft/draftsman.

unresolvedQuestions:
  - id: authoritative-database-platform
    question: Is the approved Recliner baseline Amazon RDS for SQL Server 2025, or is Aurora PostgreSQL still a viable production choice?
    status: open
    reason: >-
      Reid Sumner deferred the platform decision to Sunil Pradhan's team.
      That team is setting up dedicated databases in the development, test,
      and stage AWS environment accounts, but the final engine and production
      substrate were not confirmed.
    currentBestGuess: SQL Server 2025 on Amazon RDS remains the intended direction, with dedicated per-environment databases, but it is not treated as an approved final decision.
    impact: The three data components currently target MSSQL and reference the existing candidate SQL Server 2025 service; both may need revision.
    relatedObjects:
      - ref: 01KSM38KGH-A6GC
      - ref: 01KRZVZXDK-7XC1
      - ref: 01KZP9ZZ56-R5MT
      - ref: 01KZP9ZZ56-QKZP
      - ref: 01KZP9ZZ56-VW85
  - id: data-codebase-locations
    question: Which repository paths own the schemas and migrations for each Recliner SQL data boundary?
    status: answered
    reason: Reid Sumner supplied all three SQL Server Database Project paths in the som-recliner repository.
    currentBestGuess: >-
      Application Instance Store is at
      src/recliner-database/ReclinerApplicationInstanceStore/; Region Instance
      Store is at src/recliner-database/ReclinerRegionInstanceStore/; and Global
      User Store maps to src/recliner-database/ReclinerUserProfileStore/.
    impact: The three DataComponents now carry repository provenance; platform and operational-control gaps remain independent.
    relatedObjects:
      - ref: 01KZP9ZZ56-R5MT
      - ref: 01KZP9ZZ56-QKZP
      - ref: 01KZP9ZZ56-VW85
  - id: sql-operational-controls
    question: What are Recliner's backup and restore testing, region-level restore, encryption and KMS, access, residency, multi-AZ, RTO/RPO, retention, and deletion controls?
    status: open
    reason: >-
      Reid Sumner explicitly deferred SQL operational evidence to Sunil
      Pradhan's team and noted that SOMDEVDB01 operations are not owned by
      the Recliner team.
    currentBestGuess: Managed AWS capabilities may provide part of the control surface, but no Recliner-specific settings are asserted until Sunil's team supplies evidence.
    impact: OPS-046456 cannot close and the managed database substrate cannot be marked complete.
    relatedObjects:
      - ref: 01KRZVZXDK-7XC1
      - ref: 01KZP9ZZ56-R5MT
      - ref: 01KZP9ZZ56-QKZP
      - ref: 01KZP9ZZ56-VW85
  - id: application-store-pii-and-consumer
    question: Which Recliner service reads or writes the Application Instance Store, and can its region configuration contain user or customer identifiers?
    status: answered
    reason: >-
      Reid Sumner confirmed that CorvidGroup.Business.Services.Restful
      consumes the store through ReclinerSystemDbContext and that its
      organization/system schema contains no customer or user identifier columns.
    currentBestGuess: >-
      The store holds assortment standards, state and region directories,
      lookups, validation rules, and other organization/system configuration;
      containsPII remains false.
    impact: The consumer and no-PII boundary are documented. A relationship remains deferred until the consuming code boundary is represented as a ProductComponent.
    relatedObjects:
      - ref: 01KZP9ZZ56-QKZP
  - id: redis-deployment-and-controls
    question: Is Recliner Redis self-managed, ElastiCache, or another managed service, and what are its TTL, persistence, encryption, and failover settings?
    status: open
    reason: Ryan confirmed Redis is planned for caching and identified Theo Kane as the implementation SME, but did not provide deployment or control details.
    currentBestGuess: No deployment model is assumed from the generic shared Redis catalog entry; the current relationship remains planned rather than deployed evidence.
    impact: The BFF cache relationship remains a stub and Redis operational posture is unresolved.
    relatedObjects:
      - ref: 01KSR5D4EC-A06A
      - ref: 01KQQ5JT00-191S
  - id: s3-snowflake-and-ai-governance
    question: What remaining retention, deletion, residency, audit, recovery, and vendor-processing controls apply to Recliner S3, Snowflake, and future Platform AI Gateway data flows?
    status: open
    reason: >-
      Ryan confirmed one S3 document bucket with SSE-S3, public access blocked,
      versioning disabled, a one-day expiry only under staging/, and no retention
      rule for final document paths. Snowflake is planned but not finalized,
      and future AI features are intended to use Platform AI Gateway rather than
      call Bedrock directly.
    currentBestGuess: >-
      Document Service writes S3 under the confirmed basic controls. Snowflake
      remains a planned reporting/analytics boundary owned for follow-up by
      Bharat Menon. No AI data flow is deployed yet; Platform AI
      Gateway is the intended boundary when AI features are implemented.
    impact: Basic S3 posture and AI direction are documented, but final-path retention, detailed S3 controls, Snowflake controls, and future AI/FERPA processing evidence remain open.
    relatedObjects:
      - ref: 01KSR5D4EG-8EW5
      - ref: 01KSR5D4EJ-T14W

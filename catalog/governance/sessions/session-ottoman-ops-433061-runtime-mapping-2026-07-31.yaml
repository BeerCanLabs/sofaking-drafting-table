    Passport awscli workload is excluded; and the production Kubernetes upgrade
    follows rolling N-1 with its schedule deferred to Platform Engineering.
  externalFollowUps: >-
    Verify completion of the Ottoman Load Test Node.js 22 migration, link the
    Platform Engineering production Kubernetes upgrade schedule, and complete

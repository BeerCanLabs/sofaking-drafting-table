    statement: >-
      The eleven namespaces supplied by the user define the Kubernetes workload
      scope for OPS-433061 across ottm-dev, ottm-stage, and ottm-prod.
    rationale: >-
      The user explicitly named the contexts and namespace inventory for this
      Compute and Runtime L1 review.
    impact: >-
      Additional Ottoman namespaces observed in development or stage remain
      outside this session unless they are required to explain a dependency.
  - id: preserve-distinct-orgperson-components
    statement: >-
      Platform Msvc Org Person and Ottoman OrgPerson Service are distinct
      ProductComponents and both remain in the catalog.
    rationale: >-
      The user explicitly answered that msvc-org-person should not replace the
      existing Ottoman OrgPerson Service in the SDP boundary.

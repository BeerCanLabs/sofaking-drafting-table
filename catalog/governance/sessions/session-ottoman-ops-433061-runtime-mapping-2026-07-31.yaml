unresolvedQuestions:
  - id: auxiliary-workload-classification
    question: >-
      Are plat-ottoman-testapp and the production-only, zero-replica
      plat-ottoman-loadtest deployment governed product components, test
      tooling, or temporary operational utilities?
    status: answered
    reason: >-
      The user explicitly classified both workloads as ProductComponents.
    currentBestGuess: >-
      Model both as governed ProductComponents in the Ottoman product boundary.
    impact: >-
      Both workloads are now represented in the catalog and Ottoman SDP as
      testing and validation workloads.
  - id: auxiliary-workload-source-and-runtime
    question: >-
      Are the provisional JavaScript language and Node.js 22 runtime mappings
      correct for plat-ottoman-testapp and plat-ottoman-loadtest?
    status: answered
    reason: >-
      The user directed Draftsman to inspect the confirmed repositories.
      Default-branch package.json and Dockerfile evidence provides exact runtime
      versions for both components.
    currentBestGuess: >-
      Ottoman Test Application uses TypeScript/NestJS 11 on Node.js 24.14.1;
      Ottoman Load Test uses TypeScript/NestJS 7 on Node.js 14.15.0.
    impact: >-
      Each component now maps to a version-specific EKS RuntimeService. Node.js
      14 is recorded as an end-of-life, non-standard current-state choice.
  - id: loadtest-nodejs-14-disposition
    question: >-
      Should Ottoman Load Test be upgraded from end-of-life Node.js 14.15.0 or
      retired if the dormant production workload is no longer needed?
    status: answered
    reason: >-
      The user explicitly directed that the component be upgraded rather than
      retired.
    currentBestGuess: >-
      Upgrade Ottoman Load Test to a supported Node.js runtime before activation.
    impact: >-
      The catalog preserves Node.js 14.15.0 as observed current state and records
      an explicit upgrade obligation.
  - id: loadtest-nodejs-upgrade-target
    question: >-
      Should Ottoman Load Test target the preferred Node.js 22 baseline or the
      candidate Node.js 24 runtime already used by Ottoman Test Application?
    status: answered
    reason: >-
      The user selected Node.js 22 as the upgrade target.
    currentBestGuess: >-
      Upgrade the repository and deployed image to the preferred Ottoman
      Node.js 22 EKS runtime, 01KZ2MRPHN-N022.
    impact: >-
      The planned upgrade follows the approved preferred technology path. The
      ProductComponent remains mapped to Node.js 14 until implementation is
      verified.
  - id: passport-awscli-utility
    question: >-
      What operational purpose and ownership apply to the running awscli
      Deployment in the production plat-passport-core namespace?
    status: answered
    reason: >-
      The user explicitly classified it as a temporary workload.
    currentBestGuess: >-
      Treat it as a temporary Passport Core operational workload and exclude it
      from the governed ProductComponent boundary.
    impact: >-
      No ProductComponent or RuntimeService is created for it. Its unpinned image
      and removal timing remain operational follow-up items.
  - id: passport-awscli-removal
    question: >-
      What completion condition or removal date governs the temporary awscli
      Deployment in the production plat-passport-core namespace?
    status: deferred
    reason: >-
      The user directed Draftsman to ignore this temporary workload for the
      remainder of OPS-433061.
    currentBestGuess: >-
      Keep it outside the product boundary with no removal action in this
      Drafting Session.
    impact: >-
      No ProductComponent, RuntimeService, or OPS-433061 follow-up is created for
      the temporary Deployment.
  - id: application-runtime-versions
    question: >-
      Do the in-scope images currently use the catalogued Node.js 22 and ASP.NET
      Core 8 versions in every environment?
    status: answered
    reason: >-
      The user authorized GitHub inspection. Default-branch package manifests
      and Dockerfiles confirm Node.js 24.14.1 across the nine remaining in-scope
      components. Production metadata also shows one shared Passport monorepo
      image release across its five workloads.
    currentBestGuess: >-
      Map the nine components and Ottoman Test Application to Node.js 24.14.1,
      retain Node.js 14.15.0 as current state for Ottoman Load Test, and retain
      Node.js 22 only as its approved upgrade target.
    impact: >-
      The initial ASP.NET Core 8 mapping is withdrawn because no .NET workload
      was found in the requested namespace scope. Node.js 24 becomes the shared
      current runtime for the active in-scope product components.
  - id: production-kubernetes-lifecycle
    question: >-
      What completion date is defined by the approved plan to move production
      Kubernetes 1.31 to the rolling N-1 target?
    status: deferred
    reason: >-
      The user confirmed that an approved upgrade plan exists and selected N-1
      as its rolling target. The user identified the completion schedule as a
      dependency on the Platform Engineering team.
    currentBestGuess: >-
      Record Kubernetes 1.31 as observed current state and N-1 as the approved
      target policy without inferring a completion date.
    impact: >-
      OPS-433061 records the approved policy but cannot close the schedule
      evidence gap until Platform Engineering supplies it.
  - id: nodejs-24-governance-disposition
    question: >-
      Should the Architecture Review Board promote Node.js 24 from candidate to
      preferred for Ottoman, or require alignment to the preferred Node.js 22
      baseline?
    status: answered
    reason: >-
      The user directed that Node.js 24 remain documented as candidate current
      state with no promotion proposal and no migration remediation.
    currentBestGuess: >-
      Preserve candidate lifecycle status and the observed Node.js 24.14.1
      mappings without changing the preferred Node.js 22 standard.
    impact: >-
      OPS-433061 records the non-preferred current state but creates no action
      for the active Node.js 24 workloads. The separate loadtest Node.js 14 to
      Node.js 22 upgrade remains required.
  - id: ottoman-orgperson-placement
    question: >-
      Where does the existing Ottoman OrgPerson Service from
      plat-svc-orgperson currently run?
    status: deferred
    reason: >-
      The user confirmed that msvc-org-person does not replace this distinct
      catalog component, but no plat-svc-orgperson namespace was included in the
      requested Kubernetes scope.
    currentBestGuess: >-
      Retain the existing component and runtime mapping without inferring its
      placement from the separate msvc-org-person workload.
    impact: >-
      The Ottoman boundary keeps both components while the older OrgPerson
      Service placement remains outside this review's evidence.
assumptions:

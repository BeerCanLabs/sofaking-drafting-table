name: CCA JSM Intake Poller (Scheduled Lambda)
description: >-
  [DOCUMENTED] AWS Lambda invoked by an EventBridge schedule (every 5 minutes)
  that polls the CCA JSM service desk over the Jira REST API (api.atlassian.com
  gateway, JSM service-account credential) for matched service requests and
  creates Staplepin work items via the Staplepin plugin API -- the automated
  third entry point into the control plane, covering tickets filed directly in
  JSM with no Console or Slack involved. Code is merged (cloud-divan-academy
  PRs #37/#162/#163) but deployed dark: the enable_jsm_intake_poller gate is
  OFF today; go-live is MVP-0 slim-path step 2 (planned 2026-08-04). Lookback
  window is timezone-agnostic and replay rows are excluded from cap/watermark
  accounting.

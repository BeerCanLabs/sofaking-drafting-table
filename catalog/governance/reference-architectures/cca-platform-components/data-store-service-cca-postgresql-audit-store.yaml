name: CCA PostgreSQL Audit and Lineage Store
description: >-
  [INTENDED] PostgreSQL is the authoritative system of record for the Cloud
  Divan Academy platform: Divans, tool invocations, execution lineage, and
  outcomes. Staplepin is the sole writer; Divans have no direct database client.
  Runs as Amazon RDS for PostgreSQL inside the private CCA VPC in aws-us-east-1,
  encrypted at rest via KMS. AWS-native CloudTrail provides a second, independent
  audit trail. Schema and retention model are open questions.

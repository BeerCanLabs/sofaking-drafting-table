name: CCA Openfin Execution Runtime (Sandboxed)
description: >-
  [INTENDED] Openfin is the sandboxed execution runtime that hosts a Divan,
  loads its scoped IAM identity, and executes the single policy-permitted task.
  Runs inside the private CCA VPC in aws-us-east-1 with deny-by-default egress,
  no public inbound, and no public SSH. One Divan equals one IAM identity scoped
  to the narrowest capability set the task requires.

name: CCA Console (Front Door)
description: >-
  [DOCUMENTED] The CCA Console is the human-facing front door of the platform: an
  Express BFF plus a served React single-page app. A person makes a plain-English
  request here; the BFF holds the Staplepin credentials and proxies the browser to
  the Staplepin control plane (REST on the board key, events over a WebSocket on
  the agent key). JSM/Atlassian is reached UNDER THE HOOD (the JSM Divan performs
  ticket I/O and JSM carries approvals + the human-readable audit trail) -- the
  user does not enter through JSM. Runs as an ECS service on the CCA sandbox
  cluster; reached privately over an SSM port-forward today (internal ALB + Okta
  OIDC is a later milestone), no public inbound.

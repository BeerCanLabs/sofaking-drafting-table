description: >-
  [INTENDED] Staplepin is the CCA control plane. It turns an approved JSM ticket
  into a scoped Divan invocation, mediates identity assumption, orchestrates the
  Divan lifecycle, and is the sole writer of audit, lineage, and outcome records
  to the PostgreSQL system of record. Runs in the private CCA VPC in
  aws-us-east-1. Implementation surface and integration contracts are still open.

description: >-
  Guardfin is the safety and control layer in the Divan-to-LLM path.
  [DOCUMENTED today] It is deployed and live in OBSERVE mode: it inspects every
  request and signals the observability platform, but blocks nothing yet.
  [INTENDED] Its end-state job is to BLOCK unsafe Divan actions before they
  execute (deny-by-default: loss of the safety layer blocks execution rather than
  allowing unsafe action) -- a one-variable action-mode flip after false-positive
  tuning. Classified as a governance-framework member, not a compensating control.

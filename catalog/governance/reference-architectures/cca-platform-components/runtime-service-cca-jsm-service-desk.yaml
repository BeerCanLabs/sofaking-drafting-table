name: CCA JSM Service Desk (Governance and Ticket I/O)
description: >-
  [DOCUMENTED] Jira Service Management service desk that is the governance,
  approval, and ticket-I/O surface for the Cloud Divan Academy platform -- reached
  UNDER THE HOOD, not the user's entry point. The human-facing front door is the
  CCA Console (with a planned Slack side door); the JSM Divan performs the actual
  ticket I/O. Every governed run is ticket-bound (no JSM ticket = no execution),
  and approvals, status, and the human-readable audit trail live on the ticket.

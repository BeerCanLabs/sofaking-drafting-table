notes:
  lifecycleRationale: Maintain as an explicit exception for existing Web Forms and SQL Server systems while referenced SQL Server Technology Components remain in extended support. This pattern should not be expanded for new target-state architecture.
  availabilityModel: Web tier scaling can tolerate individual node loss; SQL and shared storage failure modes require product-specific documentation.
  tenancyModel: Single-tenant customizations and per-client deployment boundaries must be explicit.
  deploymentModel: Datacenter primary, AWS non-production, and AWS DR roles must be separately described.
  patternRisks: Deprecated replication, custom tenant drift, and shared file models must be explicitly governed.

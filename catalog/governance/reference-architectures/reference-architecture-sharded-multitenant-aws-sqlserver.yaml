applicableDefinitionChecklist:
  - "Each shard is a replicated, isolated sub-environment hosting a defined subset of tenants with independent failure domain."
  - "Shared services are explicitly scoped to the shared-services scaling unit and their broader blast radius is documented."
  - "SQL Server data tiers are shard-scoped; no cross-shard data dependencies are permitted without an explicit decision record."
  - "Shard placement decisions, capacity boundaries, and shared-service coupling are captured as explicit decision records or risks."
  - "Migration from this pattern to a modern target architecture requires a separate modernization SDM."
notes:
  lifecycleRationale: Previously maintained as an explicit exception for existing sharded AWS and SQL Server systems while referenced Windows Server and SQL Server Technology Components remained in extended support. Set to deprecated because TechnologyComponent 01KQQ5JT1S-D14E reaches extendedSupportEnd on 2026-11-10 (required by DRAFT validation). It should not be treated as cloud-forward target state. The Architecture Review Board should confirm this status and decide whether any extended-support arrangement applies.
  availabilityModel: Shard-level failure domains should contain most tenant impact; shared services must document broader blast radius.
  tenancyModel: Tenants are assigned to replicated sub-environments based on capacity and operations decisions.
  deploymentModel: Shard and shared-service release processes must be separately documented.
  patternRisks: Shared services, single-instance debt, and shard placement decisions must be captured as explicit decisions or risks.

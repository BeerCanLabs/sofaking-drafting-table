architectureNotes:
  lifecycleRationale: Disinvest by default because the pattern resolves to extended-support Technology Components, including Windows Server 2016 and SQL Server 2016. It should move to existing-only only if a documented exception is approved before replacement.
  availabilityModel: Shared ECS application tier with separately governed tenant database isolation.
  tenancyModel: Multi-tenant application runtime with tenant separation at the database layer.
  backgroundProcessing: Lambda handles asynchronous and scheduled workloads outside the primary ECS service path.
  patternRisks: Database-per-tenant operations, configuration management, and coordinated application/database releases must be explicitly designed.

notes:
  lifecycleRationale: Maintain as an explicit exception for existing hosted systems while referenced Windows Server and SQL Server Technology Components remain in extended support. This pattern should not be used for new target-state architecture.
  availabilityModel: Dedicated application and data tiers must declare failover, backup, and recovery posture per hosted boundary.
  tenancyModel: Isolation is provided by dedicated stack, ITC, customer, or tenant boundaries.
  deploymentModel: Manual or semi-automated deployment paths are expected to be documented as deviations until automated.
  patternRisks: Non-Sofa King hosting control, manual deployment, and shared storage blast radius must be explicitly recorded.

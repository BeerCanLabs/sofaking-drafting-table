architectureNotes:
  lifecycleRationale: Cloud-forward EKS microservices pattern with no currently end-of-support Technology Components in the referenced Standards.
  availabilityModel: EKS workloads and managed data stores should be distributed across multiple availability zones.
  tenancyModel: Multi-tenant services must declare tenant isolation at the application, database, or row-security layer.
  deploymentModel: GitOps or pipeline automation should own application and cluster addon rollout.
  patternRisks: Service mesh choice, data isolation, and platform dependency blast radius must be explicitly documented.

notes:
  lifecycleRationale: Maintain as an explicit modernization exception while extended-support Windows Server and SQL Server components are still active. This pattern is acceptable for controlled migration work, but it is not target-state architecture for new builds.
  availabilityModel: The legacy and target architectures must each declare independent failure domains and recovery posture.
  migrationModel: Migration pipelines and coexistence boundaries must be explicitly modeled.
  tenancyModel: Legacy tenancy and target tenancy may differ and must both be recorded.
  patternRisks: Running two architectures in parallel creates data sync, identity, observability, and operational ownership risks.

architectureNotes:
  lifecycleRationale: Cloud-forward EKS platform pattern with no currently end-of-support Technology Components in the referenced Standards.
  availabilityModel: Primary platform services must be multi-AZ and define DR posture for shared identity, gateway, and mesh dependencies.
  tenancyModel: Platform services serve multiple products and must document product and tenant isolation boundaries.
  serviceMeshModel: Gateway, mesh control planes, and sidecars must be modeled as shared platform dependencies.
  patternRisks: Platform outage blast radius and downstream product coupling must be explicitly governed.

schemaVersion: '1.0'
uid: Z8ZEXRM11J-FGJ6
type: software_deployment_pattern
name: CCA — Governed Automation Platform
description: >
  Cloud Divan Academy (CCA) reference architecture. A ticket-bound,
  policy-constrained, validated, and audited automation platform where every
  meaningful action is bound to a JSM service request, executes inside a
  per-Divan IAM-scoped AWS sandbox, and is persisted to PostgreSQL for lineage.
  The requester enters through the CCA Console; the Console opens the governing
  Service Request server-side, so the run is ticket-bound without the requester
  ever using the JSM portal (see decision record 01KZ6K57W5-APKF).

  This is a PoC architecture under active design. Items below are labeled
  [DOCUMENTED] when observed in code or AWS, [INTENDED] when target state and
  not yet built, and [OPEN] when a decision is still pending. Do not treat
  [INTENDED] items as implemented.
version: 0.1.0
catalogStatus: incomplete
lifecycleStatus: candidate
businessContext:
  pillar: business-pillar.enterprise-enablement
owner:
  team: aiops
  contact: lpark@sofaking.example

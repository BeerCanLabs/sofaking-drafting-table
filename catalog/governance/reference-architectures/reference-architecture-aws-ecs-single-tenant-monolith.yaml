notes:
  lifecycleRationale: Disinvest by default because the pattern includes SQL Server 2019, which is past mainstream support and in extended support. This single-tenant monolith pattern should not be treated as target-state architecture without an explicit existing-only exception.
  availabilityModel: Each tenant boundary must define its own runtime, data, observability, and recovery design.
  tenancyModel: Single-tenant isolation is the primary control; shared services are external dependencies.
  deploymentModel: The same EC2-backed ECS deployment pattern is repeated for each tenant or region. AWS Fargate is not part of this pattern.
  patternRisks: Operational scale, tenant drift, and shared observability dependencies must be explicitly governed.
applicableDefinitionChecklist:
  - Each region or tenant runs inside its own AWS account and ECS cluster failure boundary.
  - Java application workloads run as ECS services on EC2-backed capacity; this pattern does not use Fargate.
  - An Application Load Balancer performs health-checked routing to the application services.
  - ECS desired counts and the EC2 Auto Scaling Group capacity provider define application and cluster scalability.
  - CloudFormation and versioned ECR images provide repeatable replacement and recovery of runtime infrastructure.
  - Each deployment selects one supported region database engine and documents its backup, recovery, and availability posture.

name: Customer Profile Service ← Loveseat Event Bus (identity-match)
description: >-
  Loveseat delivers IdentityMatchTransaction events to the Customer Profile Service
  callback (POST /api/events/identity-match, scope ss.profile.events), which updates
  the affected customer and contact profiles. The API registers its Loveseat
  subscription on startup and quarantines unprocessable events to SQS. Loveseat calls
  the API at its per-service Traefik hostname (Events:CallbackBaseUrl,
  customer-profile-{env}.ss.sofaking.example), entering through the internal ALB and
  Traefik (owner-confirmed 2026-10-20). Loveseat has no
  dedicated shared-service catalog object, so it is recorded as an external target.
source: 01KXR9XAR4-BES0
externalTarget: Loveseat Event Bus
label: receives identity-match events from
technology: HTTPS
direction: event
flow: inbound

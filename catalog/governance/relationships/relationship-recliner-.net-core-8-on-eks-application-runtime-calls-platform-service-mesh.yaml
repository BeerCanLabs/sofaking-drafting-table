notes: >-
  The Recliner Infrastructure Architecture documents the intended Platform
  Service Mesh participation. Helm chart evidence gathered 2026-08-05 for
  OPS-306834 shows this intent is only partially realized: the som-recliner
  repository's recliner-loveseat-subscriber chart sets
  `kuma.io/sidecar-injection: enabled`, but the recliner-bff, recliner-backend,
  recliner-user-profile, and recliner-entity-locking charts carry no mesh
  sidecar-injection annotations. The BFF and core-service workloads that make
  up the primary Recliner runtime are therefore not currently evidenced as mesh
  participants. Exact namespace injection policy, mesh name, traffic
  policies, and live sidecar state for recliner-loveseat-subscriber remain deferred
  until AWS SSO access is refreshed or deployment manifests are linked.

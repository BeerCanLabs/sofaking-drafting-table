notes:
  background: The MDaemon infrastructure guide identifies F5-fronted SMB raw queues on the high- and low-priority endpoints as the path used by email agents and states that raw files carry most mail volume. The Email Agents page maps Rota Legacy on GRRLVELEGEA1 and the New Rota Email Agent Letter Writer and Report Writer services on GRRLVELWEA1 and GRRLVERWEA1 to GRRMAILLOW. It maps the Rota Platform Email Agent on GRRLVEPLATEA1 to GRRMAILHIGH. Clockwise and IDM rows are outside this Leave-specific relationship. The contributor confirmed on 2026-09-03 that this SMB transport is unencrypted within Grand Rapids.

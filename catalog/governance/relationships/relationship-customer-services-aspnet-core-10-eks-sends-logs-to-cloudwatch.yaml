  team lead. The owning team is not yet named. A path search of k8s-deployments found no
  log-forwarder Application under apps/clusters/le1. Fluent Bit Applications exist there
  for other clusters. That search covered file paths only. The team lead states Dynatrace
  is not yet configured.

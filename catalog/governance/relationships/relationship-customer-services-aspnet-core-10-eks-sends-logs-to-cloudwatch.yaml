name: Customer Services ASP.NET Core 10 on EKS Application Runtime sends logs to Amazon CloudWatch Logs
description: >-
  Per the Customer Services team lead, the Shared Customer services write logs to STDOUT and a node-level or
  cluster-level agent forwards them to Amazon CloudWatch Logs. This forwarding is not
  verified. No agent, log group, or destination has been identified. Verified in
  ss-msvc-customer-profile (Api.csproj, appsettings.json, Program.cs): the API uses the .NET
  console logger with the JSON formatter in single-line mode, has no logging SDK or sink
  package, and an audit-logging middleware writes through the same logger. The same
  behavior in the other Shared Customer services is per the team lead and was not checked.

notes:
  background: The shared MDaemon service exposes F5-fronted high- and low-priority SMTP endpoints to Leave and other product consumers. The Email Agents page documents that Rota reports configured with a static filename bypass the Email Queue and Email Agent and deliver directly over SMTP. The contributor confirmed on 2026-08-13 that this bypass path uses the low-priority GRRMAILLOW endpoint and confirmed on 2026-09-03 that the SMTP transport is unencrypted within Grand Rapids.

decisionRationale: >-
  serviceAuthentication: Ottoman provides trusted user context and OAuth 2.0
  protects service-to-service calls. secretsManagement: Kubernetes secrets
  and AWS Secrets Manager provide runtime credentials, with non-sensitive
  settings supplied through ConfigMaps. serviceLogging: Node.js server logs
  and ASP.NET Core structured Serilog output are collected by the platform
  logging pipeline. healthWelfareMonitoring: Kubernetes readiness and liveness
  probes report workload health. recoverabilityModel: Kubernetes replaces
  failed pods and SQS dead-letter queues preserve failed asynchronous work.
  failureDomain: Workload failures are isolated to a Kubernetes Deployment
  inside the regional EKS cluster. Status remains open pending Recruiting &
  Hiring team and ARB ratification; this does not block recording the observed
  current-state L1 runtime mapping.

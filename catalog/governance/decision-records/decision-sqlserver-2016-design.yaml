decisionRationale: >
  SQL Server 2016 uses AlwaysOn Availability Groups for multi-node HA with a minimum of 3 nodes and vertical scale-up with optional secondary replicas. Service authentication uses Active Directory integrated identities. Database audit and engine logs are forwarded to centralized logging. SQL listener probes, replica telemetry, and platform monitoring track service welfare. Service accounts and connection secrets are stored centrally. Backup strategy is daily full plus hourly log backup to SQL Server native managed storage, with 1-hour RTO and RPO. TDE is enabled on all production databases. Administrative access uses Active Directory integrated access with role-based SQL permissions. Autoscaling is not applicable; load balancer is optional.

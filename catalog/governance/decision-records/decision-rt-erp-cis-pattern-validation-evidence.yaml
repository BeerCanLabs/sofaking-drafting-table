decisionRationale: |
  deploymentTargets: Cloud-hosted scope only. Each region deployment runs in
  its own AWS account with separate production and non-production ECS clusters.
  On-premise deployments are out of scope for this SDM.

  dataClassification: Highly regulated customer, employee, and financial data.
  FERPA-adjacent customer records, HR/personnel records, payroll data, and
  cardholder/PHI handling concerns require explicit control treatment.

  failureDomain: The intended failure domain is per-region, single-tenant
  isolation. Shared observability platforms remain external dependencies.

  externalDependencies: External interactions include Imperva and ALB ingress,
  ECR image delivery, CloudWatch, Glowroot, central logging, Sofa King IDM,
  region LDAP, database authentication, Nagios, SES/Postfix, and
  Stunnel/Netskope.

  interServiceConnections: The region ALB routes to ECS application and
  reporting services. Application and Jasper tasks connect to the selected
  region database. ECS pulls images from ECR and exports telemetry to
  CloudWatch; application traffic also reaches the documented identity,
  observability, email, and region-connectivity dependencies.

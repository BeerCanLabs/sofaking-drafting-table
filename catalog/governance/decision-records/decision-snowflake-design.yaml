decisionRationale: >
  Snowflake is operated as a vendor-managed SaaS. Audit visibility is provided through Snowflake query history and access logs available via account usage views. Health status visibility is provided through the Snowflake vendor status page and automated alerts. The failure domain is scoped to the Snowflake account and regional cloud deployment.

name: Digital Stores Encryption At Rest Is Not Enabled On Confidential Data
category: risk
status: open
catalogStatus: complete
lifecycleStatus: existing-only
description: >-
  Confirmed by the Digital Stores engineering owner on 2026-09-08, in answer to question 4.3 of the
  DRAFT L1 Baseline Questionnaire: Transparent Data Encryption is not enabled on any Digital Stores
  SQL Server instance. In the same questionnaire, answer 3.1 confirmed that the product handles
  personally identifiable information and classified the data as Confidential, citing Sofa King's Data
  Classification and Protection Policy. That policy's Data Protection in AWS section requires that all
  sensitive data - PHI, PCI, PII or customer data - be encrypted both in transit and at rest, and its
  Additional Data Requirements section sets full-disk encryption as the minimum at-rest control, with
  the Security Team empowered to require Transparent Data Encryption or column-level encryption on top
  of that based on risk. Whether the underlying EBS volumes on PRAngDB1, SUDB, QADB and ALDB are
  encrypted, which would satisfy the full-disk minimum, was not asked in the questionnaire and is not
  evidenced anywhere in DRAFT or in the linked Confluence material. This is therefore a confirmed
  leave of one named control (TDE) over an unconfirmed baseline (EBS encryption), not a confirmed
  total leave of at-rest encryption.

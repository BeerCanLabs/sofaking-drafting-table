decisionRationale: "serviceAuthentication: Broker administrative and client identities use centralized secret distribution with broker-side authentication policy.\n\nsecretsManagement: credentials stored in a centralized secrets platform\n\nserviceLogging: Broker logs and queue events are forwarded to centralized logging beyond host-level collection.\n\nhealthWelfareMonitoring: Broker health probes, queue-depth telemetry, and platform monitoring track service welfare.\n\nfailureDomain: Scoped to the shared RabbitMQ cluster serving dependent workloads."

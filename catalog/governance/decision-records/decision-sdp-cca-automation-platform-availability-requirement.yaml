decisionRationale: 'availabilityRequirement: Best-effort / business-hours for the PoC. CCA is a candidate-stage, team-only platform with no production SLA in Milestone A (Internal Supervised Divan). Because every action is human-initiated through a JSM ticket and is read-only/sandbox-only in Milestone A, there is no continuous uptime obligation; an outage delays manual runs rather than impacting a customer-facing service. A formal availability tier will be set when Milestone B (Auditable Divan) defines its audience and write scope. Status open pending aiops / ARB ratification.'

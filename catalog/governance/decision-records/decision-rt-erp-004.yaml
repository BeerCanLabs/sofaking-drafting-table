name: Reporting Services — JasperSoft ECS Runtime Topology
description: 'JasperSoft is a standalone per-region ECS reporting capability using EC2-backed cluster capacity. Legacy Jasper and Jasper 9 service definitions may coexist during migration. The active-version baseline uses one desired task with repository storage backed by PostgreSQL on EFS; RDS is a migration path.

  '

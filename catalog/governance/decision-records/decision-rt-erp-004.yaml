status: accepted
affectedComponent: 01KQQ5JT1F-737K
impact: 'DRAFT now reflects Jasper as a region-scoped ECS service and does not overstate the current single-task baseline as active-active high availability.

  '
mitigationPath: 'Revalidate storage, session, and task-count assumptions during the Jasper 9 and RDS migration.

  '
linkedObject: 01KSM38KEY-JC4K
decisionRationale: |
  deploymentModel: The current cloud baseline deploys the active Jasper
  version with one desired ECS task per region on EC2-backed capacity.
  Legacy Jasper and Jasper 9 service definitions can coexist during migration.
  The runtime includes Jasper web application, PostgreSQL repository,
  ActiveMQ, and buildomatic container roles. Repository storage is EFS-backed
  in the current runbook; RDS is a migration path. This decision does not claim
  active-active Jasper availability.

decisionRationale: >-
  Per the Customer Services team lead. The readiness and liveness endpoints are about all
  the health monitoring there is today. CloudWatch alarms are set up, but their
  recipients are not configured. Dynatrace is not yet configured.
  Verified in k8s-deployments. The dev Deployment manifests for the three Shared Customer
  Record services (Customer Profile, Academic Calendar, Customer Membership) each configure
  a readinessProbe on /health/ready and a livenessProbe on /health/live. The stage
  manifests were not checked.
  Not established. Which resources have alarms, what the alarms cover, the plan and
  timing for configuring recipients, whether any monitoring of the API pods exists beyond
  the probes and these alarms, and whether production on Chaise, which is not
  provisioned, needs API-level health monitoring.

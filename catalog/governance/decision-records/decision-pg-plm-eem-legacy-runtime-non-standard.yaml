decisionRationale: >-
  nonStandardTechnology: Two non-standard choices persist in the legacy estate.
  (1) STL-LDMS-Legacy is Classic ASP (src/asp, including nRegionAdmin and
  SysAdmin). Classic ASP is not an approved Technology Component and has no
  object in the DRAFT catalog; the approved .NET path runs from Microsoft .NET
  Framework 4.8 (BMRKCQRYYP-PV6V) through .NET Runtime 8 (01KQQ5JT1S-EHW4).
  (2) The build and deploy chain is non-standard end to end, where Codefresh
  (01KQQ5JT1D-KJ3A) is the catalogued Sofa King CI service used by the PLM/EEM
  cloud tier. WIDENED under SKPG-19589 review: this record previously named
  TeamCity and psake only. The chain also includes OCTOPUS DEPLOY and CHEF.
  The PLM/EEM Environment Guide (Confluence 648381633) gives the deploy process
  for every environment as "SK Team City and Octopus", names the Octopus
  project ldms-legacy at octopus.ss.sofaking.example, and lists Chef
  cookbook-sk_stl as the configuration-management repository (with a
  struck-through Sys-LDMS-Terraform). Octopus is actively used, not vestigial:
  OPS-94649 records Octopus deployments of LDMS.Net, LDMS Legacy, FORMIX and the
  PG Report Writer Service to the prod_ottm target, and OPS-18728 tracks
  in-flight changes to the PlmEem Orchestra Octopus pipeline. Neither choice is
  a new decision - both are inherited from the Skilltrail acquisition
  lineage and predate the current standards. Miles Chandler confirmed on
  2026-08-31 that the legacy estate is NOT on a short-term funded retirement
  plan, so these choices persist rather than resolving through decommissioning.
  Related intent exists but is not a tracking item: SKPG-35699 is a backlog
  epic for Classic ASP LMS modernization, generated by a story-generator POC
  rather than raised as an architecture exception. No remediation target is set;
  APEX L1 does not require one. RATIFICATION READINESS: this record is
  factually settled - the technology facts are read directly from the
  repositories and from infrastructure documentation, and Miles Chandler's
  retirement confirmation closes the last open variable. It can be ratified
  once its Jira tracking item exists, unlike the New Relic and SaaS records
  which need ARB input. ACTION REQUIRED: APEX Architecture L1 criterion 5
  requires a Jira tracking item for each non-standard technology choice. No
  dedicated exception ticket exists yet; SKPG-19589 is the only tracking item.
  Status open pending only that ticket.

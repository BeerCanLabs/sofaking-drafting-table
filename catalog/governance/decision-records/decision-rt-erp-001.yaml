name: Application Server — Java on Amazon ECS Runtime Binding
description: 'The RT-ERP monolith is bound to the Java Application Service on Amazon ECS, using EC2-backed cluster capacity and CloudFormation-managed infrastructure.

  '
version: 1.0.0
catalogStatus: complete
lifecycleStatus: preferred

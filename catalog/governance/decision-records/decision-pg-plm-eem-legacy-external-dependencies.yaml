decisionRationale: >-
  externalDependencies: The legacy estate integrates with the New Brunswick Department of Retail (STLI.Shared.Integration.Nhdcb) and a credit-card payment path (STLI.Shared.Integration.CreditCards), both observed as projects in STL-LDMS.Net. FORMIX additionally reaches AWS SQS from its ArchiveFilesExport utility and provisions AWS resources through the EemEvaluationRightsAutomation CDK application. The legacy tier is also read by the PLM/EEM cloud pattern 01M1F8WB4E-8WVS. This list is derived from repository evidence only - no owner interview has confirmed it, the payment processor is unidentified, and further region or state integrations may exist. Status open pending Associate Development engineering ratification. Unconfirmed items are tracked in DraftingSession 01M1F8WB4E-0GSN.

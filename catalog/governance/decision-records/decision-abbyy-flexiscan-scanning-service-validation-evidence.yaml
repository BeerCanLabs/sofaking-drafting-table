decisionRationale: "serviceAuthentication: Scanning service accounts and workflow credentials use centralized secret distribution.\n\nsecretsManagement: Runtime credentials sourced from centralized secret storage\n\nserviceLogging: Scanning workflow logs are exported to centrally managed logging and retained with operational telemetry.\n\navailabilityModel: Single-instance scanning service with no built-in active redundancy.\n\nscalabilityModel: Vertical scale-up on the assigned host.\n\nrecoverabilityModel: Rebuild the service on a replacement host and restore configuration and workflow dependencies.\n\nfailureDomain: Scoped to the scanning workflow service for the deployment that consumes it."

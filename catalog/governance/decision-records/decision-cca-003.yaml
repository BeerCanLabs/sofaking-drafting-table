name: Two-Milestone Delivery (Internal Supervised, then Auditable)
description: >
  CCA's first Divan is delivered in two distinct milestones, not one. Milestone
  A is an Internal Supervised Divan — read-only, in-sandbox, team-only audience,
  manual JSM approval per run — targeted for 2026-06-15. Milestone B is the
  Auditable Divan — full 9-layer controls, JIT credentialing, integrated kill
  switch, anti-affinity enforcement, expanded audience — with a date set by
  readiness, not the calendar.

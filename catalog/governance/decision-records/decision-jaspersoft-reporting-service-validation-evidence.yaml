decisionRationale: |
  serviceAuthentication: Jasper administrative access and JDBC datasource
  authentication are configured per region.

  secretsManagement: Administrative and datasource credentials use the
  approved secret-management workflow and are injected into region
  configuration rather than container images.

  serviceLogging: ECS and container telemetry is sent to CloudWatch; Jasper
  logs are available to region troubleshooting and centralized logging.

  availabilityModel: The current baseline uses one desired task for the active
  Jasper service version. ECS replaces failed tasks, but active-active HA is
  not claimed.

  scalabilityModel: Legacy Jasper and Jasper 9 are distinct ECS service
  definitions that can coexist during migration. Desired count and EC2
  capacity can be adjusted operationally; horizontal Jasper scaling requires
  storage and session validation.

  recoverabilityModel: ECS rebuilds failed tasks from versioned images.
  Repository recovery stops Jasper capacity, restores the EFS-backed
  PostgreSQL repository, and restarts the service.

  failureDomain: Jasper runtime and repository failures are scoped to one
  region environment.


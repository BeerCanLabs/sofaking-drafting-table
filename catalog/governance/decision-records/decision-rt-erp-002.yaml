status: resolved
affectedComponent: Data Services
impact: 'The SDM listed three database platforms in one Data Services group without making clear they are mutually exclusive per-region alternatives, which could overstate the footprint of a single region deployment. Residual risk is limited to misreading the Data Services group as co-deployed platforms if the documented single-tenant selection rule is overlooked.

  '
mitigationPath: 'Clarified the pre-existing single-tenant architecture in the SDM via architectureNotes.databasePlatformSelection and per-entry notes marking the three data store entries as mutually exclusive per-region alternatives. No architectural change was made; this record captures a documentation clarification only.

  '
decisionRationale: 'RT-ERP/CIS has operated as a single-tenant product for many years. Each region deployment runs in its own dedicated AWS account containing its own database instance running exactly one platform selected from IBM Db2, SQL Server 2019, or PostgreSQL 17. The database instance co-resides in the same region AWS account as the ECS application services. The three Data Services entries in the SDM are therefore mutually exclusive per-region alternatives, not concurrently deployed platforms. Oracle appears only in developer/test and legacy configurations (dev-named JDBC hosts, no production client connection strings) and is out of scope for the cloud-hosted SDM. This record documents an existing architectural fact first captured in DRAFT on 2026-06-17.

  '

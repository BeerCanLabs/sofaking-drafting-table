name: Data Services — Multiple Database Platforms Represented Concurrently
description: 'The RT-ERP SDM initially listed Db2, SQL Server, and PostgreSQL in the same Data Services group, which could be read as all three running simultaneously in one region deployment. This record clarifies the pre-existing single-tenant architecture: each region has always run exactly one database platform in its own dedicated AWS account. The SDM entries are mutually exclusive per-region alternatives; see decisionRationale.

  '

name: External Identity Services — Region Fallback Semantics Resolved
description: >-
  Sofa King IDM is the preferred authentication path. Region LDAP over LDAPS
  and local database authentication are retained as region-specific alternate
  or exception paths rather than the standard Sofa King identity baseline.

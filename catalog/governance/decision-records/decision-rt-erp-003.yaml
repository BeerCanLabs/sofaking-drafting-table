affectedComponent: External Identity Services
impact: >-
  The SDM keeps the installed-base identity options visible without presenting
  LDAP or database-local authentication as the preferred company standard.
mitigationPath: >-
  Model region LDAP as an external LDAPS 636 relationship and retain
  database-local authentication as a region-specific exception interaction.
  Revisit only when a region migrates identity paths or the product standard
  changes.

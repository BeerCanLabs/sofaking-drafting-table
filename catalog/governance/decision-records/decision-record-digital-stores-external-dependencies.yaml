description: >-
  Enumerates every external dependency and service-to-service connection confirmed for Digital
  Stores Suite+ as of 2026-09-08, and records which of them are registered as DRAFT objects and which
  are not. Answers question 7.1 of the DRAFT L1 Baseline Questionnaire and closes the
  noAdditionalInteractions claim previously carried on the pattern, which asserted Pendo as the only
  external interaction. That claim was incomplete. External dependencies, confirmed: Pendo product
  analytics at us1.app.pendo.io, allow-listed in the EntityAPI CORS policy and keyed as PENDO_DS in
  dshpConfig.service.ts; Imperva WAF, vendor-managed SaaS, fronting *.digital-showrooms.example; a
  self-hosted Confluence instance at Conf6152.dsh-aws.local serving the client Help Book, also called
  the Blue Book, on a Digital Stores-operated EC2 host in us-west-1 rather than on the Atlassian
  Cloud tenant; Jaspersoft, a separately paid custom-report and data-extract service running ten
  nightly extracts; an SFTP host at ftp.digital-showrooms.example as the extract delivery channel; and
  Active Directory domain controllers DCW06, DCW08, DCE10 and Saline2. Service connections,
  confirmed: Web UI to EntityAPI over HTTPS REST, same-origin; Imperva to the AWS load balancer;
  the load balancer to the shared IIS origin per region; EntityAPI to SQL Server over TDS, resolving
  a region database per request; EntityAPI to the DS_Admin catalog on every request; and Jaspersoft
  to SQL Server to build the nightly extracts. The owner confirmed on 2026-09-08 that the Web UI never
  reaches SQL Server directly, so no presentation-to-data crossing exists. Retired rather than active:
  the Matillion ETL job set that incrementally loaded AWS Redshift from the applogPR, applogAL,
  applogQA and applogSU databases, and the AWS Data Pipeline start and stop jobs, both struck through
  on the Scheduled Tasks page and superseded by AWS Instance Scheduler (corrected 2026-10-20 from Park
  My Cloud; see SoftwareDeploymentPattern 01KRZ1GCH3-99RF notes.scheduledJobs. Needs Validation.), with
  the Matillion instance recorded as stopped in the AWS Backup server list. Retired dependencies are
  recorded here for traceability and are deliberately not modeled as active. The registered-object gap
  for the confirmed service connections is dispositioned separately on DecisionRecord 01M263WKS2-NR3T,
  so that each decision record stays 1:1 with the single requirement it disposes.

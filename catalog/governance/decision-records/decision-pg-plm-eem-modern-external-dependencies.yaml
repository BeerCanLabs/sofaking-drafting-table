decisionRationale: >-
  externalDependencies: Enumerated from the production ConfigMap at cd/prod-ottoman/cm.yml in pg-msvc-plm-eem-api. Internal Sofa King dependencies: the IDM login gateway and token authority (login.sofaking.example), Platform Organization Service, Platform List API, OrgPerson Service, Sofa King Central Employee API (fc-api-employee.use1), Employee Service, the Settee module host, the PG Permissions Service, the PG User Activity Service, the PG Emailer, and the Report Writer. Third-party SaaS: LaunchDarkly (feature management), Salesforce (SSO and API, including a PDEval community site), and Avalara (tax). The three SaaS dependencies are not present as objects in the DRAFT catalog - see decision record 01M1F8WB4E-9C7X. Criticality has not been assigned to any dependency and no owner interview has confirmed this list. Status open pending Associate Development engineering ratification.

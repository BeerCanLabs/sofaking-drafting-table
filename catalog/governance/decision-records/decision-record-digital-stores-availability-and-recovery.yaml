type: decision_record
name: Digital Stores Has No Recorded Availability Target And No Tested Recovery
category: risk
status: open
catalogStatus: complete
lifecycleStatus: existing-only
description: >-
  Digital Stores has no expressible availability target, RTO or RPO. Asked for the production
  availability target and SLA in question 2.1 of the DRAFT L1 Baseline Questionnaire, and again for
  the SQL Server tier RPO and RTO in question 4.2, the engineering owner answered "100%" on
  2026-09-08. That is not an availability target: it states no measurement window, no allowance, and
  no recovery objective, and 100 percent uptime is not achievable by any architecture. It is also
  contradicted by the deployed posture confirmed in the same round of evidence. Each of the four
  environment tiers runs its region databases on a single SQL Server EC2 instance with no AlwaysOn
  availability group, no failover partner and no read replica, and the 2026-01-28 AWS API discovery of
  account 472468972873 found zero RDS instances in any region, so there is no managed multi-AZ
  failover anywhere in the estate. DS_Admin, the routing catalog every request depends on, is a single
  point of failure whose loss removes access for all regions - confirmed by the owner in answer 2.3.
  Only the production and sandbox web tiers have redundancy: production runs an Auto Scaling group
  behind PRLB-155628125.us-west-1.elb.amazonaws.com and sandbox runs SBWeb behind
  SBLB-3852661381.us-west-1.elb.amazonaws.com, while QA and alpha run a single web host each.
  Recovery is restore-from-backup only, through AWS Backup EBS snapshots taken Monday through Thursday
  and weekly Friday AMIs retained 30 days, with no SQL Server native or log backup schedule recorded,
  which puts the practical RPO at up to roughly 24 hours. No restore has ever been timed, so there is
  no RTO figure at all. Non-production tiers are additionally powered off outside scheduled hours
  through AWS Instance Scheduler and are therefore not continuously available by design (corrected
  2026-10-20 from Park My Cloud; see SoftwareDeploymentPattern 01KRZ1GCH3-99RF notes.scheduledJobs
  for the evidence and the open configuration questions. Needs Validation.).

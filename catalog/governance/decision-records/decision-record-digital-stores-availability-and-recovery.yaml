impact: >-
  Blocks a satisfied disposition on the availability-requirement entry of the mandatory
  software_deployment_pattern requirement group (01KQQ4Q027-VK45), which is why the Digital Stores
  pattern records that requirement as not-compliant and keeps catalogStatus at incomplete. The
  architectural consequence is larger than the catalog one. Without a stated target there is no
  standard against which the single-instance data tier can be judged adequate or inadequate, no basis
  for a capacity or redundancy investment decision, and no commitment to hold an incident response
  against. Three specific exposures follow. One, a lost database host takes an entire tier offline and
  the only recovery is a snapshot or AMI restore of unknown duration; production is one host,
  PRAngDB1. Two, up to a day of region transactions can be lost in that restore, because
  infrastructure snapshots are the only recorded backup mechanism and there is no transaction-log
  chain to roll forward. Three, the estate has the same shape as the Kent County Customer Health
  Management outage, where a SQL Server cluster with insufficient failover became unrecoverable when
  replacement capacity was unavailable; hardware redundancy and infrastructure snapshots are not a
  temp for tested failover and tested restore. Bears on Hearthstone HCF.03.1.2 and HCF.03.2.1 indirectly
  through the unpatched engine builds tracked in DecisionRecord 01M0GDHSAM-F64B.
mitigationPath: >-
  Five steps. First, have the Digital Stores product and engineering owners state a real availability
  target with a measurement window, an RTO and an RPO, distinguishing production from the scheduled
  lower environments; "100%" cannot be recorded in DRAFT as a target and this record cannot close
  against it. Second, revalidate the backup posture against the live AWS account before treating it as
  confirmed - the AWS Backup Service page it comes from is dated 2023-02-28 and is written
  prospectively as a plan rather than as an implemented state. Third, decide whether SQL Server
  native backups with transaction-log backups are required to meet the stated RPO, because
  infrastructure snapshots alone cannot deliver a sub-daily recovery point. Fourth, perform and time
  an actual restore of a region database and of DS_Admin, and record the measured RTO here; an
  untested restore is not a recovery capability. Fifth, take the DS_Admin single point of failure and
  the single-instance data tier to the Architecture Review Board with the stated target in hand, so
  the decision to accept or remediate is made against a requirement rather than in the abstract; the
  reference architecture this pattern is filed against expects a highly available shard-scoped data
  tier, and the deviation is recorded in DecisionRecord 01M25X9W0R-0Q0X.

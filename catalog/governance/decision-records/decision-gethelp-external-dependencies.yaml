decisionRationale: 'externalDependencies: External dependencies modeled as first-class relationship objects in

  catalog/governance/relationships/: HHD_API → Sofa King Asset Management /

  Trackweb (WHM Asset Management API) and HHD_API → Amazon S3 runtime

  configuration. Additional external interactions are documented as

  serviceGroup externalInteractions rather than relationships because no

  catalog target objects exist yet: tenant identity providers (SAML, Azure,

  Google, ClassLink, ADFS, Rapid Identity, OneLogin), email infrastructure,

  Microsoft Application Insights, and Amazon CloudWatch. These remain

  incomplete pending catalog objects to point at. Status open pending brannock-asset-management-engineering / ARB ratification.'

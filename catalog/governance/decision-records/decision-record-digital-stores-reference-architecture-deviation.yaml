name: Digital Stores Database-Per-Region Pattern Is The Intended Long-Term Architecture
category: decision
status: open
catalogStatus: complete
lifecycleStatus: existing-only
description: >-
  Digital Stores is filed against the Sharded Multi-Tenant AWS SQL Server reference architecture
  (01KQQ5JT1D-NMRQ) with five recorded deviations, the material ones being a single application tier
  shared across all regions rather than replicated per shard, a central DS_Admin catalog that is a
  cross-shard data dependency with a platform-wide blast radius, and a single non-highly-available SQL
  Server instance per environment tier where the reference architecture expects a shard-scoped highly
  available data tier. When the composition was authored on 2026-08-20 it was not known whether this
  shape was a transitional state or a settled position. Question 8.1 of the DRAFT L1 Baseline
  Questionnaire asked directly whether the current model - one shared application tier, one database
  per region, resolved at request time through DS_Admin - is the intended long-term architecture or
  whether a move toward per-tenant isolation is planned. The engineering owner answered on 2026-09-08
  that it is the intended long-term architecture. No per-tenant isolation work is planned.

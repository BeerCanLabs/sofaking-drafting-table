decisionRationale: >-
  availability: Single install on a single Windows Server 2012 R2 host; no HA
  pair and no standby instance.


  scalability: Scales with the underlying single Windows Server 2012 R2 host
  and Bitvise configuration; customer/file-volume limits require confirmation.


  recoverability: Recovery path requires confirmation from Webloom/SOM
  operations, including Windows host rebuild, Bitvise configuration backup, and
  BestSync job configuration backup.


  failure-domain: Impact is scoped to Webloom legacy SOM customer SFTP/bulk
  import intake and local file movement unless the Webloom central file server,
  shared storage, or shared databases are also affected.

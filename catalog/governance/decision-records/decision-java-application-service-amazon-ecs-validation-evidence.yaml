decisionRationale: |
  runtimeRequirement: RT ERP Java workloads run as Amazon ECS services on
  EC2-backed ECS clusters; Fargate is not used.

  serviceAuthentication: Product authentication remains with the deployed
  component. Deployment automation assumes region IAM roles.

  secretsManagement: Runtime parameters and sensitive configuration are
  distributed through AWS Systems Manager and region deployment
  configuration rather than container images.

  serviceLogging: ECS telemetry is sent to CloudWatch and application logs may
  be forwarded to centralized logging.

  healthWelfareMonitoring: ECS desired-state reconciliation, ALB health checks,
  CloudWatch, APM, and synthetic monitoring cover service welfare.

  availabilityModel: Desired task count, ALB routing, and ECS replacement are
  configured per region environment.

  scalabilityModel: ECS desired counts scale tasks and the ECS capacity
  provider scales its EC2 Auto Scaling Group. A representative production
  region showed separate service roles with independently configured desired
  counts, including idle batch services held at zero.

  recoverabilityModel: ECS and Auto Scaling replace failed capacity;
  CloudFormation and ECR provide repeatable rebuilds.

  failureDomain: Each runtime is contained within one region environment's
  AWS account and ECS cluster.


decisionRationale: >
  AWS Glue is operated as a serverless PaaS with managed multi-AZ high availability. Operators configure Glue jobs, crawlers, and triggers; underlying execution infrastructure is fully managed by AWS. The failure domain is scoped to the AWS region.

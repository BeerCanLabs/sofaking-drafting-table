decisionRationale: >-
  noApplicablePattern: No reference architecture has been selected for this pattern. reference-architecture-aws-eks-microservices-multitenant is the closest candidate and matches the EKS container tier, but this pattern is a hybrid of EKS containers and a CDK-deployed Lambda and Step Functions estate, and it depends on the SQL Server database catalogued in the legacy pattern rather than on a cloud-native store alone. Confirming conformance would require verifying the multitenancy model, which has not been done. Pattern alignment is an APEX L2 Established criterion, not L1 Baseline, so this pattern is registered without a selected reference architecture and the choice is tracked as an unresolved question in DraftingSession 01M1F8WB4E-0GSN. Status open pending Architecture Review Board input.

type: decision_record
name: Job Server — Unintentional Single Instance
description: 'The SOM Job Server is deployed as a single instance with no redundancy. This is not an intentional architectural decision.

  '
version: 1.0.0
catalogStatus: incomplete
lifecycleStatus: preferred
owner:
  team: architecture-review-board
  contact: architecture-review-board@sofaking.example
tags:
- ard
- risk
- som
category: risk
status: open
affectedComponent: 01KSM38KEW-VCQS
impact: 'Loss of scheduled job execution for the affected SubEnvironment. Depending on job types, this could result in missed notifications, stale reports, or unprocessed background tasks for multiple regions.

  '
mitigationPath: 'Evaluate whether jobs are idempotent and can safely run on multiple instances. If so, a second instance with a distributed job lock mechanism (e.g., database-backed locking) enables HA. If jobs are not idempotent, a primary or standby failover pattern may be more appropriate.

  '

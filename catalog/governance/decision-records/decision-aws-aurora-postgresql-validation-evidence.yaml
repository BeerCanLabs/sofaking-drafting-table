decisionRationale: "resilienceModel: Aurora PostgreSQL is deployed as a managed multi-AZ database cluster with a production writer in us-east-1 and disaster recovery reader capacity in us-east-2 for Ottoman.\n\nconfigurableSurface: Cluster topology, parameter groups, endpoints, backup retention, encryption, and network access controls are customer-managed within AWS.\n\nfailureDomain: Scoped to the Aurora cluster, AWS account, VPC, and configured region."

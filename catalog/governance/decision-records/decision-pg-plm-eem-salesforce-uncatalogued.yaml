name: PG PLM/EEM - Salesforce Is Established at Sofa King but Absent from the Catalog
description: >-
  Records Salesforce as a dependency of PLM/EEM that is demonstrably used across
  multiple Sofa King products yet has no Technology Component or service object
  in the DRAFT catalog. Split out of decision record 01M1F8WB4E-9C7X after
  Trevor Lane's review, because Salesforce needs a different outcome from
  LaunchDarkly and Avalara.

decisionRationale: >-
  nonStandardTechnology: The PLM/EEM cloud tier depends on Salesforce for SSO
  and API access - the production ConfigMap sets SalesforceBaseUrl to a
  sofaking-example.my.site.com/PDEval community endpoint and SalesforceApiBaseUrl to
  sofaking-example.my.salesforce.com. Salesforce has NO Technology Component and no
  service object in the DRAFT catalog, so this dependency cannot reference an
  approved component. However, unlike the other uncatalogued SaaS dependencies,
  Salesforce is plainly established at Sofa King: fourteen catalog files
  reference it, including the Inventory and Asset Management deployment pattern,
  the GetHelp deployment pattern, product-component-whm-am-app, and both the
  Ottoman sofaking-admin-bff and sofaking-tools-bff components. A
  saas-salesforce deployment target also exists in the vocabulary. The correct
  remedy is therefore to CATALOGUE Salesforce as a Technology Component with an
  accompanying service object, not to carry it as a Associate Development
  exception - PG is simply the team that surfaced the gap. This is a
  catalog-completeness action with organisation-wide precedent to cite. Status
  open pending Architecture Review Board direction on who authors the shared
  Salesforce objects. ACTION REQUIRED: APEX Architecture L1 criterion 5 requires
  a Jira tracking item; none exists yet beyond SKPG-19589.

decisionRationale: >
  Windows Server 2022 on EC2: EOL is addressed through active lifecycle governance — Windows Server 2022 remains within Microsoft support through October 2031 and is reviewed before support end. Privileged administrative access is reviewed quarterly through enterprise identity and access governance. Windows event and application logs are retained centrally for 90 days or more. EC2 storage retirement and managed host decommissioning follow cloud-provider media handling and enterprise wipe or disposal procedures.

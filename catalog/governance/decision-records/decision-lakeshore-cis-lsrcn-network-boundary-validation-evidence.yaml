name: Lakeshore CIS LSRCN Network Boundary Validation Evidence
description: Confirmed ownership, access, and connectivity boundaries for the third-party-managed network hosting the Lakeshore CIS production environment.
version: 1.0.0
catalogStatus: incomplete

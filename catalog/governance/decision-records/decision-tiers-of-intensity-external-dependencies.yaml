decisionRationale: >-
  The complete deployment dependency set is Traefik ingress, Amazon EKS,
  ArgoCD, AWS SNS, AWS SQS, AWS Lambda, and Amazon CloudWatch Logs. ArgoCD
  deploys the API Kubernetes resources; Terraform provisions the managed AWS
  integration resources. The calculation service is stateless and does not
  depend on a database or other durable application data store. Product event
  publishers and result-topic consumers are outside this deployment boundary
  and interact through the documented SNS interfaces.

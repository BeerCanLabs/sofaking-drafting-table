decisionRationale: >
  WHM_IM is an ASP.NET WebForms application (.NET Framework 4.6.1, VB.NET) running on IIS 10 on Windows Server 2022 EC2. Service authentication uses centralized identity; the exact model (SAML, Windows auth, or application-layer auth) requires owner confirmation. Secrets management approach is not confirmed by repository discovery and requires owner interview. IIS and application logs are forwarded to centralized logging. Health and welfare monitoring uses IIS application pool health probes; synthetic URL checks require owner confirmation. Availability, scalability, and recoverability models are not confirmed by repository discovery. The failure domain is scoped to the IIS application pool and host for WHM_IM. Third-party control libraries (Telerik UI for ASP.NET AJAX 2015.3, AjaxControlToolkit 17.1, GrapeCity ActiveReports 15) are deployed from the ThirdPartyControls\ vendor directory and are bundled with the application deployment.

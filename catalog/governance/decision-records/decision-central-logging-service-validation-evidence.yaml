decisionRationale: "serviceAuthentication: Access to the managed logging destination is controlled through AWS IAM and workload identity.\n\nsecretsManagement: Log forwarding endpoint and credential material are supplied through managed cluster secret delivery when required.\n\nhealthWelfareMonitoring: Fluent Bit forwarder health, delivery errors, and AWS OpenSearch domain health are monitored through the observability stack.\n\nfailureDomain: Scoped to the EKS cluster logging plane and the AWS OpenSearch domain and region."

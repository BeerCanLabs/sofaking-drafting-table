uid: 01M0GDHSAM-F64B
type: decision_record
name: Digital Stores SQL Server 2017 End Of Support And Patch Currency
category: risk
status: open
catalogStatus: complete
lifecycleStatus: existing-only
description: >-
  Digital Stores runs SQL Server 2017. Two related exposures follow. First, end of support: SQL
  Server 2017 mainstream support ended 2022-10-11 and extended support ends 2027-10-12, after which
  no security updates are issued without Extended Security Updates or migration. Second, patch
  currency, and the scope of that exposure is now bounded. Question 4.6 of the DRAFT L1 Baseline
  Questionnaire, answered 2026-09-08, established that the estate runs two builds, not one:
  production and sandbox are at 14.0.3495.9, which is CU31 + GDR (KB5058714, released 2025-07-08),
  and QA and alpha are at 14.0.3485.1, one GDR band further behind. This is corroborated host by host
  against the Digital Stores Environment Guide, which records 14.0.3495.9 on PRAngDB1 and SUDB and
  14.0.3485.1 on QADB and ALDB. The owner reported the production build as "14.3.3495.9", which is
  not a released SQL Server build number and is read here as a transcription of 14.0.3495.9. Seven
  later security GDR builds have shipped above 14.0.3495.9 and are not applied - 14.0.3500.1,
  14.0.3505.1, 14.0.3515.1, 14.0.3520.4, 14.0.3525.1, 14.0.3530.2 and 14.0.3540.1 (KB5102337,
  2026-07-14) - leaving roughly thirteen months of accumulated database security updates unapplied on
  production and sandbox and more than that on QA and alpha. Because the tenancy model is one database
  per region inside a single instance per tier, the build is per tier rather than per region, so
  there is no per-region build drift to bound: four instances, two builds. Automox handles operating
  system patching across production and lower environments; no database engine patching schedule is
  recorded.

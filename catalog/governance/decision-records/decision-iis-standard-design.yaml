decisionRationale: >
  IIS Standard Web Service uses a multi-node web tier (minimum 3 nodes) behind a required load balancer with horizontal autoscaling for availability and elasticity. Web identities and administrative access use centralized identity and certificate services. IIS and application logs are forwarded to centralized logging beyond host event collection. Service health is monitored via HTTP 200 endpoint probes, synthetic URL checks, and platform telemetry. Runtime secrets are sourced from a centralized secret store. DNS registration and name resolution are modeled as endpoint support dependencies — DNS does not satisfy a DRAFT runtime-service requirement. TLS certificate issuance and renewal are endpoint support dependencies; service-level secrets are documented separately. The service scales horizontally. The failure domain is scoped to the IIS web tier deployment unit behind the load balancer.

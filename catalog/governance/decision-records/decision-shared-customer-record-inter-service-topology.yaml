decisionRationale: >-
  Confirmed by the owner through Network Zone and Connection Elicitation on
  2026-10-20. Clients reach each API through an internal AWS Traefik load balancer
  and the le1 Traefik ingress by per-service hostname (Traefik to Customer Profile,
  Academic Calendar, and Customer Membership); Kong is not in the path and no WAF or
  CDN sits in front for dev and stage. Customer Membership calls the Customer Profile
  and Academic Calendar Services, and Loveseat calls the Customer Profile identity-match
  callback, through those same hostnames. Each API reads AWS Secrets Manager, and the
  Customer Profile Service also writes unprocessable events to an SQS quarantine queue.
  ArgoCD reconciles each service's manifests into le1. Within a
  service, the API reads and writes its own DynamoDB store; DynamoDB Streams feed an
  EventBridge Pipe, SNS topic, and SQS queue consumed by the event publisher Lambda,
  which posts canonical events to Loveseat. Customer Profile's API validates caller-supplied
  orgPersonIds against the Ottoman msvc-org-person service (read-only; the OrgPerson Worker
  was removed by ADR-006) and receives identity-match callbacks from Loveseat. Each API
  authenticates callers against Okta. Customer Membership's API validates
  references synchronously against the Customer Profile Service, the Academic Calendar API,
  and Core HR Org Unit. Every path above is registered as a relationship object
  except the intra-service stream, Pipe, SNS, and SQS hops, which are managed AWS
  plumbing inside the managed-integration zone, and Academic Calendar's and Customer
  Membership's publisher reads from their queues, recorded as runtime dependencies on
  the publisher components. Network-zone assignment follows the pattern's networkZones
  (ingress, application, managed-integration, operations), confirmed by the owner.
  Not covered: same-tier connections were not reviewed; the production edge on Chaise
  has not been elicited; the Membership outbound BaseUrls are not yet configured
  (TBSPS-9657); and whether Operations mandates a particular service-to-service path
  is unconfirmed.

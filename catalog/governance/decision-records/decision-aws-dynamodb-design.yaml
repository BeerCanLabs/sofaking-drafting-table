decisionRationale: >
  AWS DynamoDB is operated as a provider-managed PaaS with inherent multi-AZ high availability. Operators configure tables, indexes, and throughput settings; all resilience and failover behavior is managed by AWS within the region. The failure domain is scoped to the AWS region.

name: PG PLM/EEM - ASP.NET Core 10 Is Not in the Approved Technology Catalog
description: >-
  Records ASP.NET Core 10 as a production platform technology used by the
  PLM/EEM cloud tier with no approved Technology Component behind it, per APEX
  Architecture L1 criterion 5. Narrowed from four technologies to one after the
  other three were found to belong to a pre-production service.

decisionRationale: >
  Codefresh is operated as a vendor-managed SaaS CI/CD platform. Audit visibility and health status visibility have not been confirmed in the source catalog and require vendor documentation or portal access to verify. The failure domain is scoped to the vendor-managed SaaS dependency.

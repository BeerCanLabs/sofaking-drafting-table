decisionRationale: |
  filesystemType: AWS FSx is used as AWS FSx for Windows File Server managed file storage.

  resilienceModel: FSx for Windows is deployed in a Multi-AZ configuration.

  directoryIntegration: FSx is Active Directory integrated by default in this deployment.

  permissionModel: Mount points, folder access, and file permissions use Active Directory-integrated folder and permission controls.

  backupPosture: No FSx backup configuration is currently configured for this service.

  configurableSurface: File system capacity and throughput settings are the configurable service surface currently modeled.

  failureDomain: The failure domain is scoped to the AWS region and VPC.

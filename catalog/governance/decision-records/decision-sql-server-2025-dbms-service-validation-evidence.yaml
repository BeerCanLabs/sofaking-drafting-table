decisionRationale: "serviceAuthentication: Active Directory integrated identities govern administrator and service access to the database.\n\nsecretsManagement: Service accounts and connection secrets stored centrally.\n\nserviceLogging: Database audit and engine logs are forwarded to centralized logging beyond host-level collection.\n\nfailureDomain: Scoped to the SQL Server availability group serving the dependent application estate.\n\nbackup.strategy: daily full plus hourly log backup\n\nbackup.platform: SQL Server native backup to managed storage\n\nbackup.rto: 1h\n\nbackup.rpo: 1h\n\nha.mechanism: AlwaysOn Availability Groups\n\nencryption.atRest: TDE enabled on all production databases\n\naccessControl.model: Active Directory integrated access with role-based SQL permissions"

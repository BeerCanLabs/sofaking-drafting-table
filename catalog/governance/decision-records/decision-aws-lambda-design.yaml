decisionRationale: >
  AWS Lambda is operated as a provider-managed PaaS with inherently multi-AZ high availability within the AWS Lambda fabric. Operators configure memory, timeout, environment variables, and IAM roles; underlying execution infrastructure is fully managed by AWS. The failure domain is scoped to the AWS region and function.

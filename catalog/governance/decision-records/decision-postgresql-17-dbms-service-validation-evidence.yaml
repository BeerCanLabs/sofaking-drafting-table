decisionRationale: "serviceAuthentication: Database administrators and service identities authenticate through centralized identity and database account governance.\n\nsecretsManagement: service accounts and connection secrets stored centrally\n\nserviceLogging: Database audit and engine logs are forwarded to centralized logging beyond host-level collection.\n\nfailureDomain: Scoped to the PostgreSQL cluster serving the dependent application estate.\n\nbackup.strategy: daily full plus hourly WAL backup\n\nbackup.platform: pg_dump / pg_basebackup to managed storage\n\nbackup.rto: 1h\n\nbackup.rpo: 1h\n\nha.mechanism: Streaming Replication\n\nencryption.atRest: required\n\naccessControl.model: Active Directory integrated access with role-based database permissions"

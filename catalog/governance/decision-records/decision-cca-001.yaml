decisionRationale: >
  JSM forecloses roughly 80% of the "what if an agent goes rogue" objections
  by structurally requiring that every action be ticket-bound, approvable,
  cancellable, and auditable in a system Sofa King already trusts. The
  alternative (a bespoke runtime API or chat trigger) would require us to
  reinvent approval, audit, and identity-binding from scratch. JSM also
  inherits Atlassian's existing access controls, which lowers the security
  surface compared to a custom front door.
impact: >
  STILL IN FORCE: no JSM service request means no execution, and any execution path
  that dispatches work without an associated service request is a control violation
  and must be removed.

  AMENDED 2026-08-04: the obligation to PRODUCE the request no longer falls on the
  consumer. The Console opens it server-side on the requester's behalf. So the rule
  is "a governing service request must exist before dispatch," not "the human must
  file a ticket." The original wording below over-specified the mechanism.

  ORIGINAL WORDING (retained): All consumers of CCA (humans, scripts, upstream
  agents) must produce a structured request that becomes a JSM ticket. Any direct
  execution path that bypasses JSM is a control violation and must be removed.
mitigationPath: >
  Continuous: monitor for any execution attempt that lacks a corresponding
  JSM ticket reference in the PostgreSQL audit log. Treat as a control
  failure if observed. This detection is unchanged by the 2026-08-04 amendment --
  it tests for the ticket's existence, not for who created it, so it remains the
  correct control for both the Console path and the JSM-portal path.

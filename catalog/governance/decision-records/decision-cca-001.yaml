name: Every Action Is Ticket-Bound (JSM Choke Point)
aliases:
- JSM Is the Sole Front Door (Choke Point)
description: >
  SUPERSEDED IN PART, 2026-08-04 -- see decision record 01KZ6K57W5-APKF ("The CCA
  Console Is the Front Door; JSM Is the Governance Record"). The CHOKE POINT
  principle below stands and is still in force: no service request, no execution.
  The ENTRY POINT claim below -- "no direct API, no chat-only entry" -- is retired.
  The requester enters through the CCA Console, which opens the governing service
  request server-side under a scoped identity, so a run is ticket-bound without
  the requester using the JSM portal. A conversational front end is therefore
  correct architecture, not a control violation. Ratified by Leo Park (Lead
  Architect); the original wording is retained below as the evidence of record for
  the DRAFT 0.41 validation run. Renamed from "JSM Is the Sole Front Door (Choke
  Point)" because that title was actively misleading; the prior name is preserved
  in aliases.

  ORIGINAL WORDING (retained, partly superseded): Every meaningful action in Cloud
  Divan Academy originates from a Jira Service Management (JSM) service request.
  There is no direct API, no chat-only entry, no admin shortcut. Plain language:
  the only way to make CCA do anything is to file a ticket, like you would for any
  other Sofa King service.

type: decision_record
name: The CCA Console Is the Front Door; JSM Is the Governance Record
description: >
  A product manager enters Cloud Divan Academy (CCA) through the CCA Console and
  types a plain-English request. The Console backend opens a Jira Service
  Management (JSM) service request server-side, under a scoped service identity,
  and that ticket is the governance record for the run -- who asked, when, and
  for what. The requester never touches the JSM portal.

  Plain language: you still cannot make CCA do anything without a ticket, but you
  no longer have to file the ticket yourself. The platform files it for you, and
  refuses to run if it cannot.

decisionRationale: >
  AWS OpenSearch Service is operated as a managed PaaS with multi-AZ deployment. Operators configure domain settings, access policies, encryption, and index configuration. Data is encrypted at rest and in transit. The failure domain is scoped to the AWS region and account.

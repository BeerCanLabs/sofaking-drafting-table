name: PG PLM/EEM - LaunchDarkly and Avalara Are Not in the Catalog
description: >-
  Records two third-party SaaS dependencies of PLM/EEM that have no
  corresponding object in the DRAFT catalog and no precedent elsewhere at
  Sofa King, per APEX Architecture L1 criterion 5. Narrowed from three after
  Trevor Lane's review; Salesforce was split out to 01M1HJY7E4-CJ8C.

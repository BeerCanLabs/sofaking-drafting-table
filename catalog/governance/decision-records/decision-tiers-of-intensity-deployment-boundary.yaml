decisionRationale: >-
  Product event topics deliver to SQS; SQS triggers the Lambda worker; the
  worker calls the queue-batch API over HTTPS through an internal Traefik load
  balancer; Traefik routes to the Kubernetes API Service and pods; and the API
  publishes calculated results to product SNS topics through the AWS SDK.
  Stage uses the LE1 endpoint
  dualstack.internal-le1-ilb-traefik-ss-38425194.us-east-1.elb.amazonaws.com,
  while production uses the Chaise endpoint
  dualstack.chaise-xalb-ssl-traefik-fe-393192678.us-east-1.elb.amazonaws.com.
  ArgoCD reconciles the API manifests into LE1 and Chaise. Explicit
  Relationship objects record each communication and deployment path so that
  the cross-zone topology is analyzable in DRAFT.

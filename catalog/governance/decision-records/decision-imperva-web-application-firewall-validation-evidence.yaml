decisionRationale: "auditVisibility: Audit and operational visibility is limited to the telemetry, event views, and notifications Imperva exposes to Sofa King through the customer-facing management experience.\n\nfailureDomain: Imperva WAF is a shared vendor-managed dependency in front of the protected application path. A vendor-side degradation or control-plane issue can impact all Sofa King traffic paths routed through the service."

impact: >-
  If the refresh carries production data unmasked, Confidential region staff, payroll, site and
  customer records are resident on three additional SQL Server instances - ALDB, QADB and SUDB - that
  are not production and are not governed as production. Those three hosts share the exposures
  confirmed elsewhere in this round: Transparent Data Encryption is not enabled on any of them
  (DecisionRecord 01M25X9W0R-4HSX), no database-level audit logging is evidenced, and the same 30-day
  EBS snapshot and AMI retention copies their volumes to us-west-1 and us-east-1. Access is also
  broader by design in lower environments than in production, where the Environment Guide records that
  server access must go through the jumpw02.dsh-aws.local jump box. QADB and ALDB are additionally one
  SQL Server GDR band further behind than production, at 14.0.3485.1. The compliance surface is
  Sofa King's own Data Classification and Protection Policy rather than a Hearthstone catalog requirement,
  and that policy names the Development, Data, QA and Support teams as accountable, so the disposition
  is not Digital Stores engineering's alone to make.
mitigationPath: >-
  Three steps. First, read the refresh scripts and the SQL jobs behind the AL, QA and Sandbox refresh
  entries and confirm whether any masking or de-identification runs as part of them; if it does,
  record it here and close this record as resolved, because the finding is then documentation drift
  rather than a control gap. Second, if no masking runs, refer the finding to Sofa King Information
  Security at security@sofaking.example for disposition, since the policy provides an exception path
  and names accountable teams beyond Digital Stores engineering. Third, if masking is required, scope
  it against the refresh mechanism rather than the environments: the refresh is a scheduled SQL job
  that copies production databases wholesale, so a de-identification pass has to run inside that job
  or immediately after it, and the hand-written-SQL, no-ORM, machine-generated-view-model data layer
  means the column inventory to be masked is not derivable from an ORM schema and has to be
  established explicitly.

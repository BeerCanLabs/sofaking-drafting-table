name: Digital Stores Lower Environments Are Refreshed With Production Data
category: risk
status: open
catalogStatus: complete
lifecycleStatus: existing-only
description: >-
  The Digital Stores alpha, QA and sandbox databases are reloaded from production data on a standing
  schedule. Per the Digital Stores Scheduled Tasks page, last modified 2026-09-08, three SQL jobs run
  on the first and third Monday of each month - sandbox at 05:20, QA at 07:20 and alpha at 08:20 - each
  described as refreshing that tier's databases with production data, with success or failure
  notification to a named engineering distribution list. The Environment Guide links the same refresh
  schedule from the ALDB, QADB and SUDB host rows. No obfuscation, masking or de-identification step
  appears anywhere in the recorded refresh process. Sofa King's Data Classification and Protection
  Policy states, in its Lower Environment Data Protection section, that for all non-production
  environments the Development, Data, QA and Support teams are required to obfuscate and de-identify
  all customer data so that it cannot be correlated back to individuals, that sensitive information
  cannot be exposed in any way, and that all data in non-production environments will be
  non-production, non-customer-identifiable data. The product was confirmed by its owner on 2026-09-08
  to handle personally identifiable information and to be classified Confidential. This finding was
  not asserted by the owner; it was derived from Sofa King's own operational documentation while
  closing the L1 questionnaire, so the possibility that an unrecorded masking step exists inside the
  refresh scripts has not been excluded.

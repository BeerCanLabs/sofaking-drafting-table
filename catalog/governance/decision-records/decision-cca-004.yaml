decisionRationale: >
  Defense in depth: a single control will miss something. Three independent
  bands (before, during, after execution) means a Divan must pass nine
  consecutive gates before its action is considered successful. Splitting
  the controls into Pre / Deep / Post bands also lets the bands be delivered
  on different milestones. Pre-Check and Post-Check are scoped for Milestone
  A (intent classification + input sanitization in Week 1; output validation
  + audit persistence in Week 3). Deep-Check (Guardfin integration depth,
  LLM Gateway routing depth, policy evaluation engine) is scoped for
  Milestone B. "Ship now, secure later" is not an option.
impact: >
  Divan execution is gated at nine points. A failure at any point aborts
  execution and writes a failure record. No layer may be bypassed even for
  trusted operators.
mitigationPath: >
  [INTENDED] Each layer is groomed as its own SAAS-####### ticket. Order of
  delivery: Pre-Check Layer 1 (SAAS-94947), Pre-Check Layer 2 (SAAS-96512),
  Pre-Check Layer 3 (SAAS-14062), then Post-Check 7-8-9 (SAAS-92034 to
  SAAS-09050) in Milestone A. Deep-Check 4-5-6 (SAAS-17961 to SAAS-23220)
  is Milestone B work.

name: 9-Layer Security Framework — Pre-Check, Deep-Check, Post-Check
description: >
  CCA enforces a 9-layer security framework grouped into three bands.
  Pre-Check (intent classification, input sanitization, scope validation)
  runs before execution. Deep-Check (policy evaluation, Guardfin safety,
  LLM Gateway routing) runs during execution. Post-Check (output validation
  in the Harness layer, audit persistence) runs after execution. "Harness"
  means the sofaking-guardfin-harness layer -- a validation stage inside
  Guardfin, in-VPC -- not a third-party platform (ratified 2026-08-02,
  Leo Park; OPS-177566). Each layer is a gate, not
  a sprint — no layer is skipped to ship faster. Tracked as SAAS-94947
  through SAAS-09050.

decisionRationale: |
  clusterInventory: Recliner owns four environment-specific EKS clusters in
  AWS us-east-1: recliner-dev, recliner-test, recliner-stage, and recliner-prod. ArgoCD
  is the GitOps deployment method for these clusters.

  computeBoundary: The Recliner BFF and core services run on EKS. Recliner does not
  use AWS Fargate. Tiers of Intensity is a standalone product boundary, so its
  Lambda worker is not an Recliner runtime exception.

  serviceAuthentication: The BFF's public ingress is a dedicated
  internet-facing Traefik ALB, not Kong Gateway — confirmed 2026-08-05 for
  OPS-306834 against the som-recliner repository's infra code. Caller identity
  is derived application-side from Ottoman-issued request context; the
  exact upstream token-validation boundary for the public hostname is
  deferred. In-cluster service-to-service traffic is documented as intending
  to use the Platform Service Mesh, though mesh sidecar injection is
  currently evidenced only for the recliner-loveseat-subscriber workload.

  secretsManagement: Runtime secrets are injected from centralized secret
  storage at pod start.

  serviceLogging: Application logs are forwarded to centralized logging beyond
  the EKS host runtime.

  healthWelfareMonitoring: Pod readiness, VictoriaMetrics platform monitoring,
  and APM telemetry track service welfare.

  recoverabilityModel: EKS replaces failed pods automatically; node failures
  are handled by the cluster autoscaler.

  failureDomain: Workload failures are scoped to a single Recliner microservice
  Deployment. Cluster-level failures are isolated to one environment.

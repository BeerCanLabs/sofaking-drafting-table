affectedComponent: 01M0GBWMZJ-E0NF
impact: >-
  A caller holding a valid session GUID and a correctly computed request fingerprint can reach
  controller actions for screens their security group does not grant, because the server no longer
  evaluates the per-screen check and the client-side route guard is not an access control the server
  enforces. Authorization is one security group per user in tblsecuritygroup granting view, edit, new,
  fy, fyedit and draft per resource, so the bypass surface is the whole per-resource permission model
  across roughly 140 controllers, not a single screen. Two qualifiers matter. First, tenant resolution
  and the fingerprint check are unaffected, so this is a horizontal privilege-escalation risk inside a
  region rather than a cross-region data-access risk. Second, the in-flight encryption added after
  the 2021 review means the cached list cannot be trivially rewritten in transit, which raises the
  effort required but does not change the fact that the authoritative decision is made client-side.
  The data behind those endpoints is classified Confidential and includes region staff and payroll
  records. Bears on Hearthstone HCF.09.1.3 and on the access-control expectations of Sofa King's Data
  Classification and Protection Policy, whose principle-of-least-privilege section requires access to
  be limited to what a role needs.
mitigationPath: >-
  The 2026-09-08 answer resolves the intent question and removes the basis for the mitigated status,
  so treat this as an open finding rather than a documentation task. Three steps. First, confirm by
  direct read of server-ang - Cloud Engineering does not need owner mediation for this - whether any
  server-side per-screen authorization exists on the request path at all, and record the file and line
  either way; the questionnaire asked for this and it was not supplied. Second, refer the finding to
  Sofa King Information Security at security@sofaking.example with the confirmed posture, since the
  disposition is a security judgment about accepted risk versus required remediation and not an
  architecture one. Third, if remediation is required, the fix is to restore an equivalent per-screen
  check inside the per-request server-side path rather than to harden the client cache further; a
  cached client-side list with encrypted transport is still a client-side authorization decision. Do
  not return this record to mitigated on the strength of the in-flight encryption control alone.

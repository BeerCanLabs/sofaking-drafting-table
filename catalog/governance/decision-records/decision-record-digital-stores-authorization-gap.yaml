uid: 01M0GBWMZJ-TMGD
type: decision_record
name: Digital Stores Server-Side Per-Screen Authorization Is Disabled
category: risk
status: open
catalogStatus: complete
lifecycleStatus: existing-only
description: >-
  In entityapi/entityapi/Controllers/BaseController.cs the block inside IsAuthorized() that would call
  SecurityBL.GetListOfEnabledScreens(), decrypt the ds-context header and check isScreenEnabled() is
  commented out, and the live isScreenEnabled(context, screens) method unconditionally returns true.
  Found by direct repository read on 2026-08-20. On 2026-08-27 the workspace owner reported that this
  was deliberate and that the screen-list construction had moved to SecurityAL::GetSecurityList(),
  and this record was moved from open to mitigated pending confirmation of that call path. Question
  5.1 of the DRAFT L1 Baseline Questionnaire asked for the SecurityAL::GetSecurityList()
  implementation by file and line and for confirmation that it is invoked on every per-screen request
  path in the EntityAPI. The answer received on 2026-09-08 does not confirm that and instead describes
  the opposite arrangement: IsAuthorized() is called on every incoming REST request, whereas
  GetSecurityList() is called by the front end only once during the initial sign-in process, and the
  resulting security list is cached on the front end. No file or line reference was supplied. Taken
  together with the direct read, the effective posture is that the per-screen check inside the
  per-request server-side path remains disabled and the only per-screen enforcement is the Angular
  route guard isAuthorizedToActivate in main-ang evaluating a client-cached list. This record is
  therefore returned from mitigated to open. The owner also reported that following a 2021 security
  review, encryption was added to the security list while in flight to mitigate a possible
  man-in-the-middle attack; that control protects the list in transit and does not restore server-side
  enforcement. Session authentication and the SHA-256 request fingerprint check are unaffected and
  remain enforced server-side regardless.

decisionRationale: >
  Least privilege is the strongest defense available against blast-radius
  failures, lateral movement, and prompt-injection-driven scope expansion.
  Collapsing multiple Divans behind one overly broad identity would mean a
  single compromised Divan could perform actions the other Divans were never
  authorized to perform. Per-Divan identities also make audit attribution
  exact: every CloudTrail event is bound to the Divan that produced it, with
  no ambiguity. Identity provisioning flow is being coordinated with IT and
  the SaaS Identity team.
impact: >
  Identity provisioning becomes a per-Divan process. New Divan onboarding
  must include identity creation, scope definition, and JSM-backed approval
  before the Divan may run. Identity scopes are versioned and reviewed.
mitigationPath: >
  [INTENDED] Establish a 90-day recertification cadence for Divan identity
  scopes (aligned with the Platform PM's factory-feature spec). Any scope
  that has not been recertified is auto-suspended pending review.

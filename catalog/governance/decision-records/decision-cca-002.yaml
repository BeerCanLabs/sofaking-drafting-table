name: One Divan, One Scoped IAM Identity
description: >
  Each Divan runs under a dedicated AWS IAM identity scoped to the narrowest
  capability set the Divan's task requires. Sensitive capabilities are not
  collapsed into a single shared identity. Plain language: every agent gets
  its own keycard, and that keycard only opens the doors it actually needs.

decisionRationale: >
  Amazon S3 is operated as a provider-managed PaaS with inherently multi-AZ high availability within the AWS region. Operators configure bucket policies, KMS encryption, and lifecycle rules; resilience is managed by AWS. The failure domain is scoped to the AWS region and account.

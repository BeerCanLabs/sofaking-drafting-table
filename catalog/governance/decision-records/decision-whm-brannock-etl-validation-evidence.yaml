decisionRationale: 'runtimeRequirement: Corrected - this is a real ASP.NET/OWIN Web API + MVC application (Brannock.ETL.Hangfire) that self-hosts Hangfire background job processing and requires an application runtime (IIS). The original repository-discovery finding ("static web assets... no standalone application runtime") was incorrect; it was likely misled by a bundled Kendo UI static-asset package.json under Content/kendo/ and missed the actual ASP.NET/Hangfire application. Confirmed by reading HangfireBootstrapper.cs, ETLServiceConfigurator.cs, and Web.config directly.'

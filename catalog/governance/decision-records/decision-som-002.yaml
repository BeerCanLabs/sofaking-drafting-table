impact: 'Loss of document scanning capability for all tenants in the affected SubEnvironment. SOM workflows requiring document capture would be blocked.

  '
mitigationPath: 'Evaluate whether ABBYY FlexiScan supports multi-instance deployment. If so, add a second instance behind a load balancer. If not, assess whether a cloud-native scanning alternative could provide built-in HA.


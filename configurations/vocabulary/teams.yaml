  id: shared-customer-engineering
  name: Shared Customer Engineering
  status: proposed
  rationale: The Shared Customer Record (ss-msvc-customer-profile, ss-msvc-customer-membership,
    ss-msvc-calendar) is authored and maintained by the Shared Customer Record
    engineering team, which has no value in the teams vocabulary yet. The existing
    devops-engineering-customer-solutions value is a DevOps team, not the product engineering
    team that owns these ProductComponents, DataComponents, and the SSR SDP. Proposing
    shared-customer-engineering so these engineering objects have an accurate owner
    and CODEOWNERS routing. Teams vocabulary is advisory, so objects using this value
    validate with a warning until the value is adopted.
- contact: ltorvik@sofaking.example
  id: whm-unified-inventory
  name: WHM Unified Inventory
  status: proposed
  rationale: Atlas (Unified Inventory, repos whm-unified-*) is authored and maintained
    by the WHM Unified Inventory engineering team, which has no value in the teams
    vocabulary yet. The nearest existing value, brannock-asset-management-engineering,
    is the Brannock / Asset Management team, not the team that owns Atlas. Proposing
    whm-unified-inventory so the Atlas SDP and its ProductComponents have an accurate
    owner and CODEOWNERS routing. Teams vocabulary is advisory, so objects using this
    value validate with a warning until the value is adopted. Contact is the requesting
    team member's address and should be replaced with a team distribution list.

      1320 Arthur E Adams Dr, Columbus OH 49545. Vendor: Management Council,
      Lakeshore Retail Computer Network (LSRCN). No Sofa King-owned hardware --
      IaaS model, VMware managed by LSRCN. Prod. Hosts: Tillbook, LSCIS.

  - id: colohub-ny
    name: Colohub Data Center
    provider: colocation
    type: colocation
    status: approved
    lat: 40.727
    lon: -73.636
    region: Zeeland, NY
    notes: >-
      501 Division Ave, Zeeland MI 49588. Vendor: Colohub (formerly Webloom).
      IaaS -- no Sofa King-owned hardware, VMware managed by Colohub. Prod.
      Hosts: Quickfit.


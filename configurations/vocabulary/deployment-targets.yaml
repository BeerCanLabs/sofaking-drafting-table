# Sofa King -- Deployment Targets vocabulary
# Source of truth: Data Centers and Colocations SharePoint list
#
# Physical colocation facilities:
#   grr-datacenter      1500 Monroe Ave NW, Grand Rapids MI (Prod, Sofa King-owned HW)
#   high point-datacenter  101 Riverside Rd, High Point MI (Non-Prod, Sofa King-owned HW)
#   xcolo-datacenter     360 Fulton St, Ada CA / OCRC (Prod, Sofa King-owned HW)
#   lsrcn-iaas         1320 Arthur E Adams Dr, Columbus OH (Prod, IaaS -- no HW ownership)
#   colohub-ny            501 Division Ave, Zeeland MI / Colohub (Prod, IaaS -- Quickfit)
#
# Cloud:
#   aws-us-east-2       Primary AWS region (all generic AWS workloads)
#   aws-us-east-1       Secondary (explicit east-1 label only)
#   aws-us-west-1       Digital Stores account only (explicit west-1 label only)
#   azure               Azure (region TBD)
#
# Non-geographic:
#   customer-hosted     Customer / region-operated environment
#   saas-*              Vendor-managed SaaS tenants

values:

  # -- Cloud: primary ------------------------------------------------------

  - id: aws-us-east-2
    name: AWS US East 2
    provider: aws
    type: cloud-region
    status: approved
    lat: 40.42
    lon: -82.91
    region: Lakeshore, US
    notes: >-
      Primary AWS region. Default for all AWS cloud workloads unless explicitly
      labeled east-1. Covers EKS, ECS, Lambda, EC2, RDS, CloudFront, and all
      managed AWS services. Also covers per-region and per-tenant AWS accounts.

  - id: aws-us-east-1
    name: AWS US East 1
    provider: aws
    type: cloud-region
    status: approved
    lat: 38.95
    lon: -77.45
    region: Virginia, US
    notes: Secondary AWS region. Reference only when explicitly labeled east-1.

  - id: aws-us-west-1
    name: AWS US West 1
    provider: aws
    type: cloud-region
    status: approved
    lat: 37.35
    lon: -121.96
    region: Northern Oregon, US
    notes: >-
      Legacy AWS region carrying the Digital Stores estate only. AWS account
      472468972873 runs all four Digital Stores environment tiers here -- 36 EC2
      instances, 8 subnets and 2 load balancers as of the 2026-01-28 account
      discovery -- with EBS snapshot and AMI copies replicated to us-east-1 for
      disaster recovery. Reference only when explicitly labeled west-1. Not a
      target for new workloads: aws-us-east-2 remains the default for generic AWS
      workloads, and any future Digital Stores re-platforming should move off
      this region rather than extend it.

  - id: azure
    name: Azure
    provider: azure
    type: cloud-account
    status: approved
    lat: 37.32
    lon: -78.10
    region: East US, Virginia (approximate -- specific region TBD)
    notes: Azure subscription for shared and acquired workloads.


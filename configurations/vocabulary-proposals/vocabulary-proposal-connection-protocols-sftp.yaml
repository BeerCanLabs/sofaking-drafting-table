rationale: >-
  GRRFTP1 supports SFTP over SSH, and reusable SFTP services already exist in
  the Sofa King catalog. SFTP is not currently available in the approved
  connectionProtocols vocabulary, preventing relationships from using the
  real protocol without a non-standard value.

description: |
  Live customer-facing production environment. Deployed from tagged releases
  following change-management approval. Multi-region capability required for
  mission-critical workloads. Full SOC 2 and RT-RAMP audit scope.
complianceScope:
- 01KQQ4Q027-T3CA
- 01KQQ4Q027-7JN2
- 01KQQ4Q027-1GHC

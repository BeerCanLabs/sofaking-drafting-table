- name: awsRegion
  description: Primary AWS region for the production environment
  required: true
  sensitive: false
- name: vpcId
  description: VPC ID where services are deployed
  required: true
  sensitive: false
- name: deployRoleArn
  description: IAM role ARN the pipeline assumes to deploy
  required: true
  sensitive: false
- name: certificateArn
  description: ACM certificate ARN for HTTPS termination
  required: true
  sensitive: false
- name: kmsKeyArn
  description: KMS key ARN for encryption-at-rest
  required: true
  sensitive: false
notes: >
  Production requires all compliance controls (security, SOC 2, RT-RAMP,
